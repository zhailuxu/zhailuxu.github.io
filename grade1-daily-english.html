.tasks{display:grid;gap:12px}.task{--accent:#3568a8;position:relative;display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;padding:17px;border-left:7px solid var(--accent);border-radius:20px}.task::before{content:"";position:absolute;left:20px;top:-13px;width:3px;height:13px;background:#cfdbea}.task:first-child::before{display:none}.task-icon{display:grid;width:49px;height:49px;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,white);font-size:1.6rem}.task-step{color:var(--accent);font-size:.71rem;font-weight:950;letter-spacing:1px}.task h3{margin:3px 0 5px;font-size:1.05rem}.task p{margin:0;color:var(--muted);font-size:.78rem;line-height:1.55}.task-meta{margin-top:6px;color:#7a879a;font-size:.69rem;font-weight:750}.task-action{min-width:116px;border:0;border-radius:13px;background:var(--accent);padding:10px 13px;color:#fff;cursor:pointer;font-size:.78rem;font-weight:900}.task-action:hover{filter:brightness(.95)}.task.current{outline:3px solid rgba(53,104,168,.2);outline-offset:1px}.task.done{background:#f6f9ff}.task.done .task-action{background:#e4eaf3;color:#66748a}.task.locked{opacity:.57}.task.locked .task-action{background:#d9dee6;color:#77808d;cursor:not-allowed}

.history-panel,.week-preview{margin-top:15px;padding:17px;border-radius:21px}.history-head{display:flex;justify-content:space-between;gap:12px}.history-head h2{margin:0;color:#365d8f;font-size:1rem}.history-head p{margin:4px 0 0;color:var(--muted);font-size:.7rem}.history-total{height:max-content;border-radius:999px;background:#e9f1fb;padding:6px 10px;color:#426991;font-size:.7rem;font-weight:900}.history-list{display:grid;gap:9px;margin-top:12px}.history-empty,.history-day{border-radius:14px;background:#f7faff;padding:13px}.history-empty{color:#7b8798;text-align:center;font-size:.78rem}.history-day-head{display:flex;justify-content:space-between;gap:10px}.history-date{font-size:.8rem;font-weight:900}.history-result{border-radius:999px;background:#e9edf4;padding:5px 8px;color:#667286;font-size:.67rem;font-weight:900}.history-result.complete-result{background:#dff1e5;color:#397151}.history-theme{margin:4px 0 8px;color:#7a8698;font-size:.68rem}.history-tasks{display:flex;gap:6px;flex-wrap:wrap}.history-task{border-radius:999px;background:#edf1f6;padding:5px 8px;color:#8993a1;font-size:.65rem}.history-task.done{background:#e4edfb;color:#42668e}.history-time{margin-top:8px;color:#8c96a4;font-size:.63rem}
.week-preview summary{cursor:pointer;color:#3d6392;font-weight:900}.week-list{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:13px}.day{min-width:0;border:0;border-radius:13px;background:#edf3fb;padding:9px 5px;text-align:center;cursor:pointer}.day.today{box-shadow:inset 0 0 0 2px #3568a8}.day.selected{background:#dceafb;box-shadow:inset 0 0 0 2px #517fba}.day b{display:block;color:#3d608c;font-size:.76rem}.day span{display:block;margin-top:4px;color:#74829a;font-size:.64rem;line-height:1.4}.week-detail{margin-top:11px;border:1px solid #dce6f3;border-radius:17px;background:#fafdff;padding:14px}.week-detail h3{margin:0 0 10px;color:#385e8d;font-size:.95rem}.week-detail-tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.week-task{display:grid;grid-template-columns:28px 1fr;gap:8px;border-radius:12px;background:#fff;padding:10px}.week-task-number{display:grid;width:25px;height:25px;place-items:center;border-radius:50%;background:#e3edfa;color:#37618f;font-size:.7rem;font-weight:950}.week-task b{display:block;font-size:.76rem}.week-task small{display:block;margin-top:3px;color:#778498;font-size:.66rem;line-height:1.45}.principle{margin:15px 0 0;padding:13px 15px;border-radius:16px;background:#fff8dc;color:#715f38;font-size:.77rem;line-height:1.7}.back{display:block;margin:19px auto 0;text-align:center;color:#356198;text-decoration:none;font-size:.84rem;font-weight:850}
dialog{width:min(980px,100vw);height:min(820px,100dvh);max-width:none;max-height:none;border:0;border-radius:23px;padding:0;background:#f4f8fd;box-shadow:0 20px 70px rgba(30,48,76,.4)}dialog::backdrop{background:rgba(24,36,55,.62)}.practice-shell{height:100%;display:grid;grid-template-rows:auto 1fr auto}.practice-head,.practice-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#fff}.practice-head{border-bottom:1px solid var(--line)}.practice-close,.practice-done{border:0;border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:850}.practice-close{background:#e8edf4;color:#566274}.practice-done{background:var(--blue);color:#fff}.practice-frame{width:100%;height:100%;border:0;background:#fff}.practice-foot{border-top:1px solid var(--line)}.practice-tip{color:#718097;font-size:.73rem}button:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid rgba(53,104,168,.28);outline-offset:2px}
@media(max-width:650px){body{padding:11px 10px 42px}.hero{padding:20px 14px}.task{grid-template-columns:45px 1fr;padding:14px 12px;gap:10px}.task-icon{width:43px;height:43px}.task-action{grid-column:1/-1;width:100%}.week-list{grid-template-columns:repeat(2,1fr)}.day:last-child{grid-column:1/-1}.week-detail-tasks{grid-template-columns:1fr}dialog{width:100vw;height:100dvh;border-radius:0}.practice-tip{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body data-hpx-page style="--hpx-accent:#3568a8">
<main class="wrap">
  <header class="hero"><div class="hero-icon" aria-hidden="true">🌈</div><h1>一年级每日英语练习</h1><p>每天约 12～15 分钟，按顺序听字母、认数字、玩单词、读小故事。先敢听、敢说，再慢慢记牢。</p><div class="hero-tools"><span class="chip" id="dayTheme"></span><button class="chip button" type="button" id="speakToggle" aria-pressed="true">🔊 声音解说 开</button></div></header>
  <section class="overview" aria-labelledby="todayTitle"><div class="overview-head"><div><div class="date" id="dateText"></div><h2 id="todayTitle">今天的四项练习</h2></div><span class="count" id="progressText">0 / 4</span></div><div class="meter" role="progressbar" aria-label="今日英语练习进度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span id="progressBar"></span></div><p class="overview-note" id="nextHint" role="status" aria-live="polite"></p></section>
  <section class="tasks" id="taskList" aria-label="今日顺序英语练习"></section>
  <section class="complete" id="completePanel" aria-live="polite"><strong>Great job! 今天完成啦！</strong><p>字母、数字、单词和故事都练到了。</p><span class="streak" id="streakText">连续完成 1 天</span></section>
  <section class="history-panel" aria-labelledby="historyTitle"><div class="history-head"><div><h2 id="historyTitle">每日练习记录</h2><p>自动保存在当前设备，展示最近 14 个有练习的日期。</p></div><span class="history-total" id="historyTotal">已练习 0 天</span></div><div class="history-list" id="historyList" aria-live="polite"></div></section>
  <details class="week-preview"><summary>查看一周练习安排</summary><div class="week-list" id="weekList"></div><section class="week-detail" aria-live="polite"><h3 id="weekDetailTitle"></h3><div class="week-detail-tasks" id="weekDetailTasks"></div></section><p class="principle">安排原则：每天都有简短的英语语音输入，字母、数字和常用词反复出现；一年级不要求独立读长句，跟读、指认和开口最重要。</p></details>
  <a class="back" href="index.html">← 返回慧陪学</a>
</main>
<dialog id="practiceDialog" aria-labelledby="practiceTitle"><div class="practice-shell"><header class="practice-head"><strong id="practiceTitle">今日练习</strong><button type="button" class="practice-close" id="closePractice">暂时返回</button></header><iframe class="practice-frame" id="practiceFrame" title="当前英语练习"></iframe><footer class="practice-foot"><span class="practice-tip">完成页面中的一小轮练习后，再点击右侧按钮。</span><button type="button" class="practice-done" id="finishTask">完成这项，学习下一项</button></footer></div></dialog>
<script src="hpx-core.js"></script>
<script>
(function(){
'use strict';
const STORE='hpx_grade1_daily_english_v1';
const DAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const THEMES=['Hello, Letters!','Numbers Around Us','Words and Pictures','Listen and Say','Read with Me','English Game Day','Happy Review'];
const READER_TITLES=['Morning Hello','My Blue Bag','A Tiny Seed','Snack for Two','Where Is Dot?','Rain Boots','The Sleepy Moon'];
const THIRD=[
 {title:'单词配对',href:'english.html?tab=match',description:'听一听并看图找单词，完成一轮配对。'},
 {title:'听音选句',href:'english-reader-1a.html?tab=practice&mode=listen',description:'先听完整句子，再从选项中找到听到的一句。'},
 {title:'单词意思',href:'english-reader-1a.html?tab=practice&mode=meaning',description:'听清单词读音，从四个意思中选一个。'},
 {title:'单词拼写',href:'english.html?tab=spell',description:'看图和听读音，按顺序点击字母拼出单词。'},
 {title:'听音选句',href:'english-reader-1a.html?tab=practice&mode=listen',description:'听一句简单英语，找出完全相同的句子。'},
 {title:'单词配对',href:'english.html?tab=match',description:'玩一轮词汇配对，答错的单词再听一次。'},
 {title:'混合复习',href:'english-reader-1a.html?tab=practice&mode=mix',description:'混合练习听句子、认意思和补单词。'}
];
const WEEK_PLAN=DAYS.map((day,index)=>({day,theme:THEMES[index],tasks:[
 {track:'字母语音',icon:'🔤',title:index===6?'字母复习':'字母听读',href:'english.html?tab=alpha',minutes:'3分钟',description:index===6?'自由点读本周不熟悉的字母和例词。':'点读一小组大小写字母，跟读字母名和例词。'},
 {track:'数字词汇',icon:index%2?'🧩':'🔢',title:index%2?'常用单词':'数字1–20',href:index%2?'english.html?tab=match':'english.html?tab=numbers',minutes:'3分钟',description:index%2?'听读常用单词，看图找到对应英文。':'点读英文数字，再完成一轮数字与英文配对。'},
 {track:'听读认词',icon:'🎧',...THIRD[index],minutes:'3～4分钟'},
 {track:'启蒙阅读',icon:'📖',title:`Lesson ${index+1} · ${READER_TITLES[index]}`,href:`english-reader-1a.html?lesson=${index+1}`,minutes:'3～4分钟',description:'先听整篇，再点读每句，最后跟着模仿一句。'}
]}));
const COLORS=['#3575ba','#7b62b7','#299284','#d18b2f'];
const $=id=>document.getElementById(id);const speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.86,pitch:1.05}):null;const say=text=>speech&&speech.speak(text);let activeTaskIndex=-1,previewDayIndex=null;
function localDateKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function loadState(){try{const value=JSON.parse(localStorage.getItem(STORE)||'{"days":{}}');return value&&value.days?value:{days:{}};}catch(error){return {days:{}};}}
function saveState(state){const keys=Object.keys(state.days).sort().slice(-60),trimmed={days:{}};keys.forEach(key=>trimmed.days[key]=state.days[key]);try{localStorage.setItem(STORE,JSON.stringify(trimmed));}catch(error){}return trimmed;}
function todayContext(){const now=new Date(),dateKey=localDateKey(now),planIndex=(now.getDay()+6)%7,state=loadState();if(!state.days[dateKey])state.days[dateKey]={done:[]};return{now,dateKey,planIndex,plan:WEEK_PLAN[planIndex],state,record:state.days[dateKey]};}
function streak(state,date){let total=0,cursor=new Date(date.getFullYear(),date.getMonth(),date.getDate());for(let i=0;i<365;i++){const record=state.days[localDateKey(cursor)];if(!record||new Set(record.done||[]).size<4)break;total++;cursor.setDate(cursor.getDate()-1);}return total;}
function formatTime(value){if(!value)return'';const date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}
function renderHistory(state){const all=Object.entries(state.days||{}).filter(([key,r])=>/^\d{4}-\d{2}-\d{2}$/.test(key)&&new Set(r.done||[]).size).sort(([a],[b])=>b.localeCompare(a)),entries=all.slice(0,14);$('historyTotal').textContent=`已练习 ${all.length} 天`;if(!entries.length){$('historyList').innerHTML='<div class="history-empty">完成第一项后，这里就会留下今天的练习记录。</div>';return;}$('historyList').innerHTML=entries.map(([key,r])=>{const pi=Number.isInteger(r.planIndex)?r.planIndex:(new Date(`${key}T12:00:00`).getDay()+6)%7,plan=WEEK_PLAN[pi],done=new Set(r.done||[]),count=Math.min(4,done.size),dateText=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date(`${key}T12:00:00`)),tasks=plan.tasks.map((task,i)=>`<span class="history-task${done.has(i)?' done':''}">${done.has(i)?'✓':'○'} ${task.track}</span>`).join(''),time=formatTime(r.completedAt||r.updatedAt);return`<article class="history-day"><div class="history-day-head"><span class="history-date">${dateText}</span><span class="history-result${count===4?' complete-result':''}">${count===4?'全部完成':`完成 ${count} / 4`}</span></div><div class="history-theme">${plan.theme}</div><div class="history-tasks">${tasks}</div>${time?`<div class="history-time">${count===4?'完成时间':'最近练习'} ${time}</div>`:''}</article>`;}).join('');}
function renderWeekDetail(index){const plan=WEEK_PLAN[index];$('weekDetailTitle').textContent=`${plan.day} · ${plan.theme}（预览）`;$('weekDetailTasks').innerHTML=plan.tasks.map((task,i)=>`<div class="week-task"><span class="week-task-number">${i+1}</span><div><b>${task.track} · ${task.title}</b><small>${task.description} · 约 ${task.minutes}</small></div></div>`).join('');}
function renderWeek(todayIndex){if(previewDayIndex===null)previewDayIndex=todayIndex;$('weekList').innerHTML=WEEK_PLAN.map((plan,i)=>`<button type="button" class="day${i===todayIndex?' today':''}${i===previewDayIndex?' selected':''}" data-preview-day="${i}" aria-pressed="${i===previewDayIndex}"><b>${plan.day.replace('星期','周')}${i===todayIndex?' · 今天':''}</b><span>${plan.theme}</span></button>`).join('');renderWeekDetail(previewDayIndex);}
function render(){const c=todayContext(),done=new Set(c.record.done||[]),count=Math.min(4,done.size),next=c.plan.tasks.findIndex((_,i)=>!done.has(i));$('dateText').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(c.now);$('dayTheme').textContent=`今日主题 · ${c.plan.theme}`;$('progressText').textContent=`${count} / 4`;$('progressBar').style.width=`${count*25}%`;document.querySelector('.meter').setAttribute('aria-valuenow',String(count));$('taskList').innerHTML=c.plan.tasks.map((task,i)=>{const isDone=done.has(i),isCurrent=i===next,isLocked=!isDone&&!isCurrent;return`<article class="task ${isDone?'done':isCurrent?'current':'locked'}" style="--accent:${COLORS[i]}"><span class="task-icon" aria-hidden="true">${isDone?'✓':task.icon}</span><div><div class="task-step">第 ${i+1} 项 · ${task.track}</div><h3>${task.title}</h3><p>${task.description}</p><div class="task-meta">约 ${task.minutes}</div></div><button type="button" class="task-action" data-task="${i}" ${isLocked?'disabled':''}>${isDone?'再练一次':isCurrent?'开始练习 →':'完成上一项后解锁'}</button></article>`;}).join('');const complete=count===4;$('completePanel').classList.toggle('show',complete);$('nextHint').textContent=complete?'今天四项都完成了，可以开心地说 Good job！':`下一项：${c.plan.tasks[next].track} · ${c.plan.tasks[next].title}`;if(complete)$('streakText').textContent=`连续完成 ${streak(c.state,c.now)} 天`;renderHistory(c.state);renderWeek(c.planIndex);}
function openTask(index){const c=todayContext(),task=c.plan.tasks[index],dialog=$('practiceDialog');activeTaskIndex=index;$('practiceTitle').textContent=`第 ${index+1} 项 · ${task.title}`;$('practiceFrame').src=task.href;$('practiceFrame').title=task.title;$('finishTask').textContent=(c.record.done||[]).includes(index)?'结束复习，返回计划':'完成这项，学习下一项';if(typeof dialog.showModal==='function')dialog.showModal();else window.location.href=task.href;}
function closeTask(){const dialog=$('practiceDialog');if(dialog.open)dialog.close();$('practiceFrame').src='about:blank';activeTaskIndex=-1;}
function finishTask(){if(activeTaskIndex<0)return;const c=todayContext(),done=new Set(c.record.done||[]),wasDone=done.has(activeTaskIndex),now=new Date().toISOString();done.add(activeTaskIndex);c.record.done=[...done].sort((a,b)=>a-b);c.record.planIndex=c.planIndex;c.record.updatedAt=now;if(done.size===4&&!c.record.completedAt)c.record.completedAt=now;saveState(c.state);closeTask();render();if(!wasDone){const next=document.querySelector('.task.current');if(next)next.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});say(done.size===4?'Great job! 今天的英语练习全部完成！':`完成了。下一项，${c.plan.tasks[done.size].track}。`);}}
$('taskList').addEventListener('click',event=>{const button=event.target.closest('[data-task]');if(button&&!button.disabled)openTask(Number(button.dataset.task));});$('weekList').addEventListener('click',event=>{const button=event.target.closest('[data-preview-day]');if(button){previewDayIndex=Number(button.dataset.previewDay);renderWeek(todayContext().planIndex);}});$('closePractice').addEventListener('click',closeTask);$('finishTask').addEventListener('click',finishTask);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('practiceDialog').addEventListener('close',()=>{$('practiceFrame').src='about:blank';activeTaskIndex=-1;});window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
}());
</script>
