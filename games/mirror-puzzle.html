
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜像拼图｜慧陪学</title>
<meta name="description" content="观察给出的半幅像素图，用颜色补全另一半，练习轴对称、观察力和空间想象。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#435047;--accent:#6d4c41;--paper:#e9f4e7;--line:#cbd9c7}
body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}
button{font:inherit}
.container{max-width:900px;margin:auto}
.header{text-align:center;margin-bottom:14px}
.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}
.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}
.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}
.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background,.15s box-shadow}
.chip:hover,.action:hover{transform:translateY(-1px)}
.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}
.chip:focus-visible,.action:focus-visible,.cell:focus-visible,.swatch:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}
.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}
.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}
.game-card{position:relative;overflow:hidden}
.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6;margin-bottom:12px}
.axis-legend{text-align:center;font-size:.78rem;color:#7c8a7b;margin:-5px 0 12px}
.board-wrap{display:flex;justify-content:center;overflow:auto;padding:4px}
.board{--n:4;--cell:min(12vw,62px);position:relative;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:3px;padding:9px;background:#91aa8b;border-radius:17px;box-shadow:0 5px 16px rgba(54,79,57,.2);touch-action:none;user-select:none}
.board.axis-v::after,.board.axis-h::after{content:"";position:absolute;z-index:4;pointer-events:none;background:#f8fbf6;box-shadow:0 0 0 2px #6d4c41}
.board.axis-v::after{top:7px;bottom:7px;left:50%;width:3px;transform:translateX(-1.5px)}
.board.axis-h::after{left:7px;right:7px;top:50%;height:3px;transform:translateY(-1.5px)}
.cell{position:relative;border:0;border-radius:7px;background:#f3f7ef;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(58,83,58,.13);transition:.12s transform,.15s background}
.cell.editable:hover{transform:scale(.95)}
.cell.given{cursor:default}
.cell.wrong{animation:shake .32s ease;box-shadow:inset 0 0 0 4px #ef5350,0 0 0 2px #fff}
.cell.hinted{animation:hintPulse .85s ease 2;box-shadow:inset 0 0 0 4px #1565c0}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes hintPulse{50%{transform:scale(.84)}}
.palette-title{text-align:center;margin:15px 0 8px;font-size:.82rem;color:#71806f}
.palette{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.swatch{width:43px;height:43px;border:3px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.22);position:relative}
.swatch.on{outline:4px solid #513b46;outline-offset:2px;transform:scale(1.06)}
.swatch.erase{background:repeating-linear-gradient(45deg,#fff,#fff 5px,#ddd 5px,#ddd 10px)}
.swatch.erase::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:1.5rem;font-weight:900}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}
.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}
.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}
.secondary{background:#dbe9d6;color:#4d6b4f}
.muted{background:#eee;color:#666}
.next{background:linear-gradient(135deg,#5eaa70,#2e7d4a);color:#fff}
.action[hidden]{display:none}
.message{min-height:48px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}
.message.ok{background:#e6f6e9;color:#26743b;font-weight:700}
.message.bad{background:#fff0ee;color:#b43c37;font-weight:700}
.message.done{background:#fff4cc;color:#7a5700;font-weight:700}
.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}
.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}
.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}
.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}
@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:560px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.board{--cell:min(12.5vw,52px);gap:2px;padding:7px}.cell{border-radius:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header">
    <h1>🪞 镜像拼图</h1>
    <p>观察有花纹的一半，用颜色把另一半照镜子补完整。</p>
  </header>

  <section class="card" aria-label="游戏设置">
    <div class="toolbar">
      <div class="group" id="modeGroup">
        <span class="group-label">模式</span>
        <button class="chip on" data-mode="practice">自由练习</button>
        <button class="chip" data-mode="challenge">5关挑战</button>
      </div>
      <div class="group" id="levelGroup">
        <span class="group-label">难度</span>
        <button class="chip on" data-level="easy">低年级 4×4</button>
        <button class="chip" data-level="medium">中年级 6×6</button>
        <button class="chip" data-level="hard">高年级 8×8</button>
      </div>
      <div class="group" id="axisGroup">
        <span class="group-label">镜面</span>
        <button class="chip on" data-axis="vertical">左右</button>
        <button class="chip" data-axis="horizontal">上下</button>
        <button class="chip" data-axis="random">随机</button>
      </div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row" aria-live="polite">
      <div class="stat">当前进度<b id="progressText">自由练习</b></div>
      <div class="stat">本题检查<b id="attemptText">0 次</b></div>
      <div class="stat">累计完成<b id="completeText">0 题</b></div>
      <div class="stat">最佳挑战<b id="bestText">--</b></div>
    </div>
  </section>

  <section class="card game-card">
    <p class="instruction" id="instruction">看左边有花纹的格子，在右边补出完全对称的图案。</p>
    <p class="axis-legend" id="axisLegend">白线是镜面｜题目一侧不能修改</p>
    <div class="board-wrap">
      <div class="board axis-v" id="board" role="grid" aria-label="镜像拼图画板"></div>
    </div>
    <p class="palette-title">先选颜色，再点击或拖过空白格；橡皮可以擦掉。</p>
    <div class="palette" id="palette" aria-label="调色板"></div>
    <div class="actions">
      <button class="action muted" id="resetBtn">↺ 清空重画</button>
      <button class="action secondary" id="hintBtn">💡 提示一格</button>
      <button class="action primary" id="checkBtn">✓ 检查答案</button>
      <button class="action next" id="nextBtn" hidden>下一题 →</button>
    </div>
    <div class="message" id="message" role="status" aria-live="polite">慢慢观察镜面两边：距离镜面一样远的格子，颜色也应该一样。</div>
  </section>

  <section class="card help">
    <h2>怎么玩？</h2>
    <ol>
      <li>观察镜面一侧不能修改的题目区域。</li>
      <li>找到镜面另一边相同距离的位置，填上相同颜色。</li>
      <li>点击“检查答案”；填错会标出来并留在当前题，可以继续修改。</li>
    </ol>
  </section>

  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>

<script src="hpx-core.js"></script>
<script>
// 2026-08-14：本站独立设计的轴对称练习；图案由下方算法运行时生成，不使用外部图片或关卡数据。
(function(){
  'use strict';

  const LEVELS={
    easy:{size:4,colors:2,density:.68},
    medium:{size:6,colors:3,density:.58},
    hard:{size:8,colors:4,density:.52}
  };
  const COLORS=['#ef5b78','#f6b73c','#35a873','#4285d4','#8a5fc7','#f27c38'];
  const STORE_KEY='hpxMirrorPuzzleStatsV1';
  const state={mode:'practice',level:'easy',axisChoice:'vertical',axis:'vertical',size:4,target:[],answer:[],selected:COLORS[0],attempts:0,challengeStep:1,challengeStart:0,solved:false,pointerDown:false,stats:loadStats()};
  const el=id=>document.getElementById(id);
  const board=el('board'),message=el('message');

  const speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;
  function say(text){if(speech)speech.speak(text)}
  el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());

  function loadStats(){
    try{return Object.assign({completed:0,bestSeconds:null},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}
    catch(e){return{completed:0,bestSeconds:null}}
  }
  function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
  function randomItem(items){return items[Math.floor(Math.random()*items.length)]}
  function mirrorIndex(row,col,axis,n){return axis==='vertical'?[row,n-1-col]:[n-1-row,col]}
  function isGiven(row,col,axis,n){return axis==='vertical'?col<n/2:row<n/2}

  function generateTarget(n,axis,config){
    const result=Array(n*n).fill(null);
    let painted=0;
    for(let row=0;row<n;row++){
      for(let col=0;col<n;col++){
        if(!isGiven(row,col,axis,n))continue;
        const edgeBias=(row===0||col===0||row===n-1||col===n-1)?-.08:.08;
        const color=Math.random()<config.density+edgeBias?randomItem(COLORS.slice(0,config.colors)):null;
        result[row*n+col]=color;
        const [mr,mc]=mirrorIndex(row,col,axis,n);
        result[mr*n+mc]=color;
        if(color)painted++;
      }
    }
    if(painted<Math.max(2,n/2))return generateTarget(n,axis,config);
    return result;
  }

  function startPuzzle(resetChallenge){
    const config=LEVELS[state.level];
    state.size=config.size;
    if(resetChallenge&&state.mode==='challenge'){
      state.challengeStep=1;
      state.challengeStart=Date.now();
    }
    state.axis=state.axisChoice==='random'?randomItem(['vertical','horizontal']):state.axisChoice;
    state.target=generateTarget(state.size,state.axis,config);
    state.answer=Array(state.size*state.size).fill(null);
    state.attempts=0;
    state.solved=false;
    render();
    setMessage('慢慢观察镜面两边：距离镜面一样远的格子，颜色也应该一样。','');
    say(state.axis==='vertical'?'请观察左边，在右边补出镜像图案。':'请观察上面，在下面补出镜像图案。');
  }

  function render(){
    board.style.setProperty('--n',state.size);
    board.className='board '+(state.axis==='vertical'?'axis-v':'axis-h');
    board.innerHTML='';
    for(let row=0;row<state.size;row++){
      for(let col=0;col<state.size;col++){
        const idx=row*state.size+col;
        const given=isGiven(row,col,state.axis,state.size);
        const cell=document.createElement('button');
        cell.type='button';
        cell.className='cell '+(given?'given':'editable');
        cell.dataset.index=idx;
        cell.setAttribute('role','gridcell');
        cell.setAttribute('aria-label',given?`题目格，第${row+1}行第${col+1}列`:`填写格，第${row+1}行第${col+1}列`);
        const color=given?state.target[idx]:state.answer[idx];
        if(color)cell.style.backgroundColor=color;
        if(!given){
          cell.addEventListener('pointerdown',e=>{e.preventDefault();state.pointerDown=true;paintCell(idx)});
          cell.addEventListener('pointerenter',()=>{if(state.pointerDown)paintCell(idx)});
          cell.addEventListener('click',()=>paintCell(idx));
          cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paintCell(idx)}});
        }
        board.appendChild(cell);
      }
    }
    renderPalette();
    updateStatus();
    el('instruction').textContent=state.axis==='vertical'?'看左边有花纹的格子，在右边补出完全对称的图案。':'看上面有花纹的格子，在下面补出完全对称的图案。';
    el('nextBtn').hidden=true;
    el('checkBtn').hidden=false;
  }

  window.addEventListener('pointerup',()=>{state.pointerDown=false});
  window.addEventListener('pointercancel',()=>{state.pointerDown=false});
  board.addEventListener('pointermove',e=>{
    if(!state.pointerDown)return;
    const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell.editable');
    if(cell&&board.contains(cell))paintCell(+cell.dataset.index);
  });

  function renderPalette(){
    const config=LEVELS[state.level];
    el('palette').innerHTML='';
    COLORS.slice(0,config.colors).concat([null]).forEach(color=>{
      const b=document.createElement('button');
      b.type='button';b.className='swatch'+(color===null?' erase':'')+(state.selected===color?' on':'');
      if(color)b.style.background=color;
      b.setAttribute('aria-label',color?'选择颜色':'选择橡皮');
      b.addEventListener('click',()=>{state.selected=color;renderPalette()});
      el('palette').appendChild(b);
    });
    if(state.selected&&!COLORS.slice(0,config.colors).includes(state.selected))state.selected=COLORS[0];
  }

  function paintCell(idx){
    if(state.solved)return;
    state.answer[idx]=state.selected;
    const cell=board.querySelector(`[data-index="${idx}"]`);
    cell.style.backgroundColor=state.selected||'';
    cell.classList.remove('wrong','hinted');
  }

  function editableIndexes(){
    const out=[];
    for(let r=0;r<state.size;r++)for(let c=0;c<state.size;c++)if(!isGiven(r,c,state.axis,state.size))out.push(r*state.size+c);
    return out;
  }

  function checkAnswer(){
    if(state.solved)return;
    state.attempts++;
    const wrong=editableIndexes().filter(i=>state.answer[i]!==state.target[i]);
    board.querySelectorAll('.cell').forEach(c=>c.classList.remove('wrong'));
    if(wrong.length){
      wrong.forEach(i=>board.querySelector(`[data-index="${i}"]`).classList.add('wrong'));
      const unfilled=wrong.filter(i=>state.answer[i]===null&&state.target[i]!==null).length;
      const extra=wrong.length-unfilled;
      const detail=[unfilled?`${unfilled}格还没填对`:null,extra?`${extra}格颜色或位置不对`:null].filter(Boolean).join('，');
      setMessage(`还差一点：${detail}。红框会留在当前题，修改后再检查。`,'bad');
      say('还差一点，请看看红框格子，修改后再试一次。');
      updateStatus();
      return;
    }
    state.solved=true;
    state.stats.completed++;
    saveStats();
    el('checkBtn').hidden=true;
    el('nextBtn').hidden=false;
    if(state.mode==='challenge'&&state.challengeStep===5){
      const seconds=Math.max(1,Math.round((Date.now()-state.challengeStart)/1000));
      if(state.stats.bestSeconds===null||seconds<state.stats.bestSeconds)state.stats.bestSeconds=seconds;
      saveStats();
      setMessage(`挑战完成！5幅镜像图全部补好了，用时 ${formatTime(seconds)}。`,'done');
      el('nextBtn').textContent='再挑战一次 ↻';
      celebrate();say('太棒了，五关挑战全部完成！');
    }else{
      setMessage(state.mode==='challenge'?`第 ${state.challengeStep} 关完成！准备好就进入下一关。`:'完全对称，拼对啦！可以继续下一题。','ok');
      el('nextBtn').textContent='下一题 →';
      celebrate();say('完全对称，拼对啦！');
    }
    updateStatus();
  }

  function nextPuzzle(){
    if(state.mode==='challenge'){
      if(state.challengeStep===5){startPuzzle(true);return}
      state.challengeStep++;
    }
    startPuzzle(false);
  }

  function resetAnswer(){
    if(state.solved)return;
    state.answer.fill(null);state.attempts=0;render();
    setMessage('已经清空，可以重新观察后再画。','');
  }

  function hintOne(){
    if(state.solved)return;
    const candidates=editableIndexes().filter(i=>state.answer[i]!==state.target[i]);
    if(!candidates.length){setMessage('看起来已经补完整了，点击“检查答案”吧。','ok');return}
    const idx=randomItem(candidates);
    state.answer[idx]=state.target[idx];
    const cell=board.querySelector(`[data-index="${idx}"]`);
    cell.style.backgroundColor=state.target[idx]||'';
    cell.classList.remove('wrong');cell.classList.add('hinted');
    setMessage('提示了一格：观察它与镜面另一侧题目格的位置关系。','');
  }

  function setMessage(text,type){message.textContent=text;message.className='message'+(type?' '+type:'')}
  function formatTime(seconds){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
  function updateStatus(){
    el('progressText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';
    el('attemptText').textContent=`${state.attempts} 次`;
    el('completeText').textContent=`${state.stats.completed} 题`;
    el('bestText').textContent=state.stats.bestSeconds===null?'--':formatTime(state.stats.bestSeconds);
  }
  function setSelected(group,attribute,value){document.querySelectorAll(`#${group} [data-${attribute}]`).forEach(b=>b.classList.toggle('on',b.dataset[attribute]===value))}

  el('modeGroup').addEventListener('click',e=>{
    const value=e.target.dataset.mode;if(!value)return;
    state.mode=value;setSelected('modeGroup','mode',value);startPuzzle(true);
  });
  el('levelGroup').addEventListener('click',e=>{
    const value=e.target.dataset.level;if(!value)return;
    state.level=value;state.selected=COLORS[0];setSelected('levelGroup','level',value);startPuzzle(true);
  });
  el('axisGroup').addEventListener('click',e=>{
    const value=e.target.dataset.axis;if(!value)return;
    state.axisChoice=value;setSelected('axisGroup','axis',value);startPuzzle(true);
  });
  el('resetBtn').addEventListener('click',resetAnswer);
  el('hintBtn').addEventListener('click',hintOne);
  el('checkBtn').addEventListener('click',checkAnswer);
  el('nextBtn').addEventListener('click',nextPuzzle);

  function celebrate(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(let i=0;i<34;i++){
      const dot=document.createElement('i');dot.className='confetti';
      dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';
      dot.style.background=randomItem(COLORS);dot.style.setProperty('--dx',(Math.random()*180-90)+'px');
      dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);
      setTimeout(()=>dot.remove(),2000);
    }
  }

  window.MirrorPuzzle={mirrorIndex,isGiven,generateTarget,LEVELS};
  startPuzzle(false);
})();
</script>
