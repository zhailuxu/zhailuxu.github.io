<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家长周报｜慧陪学</title>
<meta name="description" content="在当前浏览器查看每周练习时间、完成情况、能力分布和下周建议。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#445047;--muted:#718078;--green:#56765b;--paper:rgba(250,252,246,.96)}body{min-height:100vh;padding:18px 12px 42px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dcebd9,#f0f2dd 50%,#f5e7d3)}button{font:inherit}.container{max-width:980px;margin:auto}.hero,.card{border:1px solid rgba(255,255,255,.8);border-radius:23px;background:var(--paper);box-shadow:0 6px 23px rgba(58,78,59,.09)}.hero{padding:23px 20px;text-align:center}.eyebrow{color:#7d8a74;font-size:.74rem;font-weight:850;letter-spacing:2px}.hero h1{margin:5px 0;color:#67584b;font-size:clamp(1.9rem,6vw,2.8rem)}.hero p{color:var(--muted);font-size:.83rem;line-height:1.65}.week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:12px 15px;border-radius:17px}.week-nav button{border:0;border-radius:10px;padding:8px 11px;background:#e3ebdf;color:#55705a;font-weight:850;cursor:pointer}.week-nav button:disabled{opacity:.4;cursor:not-allowed}.week-title{text-align:center}.week-title b{display:block;font-size:.95rem}.week-title span{color:var(--muted);font-size:.72rem}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px 10px;border-radius:17px;background:#eaf1e6;text-align:center;color:#6c796e;font-size:.75rem}.stat b{display:block;margin-top:5px;color:#5d584e;font-size:1.3rem}.notice{display:none;margin-top:13px;padding:13px 16px;border-radius:15px;background:#fff1d7;color:#74644d;font-size:.79rem;line-height:1.65}.notice.show{display:block}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.card{padding:18px}.card h2{margin-bottom:13px;color:#59675c;font-size:1.04rem}.ability-list{display:grid;gap:12px}.ability{display:grid;grid-template-columns:110px 1fr 76px;align-items:center;gap:10px}.ability-name{font-size:.78rem;font-weight:850}.ability-bar{height:11px;border-radius:99px;background:#dce5d8;overflow:hidden}.ability-bar i{display:block;height:100%;border-radius:inherit}.ability-count{color:#6d796f;font-size:.72rem;text-align:right}.trend-list{display:grid;gap:8px}.trend{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:10px 12px;border-radius:13px;background:#edf3e9}.trend b{font-size:.79rem}.trend span{padding:4px 8px;border-radius:99px;background:#fff;color:#657267;font-size:.68rem;font-weight:850}.advice{display:grid;gap:10px}.advice-item{padding:13px;border-radius:14px;background:#edf3e9}.advice-item b{display:block;color:#596b5d;font-size:.82rem}.advice-item p{margin-top:4px;color:#718078;font-size:.76rem;line-height:1.6}.games{display:grid;gap:8px}.game-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#edf3e9;font-size:.77rem}.game-row span{color:#718078}.empty{padding:17px;border-radius:14px;background:#edf3e9;color:#718078;text-align:center;font-size:.78rem;line-height:1.65}.privacy{margin-top:14px;color:#6f7b72;font-size:.76rem;line-height:1.7;text-align:center}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.action{border:0;border-radius:12px;padding:10px 14px;background:#58775e;color:white;font-weight:850;cursor:pointer}.action.secondary{background:#e2eadf;color:#58705c}.back{display:block;margin-top:16px;text-align:center;color:#55715a;text-decoration:none;font-size:.82rem;font-weight:850}@media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.ability{grid-template-columns:96px 1fr}.ability-count{grid-column:2;text-align:left}.week-nav{padding:10px}}@media print{body{padding:0;background:#fff}.container{max-width:none}.hero,.card,.week-nav{box-shadow:none}.week-nav button,.actions,.back,#feedbackButton,#feedbackPanel{display:none!important}.grid{break-inside:avoid}.privacy{margin-top:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="container">
  <header class="hero"><div class="eyebrow">只看自己的成长变化</div><h1>📘 家长周报</h1><p>把一周练习整理成容易理解的反馈。记录较少时会继续观察，不急着下结论。</p></header>
  <section class="card week-nav"><button id="prevWeek" aria-label="查看上一周">← 上一周</button><div class="week-title"><b id="weekRange"></b><span id="weekState"></span></div><button id="nextWeek" aria-label="查看下一周">下一周 →</button></section>
  <section class="summary"><div class="stat">练习天数<b id="practiceDays">0天</b></div><div class="stat">完成练习<b id="completed">0次</b></div><div class="stat">有效练习<b id="minutes">0分钟</b></div><div class="stat">训练营打卡<b id="checkins">0/7天</b></div></section>
  <p class="notice" id="dataNotice">本周记录还比较少。建议先完成至少 2 天、3 次练习，再观察能力方向的变化。</p>
  <div class="grid">
    <section class="card"><h2>本周能力练习分布</h2><div class="ability-list" id="abilityList"></div></section>
    <section class="card"><h2>与上一周相比</h2><div class="trend-list" id="trendList"></div></section>
    <section class="card"><h2>下周练习建议</h2><div class="advice" id="advice"></div></section>
    <section class="card"><h2>本周常用游戏</h2><div class="games" id="games"></div></section>
  </div>
  <p class="privacy">隐私说明：周报在当前浏览器中根据本机练习记录即时生成，不上传姓名、年龄、答案或设备标识，也不提供儿童排名。清除浏览器数据后记录会消失。</p>
  <div class="actions"><button class="action" id="printBtn">打印 / 保存为 PDF</button><a class="action secondary" href="game-progress.html" style="text-decoration:none">查看详细成长记录</a></div>
  <a class="back" href="daily-camp.html">← 返回每日训练营</a>
</main>
<script src="hpx-game-progress.js"></script>
<script src="hpx-daily-camp.js"></script>
<script src="hpx-ability-check.js"></script>
<script src="hpx-parent-report.js"></script>
<script>
(function(){'use strict';var anchor=new Date(),currentStart=HpxParentReport.weekStart(new Date()),gamesMeta=HpxGameProgress.GAMES;function fmt(date){return(date.getMonth()+1)+'月'+date.getDate()+'日'}function minutes(ms){var value=Math.round(ms/60000);return value<1&&ms>0?'不足1分钟':value+'分钟'}function render(){var report=HpxParentReport.build(HpxGameProgress.load(),HpxDailyCamp.load(),HpxAbilityCheck.load(),anchor),current=report.current,max=Math.max(1,...report.rows.map(function(row){return row.completed}));document.getElementById('weekRange').textContent=fmt(current.start)+'—'+fmt(current.end);document.getElementById('weekState').textContent=current.start.getTime()===currentStart.getTime()?'本周':'历史周报';document.getElementById('nextWeek').disabled=current.start.getTime()>=currentStart.getTime();document.getElementById('practiceDays').textContent=current.practiceDays+'天';document.getElementById('completed').textContent=current.completed+'次';document.getElementById('minutes').textContent=minutes(current.totalMs);document.getElementById('checkins').textContent=report.checkins.completedDays+'/7天';document.getElementById('dataNotice').classList.toggle('show',!report.advice.enough);document.getElementById('abilityList').innerHTML=report.rows.map(function(row){var width=row.completed/max*100;return '<div class="ability"><span class="ability-name">'+row.meta.icon+' '+row.meta.name+'</span><span class="ability-bar"><i style="width:'+width+'%;background:'+row.meta.color+'"></i></span><span class="ability-count">'+row.completed+'次完成</span></div>'}).join('');document.getElementById('trendList').innerHTML=report.rows.map(function(row){return '<div class="trend"><b>'+row.meta.icon+' '+row.meta.name+'</b><span>'+row.trend+'</span></div>'}).join('');var advice=[];if(!report.advice.enough){advice.push('<div class="advice-item"><b>先保持规律</b><p>本周数据不足以判断变化，建议先完成至少 2 天训练，再继续观察。</p></div>')}if(report.advice.maintain){var keep=HpxParentReport.abilityMeta(report.advice.maintain);advice.push('<div class="advice-item"><b>继续保持 · '+keep.name+'</b><p>这个方向本周练习较稳定，下周继续安排少量巩固即可。</p></div>')}if(report.advice.focus.length){var focus=report.advice.focus.map(function(id){return HpxParentReport.abilityMeta(id).name}),focusTitle=report.advice.focusSource==='assessment'?'沿用小测重点':'建议加强';advice.push('<div class="advice-item"><b>'+focusTitle+' · '+focus.join('、')+'</b><p>下周训练会适当增加这些方向，但仍保持多种能力均衡。</p></div>')}if(!advice.length)advice.push('<div class="advice-item"><b>继续积累</b><p>完成几次练习后，这里会生成更具体的下周建议。</p></div>');document.getElementById('advice').innerHTML=advice.join('');var used=current.games.filter(function(game){return game.completed||game.visits}).slice(0,5);document.getElementById('games').innerHTML=used.length?used.map(function(game){var meta=gamesMeta[game.gameId]||{name:game.gameId};return '<div class="game-row"><b>'+meta.name+'</b><span>完成 '+game.completed+' 次 · 打开 '+game.visits+' 次</span></div>'}).join(''):'<div class="empty">这一周还没有游戏记录。</div>'}document.getElementById('prevWeek').addEventListener('click',function(){anchor=HpxParentReport.addDays(anchor,-7);render()});document.getElementById('nextWeek').addEventListener('click',function(){anchor=HpxParentReport.addDays(anchor,7);render()});document.getElementById('printBtn').addEventListener('click',function(){window.print()});render()})();
</script>
<script src="feedback.js?v=20260906-2"></script>
<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
