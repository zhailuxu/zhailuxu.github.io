<body data-hpx-page style="--hpx-accent:#a64f48">
<main class="wrap">
  <header class="hero"><div class="hero-icon" aria-hidden="true">📖</div><h1>一年级每日语文练习</h1><p>每天约 12～15 分钟，按顺序完成拼音听读、识字词语、阅读表达和朗读积累。每天读一点、认一点、说一点。</p><div class="hero-tools"><span class="chip" id="dayTheme"></span><button class="chip button" type="button" id="speakToggle" aria-pressed="true">🔊 声音解说 开</button></div></header>
  <section class="overview" aria-labelledby="todayTitle"><div class="overview-head"><div><div class="date" id="dateText"></div><h2 id="todayTitle">今天的四项练习</h2></div><span class="count" id="progressText">0 / 4</span></div><div class="meter" role="progressbar" aria-label="今日语文练习进度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span id="progressBar"></span></div><p class="overview-note" id="nextHint" role="status" aria-live="polite"></p></section>
  <section class="tasks" id="taskList" aria-label="今日顺序语文练习"></section>
  <section class="complete" id="completePanel" aria-live="polite"><strong>今天的语文练习完成啦！</strong><p>拼音、识字、表达和积累都练到了。明天继续稳稳进步。</p><span class="streak" id="streakText">连续完成 1 天</span></section>
  <section class="history-panel" aria-labelledby="historyTitle"><div class="history-head"><div><h2 id="historyTitle">每日练习记录</h2><p>自动保存在当前设备，展示最近 14 个有练习的日期。</p></div><span class="history-total" id="historyTotal">已练习 0 天</span></div><div class="history-list" id="historyList" aria-live="polite"></div></section>
  <details class="week-preview"><summary>查看一周练习安排</summary><div class="week-list" id="weekList"></div><section class="week-detail" aria-live="polite" aria-labelledby="weekDetailTitle"><h3 id="weekDetailTitle"></h3><div class="week-detail-tasks" id="weekDetailTasks"></div></section><p class="principle">安排原则：拼音练习与识字交替巩固，词语、标点、说话和古诗每天少量练习。先把话读清楚、说完整，再逐渐追求熟练。</p></details>
  <a class="back" href="index.html">← 返回慧陪学</a>
</main>
<dialog id="practiceDialog" aria-labelledby="practiceTitle"><div class="practice-shell"><header class="practice-head"><strong id="practiceTitle">今日练习</strong><button type="button" class="practice-close" id="closePractice">暂时返回</button></header><iframe class="practice-frame" id="practiceFrame" title="当前语文练习"></iframe><footer class="practice-foot"><span class="practice-tip">完成页面中的一小轮练习后，再点击右侧按钮。</span><button type="button" class="practice-done" id="finishTask">完成这项，学习下一项</button></footer></div></dialog>

<script>
(function(){
'use strict';
const STORE='hpx_grade1_daily_chinese_v1';
const WEEK_PLAN=[

 {day:'星期二',theme:'听辨与标点',tasks:[

  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'复习一首读过的古诗，尝试看着提示背出完整诗句。'}]},
 {day:'星期三',theme:'拼读与完整表达',tasks:[
  {track:'拼音听读',icon:'🗣️',title:'汉语拼音入门',href:'pinyin.html',minutes:'3～4分钟',description:'复习声调和拼读路径，把声母与韵母连起来读。'},

  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'跟读一首短诗，圈出已经认识的字，再试着背诵。'}]},
 {day:'星期四',theme:'听音识字与句子停顿',tasks:[
  {track:'拼音听读',icon:'👂',title:'拼音听辨挑战',href:'pinyin-listening.html',minutes:'3分钟',description:'听清音节后再作答，答错时重新听一遍并对比。'},
  {track:'识字词语',icon:'🀄',title:'趣味汉字',href:'hanzi.html',minutes:'3分钟',description:'观察字的偏旁和部件，用熟悉的字帮助记住新字。'},

  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'用自然的声音朗读古诗，不抢读，也不拖长声音。'}]},
 {day:'星期五',theme:'拼音复习与看图说话',tasks:[
  {track:'拼音听读',icon:'🗣️',title:'汉语拼音入门',href:'pinyin.html',minutes:'3～4分钟',description:'复习本周容易读错的拼音，重点练两组易混音。'},
  {track:'识字词语',icon:'🔗',title:'词语连线',href:'chinese_line.html',minutes:'3分钟',description:'一边读词语一边配对，完成后选一组说一句话。'},
  {track:'阅读表达',icon:'✏️',title:'看图写话',href:'xiezuo.html',minutes:'3～4分钟',description:'按顺序观察画面，用两句话说清发生了什么。'},
  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'把本周读过的古诗再背一次，想不起时再看提示。'}]},
 {day:'星期六',theme:'听辨与识字巩固',tasks:[
  {track:'拼音听读',icon:'👂',title:'拼音听辨挑战',href:'pinyin-listening.html',minutes:'3分钟',description:'完成一轮轻松听辨，注意四声和前后鼻音的区别。'},
  {track:'识字词语',icon:'🀄',title:'趣味汉字',href:'hanzi.html',minutes:'3分钟',description:'复习本周学过的字，看到字先读，再说一个常用词。'},
  {track:'阅读表达',icon:'？',title:'标点符号小课堂',href:'punctuation.html',minutes:'3分钟',description:'比较句号和问号，读出陈述与提问的不同语气。'},
  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'选一首喜欢的古诗读给家人听，注意题目和作者。'}]},
 {day:'星期日',theme:'词语与表达整理',tasks:[

  {track:'识字词语',icon:'🔗',title:'词语连线',href:'chinese_line.html',minutes:'3分钟',description:'完成一轮词语复习，把不熟悉的词再读两遍。'},

  {track:'朗读积累',icon:'📜',title:'古诗背诵',href:'chinese_poem.html',minutes:'3分钟',description:'整理本周背过的诗，挑一首完整朗读或背诵。'}]}
];
const COLORS=['#a5534a','#8b6b43','#4f7c79','#826486'];
const $=id=>document.getElementById(id);const speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.86,pitch:1.05}):null;const say=text=>speech&&speech.speak(text);let activeTaskIndex=-1,previewDayIndex=null;
function localDateKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function loadState(){try{const value=JSON.parse(localStorage.getItem(STORE)||'{"days":{}}');return value&&value.days?value:{days:{}};}catch(error){return {days:{}};}}
function saveState(state){const keys=Object.keys(state.days).sort().slice(-60),trimmed={days:{}};keys.forEach(key=>{trimmed.days[key]=state.days[key];});try{localStorage.setItem(STORE,JSON.stringify(trimmed));}catch(error){}return trimmed;}
function todayContext(){const now=new Date(),dateKey=localDateKey(now),planIndex=(now.getDay()+6)%7,state=loadState();if(!state.days[dateKey])state.days[dateKey]={done:[]};return {now,dateKey,planIndex,plan:WEEK_PLAN[planIndex],state,record:state.days[dateKey]};}
function completedStreak(state,date){let total=0,cursor=new Date(date.getFullYear(),date.getMonth(),date.getDate());for(let index=0;index<365;index++){const record=state.days[localDateKey(cursor)];if(!record||new Set(record.done||[]).size<4)break;total++;cursor.setDate(cursor.getDate()-1);}return total;}
function recordPlanIndex(dateKey){const date=new Date(`${dateKey}T12:00:00`);return(date.getDay()+6)%7;}
function formatTime(value){if(!value)return'';const date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}
function renderHistory(state){const all=Object.entries(state.days||{}).filter(([key,record])=>/^\d{4}-\d{2}-\d{2}$/.test(key)&&new Set(record.done||[]).size>0).sort(([a],[b])=>b.localeCompare(a)),entries=all.slice(0,14);$('historyTotal').textContent=`已练习 ${all.length} 天`;if(!entries.length){$('historyList').innerHTML='<div class="history-empty">完成第一项后，这里就会留下今天的练习记录。</div>';return;}$('historyList').innerHTML=entries.map(([key,record])=>{const plan=WEEK_PLAN[Number.isInteger(record.planIndex)?record.planIndex:recordPlanIndex(key)],done=new Set(record.done||[]),count=Math.min(4,done.size),date=new Date(`${key}T12:00:00`),dateText=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(date),time=formatTime(record.completedAt||record.updatedAt),tasks=plan.tasks.map((task,index)=>`<span class="history-task${done.has(index)?' done':''}">${done.has(index)?'✓':'○'} ${task.track}</span>`).join('');return `<article class="history-day"><div class="history-day-head"><span class="history-date">${dateText}</span><span class="history-result${count===4?' complete-result':''}">${count===4?'全部完成':`完成 ${count} / 4`}</span></div><div class="history-theme">${plan.theme}</div><div class="history-tasks">${tasks}</div>${time?`<div class="history-time">${count===4?'完成时间':'最近练习'} ${time}</div>`:''}</article>`;}).join('');}
function renderWeekDetail(index){const plan=WEEK_PLAN[index];$('weekDetailTitle').textContent=`${plan.day} · ${plan.theme}（预览）`;$('weekDetailTasks').innerHTML=plan.tasks.map((task,taskIndex)=>`<div class="week-task"><span class="week-task-number">${taskIndex+1}</span><div><b>${task.track} · ${task.title}</b><small>${task.description} · 约 ${task.minutes}</small></div></div>`).join('');}
function renderWeek(todayIndex){if(previewDayIndex===null)previewDayIndex=todayIndex;$('weekList').innerHTML=WEEK_PLAN.map((plan,index)=>`<button type="button" class="day${index===todayIndex?' today':''}${index===previewDayIndex?' selected':''}" data-preview-day="${index}" aria-pressed="${index===previewDayIndex}"><b>${plan.day.replace('星期','周')}${index===todayIndex?' · 今天':''}</b><span>${plan.theme}</span></button>`).join('');renderWeekDetail(previewDayIndex);}
function render(){const context=todayContext(),done=new Set(context.record.done||[]),doneCount=Math.min(4,done.size),nextIndex=context.plan.tasks.findIndex((_,index)=>!done.has(index));$('dateText').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(context.now);$('dayTheme').textContent=`今日主题 · ${context.plan.theme}`;$('progressText').textContent=`${doneCount} / 4`;$('progressBar').style.width=`${doneCount/4*100}%`;document.querySelector('.meter').setAttribute('aria-valuenow',String(doneCount));$('taskList').innerHTML=context.plan.tasks.map((task,index)=>{const isDone=done.has(index),isCurrent=index===nextIndex,isLocked=!isDone&&!isCurrent,status=isDone?'done':isCurrent?'current':'locked',buttonText=isDone?'再练一次':isCurrent?'开始练习 →':'完成上一项后解锁';return `<article class="task ${status}" style="--accent:${COLORS[index]}"><span class="task-icon" aria-hidden="true">${isDone?'✓':task.icon}</span><div><div class="task-step">第 ${index+1} 项 · ${task.track}</div><h3>${task.title}</h3><p>${task.description}</p><div class="task-meta">约 ${task.minutes}</div></div><button type="button" class="task-action" data-task="${index}" ${isLocked?'disabled':''}>${buttonText}</button></article>`;}).join('');const complete=doneCount===4;$('completePanel').classList.toggle('show',complete);$('nextHint').textContent=complete?'今天四项都完成了，可以安心休息。':`下一项：${context.plan.tasks[nextIndex].track} · ${context.plan.tasks[nextIndex].title}`;if(complete)$('streakText').textContent=`连续完成 ${completedStreak(context.state,context.now)} 天`;renderHistory(context.state);renderWeek(context.planIndex);}
function openTask(index){const context=todayContext(),task=context.plan.tasks[index],dialog=$('practiceDialog');activeTaskIndex=index;$('practiceTitle').textContent=`第 ${index+1} 项 · ${task.title}`;$('practiceFrame').src=task.href;$('practiceFrame').title=task.title;const alreadyDone=(context.record.done||[]).includes(index);$('finishTask').textContent=alreadyDone?'结束复习，返回计划':'完成这项，学习下一项';if(typeof dialog.showModal==='function')dialog.showModal();else window.location.href=task.href;}
function closeTask(){const dialog=$('practiceDialog');if(dialog.open)dialog.close();$('practiceFrame').src='about:blank';activeTaskIndex=-1;}
function finishTask(){if(activeTaskIndex<0)return;const context=todayContext(),done=new Set(context.record.done||[]),wasDone=done.has(activeTaskIndex),now=new Date().toISOString();done.add(activeTaskIndex);context.record.done=[...done].sort((a,b)=>a-b);context.record.planIndex=context.planIndex;context.record.updatedAt=now;if(done.size===4&&!context.record.completedAt)context.record.completedAt=now;saveState(context.state);closeTask();render();if(!wasDone){const next=document.querySelector('.task.current');if(next)next.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});say(done.size===4?'今天四项语文练习全部完成！':`完成了。下一项，${context.plan.tasks[done.size].track}。`);}}
$('taskList').addEventListener('click',event=>{const button=event.target.closest('[data-task]');if(button&&!button.disabled)openTask(Number(button.dataset.task));});$('weekList').addEventListener('click',event=>{const button=event.target.closest('[data-preview-day]');if(!button)return;previewDayIndex=Number(button.dataset.previewDay);renderWeek(todayContext().planIndex);});$('closePractice').addEventListener('click',closeTask);$('finishTask').addEventListener('click',finishTask);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('practiceDialog').addEventListener('close',()=>{$('practiceFrame').src='about:blank';activeTaskIndex=-1;});window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();
}());
</script>
