<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>反应控制｜慧陪学</title>
  <meta name="description" content="根据颜色或形状规则决定快速点击还是耐心等待，练习反应抑制、持续注意和规则切换。">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#435047;--accent:#55725b}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd,#d5ecd2 55%,#e9f2df)}button{font:inherit}.container{max-width:900px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#5f5748;text-shadow:2px 3px #ddd7c6}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}.card{background:rgba(240,248,235,.94);border:1px solid rgba(255,255,255,.62);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.8rem;font-weight:700;color:#71806f}.chip,.action{border:2px solid #cbd8c7;background:#fbfdf9;color:#5d625d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background}.chip:hover,.action:hover,.stimulus:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(74,103,79,.22)}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.04rem;color:#5f5748;margin-top:2px}.rule{max-width:650px;margin:0 auto 12px;border-radius:17px;background:#e5e4d4;padding:13px;text-align:center}.rule-label{font-size:.76rem;color:#747669}.rule-text{margin-top:4px;color:#5c5548;font-weight:900;font-size:clamp(1rem,3vw,1.23rem)}.rule-text .go{color:#28733c}.rule-text .wait{color:#a04a42}.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:335px;max-width:650px;margin:auto;border:2px solid #c9d8c5;border-radius:24px;background:linear-gradient(160deg,#f8fbf5,#e5efe0);overflow:hidden}.stimulus{width:210px;height:210px;border:0;border-radius:30px;background:#fff;box-shadow:0 8px 24px rgba(56,79,58,.16);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#59655b;transition:.12s transform}.shape{width:104px;height:104px;background:var(--color);filter:saturate(.78)}.shape.circle{border-radius:50%}.shape.square{border-radius:15px}.shape.diamond{transform:rotate(45deg) scale(.76);border-radius:12px}.shape.triangle{width:0;height:0;background:transparent;border-left:58px solid transparent;border-right:58px solid transparent;border-bottom:104px solid var(--color);filter:saturate(.78)}.stimulus-name{font-size:1rem;font-weight:850}.stage.flash-ok{box-shadow:inset 0 0 0 6px #74a879}.stage.flash-bad{box-shadow:inset 0 0 0 6px #cc6258}.cover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:#e5efe0;text-align:center}.cover[hidden]{display:none}.cover strong{font-size:1.2rem;color:#5f5748}.cover span{max-width:370px;color:#6a786b;line-height:1.6;font-size:.88rem}.progress{max-width:650px;margin:14px auto 4px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7fa777,#55725b);transition:width .2s}.progress-text{text-align:center;font-size:.79rem;color:#71806f}.actions{margin-top:13px}.action{border:0;padding:9px 16px;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#6f8c72,#55725b);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.45;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:50px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#5f5748;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}@media(max-width:520px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.stage{min-height:285px}.stimulus{width:180px;height:180px}.shape{width:88px;height:88px}.shape.triangle{border-left-width:49px;border-right-width:49px;border-bottom-width:88px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header"><h1>🚦 反应控制</h1><p>该点时快速点击，该等时稳稳忍住；看清规则再行动。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 颜色</button><button class="chip" data-level="medium">中年级 形状</button><button class="chip" data-level="hard">高年级 规则切换</button></div>
      <button class="chip" id="speakToggle">🔊 声音提醒 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">答对数量<b id="correctText">0 / 10</b></div><div class="stat">错误数量<b id="errorText">0 次</b></div><div class="stat">最佳正确率<b id="bestText">--</b></div></div>
  </section>
  <section class="card">
    <div class="rule"><div class="rule-label">当前规则</div><div class="rule-text" id="ruleText"><span class="go">绿色要点</span>，其他颜色<span class="wait">等待</span></div></div>
    <div class="stage" id="stage">
      <button class="stimulus" id="stimulus" type="button" aria-label="当前图形"></button>
      <div class="cover" id="cover"><strong id="coverTitle">准备好了吗？</strong><span id="coverText">看到绿色图形就点击；看到其他颜色什么也不做，等待它自动消失。</span><button class="action primary" id="startBtn">开始本轮</button></div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">共10个图形，等待开始</p>
    <div class="actions"><button class="action secondary" id="pauseBtn" hidden>⏸ 暂停</button><button class="action muted" id="newBtn">↻ 换一组</button><button class="action primary" id="nextBtn" hidden>下一组 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">不用一直快速点击，“忍住不点”也是正确答案。</div>
  </section>
  <section class="card help"><h2>怎么玩</h2><ol><li>先看“当前规则”。符合规则的图形出现时，点击中间的大卡片。</li><li>不符合规则时不要点击，安静等待它自动消失，这就算答对。</li><li>高年级模式会切换规则：有时看颜色，有时看形状；页面不会快速闪烁，可随时暂停。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-15：本站独立设计；刺激图形、出现顺序、判定规则和反馈文案均由浏览器内代码生成。
(function(){'use strict';
const LEVELS={easy:{count:10,duration:1900,rule:'color'},medium:{count:12,duration:1550,rule:'shape'},hard:{count:16,duration:1300,rule:'switch'}};
const COLORS=[{key:'green',name:'绿色',hex:'#69a66e'},{key:'red',name:'红色',hex:'#d46a65'},{key:'yellow',name:'黄色',hex:'#d9a63f'},{key:'purple',name:'紫色',hex:'#9274aa'}];
const SHAPES=[{key:'circle',name:'圆形'},{key:'square',name:'方形'},{key:'triangle',name:'三角形'},{key:'diamond',name:'菱形'}];
const STORE_KEY='hpxReactionControlV1';
const state={mode:'practice',level:'easy',game:null,index:0,correct:0,falseTaps:0,misses:0,reactionTotal:0,reactionCount:0,phase:'ready',timer:null,trialStart:0,challengeStep:1,challengeCorrect:0,challengeTotal:0,stats:loadStats()};
const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.04}):null;
function loadStats(){try{return Object.assign({best:{}},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{best:{}}}}
function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function makeStimulus(rule,shouldTap){let color,shape;if(rule==='color'){color=shouldTap?COLORS[0]:COLORS[1+Math.floor(Math.random()*(COLORS.length-1))];shape=SHAPES[Math.floor(Math.random()*SHAPES.length)]}else{shape=shouldTap?SHAPES[0]:SHAPES[1+Math.floor(Math.random()*(SHAPES.length-1))];color=COLORS[Math.floor(Math.random()*COLORS.length)]}return{rule,shouldTap,colorKey:color.key,colorName:color.name,colorHex:color.hex,shapeKey:shape.key,shapeName:shape.name}}
function createGame(level){const cfg=LEVELS[level],flags=shuffled(Array.from({length:cfg.count},(_,i)=>i<Math.ceil(cfg.count/2)));return{duration:cfg.duration,trials:flags.map((flag,index)=>{const rule=cfg.rule==='switch'?(Math.floor(index/4)%2===0?'color':'shape'):cfg.rule;return makeStimulus(rule,flag)})}}
function judgeTrial(trial,tapped){if(trial.shouldTap===tapped)return{correct:true,error:null};return{correct:false,error:tapped?'falseTap':'miss'}}
function ruleLabel(rule){return rule==='color'?'<span class="go">绿色要点</span>，其他颜色<span class="wait">等待</span>':'<span class="go">圆形要点</span>，其他形状<span class="wait">等待</span>'}
function ruleSpeech(rule){return rule==='color'?'当前规则：绿色要点，其他颜色等待。':'当前规则：圆形要点，其他形状等待。'}
function startGame(resetChallenge){clearTrialTimer();if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeCorrect=0;state.challengeTotal=0}state.game=createGame(state.level);state.index=0;state.correct=0;state.falseTaps=0;state.misses=0;state.reactionTotal=0;state.reactionCount=0;state.phase='ready';el('cover').hidden=false;el('coverTitle').textContent='准备好了吗？';el('coverText').textContent=state.level==='hard'?'规则每4个图形切换一次，请先看清当前规则。':'符合规则就点击，不符合规则就等待它自动消失。';el('startBtn').hidden=false;el('startBtn').textContent='开始本轮';el('pauseBtn').hidden=true;el('newBtn').hidden=false;el('nextBtn').hidden=true;el('stimulus').innerHTML='';updateRule(state.game.trials[0].rule,true);updateStatus();setMessage('不用一直快速点击，“忍住不点”也是正确答案。','')}
function begin(){if(state.phase!=='ready'&&state.phase!=='paused')return;state.phase='running';el('cover').hidden=true;el('pauseBtn').hidden=false;showTrial()}
function showTrial(){if(state.phase!=='running')return;const trial=state.game.trials[state.index],button=el('stimulus');updateRule(trial.rule,state.index===0||state.game.trials[state.index-1].rule!==trial.rule);button.disabled=false;button.dataset.shouldTap=String(trial.shouldTap);button.setAttribute('aria-label',`${trial.colorName}${trial.shapeName}`);button.innerHTML=`<span class="shape ${trial.shapeKey}" style="--color:${trial.colorHex}"></span><span class="stimulus-name">${trial.colorName}${trial.shapeName}</span>`;state.trialStart=performance.now();clearTrialTimer();state.timer=setTimeout(()=>resolveTrial(false),state.game.duration);updateStatus()}
function resolveTrial(tapped){if(state.phase!=='running')return;clearTrialTimer();const trial=state.game.trials[state.index],result=judgeTrial(trial,tapped);el('stimulus').disabled=true;if(result.correct){state.correct++;if(tapped){state.reactionTotal+=performance.now()-state.trialStart;state.reactionCount++}flash('ok');setMessage(tapped?'点得正确！':'忍住了，判断正确！','ok')}else{if(result.error==='falseTap'){state.falseTaps++;setMessage('这个图形应该等待，你点得太快了。','bad')}else{state.misses++;setMessage('这个图形应该点击，下次再果断一点。','bad')}flash('bad')}state.index++;updateStatus();if(state.index>=state.game.trials.length){setTimeout(finishRound,520)}else{setTimeout(showTrial,520)}}
function finishRound(){if(state.phase!=='running')return;state.phase='done';const total=state.game.trials.length,accuracy=Math.round(state.correct/total*100),best=state.stats.best[state.level]||0;if(accuracy>best){state.stats.best[state.level]=accuracy;saveStats()}if(state.mode==='challenge'){state.challengeCorrect+=state.correct;state.challengeTotal+=total}el('startBtn').hidden=true;el('pauseBtn').hidden=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;el('cover').hidden=false;el('coverTitle').textContent=`本轮正确率 ${accuracy}%`;const average=state.reactionCount?Math.round(state.reactionTotal/state.reactionCount):0;el('coverText').textContent=`误点${state.falseTaps}次，漏点${state.misses}次${average?`，点击平均${average}毫秒`:''}。`;if(state.mode==='challenge'&&state.challengeStep===5){const totalAccuracy=Math.round(state.challengeCorrect/state.challengeTotal*100);el('nextBtn').textContent='再挑战一次 ↻';setMessage(`5关完成！总正确率${totalAccuracy}%。`,'done');celebrate()}else{el('nextBtn').textContent='下一组 →';setMessage(`本轮结束，正确${state.correct}个，共${total}个。`,'done');if(accuracy>=80)celebrate()}updateStatus()}
function pause(){if(state.phase!=='running')return;clearTrialTimer();state.phase='paused';el('cover').hidden=false;el('coverTitle').textContent='已经暂停';el('coverText').textContent='休息好后继续，当前图形会重新计时，不会记错。';el('startBtn').hidden=false;el('startBtn').textContent='继续本轮';el('pauseBtn').hidden=true}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}
function clearTrialTimer(){if(state.timer){clearTimeout(state.timer);state.timer=null}}
function updateRule(rule,announce){el('ruleText').innerHTML=ruleLabel(rule);if(announce&&speech)speech.speak(ruleSpeech(rule))}
function updateStatus(){const total=state.game.trials.length,done=Math.min(state.index,total),errors=state.falseTaps+state.misses;el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('correctText').textContent=`${state.correct} / ${total}`;el('errorText').textContent=`${errors} 次`;el('bestText').textContent=state.stats.best[state.level]!==undefined?`${state.stats.best[state.level]}%`:'--';el('progressFill').style.width=`${done/total*100}%`;el('progressText').textContent=state.phase==='ready'?`共${total}个图形，等待开始`:state.phase==='done'?`已完成 ${total} / ${total}`:`第${Math.min(done+1,total)} / ${total}个图形`}
function flash(type){const stage=el('stage');stage.classList.remove('flash-ok','flash-bad');void stage.offsetWidth;stage.classList.add(type==='ok'?'flash-ok':'flash-bad');setTimeout(()=>stage.classList.remove('flash-ok','flash-bad'),350)}
function setMessage(text,type){const message=el('message');message.textContent=text;message.className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(button=>button.classList.toggle('on',button.dataset[key]===value))}
el('stimulus').addEventListener('click',()=>resolveTrial(true));el('startBtn').addEventListener('click',begin);el('pauseBtn').addEventListener('click',pause);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
el('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});el('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startGame(true)});
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<28;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=colors[Math.floor(Math.random()*colors.length)];dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}}
window.ReactionControl={LEVELS,makeStimulus,createGame,judgeTrial,ruleLabel};startGame(false)})();
</script>

<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
