<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>游戏成长记录｜慧陪学</title><meta name="description" content="在当前设备查看小游戏完成次数、练习时长和需要加强的方向。"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#465149;--green:#58745d}body{min-height:100vh;padding:18px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dfedda,#eff2dc 52%,#f6e9d5)}button{font:inherit}.container{max-width:940px;margin:auto}.hero,.card{margin-bottom:15px;padding:18px;border:1px solid rgba(255,255,255,.72);border-radius:23px;background:rgba(248,251,244,.94);box-shadow:0 5px 22px rgba(54,79,57,.1)}.hero{text-align:center}.hero h1{font-size:clamp(1.8rem,5vw,2.5rem);color:#625648;letter-spacing:3px}.hero p{margin-top:7px;color:#718078;font-size:.88rem;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#dfebda;text-align:center;color:#6e796f;font-size:.75rem}.stat b{display:block;margin-top:5px;color:#5e574a;font-size:1.28rem}.card h2{margin-bottom:12px;color:#5c685e;font-size:1.05rem}.weak-list,.recent-list{display:grid;gap:8px}.weak,.recent{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:13px;background:#edf3e9}.weak b,.recent b{color:#536457}.weak span,.recent span{color:#718078;font-size:.75rem}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:11px}.game{padding:14px;border-radius:16px;background:#edf3e9}.game-head{display:flex;justify-content:space-between;gap:8px}.game h3{font-size:.95rem}.game a{color:#57715b;text-decoration:none;font-size:.75rem;font-weight:800}.metrics{margin-top:8px;color:#6b766d;font-size:.76rem;line-height:1.7}.bar{height:8px;margin-top:8px;border-radius:8px;background:#d2dfce;overflow:hidden}.bar i{display:block;height:100%;background:#6d9274}.empty{padding:18px;border-radius:14px;background:#edf3e9;text-align:center;color:#718078;line-height:1.7}.privacy{color:#6f7c72;font-size:.78rem;line-height:1.7}.actions{display:flex;justify-content:center;gap:9px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:9px 14px;background:#dfe9dc;color:#526655;font-weight:800;cursor:pointer}.btn.danger{background:#f1dfda;color:#93473d}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@media(max-width:620px){.summary{grid-template-columns:repeat(2,1fr)}.weak,.recent{align-items:flex-start;flex-direction:column}.games{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="container"><header class="hero"><h1>🌱 游戏成长记录</h1><p>看看最近练了什么、完成了多少，以及下一步可以加强哪里。</p></header><section class="card"><div class="summary"><div class="stat">玩过游戏<b id="tracked">0</b></div><div class="stat">完成练习<b id="completed">0</b></div><div class="stat">综合正确率<b id="accuracy">--</b></div><div class="stat">有效练习<b id="minutes">0分钟</b></div></div></section><section class="card"><h2>🎯 建议加强</h2><div class="weak-list" id="weakList"></div></section><section class="card"><h2>🕘 最近活动</h2><div class="recent-list" id="recentList"></div></section><section class="card"><h2>🎮 各游戏记录</h2><div class="games" id="games"></div></section><section class="card"><p class="privacy">隐私说明：成长记录仅保存在当前浏览器的本地存储中，不上传姓名、年龄、答案或设备标识。清除浏览器数据后记录也会消失。</p><div class="actions"><a class="btn" href="parent-weekly-report.html" style="text-decoration:none">查看家长周报</a><button class="btn" id="exportBtn">导出记录</button><button class="btn danger" id="clearBtn">清空本机记录</button></div></section><a class="back" href="game-paradise.html">← 返回游戏乐园</a></main><script src="hpx-game-progress.js"></script><script>
(function(){'use strict';const api=window.HpxGameProgress,$=id=>document.getElementById(id);function levelName(level){return{easy:'低年级',medium:'中年级',hard:'高年级',default:'综合'}[level]||level}function formatTime(ms){const min=Math.round(ms/60000);return min<1?'不足1分钟':`${min}分钟`}function render(){const data=api.load(),sum=api.summary(data);$('tracked').textContent=sum.tracked;$('completed').textContent=sum.completed;$('accuracy').textContent=sum.completed+sum.mistakes?`${sum.accuracy}%`:'--';$('minutes').textContent=formatTime(sum.totalMs);const weak=api.weakAreas(data,3);$('weakList').innerHTML=weak.length?weak.map(row=>`<div class="weak"><b>${row.name} · ${levelName(row.level)}</b><span>出现${row.mistakes}次困难，建议再练一轮</span></div>`).join(''):'<div class="empty">暂时没有明显薄弱项，完成几轮游戏后这里会给出建议。</div>';const recent=data.events.filter(event=>event.type==='complete'||event.type==='visit').slice(-10).reverse();$('recentList').innerHTML=recent.length?recent.map(event=>{const meta=api.GAMES[event.gameId]||{name:event.gameId};return`<div class="recent"><b>${event.type==='complete'?'完成':'打开'} · ${meta.name}</b><span>${new Date(event.at).toLocaleString('zh-CN')}</span></div>`}).join(''):'<div class="empty">还没有游戏记录，从游戏乐园选一个开始吧。</div>';const games=Object.values(data.games).filter(game=>game.visits>0).sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));$('games').innerHTML=games.length?games.map(game=>{const attempts=game.completed+game.mistakes,accuracy=attempts?Math.round(game.completed/attempts*100):0;return`<article class="game"><div class="game-head"><h3>${game.name}</h3><a href="${game.id}.html">继续练习 →</a></div><div class="metrics">打开 ${game.visits} 次 · 完成 ${game.completed} 次<br>误选 ${game.mistakes} 次 · 提示 ${game.hints} 次</div><div class="bar" title="正确率${accuracy}%"><i style="width:${accuracy}%"></i></div></article>`}).join(''):'<div class="empty">还没有记录。成长统计会从接入后的练习开始计算。</div>'}$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(api.load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='慧陪学-游戏成长记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('clearBtn').addEventListener('click',()=>{if(confirm('确定清空当前浏览器中的全部游戏成长记录吗？此操作无法撤销。')){api.clear();render()}});render()})();
</script><script src="feedback.js?v=20260906-2"></script><script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body></html>
