<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>路线复现｜慧陪学</title>
<meta name="description" content="短暂观察方格中的移动路线，隐藏后按顺序点击复现，练习空间记忆和方向感。">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#435047;--accent:#6d4c41}
body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}button{font:inherit}.container{max-width:900px;margin:auto}
.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}
.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}
.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background,.15s box-shadow}.chip:hover,.action:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}.chip:focus-visible,.action:focus-visible,.route-cell:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}
.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}
.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6;margin-bottom:5px}.sub{text-align:center;font-size:.78rem;color:#7c8a7b;margin-bottom:13px}
.board-wrap{display:flex;justify-content:center;padding:5px}.route-board{--n:4;--cell:min(13vw,68px);display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:5px;padding:10px;background:#91aa8b;border-radius:18px;box-shadow:0 5px 16px rgba(54,79,57,.2);touch-action:manipulation}.route-board.size-5{--cell:min(11vw,62px)}.route-board.size-6{--cell:min(9vw,56px)}
.route-cell{position:relative;border:0;border-radius:9px;background:#f3f7ef;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(58,83,58,.13);transition:.16s transform,.16s background,.16s box-shadow;color:#fff;font-weight:900;font-size:1.05rem}.route-cell:disabled{cursor:default}.route-cell.show{background:#d8a03b;box-shadow:inset 0 0 0 3px #f7d47b}.route-cell.current{background:#c77931;transform:scale(.88);box-shadow:0 0 0 5px rgba(199,121,49,.22)}.route-cell.start::after{content:"";position:absolute;inset:7px;border:3px solid #fff;border-radius:50%}.route-cell.entered{background:#568a5d;box-shadow:inset 0 0 0 3px #acd2ae}.route-cell.wrong{animation:shake .34s ease;box-shadow:inset 0 0 0 4px #d04e44}.route-cell.reveal{background:#507ba6;box-shadow:inset 0 0 0 3px #a8c8e4;animation:pulse .8s ease 2}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(.85)}}
.step-progress{max-width:460px;margin:14px auto 3px;height:12px;background:#d7e5d3;border-radius:8px;overflow:hidden}.step-fill{height:100%;width:0;background:linear-gradient(90deg,#7fa777,#4d7c52);border-radius:inherit;transition:width .2s}.progress-text{text-align:center;font-size:.78rem;color:#71806f}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.5;cursor:default;transform:none}.action[hidden]{display:none}
.message{min-height:52px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}
.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:520px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.route-board{gap:4px;padding:8px}.route-board.size-4{--cell:min(17vw,60px)}.route-board.size-5{--cell:min(14vw,52px)}.route-board.size-6{--cell:min(11.5vw,45px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header"><h1>🐾 路线复现</h1><p>看清方格中的移动路线，隐藏后按原来的顺序走一遍。</p></header>
  <section class="card" aria-label="游戏设置">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 4×4</button><button class="chip" data-level="medium">中年级 5×5</button><button class="chip" data-level="hard">高年级 6×6</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row" aria-live="polite"><div class="stat">当前进度<b id="roundText">自由练习</b></div><div class="stat">本题正确率<b id="accuracyText">--</b></div><div class="stat">连续完成<b id="streakText">0 题</b></div><div class="stat">最佳挑战<b id="bestText">--</b></div></div>
  </section>
  <section class="card">
    <p class="instruction" id="instruction">点击“播放路线”，记住亮起格子的先后顺序。</p><p class="sub" id="levelHint">低年级路线包含3～4个相邻格子。</p>
    <div class="board-wrap"><div class="route-board size-4" id="board" role="grid" aria-label="路线记忆方格"></div></div>
    <div class="step-progress" aria-hidden="true"><div class="step-fill" id="stepFill"></div></div><p class="progress-text" id="progressText">等待播放路线</p>
    <div class="actions"><button class="action primary" id="playBtn">▶ 播放路线</button><button class="action secondary" id="replayBtn" hidden>↺ 再看一次</button><button class="action muted" id="newBtn">换一条路线</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">路线中的每一步都只会走到相邻的上、下、左、右格子。</div>
  </section>
  <section class="card help"><h2>记忆小方法</h2><ol><li>先记起点在哪里，再观察每一步往哪个方向移动。</li><li>可以在心里说“右、下、下、左”，把画面变成方向口令。</li><li>点错不会换题，也不会清空已经走对的步骤。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-14：本站独立设计；路线由相邻方格随机游走算法生成，界面图形全部由 CSS 绘制。
(function(){
  'use strict';
  const LEVELS={easy:{size:4,min:3,max:4},medium:{size:5,min:5,max:7},hard:{size:6,min:8,max:10}};
  const COLORS=['#d8a03b','#4d7c52','#4f87c7','#8a68b5','#c56d42'];
  const STORE_KEY='hpxRouteMemoryStatsV1';
  const state={mode:'practice',level:'easy',route:[],phase:'ready',inputIndex:0,correctClicks:0,mistakes:0,replays:0,challengeStep:1,challengeMistakes:0,playToken:0,stats:loadStats()};
  const el=id=>document.getElementById(id),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;
  function say(text){if(speech)speech.speak(text)}el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
  function loadStats(){try{return Object.assign({completed:0,streak:0,bestMistakes:null},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{completed:0,streak:0,bestMistakes:null}}}
  function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
  function randomInt(min,max){return min+Math.floor(Math.random()*(max-min+1))}
  function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
  function neighbors(index,size){const row=Math.floor(index/size),col=index%size,out=[];if(row>0)out.push(index-size);if(row<size-1)out.push(index+size);if(col>0)out.push(index-1);if(col<size-1)out.push(index+1);return out}
  function generateRoute(size,length){
    for(let attempt=0;attempt<200;attempt++){
      const route=[randomInt(0,size*size-1)],used=new Set(route);
      while(route.length<length){const options=shuffled(neighbors(route[route.length-1],size).filter(i=>!used.has(i)));if(!options.length)break;route.push(options[0]);used.add(options[0])}
      if(route.length===length)return route;
    }
    throw new Error('无法生成指定长度的路线');
  }
  function createQuestion(level){const cfg=LEVELS[level],length=randomInt(cfg.min,cfg.max);return{size:cfg.size,route:generateRoute(cfg.size,length)}}

  function startQuestion(resetChallenge){
    state.playToken++;if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeMistakes=0}
    const q=createQuestion(state.level);state.route=q.route;state.phase='ready';state.inputIndex=0;state.correctClicks=0;state.mistakes=0;state.replays=0;render();setMessage('路线中的每一步都只会走到相邻的上、下、左、右格子。','');say('准备好后，点击播放路线。');
  }
  function render(){
    const n=LEVELS[state.level].size,board=el('board');board.className=`route-board size-${n}`;board.style.setProperty('--n',n);board.innerHTML='';
    for(let i=0;i<n*n;i++){const b=document.createElement('button');b.type='button';b.className='route-cell';b.dataset.index=i;b.setAttribute('role','gridcell');b.setAttribute('aria-label',`第${Math.floor(i/n)+1}行第${i%n+1}列`);b.addEventListener('click',()=>pick(i,b));board.appendChild(b)}
    el('levelHint').textContent=state.level==='easy'?'低年级路线包含3～4个相邻格子。':state.level==='medium'?'中年级路线包含5～7个相邻格子。':'高年级路线包含8～10个相邻格子。';
    el('playBtn').hidden=false;el('playBtn').disabled=false;el('replayBtn').hidden=true;el('newBtn').hidden=false;el('newBtn').disabled=false;el('nextBtn').hidden=true;updateStatus();
  }
  function cell(index){return el('board').querySelector(`[data-index="${index}"]`)}
  function clearBoard(){el('board').querySelectorAll('.route-cell').forEach(c=>{c.className='route-cell';c.textContent='';c.disabled=false})}
  async function playRoute(isReplay){
    if(state.phase==='showing')return;const token=++state.playToken;state.phase='showing';state.inputIndex=0;state.correctClicks=0;if(isReplay)state.replays++;
    clearBoard();el('board').querySelectorAll('.route-cell').forEach(c=>c.disabled=true);el('playBtn').disabled=true;el('replayBtn').hidden=true;el('newBtn').disabled=true;el('nextBtn').hidden=true;
    setMessage('仔细看：先记住起点，再记住移动方向。','');el('progressText').textContent='正在展示路线…';el('stepFill').style.width='0%';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,delay=reduced?300:620;
    for(let i=0;i<state.route.length;i++){
      if(token!==state.playToken)return;const c=cell(state.route[i]);c.classList.add('show','current');if(i===0)c.classList.add('start');el('stepFill').style.width=`${(i+1)/state.route.length*100}%`;await sleep(delay);c.classList.remove('current')
    }
    await sleep(reduced?300:750);if(token!==state.playToken)return;clearBoard();state.phase='input';el('playBtn').hidden=true;el('replayBtn').hidden=false;el('newBtn').disabled=false;el('stepFill').style.width='0%';el('progressText').textContent=`请从第 1 步开始，共 ${state.route.length} 步`;setMessage('路线藏起来了，请从起点开始，按原顺序点击。','');say('路线藏起来了，请从起点开始点击。');updateStatus();
  }
  function pick(index,button){
    if(state.phase!=='input')return;const expected=state.route[state.inputIndex];
    if(index===expected){state.correctClicks++;state.inputIndex++;button.classList.add('entered');button.textContent=state.inputIndex;el('stepFill').style.width=`${state.inputIndex/state.route.length*100}%`;if(state.inputIndex===state.route.length)finish();else{el('progressText').textContent=`已走 ${state.inputIndex} / ${state.route.length} 步`;setMessage(`第 ${state.inputIndex} 步正确，继续走下一步。`,'ok')}}
    else{state.mistakes++;if(state.mode==='challenge')state.challengeMistakes++;state.stats.streak=0;saveStats();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage(`这里不是第 ${state.inputIndex+1} 步，已经走对的部分会保留，请再试。`,'bad');say('这一步不对，再想想移动方向。')}
    updateStatus();
  }
  function finish(){
    state.phase='solved';state.stats.completed++;state.stats.streak++;saveStats();el('board').querySelectorAll('.route-cell').forEach(c=>c.disabled=true);el('replayBtn').hidden=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;
    if(state.mode==='challenge'&&state.challengeStep===5){if(state.stats.bestMistakes===null||state.challengeMistakes<state.stats.bestMistakes)state.stats.bestMistakes=state.challengeMistakes;saveStats();setMessage(`挑战完成！5条路线全部走对，共误点 ${state.challengeMistakes} 次。`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('太棒了，五关路线挑战全部完成！')}
    else{setMessage(state.mode==='challenge'?`第 ${state.challengeStep} 关完成，本题误点 ${state.mistakes} 次。`:`路线完全正确！本题误点 ${state.mistakes} 次。`,'ok');el('nextBtn').textContent='下一题 →';say('路线完全正确，记忆得真清楚！')}
    celebrate();updateStatus();
  }
  function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startQuestion(true);return}state.challengeStep++}startQuestion(false)}
  function accuracy(){const total=state.correctClicks+state.mistakes;return total?`${Math.round(state.correctClicks/total*100)}%`:'--'}
  function updateStatus(){el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('accuracyText').textContent=accuracy();el('streakText').textContent=`${state.stats.streak} 题`;el('bestText').textContent=state.stats.bestMistakes===null?'--':`${state.stats.bestMistakes}次误点`}
  function setMessage(text,type){const m=el('message');m.textContent=text;m.className='message'+(type?' '+type:'')}
  function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(b=>b.classList.toggle('on',b.dataset[key]===value))}
  el('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startQuestion(true)});el('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startQuestion(true)});el('playBtn').addEventListener('click',()=>playRoute(false));el('replayBtn').addEventListener('click',()=>playRoute(true));el('newBtn').addEventListener('click',()=>startQuestion(false));el('nextBtn').addEventListener('click',next);
  function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<30;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top='-15px';d.style.background=COLORS[randomInt(0,COLORS.length-1)];d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}}
  window.RouteMemory={LEVELS,neighbors,generateRoute,createQuestion};startQuestion(false);
})();
</script>
