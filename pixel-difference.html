<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>像素找不同｜慧陪学</title>
<meta name="description" content="观察两幅程序生成的像素图，找出颜色或位置不同的格子，练习专注力和细节观察。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#435047;--accent:#6d4c41;--paper:#e9f4e7;--line:#cbd9c7}
body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}
button{font:inherit}.container{max-width:980px;margin:auto}.hidden{display:none!important}
.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}
.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}
.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background,.15s box-shadow}.chip:hover,.action:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}
.chip:focus-visible,.action:focus-visible,.pixel:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}
.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}.stat.timer.warning b{color:#c75138}
.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6;margin-bottom:6px}.sub-instruction{text-align:center;font-size:.78rem;color:#7c8a7b;margin-bottom:13px}
.pictures{display:flex;align-items:center;justify-content:center;gap:14px;overflow:auto;padding:4px}.picture{text-align:center;flex:0 0 auto}.picture-label{font-size:.8rem;font-weight:700;color:#6d4c41;margin-bottom:7px}
.pixel-board{--n:4;--cell:min(9vw,48px);display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:2px;padding:8px;background:#91aa8b;border-radius:17px;box-shadow:0 5px 16px rgba(54,79,57,.2);user-select:none;touch-action:manipulation}.pixel-board.size-6{--cell:min(6.2vw,42px)}.pixel-board.size-8{--cell:min(4.6vw,36px)}
.pixel{position:relative;width:var(--cell);height:var(--cell);border:0;border-radius:6px;background:#f3f7ef;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(58,83,58,.13);transition:.12s transform,.15s box-shadow}.pixel:hover{transform:scale(.94)}.pixel.found{box-shadow:inset 0 0 0 4px #2e7d4a,0 0 0 2px #f3f7ef}.pixel.found::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(.75rem,2vw,1.25rem);text-shadow:0 1px 4px #164c28;background:rgba(46,125,74,.18);border-radius:inherit}.pixel.wrong{animation:shake .34s ease;box-shadow:inset 0 0 0 4px #d84b42}.pixel.reveal{box-shadow:inset 0 0 0 4px #1565c0,0 0 0 2px #fff;animation:pulse .8s ease 2}
.between{font-size:1.4rem;color:#71806f;font-weight:900}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes pulse{50%{transform:scale(.82)}}
.progress{height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden;margin:15px auto 4px;max-width:540px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7fa777,#4d7c52);border-radius:inherit;transition:width .25s}.progress-text{text-align:center;font-size:.78rem;color:#71806f}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action[hidden]{display:none}
.message{min-height:48px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}
.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}
.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:520px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.pictures{gap:7px}.between{font-size:1rem}.pixel-board{padding:5px;gap:2px}.pixel-board.size-4{--cell:min(9.3vw,44px)}.pixel-board.size-6{--cell:min(6vw,34px)}.pixel-board.size-8{--cell:min(4.25vw,26px)}.pixel{border-radius:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header">
    <h1>🔍 像素找不同</h1>
    <p>仔细观察两幅像素图，找出颜色或位置不同的格子。</p>
  </header>

  <section class="card" aria-label="游戏设置">
    <div class="toolbar">
      <div class="group" id="modeGroup">
        <span class="group-label">模式</span>
        <button class="chip on" data-mode="practice">自由练习</button>
        <button class="chip" data-mode="challenge">5关挑战</button>
      </div>
      <div class="group" id="levelGroup">
        <span class="group-label">难度</span>
        <button class="chip on" data-level="easy">低年级 4×4</button>
        <button class="chip" data-level="medium">中年级 6×6</button>
        <button class="chip" data-level="hard">高年级 8×8</button>
      </div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row" aria-live="polite">
      <div class="stat">当前进度<b id="roundText">自由练习</b></div>
      <div class="stat">误点次数<b id="mistakeText">0 次</b></div>
      <div class="stat">累计完成<b id="completeText">0 题</b></div>
      <div class="stat timer" id="timerBox">剩余时间<b id="timerText">不限时</b></div>
    </div>
  </section>

  <section class="card">
    <p class="instruction" id="instruction">本题有 2 处不同，点击任意一幅图中的不同格子。</p>
    <p class="sub-instruction">点对会同时圈出两边的位置；点错不会换题，可以继续寻找。</p>
    <div class="pictures" id="pictures">
      <div class="picture"><div class="picture-label">图一</div><div class="pixel-board size-4" id="leftBoard" role="grid" aria-label="左侧像素图"></div></div>
      <div class="between" aria-hidden="true">⇄</div>
      <div class="picture"><div class="picture-label">图二</div><div class="pixel-board size-4" id="rightBoard" role="grid" aria-label="右侧像素图"></div></div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-text" id="foundText">已找到 0 / 2 处</p>
    <div class="actions">
      <button class="action secondary" id="hintBtn">💡 提示一处</button>
      <button class="action muted" id="newBtn">↻ 换一题</button>
      <button class="action primary" id="nextBtn" hidden>下一题 →</button>
    </div>
    <div class="message" id="message" role="status" aria-live="polite">可以按行观察，也可以先找颜色最显眼的格子。</div>
  </section>

  <section class="card help">
    <h2>怎么玩？</h2>
    <ol>
      <li>从第一行开始，对照查看两幅图的同一个位置。</li>
      <li>发现颜色不同，或者一边有颜色、另一边空白，就点击那个格子。</li>
      <li>自由练习不限时；5关挑战会根据难度提供不同倒计时。</li>
    </ol>
  </section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>

<script src="hpx-core.js"></script>
<script>
// 2026-08-14：本站独立设计；两幅像素图和差异位置均由算法运行时生成，不使用外部图片或关卡数据。
(function(){
  'use strict';
  const LEVELS={
    easy:{size:4,differences:2,colors:3,density:.68,seconds:60},
    medium:{size:6,differences:4,colors:4,density:.62,seconds:75},
    hard:{size:8,differences:6,colors:5,density:.58,seconds:90}
  };
  const COLORS=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5','#e47c43'];
  const STORE_KEY='hpxPixelDifferenceStatsV1';
  const state={mode:'practice',level:'easy',left:[],right:[],differences:new Set(),found:new Set(),mistakes:0,challengeStep:1,secondsLeft:0,timer:null,solved:false,stats:loadStats()};
  const el=id=>document.getElementById(id);
  const speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;
  function say(text){if(speech)speech.speak(text)}
  el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());

  function loadStats(){try{return Object.assign({completed:0},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{completed:0}}}
  function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
  function randomItem(items){return items[Math.floor(Math.random()*items.length)]}
  function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}

  function generateBase(config){
    const n=config.size,grid=Array(n*n).fill(null);
    for(let row=0;row<n;row++)for(let col=0;col<n;col++){
      const neighbor=[row>0?grid[(row-1)*n+col]:null,col>0?grid[row*n+col-1]:null].filter(Boolean);
      if(Math.random()<config.density)grid[row*n+col]=neighbor.length&&Math.random()<.38?randomItem(neighbor):randomItem(COLORS.slice(0,config.colors));
    }
    if(grid.filter(Boolean).length<n)return generateBase(config);
    return grid;
  }

  function chooseDifferenceIndexes(size,count){
    const indexes=shuffled(Array.from({length:size*size},(_,i)=>i));
    const chosen=[];
    for(const idx of indexes){
      const row=Math.floor(idx/size),col=idx%size;
      if(chosen.every(other=>Math.abs(row-Math.floor(other/size))+Math.abs(col-other%size)>1))chosen.push(idx);
      if(chosen.length===count)break;
    }
    for(const idx of indexes)if(chosen.length<count&&!chosen.includes(idx))chosen.push(idx);
    return chosen;
  }

  function createPuzzle(config){
    const left=generateBase(config),right=left.slice();
    const indexes=chooseDifferenceIndexes(config.size,config.differences);
    indexes.forEach((idx,order)=>{
      const original=right[idx];
      if(original===null&&order%2===0)right[idx]=randomItem(COLORS.slice(0,config.colors));
      else if(original!==null&&order%3===0)right[idx]=null;
      else right[idx]=randomItem(COLORS.slice(0,config.colors).filter(c=>c!==original));
    });
    return{left,right,differences:indexes};
  }

  function startPuzzle(resetChallenge){
    stopTimer();
    if(resetChallenge&&state.mode==='challenge')state.challengeStep=1;
    const config=LEVELS[state.level],puzzle=createPuzzle(config);
    state.left=puzzle.left;state.right=puzzle.right;state.differences=new Set(puzzle.differences);state.found=new Set();state.mistakes=0;state.solved=false;
    state.secondsLeft=state.mode==='challenge'?config.seconds:0;
    render();
    setMessage('可以按行观察，也可以先找颜色最显眼的格子。','');
    if(state.mode==='challenge')startTimer();
    say(`请找出两幅图中${config.differences}处不同。`);
  }

  function render(){
    const config=LEVELS[state.level];
    renderBoard(el('leftBoard'),state.left,'图一');renderBoard(el('rightBoard'),state.right,'图二');
    el('instruction').textContent=`本题有 ${config.differences} 处不同，点击任意一幅图中的不同格子。`;
    el('nextBtn').hidden=true;el('newBtn').hidden=false;el('hintBtn').disabled=false;
    updateStatus();
  }
  function renderBoard(board,data,label){
    const n=LEVELS[state.level].size;
    board.className=`pixel-board size-${n}`;board.style.setProperty('--n',n);board.innerHTML='';
    data.forEach((color,idx)=>{
      const row=Math.floor(idx/n),col=idx%n,b=document.createElement('button');
      b.type='button';b.className='pixel';b.dataset.index=idx;
      if(color)b.style.backgroundColor=color;
      b.setAttribute('role','gridcell');b.setAttribute('aria-label',`${label}第${row+1}行第${col+1}列`);
      b.addEventListener('click',()=>pick(idx,b));board.appendChild(b);
    });
  }

  function pick(idx,cell){
    if(state.solved)return;
    if(state.differences.has(idx)){
      if(state.found.has(idx)){setMessage('这一处已经找到了，继续看看其他位置。','');return}
      state.found.add(idx);markBoth(idx,'found');
      const left=state.differences.size-state.found.size;
      if(left===0)finishPuzzle();
      else{setMessage(`找对了！还有 ${left} 处不同。`,'ok');say(`找对了，还有${left}处。`)}
    }else{
      state.mistakes++;cell.classList.remove('wrong');void cell.offsetWidth;cell.classList.add('wrong');
      setMessage('这个位置两边一样，再仔细看看；本题不会跳走。','bad');say('这里是一样的，再仔细看看。');
    }
    updateStatus();
  }
  function markBoth(idx,className){document.querySelectorAll(`.pixel[data-index="${idx}"]`).forEach(c=>c.classList.add(className))}

  function hint(){
    if(state.solved)return;
    const remaining=Array.from(state.differences).filter(i=>!state.found.has(i));
    if(!remaining.length)return;
    const idx=randomItem(remaining);markBoth(idx,'reveal');
    setMessage('蓝框提示了同一个位置，比较两边的颜色或空白。','');
    setTimeout(()=>document.querySelectorAll(`.pixel[data-index="${idx}"]`).forEach(c=>c.classList.remove('reveal')),1800);
  }

  function finishPuzzle(){
    state.solved=true;stopTimer();state.stats.completed++;saveStats();
    el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;
    if(state.mode==='challenge'&&state.challengeStep===5){
      setMessage(`挑战完成！5关全部找完，本题误点 ${state.mistakes} 次。`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('太棒了，五关挑战全部完成！');
    }else{
      setMessage(state.mode==='challenge'?`第 ${state.challengeStep} 关完成！本题误点 ${state.mistakes} 次。`:`全部找到！本题误点 ${state.mistakes} 次。`,'ok');el('nextBtn').textContent='下一题 →';say('全部找到了，真仔细！');
    }
    celebrate();updateStatus();
  }

  function nextPuzzle(){
    if(state.mode==='challenge'){
      if(state.challengeStep===5){startPuzzle(true);return}
      state.challengeStep++;
    }
    startPuzzle(false);
  }
  function startTimer(){
    updateTimer();state.timer=setInterval(()=>{
      state.secondsLeft--;updateTimer();
      if(state.secondsLeft<=0){
        stopTimer();state.solved=true;el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;el('nextBtn').textContent='重试本关 ↻';
        setMessage('时间到了，这一关没有自动跳走。观察完后点击“重试本关”。','bad');say('时间到了，观察一下，再重试本关。');
      }
    },1000);
  }
  function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
  function updateTimer(){
    el('timerText').textContent=state.mode==='challenge'?`${state.secondsLeft} 秒`:'不限时';
    el('timerBox').classList.toggle('warning',state.mode==='challenge'&&state.secondsLeft<=10);
  }
  function retryOrNew(){startPuzzle(false)}
  function updateStatus(){
    const config=LEVELS[state.level],found=state.found.size;
    el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('mistakeText').textContent=`${state.mistakes} 次`;el('completeText').textContent=`${state.stats.completed} 题`;
    el('foundText').textContent=`已找到 ${found} / ${config.differences} 处`;el('progressFill').style.width=`${found/config.differences*100}%`;updateTimer();
  }
  function setMessage(text,type){const m=el('message');m.textContent=text;m.className='message'+(type?' '+type:'')}
  function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(b=>b.classList.toggle('on',b.dataset[key]===value))}
  el('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startPuzzle(true)});
  el('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startPuzzle(true)});
  el('hintBtn').addEventListener('click',hint);el('newBtn').addEventListener('click',retryOrNew);el('nextBtn').addEventListener('click',()=>state.solved&&state.secondsLeft<=0&&state.mode==='challenge'&&state.found.size<state.differences.size?startPuzzle(false):nextPuzzle());

  function celebrate(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(let i=0;i<34;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=randomItem(COLORS);dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}
  }
  window.PixelDifference={LEVELS,generateBase,chooseDifferenceIndexes,createPuzzle};
  startPuzzle(false);
})();
</script>
