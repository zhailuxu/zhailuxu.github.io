<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#435047;--accent:#6d4c41}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}button{font:inherit}.container{max-width:940px;margin:auto}
.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background,.15s box-shadow}.chip:hover,.action:hover,.option:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}.chip:focus-visible,.action:focus-visible,.option:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}
.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6}.sub{text-align:center;font-size:.78rem;color:#7c8a7b;margin:5px 0 13px}
.source-row{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.source-box{text-align:center}.label{font-size:.8rem;font-weight:700;color:#6d4c41;margin-bottom:7px}.turn-guide{width:115px;text-align:center;color:#6d4c41}.turn-arrow{font-size:3.2rem;line-height:1;display:block}.turn-angle{font-weight:900;font-size:1.05rem;margin-top:4px}.pixel-grid{--n:4;--cell:42px;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:2px;padding:7px;background:#91aa8b;border-radius:16px;box-shadow:0 4px 13px rgba(54,79,57,.18)}.pixel-grid.size-5{--cell:36px}.pixel-grid.size-6{--cell:31px}.px{border-radius:5px;background:#f3f7ef;box-shadow:inset 0 0 0 1px rgba(58,83,58,.12)}
.answer-title{text-align:center;color:#647162;font-size:.86rem;font-weight:700;margin:18px 0 10px}.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.option{position:relative;border:3px solid #cad7c6;background:#f8fbf6;border-radius:18px;padding:9px;cursor:pointer;box-shadow:0 3px 10px rgba(54,79,57,.12);transition:.15s transform,.15s box-shadow}.option .pixel-grid{--cell:28px;padding:5px;gap:2px;border-radius:11px;box-shadow:none}.option .pixel-grid.size-5{--cell:24px}.option .pixel-grid.size-6{--cell:21px}.option::after{content:attr(data-letter);position:absolute;top:-9px;left:-7px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#6d4c41;color:#fff;font-weight:900;font-size:.76rem}.option.wrong{animation:shake .34s ease;border-color:#cf5349}.option.correct{border-color:#3d8750;box-shadow:0 0 0 4px rgba(61,135,80,.2);background:#e2f1e1}.option:disabled{cursor:default}.option.hint{box-shadow:0 0 0 4px #d6a13b}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.5}.action[hidden]{display:none}
.message{min-height:52px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:540px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.source-row{gap:10px}.turn-guide{width:72px}.turn-arrow{font-size:2.4rem}.pixel-grid{--cell:34px}.pixel-grid.size-5{--cell:29px}.pixel-grid.size-6{--cell:25px}.option{padding:6px}.option .pixel-grid{--cell:21px}.option .pixel-grid.size-5{--cell:18px}.option .pixel-grid.size-6{--cell:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<body><main class="container">
<header class="header"><h1>🔄 方块旋转</h1><p>在脑海里转动像素图，找出旋转后的正确样子。</p></header>
<section class="card" aria-label="游戏设置"><div class="toolbar"><div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div><div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 4×4</button><button class="chip" data-level="medium">中年级 5×5</button><button class="chip" data-level="hard">高年级 6×6</button></div><button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button></div><div class="status-row" aria-live="polite"><div class="stat">当前进度<b id="roundText">自由练习</b></div><div class="stat">本题误选<b id="mistakeText">0 次</b></div><div class="stat">连续答对<b id="streakText">0 题</b></div><div class="stat">最佳挑战<b id="bestText">--</b></div></div></section>
<section class="card"><p class="instruction" id="instruction">原图顺时针旋转90°后，会变成哪一个？</p><p class="sub" id="levelHint">低年级固定练习顺时针90°旋转。</p><div class="source-row"><div class="source-box"><div class="label">原图</div><div id="sourceGrid"></div></div><div class="turn-guide" aria-hidden="true"><span class="turn-arrow">↻</span><div class="turn-angle" id="turnAngle">90°</div></div><div class="source-box"><div class="label">旋转后</div><div class="pixel-grid" id="questionGrid" style="--n:2;--cell:48px"><div class="px" style="grid-area:1/1/3/3;display:grid;place-items:center;font-size:2.3rem;color:#6d4c41">?</div></div></div></div><p class="answer-title">选择正确图案</p><div class="options" id="options"></div><div class="actions"><button class="action secondary" id="hintBtn">💡 方向提示</button><button class="action muted" id="newBtn">↻ 换一题</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div><div class="message" id="message" role="status" aria-live="polite">先找一个靠近角落的彩色格子，想想旋转后它会去哪里。</div></section>
<section class="card help"><h2>旋转小方法</h2><ol><li>顺时针90°：上边转到右边，右边转到底边。</li><li>顺时针180°：图案上下、左右都换到相反方向。</li><li>顺时针270°等于逆时针90°：上边转到左边。</li></ol></section><a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main><script src="hpx-core.js"></script><script>
// 2026-08-14：本站独立设计；像素图、旋转题目及干扰项均由浏览器内算法生成。
(function(){
'use strict';
const COLORS=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];
const LEVELS={easy:{size:4,choices:3,turns:[1],colors:3,density:.45},medium:{size:5,choices:4,turns:[1,2],colors:4,density:.42},hard:{size:6,choices:5,turns:[1,2,3],colors:5,density:.38}};
const STORE_KEY='hpxBlockRotationStatsV1';
const state={mode:'practice',level:'easy',question:null,mistakes:0,challengeStep:1,challengeMistakes:0,solved:false,stats:loadStats()};
const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;
function say(text){if(speech)speech.speak(text)}el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
function loadStats(){try{return Object.assign({completed:0,streak:0,bestMistakes:null},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{completed:0,streak:0,bestMistakes:null}}}function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
function randomItem(items){return items[Math.floor(Math.random()*items.length)]}function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}function gridKey(grid){return grid.map(v=>v||'-').join(',')}
function rotateGrid(grid,n,turns=1){let out=grid.slice();for(let t=0;t<(turns%4+4)%4;t++){const next=Array(n*n);for(let r=0;r<n;r++)for(let c=0;c<n;c++)next[c*n+(n-1-r)]=out[r*n+c];out=next}return out}
function reflectGrid(grid,n){const out=Array(n*n);for(let r=0;r<n;r++)for(let c=0;c<n;c++)out[r*n+(n-1-c)]=grid[r*n+c];return out}
function generateBase(config){
  for(let attempt=0;attempt<500;attempt++){const grid=Array.from({length:config.size**2},()=>Math.random()<config.density?randomItem(COLORS.slice(0,config.colors)):null);if(grid.filter(Boolean).length<config.size+1)continue;const variants=[grid,rotateGrid(grid,config.size,1),rotateGrid(grid,config.size,2),rotateGrid(grid,config.size,3),reflectGrid(grid,config.size)];if(new Set(variants.map(gridKey)).size===variants.length)return grid}
  throw new Error('无法生成不对称图案');
}
function createQuestion(level){
  const cfg=LEVELS[level],base=generateBase(cfg),turns=randomItem(cfg.turns),correct=rotateGrid(base,cfg.size,turns),pool=[base,rotateGrid(base,cfg.size,1),rotateGrid(base,cfg.size,2),rotateGrid(base,cfg.size,3),reflectGrid(base,cfg.size),rotateGrid(reflectGrid(base,cfg.size),cfg.size,1),rotateGrid(reflectGrid(base,cfg.size),cfg.size,2),rotateGrid(reflectGrid(base,cfg.size),cfg.size,3)];
  const unique=new Map(pool.map(g=>[gridKey(g),g]));unique.delete(gridKey(correct));const choices=shuffled([correct,...shuffled([...unique.values()]).slice(0,cfg.choices-1)]);return{size:cfg.size,base,turns,correct,choices};
}
function gridHtml(grid,n){return`<div class="pixel-grid size-${n}" style="--n:${n}">${grid.map(color=>`<span class="px"${color?` style="background:${color}"`:''}></span>`).join('')}</div>`}
function startQuestion(resetChallenge){if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeMistakes=0}state.question=createQuestion(state.level);state.mistakes=0;state.solved=false;render();setMessage('先找一个靠近角落的彩色格子，想想旋转后它会去哪里。','');say(`请判断顺时针旋转${state.question.turns*90}度后的图案。`)}
function render(){const q=state.question;el('sourceGrid').innerHTML=gridHtml(q.base,q.size);el('turnAngle').textContent=`${q.turns*90}°`;el('instruction').textContent=`原图顺时针旋转 ${q.turns*90}° 后，会变成哪一个？`;el('levelHint').textContent=state.level==='easy'?'低年级固定练习顺时针90°旋转。':state.level==='medium'?'中年级随机练习顺时针90°或180°旋转。':'高年级随机练习顺时针90°、180°或270°旋转，并加入镜像干扰。';el('options').innerHTML='';q.choices.forEach((grid,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.dataset.key=gridKey(grid);b.dataset.letter=String.fromCharCode(65+i);b.setAttribute('aria-label',`选项${String.fromCharCode(65+i)}`);b.innerHTML=gridHtml(grid,q.size);b.addEventListener('click',()=>choose(grid,b));el('options').appendChild(b)});el('hintBtn').disabled=false;el('newBtn').hidden=false;el('nextBtn').hidden=true;updateStatus()}
function choose(grid,button){if(state.solved)return;if(gridKey(grid)===gridKey(state.question.correct)){state.solved=true;state.stats.completed++;state.stats.streak++;saveStats();button.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){if(state.stats.bestMistakes===null||state.challengeMistakes<state.stats.bestMistakes)state.stats.bestMistakes=state.challengeMistakes;saveStats();setMessage(`5关挑战完成，共误选 ${state.challengeMistakes} 次。`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('五关旋转挑战全部完成！')}else{setMessage(`答对了！原图顺时针旋转了 ${state.question.turns*90}°。`,'ok');el('nextBtn').textContent='下一题 →';say('答对了，空间想象很准确！')}celebrate()}else{state.mistakes++;if(state.mode==='challenge')state.challengeMistakes++;state.stats.streak=0;saveStats();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage('这个图案的方向不对，本题不会跳走。选一个角落格再转一次看看。','bad');say('方向不对，再转一次看看。')}updateStatus()}
function showHint(){if(state.solved)return;const text=state.question.turns===1?'顺时针90°时，上边会转到右边。':state.question.turns===2?'旋转180°时，左上角会去右下角。':'顺时针270°时，上边会转到左边。';setMessage(`提示：${text}`,'');say(text)}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startQuestion(true);return}state.challengeStep++}startQuestion(false)}function updateStatus(){el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('mistakeText').textContent=`${state.mistakes} 次`;el('streakText').textContent=`${state.stats.streak} 题`;el('bestText').textContent=state.stats.bestMistakes===null?'--':`${state.stats.bestMistakes}次误选`}function setMessage(text,type){const m=el('message');m.textContent=text;m.className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(b=>b.classList.toggle('on',b.dataset[key]===value))}
el('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startQuestion(true)});el('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startQuestion(true)});el('hintBtn').addEventListener('click',showHint);el('newBtn').addEventListener('click',()=>startQuestion(false));el('nextBtn').addEventListener('click',next);
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<30;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top='-15px';d.style.background=randomItem(COLORS);d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}}
window.BlockRotation={LEVELS,gridKey,rotateGrid,reflectGrid,generateBase,createQuestion};startQuestion(false);
})();
</script><script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
