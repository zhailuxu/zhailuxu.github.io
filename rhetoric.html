<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修辞手法练习</title>
<link rel="stylesheet" href="hpx-common.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Comic Sans MS","华文圆体","微软雅黑",sans-serif;background:linear-gradient(135deg,#f3e5f5 0%,#e0f2f1 50%,#fff3e0 100%);min-height:100vh;padding:16px 12px;}
.container{max-width:720px;margin:0 auto;}
.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:1.9rem;color:#4a148c;letter-spacing:2px;text-shadow:2px 3px 0 #ce93d8;}
.header p{font-size:.85rem;color:#999;margin-top:4px;}
.tab-btn{padding:8px 18px;font-size:.9rem;}
.card{background:rgba(255,255,255,.92);border-radius:20px;padding:20px 18px;box-shadow:0 4px 20px rgba(0,0,0,.1);margin-bottom:14px;}
.device-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.device-btn{padding:8px 16px;border:2px solid #ce93d8;border-radius:14px;background:#fff;color:#7b1fa2;font-size:.88rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .15s;}
.device-btn.on{background:#7b1fa2;color:#fff;border-color:#7b1fa2;}
.device-title{text-align:center;font-size:1.2rem;font-weight:bold;color:#4a148c;margin-bottom:8px;}
.device-desc{text-align:center;font-size:.92rem;color:#666;line-height:1.8;margin-bottom:14px;}
.example-box{background:#f3e5f5;border-radius:12px;padding:12px 16px;font-size:1rem;color:#4e342e;line-height:2;margin-bottom:8px;}
.ti{color:#1565c0;font-weight:bold;border-bottom:2px dashed #1565c0;}
.yu{color:#c62828;font-weight:bold;border-bottom:2px dashed #c62828;}
.legend{font-size:.8rem;color:#999;text-align:center;margin-top:6px;}
/* 连线配对 */
.match-wrap{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
.match-btn{padding:10px 8px;border:2px solid #b39ddb;border-radius:12px;background:#fff;color:#4a148c;font-size:.9rem;font-weight:bold;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s;}
.match-btn.selected{background:#7b1fa2;color:#fff;border-color:#7b1fa2;}
.match-btn.correct{background:#c8e6c9;border-color:#2e7d32;color:#2e7d32;cursor:default;}
.match-btn.wrong{background:#ffcdd2;border-color:#c62828;}
.match-progress{text-align:center;font-size:.95rem;color:#7b1fa2;font-weight:bold;margin-bottom:10px;}
.shuffle-btn{display:block;margin:0 auto;padding:8px 22px;border:none;border-radius:14px;background:#7b1fa2;color:#fff;font-size:.9rem;font-weight:bold;cursor:pointer;font-family:inherit;}
/* quiz */
.quiz-box{text-align:center;}
.score-row{display:flex;gap:16px;justify-content:center;margin-bottom:12px;}
.score-item{background:#f3e5f5;border-radius:10px;padding:6px 18px;font-size:.9rem;font-weight:bold;color:#7b1fa2;}
.quiz-q{font-size:1.1rem;color:#333;margin-bottom:14px;line-height:1.8;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto;}
.choice-btn{padding:12px 10px;border:2px solid #ce93d8;border-radius:12px;background:#fff;color:#4a148c;font-size:.98rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .15s;}
.choice-btn:hover{background:#f3e5f5;}
.choice-btn.correct{background:#c8e6c9;border-color:#2e7d32;}
.choice-btn.wrong{background:#ffcdd2;border-color:#c62828;}
.result-msg{font-size:1.05rem;font-weight:bold;min-height:26px;margin-top:12px;}
.result-msg.ok{color:#2e7d32;}
.result-msg.no{color:#c62828;}
.next-btn{margin-top:12px;padding:10px 32px;border:none;border-radius:20px;background:#7b1fa2;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;}
</style>
</head>
<body data-hpx-page style="--hpx-accent:#7b1fa2">
<div class="container">
  <div class="header">
    <div style="font-size:2.4rem;">🎭</div>
    <h1>修辞手法练习</h1>
    <p>比喻、拟人、排比、夸张、反问，让句子更精彩</p>
  </div>
  <div class="speak-bar"><button class="speak-toggle on" id="speakToggle" onclick="toggleSpeak()">🔊 声音解说 开</button></div>
  <div class="tabs">
    <button class="tab-btn on" onclick="switchTab('learn')">📖 认识修辞</button>
    <button class="tab-btn" onclick="switchTab('match')">🔗 本体喻体连线</button>
    <button class="tab-btn" onclick="switchTab('quiz')">✏️ 识别练习</button>
  </div>

  <!-- 认识修辞 -->
  <div id="tab-learn">
    <div class="card">
      <div class="device-row" id="deviceRow"></div>
      <div class="device-title" id="devTitle"></div>
      <div class="device-desc" id="devDesc"></div>
      <div id="devExamples"></div>
      <div class="legend" id="devLegend"></div>
    </div>
  </div>

  <!-- 本体喻体连线 -->
  <div id="tab-match" style="display:none;">
    <div class="card">
      <div style="text-align:center;font-size:.9rem;color:#777;margin-bottom:10px;">先点左边的"本体"，再点右边对应的"喻体"</div>
      <div class="match-progress" id="matchProgress"></div>
      <div class="match-wrap">
        <div class="match-col" id="matchLeft"></div>
        <div class="match-col" id="matchRight"></div>
      </div>
      <button class="shuffle-btn" onclick="newMatchRound()">🎲 换一组</button>
    </div>
  </div>

  <!-- 识别练习 -->
  <div id="tab-quiz" style="display:none;">
    <div class="card quiz-box">
      <div class="score-row">
        <div class="score-item">✅ <span id="qC">0</span></div>
        <div class="score-item">❌ <span id="qW">0</span></div>
      </div>
      <div class="quiz-q" id="quizQ"></div>
      <div class="choice-grid" id="quizArea"></div>
      <div class="result-msg" id="quizMsg"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()" style="display:none;">下一题 →</button>
    </div>
  </div>

  <a href="index.html" class="back-link">← 返回慧陪学</a>
</div>
<script src="hpx-core.js"></script>
<script>
Hpx.speech.install({rate:0.88});
const randInt=Hpx.random.int;

// ── 认识修辞 ──
const DEVICES=[
  {key:'simile', name:'比喻', desc:'把一种事物比作另一种事物，使描写更生动形象。常用"像、如、好像、仿佛"等词。',
   examples:['月亮<b class="ti">像</b>一个金黄的<b class="yu">圆盘</b>挂在天上。','<b class="ti">瀑布</b>好像一条白色的<b class="yu">丝带</b>垂挂下来。','她的<b class="ti">笑容</b>如<b class="yu">春天</b>般温暖。'],
   legend:'蓝色=本体，红色=喻体'},
  {key:'personify', name:'拟人', desc:'把物当作人来写，赋予它人的动作、语言或感情，使描写更有趣、更亲切。',
   examples:['清晨，露珠趴在草尖上，眨着亮晶晶的眼睛。','风儿唱着歌，轻轻地走过田野。','柳树姑娘对着河水梳理着自己的长发。'], legend:''},
  {key:'parallel', name:'排比', desc:'用三个或以上结构相似、语气一致的句子排列在一起，读起来更有气势，感情更强烈。',
   examples:['他好学，他勤奋，他坚持不懈。','春天来了，花儿开了，草儿绿了，鸟儿叫了。','我们爱学习，我们爱劳动，我们爱祖国。'], legend:''},
  {key:'hyperbole', name:'夸张', desc:'故意把事物往大或小、多或少的方向说，突出特点，增强表达效果（不是说假话哦）。',
   examples:['他饿得能吃下一头牛。','教室里安静得连一根针掉在地上都能听见。','这座山高得好像能碰到云彩。'], legend:''},
  {key:'rhetq', name:'反问', desc:'用疑问的形式表达确定的意思，不需要回答，能加强语气、引发思考。',
   examples:['这么简单的题，难道你还不会吗？（意思是：应该会）','难道我们能眼看着垃圾越堆越多而不管吗？（意思是：不能不管）'], legend:''}
];
let curDevice=0;
function buildDeviceRow(){
  const row=document.getElementById('deviceRow');
  row.innerHTML='';
  DEVICES.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='device-btn'+(i===curDevice?' on':'');
    b.textContent=d.name;
    b.onclick=()=>{curDevice=i;buildDeviceRow();renderDevice();};
    row.appendChild(b);
  });
}
function renderDevice(){
  const d=DEVICES[curDevice];
  document.getElementById('devTitle').textContent=d.name;
  document.getElementById('devDesc').textContent=d.desc;
  document.getElementById('devExamples').innerHTML=d.examples.map(e=>`<div class="example-box">${e}</div>`).join('');
  document.getElementById('devLegend').textContent=d.legend;
  speak(d.name+'：'+d.desc.replace(/（.*?）/g,''));
}

// ── 本体喻体连线 ──
const PAIRS=[
  ['月亮','金黄的圆盘'],['瀑布','白色的丝带'],['她的笑容','温暖的春天'],
  ['星星','夜空中的眼睛'],['枫叶','燃烧的火焰'],['雪花','空中飞舞的白蝴蝶']
];
let matchPairs=[], matchedCount=0, selectedLeftIdx=-1;
function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function newMatchRound(){
  matchPairs=shuffleArr(PAIRS).slice(0,4);
  matchedCount=0; selectedLeftIdx=-1;
  const leftOrder=shuffleArr(matchPairs.map((p,i)=>i));
  const rightOrder=shuffleArr(matchPairs.map((p,i)=>i));
  const leftCol=document.getElementById('matchLeft'); leftCol.innerHTML='';
  const rightCol=document.getElementById('matchRight'); rightCol.innerHTML='';
  leftOrder.forEach(idx=>{
    const b=document.createElement('button');
    b.className='match-btn'; b.textContent=matchPairs[idx][0]; b.dataset.idx=idx;
    b.onclick=()=>selectLeft(b,idx);
    leftCol.appendChild(b);
  });
  rightOrder.forEach(idx=>{
    const b=document.createElement('button');
    b.className='match-btn'; b.textContent=matchPairs[idx][1]; b.dataset.idx=idx;
    b.onclick=()=>selectRight(b,idx);
    rightCol.appendChild(b);
  });
  updateMatchProgress();
  speak('先点左边的本体，再点右边对应的喻体，把它们连起来。');
}
function updateMatchProgress(){document.getElementById('matchProgress').textContent=`已配对 ${matchedCount} / ${matchPairs.length}`;}
function selectLeft(btn,idx){
  if(btn.classList.contains('correct')) return;
  document.querySelectorAll('#matchLeft .match-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedLeftIdx=idx;
}
function selectRight(btn,idx){
  if(btn.classList.contains('correct')||selectedLeftIdx<0) return;
  const leftBtn=document.querySelector(`#matchLeft .match-btn[data-idx="${selectedLeftIdx}"]`);
  if(idx===selectedLeftIdx){
    leftBtn.classList.remove('selected'); leftBtn.classList.add('correct');
    btn.classList.add('correct');
    matchedCount++;
    speak(matchPairs[idx][0]+'和'+matchPairs[idx][1]+'，配对正确！');
    updateMatchProgress();
    if(matchedCount>=matchPairs.length){
      setTimeout(()=>speak('太棒了，全部配对成功！'),300);
    }
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>{btn.classList.remove('wrong'); leftBtn.classList.remove('selected');},500);
  }
  selectedLeftIdx=-1;
}

// ── 识别练习 ──
const SENTENCE_BANK=[
  {text:'月亮像一个金黄的圆盘挂在天上。', ans:'比喻'},
  {text:'清晨，露珠趴在草尖上，眨着亮晶晶的眼睛。', ans:'拟人'},
  {text:'他好学，他勤奋，他坚持不懈。', ans:'排比'},
  {text:'他饿得能吃下一头牛。', ans:'夸张'},
  {text:'这么简单的题，难道你还不会吗？', ans:'反问'},
  {text:'风儿唱着歌，轻轻地走过田野。', ans:'拟人'},
  {text:'瀑布好像一条白色的丝带垂挂下来。', ans:'比喻'},
  {text:'教室里安静得连一根针掉在地上都能听见。', ans:'夸张'},
  {text:'我们爱学习，我们爱劳动，我们爱祖国。', ans:'排比'},
  {text:'难道我们能眼看着垃圾越堆越多而不管吗？', ans:'反问'},
  {text:'她的眼睛像天上的星星一样闪亮。', ans:'比喻'},
  {text:'柳树姑娘对着河水梳理着自己的长发。', ans:'拟人'}
];
let qScore={c:0,w:0}, qAns='';
function nextQ(){
  document.getElementById('quizMsg').textContent='';
  document.getElementById('nextBtn').style.display='none';
  const item=SENTENCE_BANK[randInt(0,SENTENCE_BANK.length-1)];
  qAns=item.ans;
  document.getElementById('quizQ').textContent=item.text;
  const area=document.getElementById('quizArea'); area.innerHTML='';
  ['比喻','拟人','排比','夸张','反问'].forEach(name=>{
    const b=document.createElement('button');
    b.className='choice-btn'; b.textContent=name;
    b.onclick=()=>checkQ(b,name);
    area.appendChild(b);
  });
  speak('这句话用了什么修辞手法？');
}
function checkQ(btn,name){
  document.querySelectorAll('#quizArea .choice-btn').forEach(b=>{b.disabled=true; if(b.textContent===qAns) b.classList.add('correct');});
  if(name===qAns){
    qScore.c++;
    document.getElementById('quizMsg').className='result-msg ok';
    document.getElementById('quizMsg').textContent='✅ 正确！';
    speak('正确！真棒！');
  } else {
    btn.classList.add('wrong');
    qScore.w++;
    document.getElementById('quizMsg').className='result-msg no';
    document.getElementById('quizMsg').textContent='❌ 正确答案是：'+qAns;
    speak('答案是'+qAns+'，再想想！');
  }
  document.getElementById('qC').textContent=qScore.c;
  document.getElementById('qW').textContent=qScore.w;
  document.getElementById('nextBtn').style.display='inline-block';
}

function switchTab(t){
  Hpx.tabs.activate(t, ['learn','match','quiz']);
  if(t==='learn') speak('认识修辞：点击上面的按钮，看看不同修辞手法的例子。');
  if(t==='match') newMatchRound();
  if(t==='quiz') nextQ();
}
buildDeviceRow();
renderDevice();
speak('欢迎来到修辞手法练习！认识比喻、拟人、排比、夸张和反问，让你的句子更精彩。');
</script>

<script src="feedback.js?v=20260906-2"></script>
<script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
