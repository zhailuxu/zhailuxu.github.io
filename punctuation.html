<html lang="zh-CN">

<meta name="description" content="小学一至六年级常用中文标点符号学习：认识名称、理解用法、朗读例句并完成选择和填空闯关。">

<link rel="stylesheet" href="hpx-common.css">
<style>
:root{--ink:#40302c;--muted:#806d66;--red:#b63c32;--red-soft:#fff0eb;--gold:#dc8b25;--green:#28775a;--green-soft:#e6f6ef;--line:#ead9cf;--paper:#fffdf9;--shadow:0 8px 28px rgba(91,52,36,.11)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px 14px 54px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#fff8ee,#f8ece7 55%,#edf7f1)}
.wrap{max-width:900px;margin:auto}.hero{text-align:center;margin:5px 0 18px}.hero-icon{font-size:2.7rem}.hero h1{margin:2px 0;color:#8f2e27;font-size:2rem;letter-spacing:2px}.hero p{margin:5px auto 0;color:var(--muted);font-size:.88rem}.toolbar,.tabs,.filters,.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.tabs{margin-bottom:16px}.tab,.filter,.btn,.mark-choice{font:inherit;cursor:pointer}.tab,.filter{border:2px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 15px;font-size:.84rem;font-weight:800}.tab:hover,.filter:hover{border-color:#d59a7f;color:var(--red)}.tab.on,.filter.on{border-color:var(--red);background:var(--red);color:#fff}.tab:focus-visible,.filter:focus-visible,.btn:focus-visible,.punct-card:focus-visible,.mark-choice:focus-visible{outline:3px solid rgba(220,139,37,.4);outline-offset:2px}.panel{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:22px;padding:21px 18px;box-shadow:var(--shadow)}.intro{text-align:center;margin:0 0 15px;color:var(--muted);font-size:.84rem}.filters{margin-bottom:17px}.filter{padding:6px 12px;font-size:.78rem}.punct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}.punct-card{position:relative;min-height:154px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px 11px;text-align:center;cursor:pointer;transition:.15s transform,.15s border-color,.15s box-shadow}.punct-card:hover,.punct-card.active{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 18px rgba(150,89,46,.13)}.punct-symbol{display:block;color:var(--red);font-family:"Songti SC","STSong",serif;font-size:2.45rem;font-weight:800;line-height:1.1}.punct-name{display:block;margin-top:5px;font-size:1rem;font-weight:900}.punct-use{display:block;margin-top:5px;color:var(--muted);font-size:.73rem;line-height:1.45}.level-chip{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:99px;background:var(--red-soft);color:var(--red);font-size:.67rem;font-weight:800}.detail{display:none;margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#fff3ed,#fffaf5);border:1px solid #efd0c1}.detail.show{display:grid;grid-template-columns:auto 1fr;gap:15px;align-items:center}.detail-symbol{min-width:86px;text-align:center;color:var(--red);font:800 4rem/1 "Songti SC","STSong",serif}.detail h2{margin:0 0 4px;color:#8f2e27;font-size:1.13rem}.detail p{margin:4px 0;font-size:.87rem;line-height:1.65}.example{color:var(--green);font-weight:800}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.score{font-weight:900;color:var(--red)}.progress{height:8px;flex:1;min-width:120px;background:#f1e4dc;border-radius:99px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .2s}.question-card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 12px;margin-bottom:16px;border:2px dashed #e5bda8;border-radius:18px;background:#fffaf6}.question-label{font-size:.76rem;color:var(--muted);font-weight:800}.question{margin-top:10px;font-size:1.28rem;font-weight:900;line-height:1.8}.question .blank{display:inline-flex;min-width:42px;min-height:40px;align-items:center;justify-content:center;margin:0 3px;border-bottom:3px solid var(--red);color:var(--red);vertical-align:middle}.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:600px;margin:auto}.mark-choice{min-height:58px;border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--red);font:800 1.65rem/1 "Songti SC","STSong",serif}.mark-choice:hover{border-color:var(--gold);background:#fff9ed}.mark-choice.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}.mark-choice.wrong{border-color:var(--red);background:var(--red-soft)}.feedback{min-height:34px;margin:13px 0 0;text-align:center;font-weight:800}.feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}.btn{border:0;border-radius:12px;padding:10px 20px;background:var(--red);color:#fff;font-weight:800}.btn.secondary{background:#fff;color:var(--muted);border:2px solid var(--line)}.challenge-sentence{font-size:1.3rem;line-height:2.15;font-weight:800;text-align:center;margin:8px 0 18px}.slot{display:inline-flex;min-width:38px;height:38px;align-items:center;justify-content:center;margin:0 2px;border-radius:8px;background:#fff0eb;border:2px dashed #d58d70;color:var(--red);font:800 1.4rem/1 "Songti SC","STSong",serif;vertical-align:middle}.slot.current{border-style:solid;box-shadow:0 0 0 3px rgba(220,139,37,.2)}.slot.good{border-color:var(--green);background:var(--green-soft);color:var(--green)}.slot.bad{border-color:var(--red);background:#ffdcd3}.challenge-palette{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.challenge-palette .mark-choice{width:58px}.tip{margin-top:17px;padding:11px 14px;border-radius:11px;background:#fff7df;color:#765a2e;font-size:.8rem}.back{display:block;margin:20px auto 0;text-align:center;color:#8f2e27;text-decoration:none;font-weight:800}@media(max-width:560px){.hero h1{font-size:1.65rem}.panel{padding:17px 13px}.punct-grid{grid-template-columns:repeat(2,1fr)}.detail.show{grid-template-columns:1fr;text-align:center}.detail-symbol{font-size:3.2rem}.choice-grid{grid-template-columns:repeat(2,1fr)}.question{font-size:1.08rem}.challenge-sentence{font-size:1.08rem}}
.punct-card{min-height:178px;display:flex;flex-direction:column;padding:0;overflow:hidden;cursor:default}.punct-main{flex:1;width:100%;border:0;background:transparent;padding:14px 11px 8px;color:inherit;font:inherit;text-align:center;cursor:pointer}.example-chip{align-self:center;margin:0 0 10px;border:1px solid #afd9c8;border-radius:99px;background:var(--green-soft);padding:4px 11px;color:var(--green);font:inherit;font-size:.7rem;font-weight:800;line-height:1.2;cursor:pointer}.example-chip:hover{border-color:var(--green);background:#d8f1e6}.punct-main:focus-visible,.example-chip:focus-visible{outline:3px solid rgba(220,139,37,.4);outline-offset:2px}.example-toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:9999;width:max-content;max-width:min(520px,calc(100vw - 28px));padding:12px 17px;border:1px solid #b9ddce;border-radius:15px;background:#174f3d;color:#fff;box-shadow:0 10px 30px rgba(31,76,60,.28);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s,visibility .2s}.example-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.example-toast-label{display:block;margin-bottom:3px;color:#bfead9;font-size:.7rem;font-weight:900;letter-spacing:.08em}.example-toast-text{display:block;font-size:.92rem;font-weight:800;line-height:1.55}@media(max-width:560px){.example-toast{bottom:max(14px,env(safe-area-inset-bottom));text-align:left}}
.example-toast{top:0;bottom:auto;transform:translate(-50%,calc(-100% + 12px))}.example-toast.show{transform:translate(-50%,-100%)}.example-toast::after{content:"";position:absolute;top:100%;left:50%;border:7px solid transparent;border-top-color:#174f3d;transform:translateX(-50%)}
@keyframes example-blink{0%,100%{opacity:1}20%,60%{opacity:.45}40%,80%{opacity:1}}.example-toast-label{font-size:.76rem;letter-spacing:.03em}.example-focus{display:inline-block;min-width:0;margin:0 .04em;padding:0;border:0;background:transparent;color:inherit;font:900 1.28em/1.2 "Songti SC","STSong",serif;text-align:center;box-shadow:none;animation:example-blink 1.4s ease-out both}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.example-focus{animation:none!important}}
</style>

<body data-hpx-page style="--hpx-accent:#b63c32">
<main class="wrap">
  <header class="hero">
    <div class="hero-icon" aria-hidden="true">，。？！</div>
    <h1>标点符号小课堂</h1>
    <p>认识 12 种常用标点 · 看懂停顿和语气 · 学会放在正确位置</p>
  </header>
  <div class="toolbar"><button type="button" class="btn secondary" id="speakToggle" aria-pressed="true">🔊 声音解说 开</button></div>
  <nav class="tabs" aria-label="学习模式">
    <button type="button" class="tab on" data-tab="learn">📚 认识标点</button>
    <button type="button" class="tab" data-tab="quiz">🎯 选择练习</button>
    <button type="button" class="tab" data-tab="challenge">🏆 综合闯关</button>
  </nav>

  <section class="panel" id="panel-learn">
    <p class="intro">点击卡片听用法，语音提示“例句”后会自动展示并朗读句子；也可以随时手动点击“例句”标签。</p>
    <div class="filters" id="levelFilters" aria-label="年级范围">
      <button type="button" class="filter on" data-level="all">全部 12 种</button>
      <button type="button" class="filter" data-level="low">一～二年级</button>
      <button type="button" class="filter" data-level="mid">三～四年级</button>
      <button type="button" class="filter" data-level="high">五～六年级</button>
    </div>
    <div class="punct-grid" id="punctGrid"></div>
    <article class="detail" id="punctDetail" aria-live="polite"></article>
  </section>

  <section class="panel" id="panel-quiz" hidden>
    <div class="quiz-head"><span class="score" id="quizScore">答对 0 · 答错 0</span><div class="progress" role="progressbar" aria-label="选择练习进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="quizProgress"></span></div><span id="quizCount">第 1 / 10 题</span></div>
    <div class="question-card"><span class="question-label" id="quizLabel">选择最合适的标点</span><div class="question" id="quizQuestion"></div></div>
    <div class="choice-grid" id="quizChoices"></div>
    <div class="feedback" id="quizFeedback" role="status" aria-live="polite"></div>
    <div class="actions"><button type="button" class="btn secondary" id="quizRead">🔊 读题</button><button type="button" class="btn" id="quizNext" hidden>下一题 →</button></div>
  </section>

  <section class="panel" id="panel-challenge" hidden>
    <p class="intro">按句子从左到右依次填入标点。填错可以继续修改，全部填好后再检查。</p>
    <div class="quiz-head"><span class="score" id="challengeScore">完成 0 关</span><span id="challengeCount">第 1 / 7 关</span></div>
    <div class="challenge-sentence" id="challengeSentence"></div>
    <div class="challenge-palette" id="challengePalette"></div>
    <div class="actions"><button type="button" class="btn secondary" id="challengeUndo">↩ 撤回</button><button type="button" class="btn" id="challengeCheck">检查答案</button><button type="button" class="btn" id="challengeNext" hidden>下一关 →</button></div>
    <div class="feedback" id="challengeFeedback" role="status" aria-live="polite"></div>
    <p class="tip">小提醒：先把句子读一遍。语气结束时看句末，句子中间再判断是普通停顿、并列词语还是提示下文。</p>
  </section>

  <a class="back" href="index.html">← 返回慧陪学</a>
</main>
<div class="example-toast" id="exampleToast" role="status" aria-live="polite" aria-atomic="true">
  <span class="example-toast-label" id="exampleToastLabel">例句</span>
  <span class="example-toast-text" id="exampleToastText"></span>
</div>
<script src="hpx-core.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.86,pitch:1.04}):null;
const say=text=>speech&&speech.speak(text);
const shuffle=items=>Hpx.random.shuffled(items);
const PUNCT=[
 {id:'comma',symbol:'，',name:'逗号',level:'low',grade:'一～二年级',use:'一句话中间的一般停顿。',example:'清风吹过，树叶轻轻摇摆。'},
 {id:'period',symbol:'。',name:'句号',level:'low',grade:'一～二年级',use:'陈述句说完时使用。',example:'小雨把种子唤醒了。'},
 {id:'question',symbol:'？',name:'问号',level:'low',grade:'一～二年级',use:'有疑问、需要回答时使用。',example:'你找到那片红叶了吗？'},
 {id:'exclamation',symbol:'！',name:'感叹号',level:'low',grade:'一～二年级',use:'表示惊喜、赞叹、命令等强烈语气。',example:'这场比赛真精彩！'},
 {id:'pause',symbol:'、',name:'顿号',level:'low',grade:'一～二年级',use:'并列的词语之间较短的停顿。',example:'篮子里有苹果、梨和橘子。'},
 {id:'colon',symbol:'：',name:'冒号',level:'low',grade:'二年级',use:'提示下文，或放在说话人后面。',example:'老师提醒大家：明天记得带水彩笔。'},
 {id:'quotes',symbol:'“ ”',name:'引号',level:'low',grade:'二年级',use:'标出人物说的话或需要特别指出的词语。',example:'妈妈说：“出门前检查一下书包。”'},
 {id:'semicolon',symbol:'；',name:'分号',level:'mid',grade:'三～四年级',use:'分开并列而且内部已有停顿的分句。',example:'白天，蜜蜂在花间忙碌；夜晚，萤火虫提着灯飞行。'},
 {id:'title',symbol:'《 》',name:'书名号',level:'mid',grade:'三～四年级',use:'标出书籍、文章、报刊等作品的名称。',example:'我读完了《会唱歌的小河》这篇故事。'},
 {id:'parentheses',symbol:'（ ）',name:'括号',level:'high',grade:'五～六年级',use:'补充说明前面的内容。',example:'银杏（又叫白果树）秋天会换上金色外衣。'},
 {id:'dash',symbol:'——',name:'破折号',level:'high',grade:'五～六年级',use:'表示解释说明、话题转折或声音延长。',example:'我们终于见到了山顶的礼物——一片壮丽的云海。'},
 {id:'ellipsis',symbol:'……',name:'省略号',level:'high',grade:'五～六年级',use:'表示内容省略、说话断续或语意未尽。',example:'远处传来一阵歌声，越来越近，越来越清楚……'}
];
const QUIZ=[
 {text:'今天的风真凉快___',answer:'！',why:'这是带有赞叹语气的句子，句末用感叹号。'},
 {text:'你愿意和我一起种花吗___',answer:'？',why:'这句话提出问题，句末用问号。'},
 {text:'小船慢慢驶过石桥___',answer:'。',why:'这句话完整陈述一件事，句末用句号。'},
 {text:'清晨___露珠在叶尖闪闪发亮。',answer:'，',why:'“清晨”后是句中的一般停顿，用逗号。'},
 {text:'文具盒里有铅笔___尺子和橡皮。',answer:'、',why:'铅笔、尺子和橡皮是并列词语，用顿号。'},
 {text:'爸爸指着天空说___“快看那颗星星！”',answer:'：',why:'“说”后面提示具体话语，用冒号。'},
 {text:'白天，太阳照亮大地___夜晚，月光洒满小路。',answer:'；',why:'前后是结构并列的两个分句，用分号。'},
 {text:'我最喜欢读___小种子的旅行___。',answer:'《 》',why:'故事名称要用书名号标出。'},
 {text:'这就是我们寻找的方向___向着太阳升起的地方。',answer:'——',why:'后半句解释“方向”，用破折号。'},
 {text:'花园里有月季、桂花、海棠___',answer:'……',why:'列举还没有结束，用省略号。'},
 {text:'“请把窗户关好___”老师轻声提醒。',answer:'。',why:'引号内的话完整陈述一件事，用句号。'},
 {text:'多么勇敢的小队员啊___',answer:'！',why:'“多么……啊”表达强烈赞叹，用感叹号。'},
 {text:'这本书是谁送给你的___',answer:'？',why:'句子询问送书的人，用问号。'},
 {text:'雨停了___我们继续向山顶出发。',answer:'，',why:'前后联系紧密，句中一般停顿用逗号。'},
 {text:'植物生长需要三样东西___阳光、水和空气。',answer:'：',why:'后面列出“三样东西”的具体内容，用冒号。'},
 {text:'春天，燕子从南方飞回来___秋天，它们又结伴南飞。',answer:'；',why:'两个分句结构并列且内部已有逗号，用分号。'}
];
const CHALLENGES=[
 {parts:['放学了','我们排好队走出校门',''],answers:['，','。'],choices:['，','。','？','！']},
 {parts:['你看见我的蓝色雨伞了吗',''],answers:['？'],choices:['。','？','！','……']},
 {parts:['书包里有课本','练习本','铅笔盒和水杯',''],answers:['、','、','。'],choices:['，','、','：','。']},
 {parts:['小航问','“明天几点集合','”'],answers:['：','？'],choices:['，','：','。','？']},
 {parts:['我正在读','会飞的邮筒','这本书',''],answers:['《','》','。'],choices:['“','”','《','》','。']},
 {parts:['清晨','鸟儿在林间唱歌','傍晚','萤火虫在草丛闪光',''],answers:['，','；','，','。'],choices:['，','、','；','。']},
 {parts:['大家终于找到了宝藏','一盒写满祝福的明信片',''],answers:['——','。'],choices:['：','——','……','。']}
];
let activeLevel='all',quizOrder=[],quizIndex=0,quizCorrect=0,quizWrong=0,quizAnswered=false,exampleToastTimer=null;
let challengeIndex=0,challengeDone=0,challengeEntries=[];

function renderCards(){
 const items=activeLevel==='all'?PUNCT:PUNCT.filter(item=>item.level===activeLevel);
 $('punctGrid').innerHTML=items.map(item=>`<div class="punct-card" data-id="${item.id}"><button type="button" class="punct-main" data-card-id="${item.id}" aria-label="查看${item.name}的用法"><span class="punct-symbol">${item.symbol}</span><span class="punct-name">${item.name}</span><span class="punct-use">${item.use}</span><span class="level-chip">${item.grade}</span></button><button type="button" class="example-chip" data-example-id="${item.id}" aria-label="查看${item.name}例句">例句</button></div>`).join('');
}
function renderFocusedExample(item){
 const container=$('exampleToastText'),marks=item.symbol.trim().split(/\s+/).sort((a,b)=>b.length-a.length);
 container.textContent='';let index=0,plain='';
 const flushPlain=()=>{if(!plain)return;container.appendChild(document.createTextNode(plain));plain='';};
 while(index<item.example.length){
  const mark=marks.find(value=>item.example.startsWith(value,index));
  if(!mark){plain+=item.example[index++];continue;}
  flushPlain();const focus=document.createElement('mark');focus.className='example-focus';focus.textContent=mark;container.appendChild(focus);index+=mark.length;
 }
 flushPlain();
}
function showExample(id,anchor,options){
 const item=PUNCT.find(row=>row.id===id);if(!item)return;
 options=options||{};
 $('exampleToastLabel').textContent=`请注意：${item.name} ${item.symbol}`;
 renderFocusedExample(item);
 const card=anchor.closest('.punct-card'),rect=card.getBoundingClientRect(),toast=$('exampleToast');
 toast.style.top=`${rect.top-10}px`;
 toast.style.left=`${rect.left+rect.width/2}px`;
 const halfWidth=toast.offsetWidth/2,pageGap=14;
 toast.style.left=`${Math.max(pageGap+halfWidth,Math.min(window.innerWidth-pageGap-halfWidth,rect.left+rect.width/2))}px`;
 $('exampleToast').classList.add('show');
 const displayMs=Math.max(3200,Math.min(7200,item.example.length*260));
 clearTimeout(exampleToastTimer);exampleToastTimer=setTimeout(()=>$('exampleToast').classList.remove('show'),displayMs);
 if(options.read!==false)say(`例句。${item.example}`);
}
function showDetail(id){
 const item=PUNCT.find(row=>row.id===id);if(!item)return;
 document.querySelectorAll('.punct-card').forEach(card=>card.classList.toggle('active',card.dataset.id===id));
 $('punctDetail').innerHTML=`<div class="detail-symbol">${item.symbol}</div><div><h2>${item.name} · ${item.grade}</h2><p>${item.use}</p><p class="example">例句：${item.example}</p><button type="button" class="btn secondary" id="detailRead">🔊 听用法和例句</button></div>`;
 $('punctDetail').classList.add('show');
 $('detailRead').onclick=()=>say(`${item.name}。${item.use}例句：${item.example}`);
 if(speech)speech.sequence([
  {text:`${item.name}。${item.use}`},
  {text:'例句'},
  {text:item.example}
 ],{gapMs:180,onItem:(_,index)=>{
  if(index!==2||$('panel-learn').hidden)return;
  const anchor=document.querySelector(`[data-example-id="${id}"]`);
  if(anchor)showExample(id,anchor,{read:false});
 }});
}
function switchTab(name){
 document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('on',button.dataset.tab===name));
 ['learn','quiz','challenge'].forEach(id=>{$(`panel-${id}`).hidden=id!==name;});
 if(name==='quiz'&&!quizOrder.length)startQuiz();
 if(name==='challenge')renderChallenge();
}
function startQuiz(){quizOrder=shuffle(QUIZ).slice(0,10);quizIndex=0;quizCorrect=0;quizWrong=0;renderQuiz();}
function renderQuiz(){
 quizAnswered=false;const item=quizOrder[quizIndex];
 $('quizLabel').textContent='选择最合适的标点';
 $('quizQuestion').innerHTML=item.text.replace('___','<span class="blank">&nbsp;</span>');
 const distractors=shuffle(PUNCT.map(row=>row.symbol).filter(symbol=>symbol!==item.answer)).slice(0,3);
 const options=shuffle([item.answer,...distractors]);
 $('quizChoices').innerHTML=options.map(value=>`<button type="button" class="mark-choice" data-value="${value}" aria-label="${PUNCT.find(row=>row.symbol===value)?.name||value}">${value}</button>`).join('');
 $('quizFeedback').textContent='';$('quizFeedback').className='feedback';$('quizNext').hidden=true;
 updateQuizHud();say(item.text.replace('___','这里应该填什么标点？'));
}
function answerQuiz(button){
 if(quizAnswered)return;quizAnswered=true;const item=quizOrder[quizIndex],ok=button.dataset.value===item.answer;
 document.querySelectorAll('#quizChoices .mark-choice').forEach(choice=>{choice.disabled=true;if(choice.dataset.value===item.answer)choice.classList.add('correct');});
 if(ok){quizCorrect++;$('quizFeedback').textContent=`答对了！${item.why}`;$('quizFeedback').className='feedback ok';say('答对了。'+item.why);}
 else{quizWrong++;button.classList.add('wrong');$('quizFeedback').textContent=`正确答案是 ${item.answer}。${item.why}`;$('quizFeedback').className='feedback no';say('再想一想。'+item.why);}
 $('quizNext').hidden=false;updateQuizHud();
}
function updateQuizHud(){const done=quizIndex+(quizAnswered?1:0);$('quizScore').textContent=`答对 ${quizCorrect} · 答错 ${quizWrong}`;$('quizCount').textContent=`第 ${quizIndex+1} / ${quizOrder.length} 题`;$('quizProgress').style.width=`${done/quizOrder.length*100}%`;document.querySelector('#panel-quiz .progress').setAttribute('aria-valuenow',String(done));}
function nextQuiz(){if(quizIndex===quizOrder.length-1){startQuiz();return;}quizIndex++;renderQuiz();}
function renderChallenge(){
 const item=CHALLENGES[challengeIndex];challengeEntries=[];
 $('challengeSentence').innerHTML=item.parts.map((part,index)=>part+(index<item.answers.length?`<span class="slot${index===0?' current':''}" data-slot="${index}"></span>`:'')).join('');
 $('challengePalette').innerHTML=item.choices.map(value=>`<button type="button" class="mark-choice" data-mark="${value}">${value}</button>`).join('');
 $('challengeFeedback').textContent='';$('challengeFeedback').className='feedback';$('challengeCheck').hidden=false;$('challengeNext').hidden=true;
 $('challengeCount').textContent=`第 ${challengeIndex+1} / ${CHALLENGES.length} 关`;$('challengeScore').textContent=`完成 ${challengeDone} 关`;
}
function addMark(mark){const item=CHALLENGES[challengeIndex];if(challengeEntries.length>=item.answers.length)return;challengeEntries.push(mark);paintSlots();}
function undoMark(){if(challengeEntries.length){challengeEntries.pop();paintSlots();}}
function paintSlots(){const item=CHALLENGES[challengeIndex];document.querySelectorAll('.slot').forEach((slot,index)=>{slot.textContent=challengeEntries[index]||'';slot.className='slot'+(index===challengeEntries.length&&index<item.answers.length?' current':'');});}
function checkChallenge(){
 const item=CHALLENGES[challengeIndex];if(challengeEntries.length<item.answers.length){$('challengeFeedback').textContent='还有空格没有填写。';$('challengeFeedback').className='feedback no';say('还有空格没有填写。');return;}
 const ok=item.answers.every((answer,index)=>answer===challengeEntries[index]);
 document.querySelectorAll('.slot').forEach((slot,index)=>slot.classList.add(challengeEntries[index]===item.answers[index]?'good':'bad'));
 if(ok){challengeDone++;$('challengeFeedback').textContent='全部正确！这句话的停顿和语气都清楚了。';$('challengeFeedback').className='feedback ok';$('challengeCheck').hidden=true;$('challengeNext').hidden=false;say('全部正确。');}
 else{$('challengeFeedback').textContent='有标点放错了，红色位置需要修改。';$('challengeFeedback').className='feedback no';say('有标点放错了，请修改红色位置。');}
 $('challengeScore').textContent=`完成 ${challengeDone} 关`;
}
function nextChallenge(){challengeIndex=(challengeIndex+1)%CHALLENGES.length;renderChallenge();}

document.querySelector('.tabs').addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(button)switchTab(button.dataset.tab);});
$('levelFilters').addEventListener('click',event=>{const button=event.target.closest('[data-level]');if(!button)return;activeLevel=button.dataset.level;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('on',item===button));$('punctDetail').classList.remove('show');renderCards();});
$('punctGrid').addEventListener('click',event=>{const exampleButton=event.target.closest('[data-example-id]');if(exampleButton){showExample(exampleButton.dataset.exampleId,exampleButton);return;}const cardButton=event.target.closest('[data-card-id]');if(cardButton)showDetail(cardButton.dataset.cardId);});
$('quizChoices').addEventListener('click',event=>{const button=event.target.closest('[data-value]');if(button)answerQuiz(button);});
$('quizRead').addEventListener('click',()=>say(quizOrder[quizIndex].text.replace('___','这里应该填什么标点？')));
$('quizNext').addEventListener('click',nextQuiz);
$('challengePalette').addEventListener('click',event=>{const button=event.target.closest('[data-mark]');if(button)addMark(button.dataset.mark);});
$('challengeUndo').addEventListener('click',undoMark);$('challengeCheck').addEventListener('click',checkChallenge);$('challengeNext').addEventListener('click',nextChallenge);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
renderCards();
}());
</script>
