<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>货币商店｜慧陪学</title><meta name="description" content="用抽象练习币认识元角分，计算购物总价、付款和找零。"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="hpx-game-mobile.css"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#4d5148;--green:#617b61;--paper:rgba(252,251,242,.95)}body{min-height:100vh;padding:16px 12px 42px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dcead8,#f4edcf 52%,#eadfd2)}button{font:inherit}.container{max-width:920px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{color:#675441;font-size:clamp(1.8rem,5vw,2.55rem);letter-spacing:3px;text-shadow:2px 3px #ddd2bf}.header p{margin-top:6px;color:#727a70;font-size:.88rem;line-height:1.65}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(255,255,255,.8);border-radius:22px;background:var(--paper);box-shadow:0 6px 22px rgba(60,72,54,.1)}.toolbar,.group,.actions,.wallet,.tray{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{color:#758075;font-size:.76rem;font-weight:850}.chip,.action{min-height:42px;border:2px solid #c9d3c6;border-radius:14px;padding:8px 13px;background:#fff;color:#59645a;cursor:pointer;font-weight:850}.chip.on{border-color:var(--green);background:var(--green);color:#fff}.primary{border:0;background:#617b61;color:#fff}.secondary{border:0;background:#eadfbf;color:#6d572c}.muted{border:0;background:#ebe9e2;color:#656860}.chip:disabled,.action:disabled,.money:disabled{opacity:.48;cursor:default}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.stat{padding:8px;border-radius:13px;background:#e7ecdf;color:#70796f;font-size:.72rem;text-align:center}.stat b{display:block;margin-top:2px;color:#5b5a4e;font-size:.98rem}.mission{padding:11px 13px;border-radius:14px;background:#f1e8cb;color:#6c5a37;text-align:center;font-size:.86rem;font-weight:800;line-height:1.6}.shop{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(330px,1.2fr);gap:14px;margin-top:14px}.panel{min-width:0;padding:14px;border-radius:18px;background:#edf2e8}.panel h2{margin-bottom:10px;color:#5e6a5e;font-size:.92rem;text-align:center}.basket{display:grid;gap:8px}.item{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:9px;padding:9px;border-radius:13px;background:#fff}.item-icon{font-size:1.6rem;text-align:center}.item b{font-size:.82rem}.item small{display:block;margin-top:2px;color:#7a8278;font-size:.68rem}.item-price{color:#8a642b;font-weight:900}.empty-basket{padding:20px 10px;color:#748074;font-size:.8rem;line-height:1.7;text-align:center}.wallet{align-items:stretch}.money{min-width:72px;min-height:50px;border:2px solid #c79549;border-radius:13px;padding:7px 10px;background:#fff8dc;color:#74521f;cursor:pointer;font-weight:950;box-shadow:0 3px 7px rgba(74,61,37,.1)}.money.note{min-width:88px;border-radius:9px;background:#e5efe0;color:#426044;border-color:#8ca485}.money small{display:block;margin-top:2px;font-size:.58rem;font-weight:700}.selected{margin-top:13px;padding:12px;border:2px dashed #a7b09f;border-radius:15px;background:#fafcf7}.selected-head{display:flex;justify-content:space-between;gap:10px;color:#6a7369;font-size:.75rem}.selected-head b{color:#785c2d;font-size:.92rem}.tray{min-height:47px;margin-top:9px}.token{padding:5px 8px;border-radius:9px;background:#f2e4b7;color:#6f5224;font-size:.72rem;font-weight:850}.question{margin:13px 0 0;color:#5e685c;font-size:.86rem;line-height:1.7;text-align:center}.message{min-height:51px;margin-top:13px;padding:11px;border-radius:14px;background:#e4ebdf;color:#5e6b5e;line-height:1.6;text-align:center}.message.ok{background:#dcefdc;color:#28713a;font-weight:850}.message.bad{background:#f3dfda;color:#9b3c35;font-weight:850}.message.hint{background:#f0e6c8;color:#735c27;font-weight:850}.explanation{display:none;margin-top:10px;padding:11px;border-radius:13px;background:#f2eddd;color:#66604f;font-size:.8rem;line-height:1.7}.explanation.show{display:block}.help summary{cursor:pointer;color:#596650;font-weight:900}.help ol{padding:9px 0 0 22px;color:#657068;font-size:.83rem;line-height:1.85}.back{display:block;margin-top:15px;color:#526f54;text-align:center;text-decoration:none;font-size:.86rem}@media(max-width:700px){.shop{grid-template-columns:1fr}.status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .group{width:100%}.wallet{gap:6px}.money{min-width:66px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style></head><body data-sound-standard="speech"><main class="container"><header class="header"><h1>🛍️ 货币商店</h1><p>使用抽象练习币认识元、角、分，练习按价格付款和计算找零。</p></header><section class="card"><div class="toolbar"><div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div><div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">简单 按金额付款</button><button class="chip" data-level="medium">中等 计算总价</button><button class="chip" data-level="hard">困难 计算找零</button></div><button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button></div><div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">已完成<b id="solvedText">0 次</b></div><div class="stat">当前任务<b id="typeText">按金额付款</b></div><div class="stat">连续正确<b id="streakText">0 关</b></div></div></section><section class="card"><div class="mission" id="mission">请用练习币凑出指定金额。</div><div class="shop"><section class="panel"><h2>购物信息</h2><div class="basket" id="basket"></div><p class="question" id="question"></p></section><section class="panel"><h2>练习币钱包</h2><div class="wallet" id="wallet" aria-label="可选择的练习币"></div><div class="selected"><div class="selected-head"><span>已经放入</span><b id="selectedTotal">0元</b></div><div class="tray" id="tray" aria-live="polite"><span class="token">还没有选择</span></div></div></section></div><div class="message" id="message" role="status" aria-live="polite">先读清任务，再选择练习币。</div><div class="explanation" id="explanation"></div><div class="actions" style="margin-top:12px"><button class="action muted" id="undoBtn">撤回一张</button><button class="action muted" id="clearBtn">全部拿回</button><button class="action secondary" id="hintBtn">给我一点提示</button><button class="action primary" id="checkBtn">检查金额</button><button class="action primary" id="nextBtn" hidden>下一位顾客 →</button></div></section><details class="card help" open><summary>怎么玩？</summary><ol><li>简单：看到指定金额后，用练习币凑出刚好的数。</li><li>中等：先把购物篮中的价格相加，再选择刚好够用的练习币。</li><li>困难：用“付款金额－商品价格”算出应找回的钱，再选择找零。</li><li>所有钱币都是本站绘制的抽象练习卡，不是人民币票面复制图。</li></ol></details><a class="back" href="game-paradise.html">← 返回游戏乐园</a></main><script src="hpx-core.js"></script><script src="hpx-money-shop.js"></script><script>
// 2026-08-20：本站独立设计；商品、价格、练习币组合、付款与找零题均由本地代码随机生成。
(function(){'use strict';const $=id=>document.getElementById(id),api=HpxMoneyShop,speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.03}):null,state={mode:'practice',level:'easy',step:1,puzzle:null,selected:[],done:false,solved:0,streak:0};function say(text){if(speech)speech.speak(text)}function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll('#'+group+' [data-'+key+']').forEach(button=>button.classList.toggle('on',button.dataset[key]===value))}function total(){return state.selected.reduce((sum,item)=>sum+item.fen,0)}function taskName(){return state.puzzle.type==='change'?'计算找零':state.puzzle.type==='total'?'计算总价':'按金额付款'}function renderBasket(){const p=state.puzzle;if(!p.items.length){$('basket').innerHTML='<div class="empty-basket"><strong>金额卡</strong><br>'+api.format(p.goal)+'<br><small>1元 = 10角 = 100分</small></div>'}else $('basket').innerHTML=p.items.map(item=>'<article class="item"><span class="item-icon">'+item.icon+'</span><span><b>'+item.name+'</b><small>无品牌练习商品</small></span><span class="item-price">'+api.format(item.price)+'</span></article>').join('');$('question').textContent=p.question}function renderWallet(){$('wallet').innerHTML=api.DENOMS.map((denom,index)=>'<button class="money '+denom.kind+'" data-index="'+index+'" '+(state.done?'disabled':'')+'>'+denom.label+'<small>练习币</small></button>').join('')}function renderTray(){const amount=total();$('selectedTotal').textContent=api.format(amount);$('tray').innerHTML=state.selected.length?state.selected.map(item=>'<span class="token">'+item.label+'</span>').join(''):'<span class="token">还没有选择</span>';$('undoBtn').disabled=state.done||!state.selected.length;$('clearBtn').disabled=state.done||!state.selected.length}function updateStatus(){$('roundText').textContent=state.mode==='challenge'?state.step+' / 5':'自由练习';$('solvedText').textContent=state.solved+' 次';$('typeText').textContent=taskName();$('streakText').textContent=state.streak+' 关'}function start(reset){if(reset&&state.mode==='challenge')state.step=1;state.puzzle=api.generate(state.level);state.selected=[];state.done=false;$('mission').textContent=state.puzzle.title;$('explanation').className='explanation';$('nextBtn').hidden=true;$('checkBtn').disabled=false;$('hintBtn').disabled=false;renderBasket();renderWallet();renderTray();updateStatus();setMessage('先读清任务，再选择练习币。');say(state.puzzle.question)}function add(index){if(state.done)return;state.selected.push(api.DENOMS[index]);renderTray();setMessage('已经放入 '+api.format(total())+'。')}function undo(){if(state.done||!state.selected.length)return;state.selected.pop();renderTray();setMessage('已撤回最后一张练习币。')}function clearAll(){if(state.done)return;state.selected=[];renderTray();setMessage('练习币已经全部拿回。')}function check(){const amount=total(),goal=state.puzzle.goal;if(amount!==goal){state.streak=0;updateStatus();setMessage(amount<goal?'还少 '+api.format(goal-amount)+'，可以继续添加。':'多了 '+api.format(amount-goal)+'，撤回一些再试。','bad');say('金额还不正确，可以继续调整。');return}state.done=true;state.solved++;state.streak++;const p=state.puzzle,formula=p.type==='change'?api.format(p.paid)+'－'+api.format(p.price)+'＝'+api.format(goal):p.type==='total'?p.items.map(item=>api.format(item.price)).join('＋')+'＝'+api.format(goal):'合计 '+api.format(goal);$('explanation').innerHTML='<strong>计算：</strong>'+formula+'<br><strong>一种选择：</strong>'+p.example;$('explanation').className='explanation show';$('nextBtn').hidden=false;$('checkBtn').disabled=true;$('hintBtn').disabled=true;renderWallet();renderTray();setMessage(p.type==='change'?'找零正确！金额刚刚好。':'付款成功！金额刚刚好。','ok');say(p.type==='change'?'找零正确，金额刚刚好。':'付款成功，金额刚刚好。');updateStatus()}function hint(){const p=state.puzzle,text=p.type==='change'?'先算 '+api.format(p.paid)+' 减去 '+api.format(p.price)+'。':p.type==='total'?'先把 '+p.items.map(item=>api.format(item.price)).join(' 和 ')+' 相加。':'可以先放较大的练习币，再用较小面额补齐。';setMessage('提示：'+text,'hint');say(text)}function next(){if(state.mode==='challenge'){if(state.step===5){start(true);return}state.step++}start(false)}$('wallet').addEventListener('click',event=>{const button=event.target.closest('[data-index]');if(button)add(Number(button.dataset.index))});$('undoBtn').addEventListener('click',undo);$('clearBtn').addEventListener('click',clearAll);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',hint);$('nextBtn').addEventListener('click',next);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);start(true)});$('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);start(true)});start(true)})();
</script><script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body></html>
