<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>数字迷宫｜慧陪学</title>
  <meta name="description" content="计算每层目标数，从多个算式门中选择结果相同的一扇，逐步走出数字迷宫。">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#445047;--accent:#507665}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd,#d6ecd2 55%,#e9f2df)}button{font:inherit}.container{max-width:940px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#655849;text-shadow:2px 3px #ddd6c4}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}.card{background:rgba(240,248,235,.94);border:1px solid rgba(255,255,255,.62);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.8rem;font-weight:700;color:#71806f}.chip,.action{border:2px solid #cbd8c7;background:#fbfdf9;color:#5d625d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background}.chip:hover,.action:hover,.gate:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(70,104,88,.22)}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.04rem;color:#655849;margin-top:2px}.mission{text-align:center;margin-bottom:12px}.mission strong{color:#4d715f;font-size:1.07rem}.mission p{font-size:.8rem;color:#748176;margin-top:4px}.maze{max-width:760px;margin:auto;padding:12px;border-radius:22px;background:#dbe8d6;border:2px solid #bfcfba}.finish,.start{width:max-content;margin:auto;padding:7px 17px;border-radius:999px;font-size:.82rem;font-weight:850}.finish{background:#eee1a7;color:#6e5a24}.start{background:#d1e2ce;color:#45644b}.connector{width:5px;height:12px;margin:auto;background:#9fb59b}.maze-row{position:relative;display:grid;grid-template-columns:80px 1fr;gap:9px;align-items:center;padding:7px;border-radius:16px}.maze-row.active{background:#f5f8ef;box-shadow:0 3px 10px rgba(55,78,57,.11)}.maze-row.completed{background:rgba(218,237,216,.72)}.maze-row.locked{opacity:.52}.target{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:61px;border-radius:12px;background:#e6e5d5;text-align:center;color:#777465;font-size:.7rem}.target b{display:block;color:#665749;font-size:1.3rem}.gates{display:grid;grid-template-columns:repeat(var(--choices),minmax(80px,1fr));gap:7px}.gate{min-height:61px;border:2px solid #c5d5c0;border-radius:12px;background:#fff;color:#536057;font-weight:900;cursor:pointer;box-shadow:0 2px 6px rgba(60,80,61,.08);transition:.15s transform,.15s background}.gate:disabled{cursor:default}.gate.correct{background:#79a77e;border-color:#5b8e62;color:#fff}.gate.wrong{animation:shake .34s ease;border-color:#d05c52;box-shadow:inset 0 0 0 2px #d05c52}.gate.hint{background:#f0dda2;border-color:#c39a35;animation:pulse .7s ease 2}.lock{font-size:1.05rem;color:#728172}.progress{max-width:760px;margin:14px auto 4px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#86a87d,#507665);transition:width .2s}.progress-text{text-align:center;font-size:.79rem;color:#71806f}.actions{margin-top:13px}.action{border:0;padding:9px 16px;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#6f917b,#507665);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.45;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:50px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#655849;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(.91)}}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}@media(max-width:560px){.card{padding:11px}.status-row{grid-template-columns:repeat(2,1fr)}.maze{padding:7px}.maze-row{grid-template-columns:58px 1fr;gap:5px;padding:5px}.target{min-height:55px}.target b{font-size:1.08rem}.gates{gap:4px}.gate{min-height:55px;font-size:.82rem;padding:3px}.connector{height:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header"><h1>🧩 数字迷宫</h1><p>算对每一层，选中正确的算式门，一步一步走向终点。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 加减</button><button class="chip" data-level="medium">中年级 加减乘</button><button class="chip" data-level="hard">高年级 四则</button></div>
      <button class="chip" id="speakToggle">🔊 语音提示 开</button>
    </div>
    <div class="status-row"><div class="stat">当前迷宫<b id="roundText">自由练习</b></div><div class="stat">已经前进<b id="stepText">0 / 5 层</b></div><div class="stat">本题误选<b id="mistakeText">0 次</b></div><div class="stat">最佳记录<b id="bestText">--</b></div></div>
  </section>
  <section class="card">
    <div class="mission"><strong id="missionText">第一层的目标数是 8</strong><p>算出每扇门的结果，只选择等于目标数的算式。</p></div>
    <div class="maze" id="maze" aria-label="数字迷宫"></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">从起点出发</p>
    <div class="actions"><button class="action secondary" id="hintBtn">💡 提示正确门</button><button class="action muted" id="newBtn">↻ 换一个迷宫</button><button class="action primary" id="nextBtn" hidden>下一个迷宫 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">选错不会换题，重新计算后还可以继续选择。</div>
  </section>
  <section class="card help"><h2>怎么玩</h2><ol><li>从最下方起点开始，看当前层左边的“目标数”。</li><li>计算这一层每扇门上的算式，点击结果等于目标数的门。</li><li>选对才能向上一层前进；选错会留在原层，可以重新计算。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-15：本站独立设计；目标数、算式门、迷宫层级和反馈均由浏览器内代码生成。
(function(){'use strict';
const LEVELS={easy:{rows:5,choices:2,min:2,max:20},medium:{rows:6,choices:3,min:6,max:81},hard:{rows:7,choices:3,min:8,max:96}},STORE_KEY='hpxNumberMazeV1';
const state={mode:'practice',level:'easy',game:null,current:0,mistakes:0,path:[],challengeStep:1,challengeMistakes:0,stats:loadStats()};
const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.05}):null;
function loadStats(){try{return Object.assign({bestMistakes:{}},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{bestMistakes:{}}}}
function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
function randomInt(min,max){return min+Math.floor(Math.random()*(max-min+1))}
function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function expressionForValue(value,level){const methods=['add','sub'];const limit=level==='hard'?12:9;const factors=[];for(let factor=2;factor<=limit;factor++)if(value%factor===0&&value/factor>=2)factors.push(factor);if(level!=='easy'&&factors.length)methods.push('mul');if(level==='hard')methods.push('div');const method=methods[Math.floor(Math.random()*methods.length)];if(method==='add'){const left=randomInt(1,Math.max(1,value-1));return{label:`${left} + ${value-left}`,value}}if(method==='sub'){const extra=randomInt(1,level==='easy'?9:20);return{label:`${value+extra} − ${extra}`,value}}if(method==='mul'){const factor=factors[Math.floor(Math.random()*factors.length)];return{label:`${factor} × ${value/factor}`,value}}const divisor=randomInt(2,limit);return{label:`${value*divisor} ÷ ${divisor}`,value}}
function createRow(level,index){const cfg=LEVELS[level],target=randomInt(cfg.min,cfg.max),nearby=shuffled(Array.from({length:cfg.max-cfg.min+1},(_,i)=>cfg.min+i).filter(value=>value!==target)).sort((a,b)=>Math.abs(a-target)-Math.abs(b-target)),values=[target,...nearby.slice(0,cfg.choices-1)],options=shuffled(values.map((value,optionIndex)=>{const expression=expressionForValue(value,level);return{id:`r${index}-o${optionIndex}-${value}`,label:expression.label,value}}));return{id:`row-${index}`,target,options,correctId:options.find(option=>option.value===target).id}}
function createGame(level){const cfg=LEVELS[level];return{choices:cfg.choices,rows:Array.from({length:cfg.rows},(_,index)=>createRow(level,index))}}
function evaluateChoice(row,optionId,current){return optionId===row.correctId?{correct:true,next:current+1}:{correct:false,next:current}}
function startGame(resetChallenge){if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeMistakes=0}state.game=createGame(state.level);state.current=0;state.mistakes=0;state.path=[];el('nextBtn').hidden=true;el('newBtn').hidden=false;el('hintBtn').disabled=false;render();setMessage('选错不会换题，重新计算后还可以继续选择。','');announceCurrent()}
function render(){const maze=el('maze');maze.innerHTML='<div class="finish">🏁 终点</div>';for(let index=state.game.rows.length-1;index>=0;index--){maze.appendChild(connector());maze.appendChild(renderRow(state.game.rows[index],index))}maze.appendChild(connector());const start=document.createElement('div');start.className='start';start.textContent='起点';maze.appendChild(start);updateStatus()}
function connector(){const line=document.createElement('div');line.className='connector';return line}
function renderRow(row,index){const wrapper=document.createElement('div'),target=document.createElement('div'),gates=document.createElement('div');wrapper.className='maze-row '+(index<state.current?'completed':index===state.current?'active':'locked');target.className='target';target.innerHTML=index>state.current?'<span class="lock">🔒</span>':`目标数<b>${row.target}</b>`;gates.className='gates';gates.style.setProperty('--choices',state.game.choices);row.options.forEach(option=>{const button=document.createElement('button');button.type='button';button.className='gate';button.dataset.id=option.id;if(index>state.current){button.disabled=true;button.innerHTML='<span class="lock">?</span>'}else{button.textContent=option.label;button.disabled=index<state.current;if(state.path[index]===option.id)button.classList.add('correct')}button.setAttribute('aria-label',index>state.current?'尚未解锁':option.label);button.addEventListener('click',()=>choose(option.id,button));gates.appendChild(button)});wrapper.appendChild(target);wrapper.appendChild(gates);return wrapper}
function choose(optionId,button){if(state.current>=state.game.rows.length)return;const row=state.game.rows[state.current],result=evaluateChoice(row,optionId,state.current);if(result.correct){state.path[state.current]=optionId;state.current=result.next;if(state.current===state.game.rows.length)finish();else{render();setMessage('计算正确，向终点前进一层！','ok');announceCurrent()}}else{state.mistakes++;button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage(`这扇门的结果不是${row.target}，留在本层再算一次。`,'bad');if(speech)speech.speak(`再算一次，要找结果等于${row.target}的算式。`);updateStatus()}}
function hint(){if(state.current>=state.game.rows.length)return;const row=state.game.rows[state.current],button=el('maze').querySelector(`[data-id="${row.correctId}"]`);button.classList.add('hint');setTimeout(()=>button.classList.remove('hint'),1400);setMessage(`提示：寻找计算结果等于${row.target}的门。`,'')}
function finish(){state.challengeMistakes+=state.mode==='challenge'?state.mistakes:0;const previous=state.stats.bestMistakes[state.level];if(previous===undefined||state.mistakes<previous){state.stats.bestMistakes[state.level]=state.mistakes;saveStats()}render();el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){el('nextBtn').textContent='再挑战一次 ↻';setMessage(`5个迷宫全部走完！总误选${state.challengeMistakes}次。`,'done');if(speech)speech.speak('五个数字迷宫全部完成！')}else{el('nextBtn').textContent='下一个迷宫 →';setMessage(`到达终点！本次误选${state.mistakes}次。`,'done');if(speech)speech.speak('到达终点！')}celebrate()}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}
function announceCurrent(){const row=state.game.rows[state.current];if(row&&speech)speech.speak(`第${state.current+1}层，寻找结果等于${row.target}的算式。`)}
function updateStatus(){const total=state.game.rows.length,finished=state.current>=total;el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('stepText').textContent=`${Math.min(state.current,total)} / ${total} 层`;el('mistakeText').textContent=`${state.mistakes} 次`;const best=state.stats.bestMistakes[state.level];el('bestText').textContent=best===undefined?'--':`${best} 次`;el('progressFill').style.width=`${Math.min(state.current,total)/total*100}%`;el('progressText').textContent=finished?'已经到达终点':state.current===0?'从起点出发':`距离终点还有 ${total-state.current} 层`;el('missionText').textContent=finished?'恭喜你走出数字迷宫！':`第${state.current+1}层的目标数是 ${state.game.rows[state.current].target}`}
function setMessage(text,type){const message=el('message');message.textContent=text;message.className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(button=>button.classList.toggle('on',button.dataset[key]===value))}
el('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});el('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startGame(true)});el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());el('hintBtn').addEventListener('click',hint);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<28;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=colors[Math.floor(Math.random()*colors.length)];dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}}
window.NumberMaze={LEVELS,expressionForValue,createRow,createGame,evaluateChoice};startGame(false)})();
</script>
<script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
