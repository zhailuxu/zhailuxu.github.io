*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#465149;--accent:#607760}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dfedda,#eff2dc 52%,#f6e9d5)}button{font:inherit}.container{max-width:940px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.75rem,5vw,2.45rem);letter-spacing:3px;color:#625648;text-shadow:2px 3px #ddd4c4}.header p{margin-top:6px;color:#718078;font-size:.9rem;line-height:1.6}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(248,251,244,.94);box-shadow:0 5px 22px rgba(54,79,57,.1)}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.78rem;font-weight:800;color:#71806f}.chip,.action,.piece-card{border:2px solid #c8d5c3;border-radius:14px;padding:8px 13px;background:#fff;color:#59635b;cursor:pointer;font-weight:800;transition:.15s transform,.15s background}.chip:hover,.action:hover,.piece-card:hover{transform:translateY(-1px)}.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}.action{border:0;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#78917c,#55715b);color:#fff}.secondary{background:#e0ebdc;color:#4e6852}.muted{background:#e8e8e2;color:#62675f}.chip:disabled,.action:disabled,.piece-card:disabled{opacity:.45;cursor:default;transform:none}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:8px;border-radius:13px;background:#dfebda;text-align:center;color:#6d796b;font-size:.74rem}.stat b{display:block;margin-top:2px;color:#5f5748;font-size:1.02rem}.instruction{padding:11px 14px;border-radius:15px;background:#eee7d5;text-align:center;color:#6c6251;font-size:.82rem;line-height:1.6}.workspace{display:grid;grid-template-columns:minmax(310px,1.1fr) minmax(270px,.9fr);gap:15px;margin-top:14px}.panel{padding:13px;border-radius:18px;background:#edf3e9}.panel h2{margin-bottom:10px;text-align:center;color:#5c685e;font-size:.9rem}.board{--size:4;display:grid;width:min(100%,480px);aspect-ratio:1;margin:auto;grid-template-columns:repeat(var(--size),1fr);gap:3px;padding:6px;border:3px solid #9eaf99;border-radius:17px;background:#c9d5c5}.cell{position:relative;border:0;border-radius:6px;background:#f8fbf6;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(79,101,80,.08)}.cell.filled{background:var(--c)}.cell.filled::after{content:attr(data-piece);position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:.72rem;font-weight:950}.cell.hint{box-shadow:inset 0 0 0 4px #e9ad4d;background:#fff2cb}.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.piece-card{min-height:105px;padding:8px}.piece-card.selected{border-color:#557fa1;background:#eaf3fa}.piece-card.placed{opacity:.42}.mini{display:grid;justify-content:center;align-content:center;gap:2px;min-height:68px}.mini-cell{width:18px;height:18px;border-radius:4px;background:transparent}.mini-cell.on{background:var(--c);box-shadow:inset -2px -2px rgba(30,40,35,.12)}.piece-name{display:block;color:#677168;font-size:.73rem}.selected-note{min-height:41px;margin-top:9px;padding:9px;border-radius:12px;background:#e0eadc;text-align:center;color:#566858;font-size:.78rem;line-height:1.5}.message{min-height:50px;margin-top:13px;padding:11px;border-radius:14px;background:#e1ebde;color:#5e6d60;text-align:center;line-height:1.6}.message.ok{background:#dcefdc;color:#27733b;font-weight:750}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:750}.message.hint{background:#eee5c9;color:#745e25;font-weight:750}.help summary{cursor:pointer;color:#5e684f;font-weight:900}.help ol{padding:10px 0 0 22px;color:#647066;font-size:.85rem;line-height:1.85}.back{display:block;margin-top:15px;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@media(max-width:700px){.workspace{grid-template-columns:1fr}.pieces{grid-template-columns:repeat(3,1fr)}.piece-card{min-height:92px}.status-row{grid-template-columns:repeat(2,1fr)}.toolbar{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}.group{flex:0 0 auto}.chip{white-space:nowrap}}@media(max-width:430px){.pieces{grid-template-columns:repeat(2,1fr)}.mini-cell{width:15px;height:15px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}

<body data-sound-standard="speech"><main class="container">
<header class="header"><h1>📦 图形装箱</h1><p>转一转、试一试，让每一块都在箱子里找到位置。</p></header>
<section class="card"><div class="toolbar"><div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div><div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 4×4</button><button class="chip" data-level="medium">中年级 5×5</button><button class="chip" data-level="hard">高年级 6×6</button></div><button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button></div><div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">已经放入<b id="placedText">0 / 3</b></div><div class="stat">无效尝试<b id="mistakeText">0 次</b></div><div class="stat">连续完成<b id="streakText">0 轮</b></div></div></section>
<section class="card"><div class="instruction">先选右边的一块，需要时旋转，再点击左边箱子中的起始格放置。</div><div class="workspace"><div class="panel"><h2>有限空间箱</h2><div class="board" id="board" aria-label="图形装箱方格"></div></div><div class="panel"><h2>待装拼块</h2><div class="pieces" id="pieces"></div><div class="selected-note" id="selectedNote">请先选择一块拼块。</div><div class="actions" style="margin-top:9px"><button class="action secondary" id="rotateBtn" disabled>↻ 旋转90°</button><button class="action muted" id="undoBtn" disabled>撤回上一步</button><button class="action muted" id="clearBtn">全部取出</button></div></div></div><div class="message" id="message" role="status" aria-live="polite">箱子必须刚好铺满，拼块不能重叠，也不能伸出边界。</div><div class="actions" style="margin-top:12px"><button class="action secondary" id="hintBtn">提示一块位置</button><button class="action muted" id="newBtn">换一组</button><button class="action primary" id="nextBtn" hidden>下一组 →</button></div></section>
<details class="card help" open><summary>怎么玩？</summary><ol><li>点击一个待装拼块，它会显示蓝色边框。</li><li>点击“旋转90°”调整方向，再点击箱子中的某一格尝试放入。</li><li>放不下时不会换题；可以继续旋转，或者点击已经放入的拼块把它取回。</li><li>提示只标出一块的参考位置，仍需要你自己安排其他拼块。</li></ol></details><a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main><script src="hpx-core.js"></script><script>
// 2026-08-16：本站独立设计；拼块、可行解、颜色、交互和反馈均由浏览器内代码生成，声音使用浏览器原生语音合成。
(function(){'use strict';
const CONFIG={easy:{size:4,pieceSizes:[5,5,6]},medium:{size:5,pieceSizes:[4,5,5,5,6]},hard:{size:6,pieceSizes:[4,5,5,5,5,6,6]}},COLORS=['#6f97b4','#d58d5b','#73a079','#9a7bad','#d2a74f','#5f9b94','#c4777c'],STORE='hpxShapePackingV1';
function shuffle(items,rng=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function normalize(cells){const minR=Math.min(...cells.map(x=>x.r)),minC=Math.min(...cells.map(x=>x.c));return cells.map(x=>({r:x.r-minR,c:x.c-minC})).sort((a,b)=>a.r-b.r||a.c-b.c)}
function rotateCells(cells,times=1){let out=normalize(cells);for(let n=0;n<((times%4)+4)%4;n++){const maxR=Math.max(...out.map(x=>x.r));out=normalize(out.map(x=>({r:x.c,c:maxR-x.r})))}return out}
function snakePath(size,vertical=false,reverse=false){const cells=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++){const cc=r%2?size-1-c:c;cells.push(vertical?{r:cc,c:r}:{r,c:cc})}return reverse?cells.reverse():cells}
function generatePuzzle(level,rng=Math.random){const cfg=CONFIG[level],path=snakePath(cfg.size,rng()<.5,rng()<.5),sizes=shuffle(cfg.pieceSizes,rng),pieces=[];let offset=0;sizes.forEach((count,index)=>{const absolute=path.slice(offset,offset+count),minR=Math.min(...absolute.map(x=>x.r)),minC=Math.min(...absolute.map(x=>x.c));pieces.push({id:index+1,color:COLORS[index],cells:normalize(absolute),solution:{r:minR,c:minC,rotation:0},initialRotation:Math.floor(rng()*4)});offset+=count});return{level,size:cfg.size,pieces:shuffle(pieces,rng)}}
function cellsAt(piece,row,col,rotation){return rotateCells(piece.cells,rotation).map(cell=>({r:row+cell.r,c:col+cell.c}))}
function canPlace(board,size,piece,row,col,rotation){return cellsAt(piece,row,col,rotation).every(cell=>cell.r>=0&&cell.c>=0&&cell.r<size&&cell.c<size&&!board[cell.r*size+cell.c])}
function placePiece(board,size,piece,row,col,rotation){if(!canPlace(board,size,piece,row,col,rotation))return null;const next=board.slice();cellsAt(piece,row,col,rotation).forEach(cell=>next[cell.r*size+cell.c]=piece.id);return next}
function isComplete(board){return board.length>0&&board.every(Boolean)}
function connected(cells){const keys=new Set(cells.map(x=>`${x.r},${x.c}`)),seen=new Set(),stack=[cells[0]];while(stack.length){const cell=stack.pop(),key=`${cell.r},${cell.c}`;if(seen.has(key))continue;seen.add(key);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const next=`${cell.r+dr},${cell.c+dc}`;if(keys.has(next)&&!seen.has(next))stack.push({r:cell.r+dr,c:cell.c+dc})})}return seen.size===cells.length}
window.ShapePacking={CONFIG,normalize,rotateCells,snakePath,generatePuzzle,cellsAt,canPlace,placePiece,isComplete,connected};if(typeof document==='undefined')return;
const $=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.05}):null;const state={mode:'practice',level:'easy',step:1,puzzle:null,board:[],placements:new Map(),selected:null,rotations:new Map(),mistakes:0,streak:loadStreak(),history:[],hint:new Set(),done:false};
function loadStreak(){try{return Number(JSON.parse(localStorage.getItem(STORE)||'{}').streak)||0}catch(e){return 0}}function saveStreak(){try{localStorage.setItem(STORE,JSON.stringify({streak:state.streak}))}catch(e){}}function say(text){if(speech)speech.speak(text)}function pieceById(id){return state.puzzle.pieces.find(piece=>piece.id===id)}function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(btn=>btn.classList.toggle('on',btn.dataset[key]===value))}
function snapshot(){return{board:state.board.slice(),placements:new Map(state.placements)}}function restore(snap){state.board=snap.board;state.placements=snap.placements;state.selected=null;state.hint.clear();renderAll()}
function miniHtml(piece,rotation){const cells=rotateCells(piece.cells,rotation),rows=Math.max(...cells.map(x=>x.r))+1,cols=Math.max(...cells.map(x=>x.c))+1,set=new Set(cells.map(x=>`${x.r},${x.c}`));return`<span class="mini" style="grid-template-columns:repeat(${cols},18px);--c:${piece.color}">${Array.from({length:rows*cols},(_,i)=>`<i class="mini-cell ${set.has(`${Math.floor(i/cols)},${i%cols}`)?'on':''}"></i>`).join('')}</span>`}
function renderPieces(){$('pieces').innerHTML=state.puzzle.pieces.map(piece=>{const placed=state.placements.has(piece.id),rotation=state.rotations.get(piece.id)||0;return`<button class="piece-card ${state.selected===piece.id?'selected':''} ${placed?'placed':''}" data-id="${piece.id}" ${placed?'disabled':''}>${miniHtml(piece,rotation)}<span class="piece-name">${piece.id}号 · ${piece.cells.length}格</span></button>`}).join('');const selected=state.selected&&pieceById(state.selected);$('selectedNote').textContent=selected?`已选${selected.id}号拼块，当前旋转 ${(state.rotations.get(selected.id)||0)*90}°。`:'请先选择一块拼块。';$('rotateBtn').disabled=!selected||state.done}
function renderBoard(){$('board').style.setProperty('--size',state.puzzle.size);$('board').innerHTML=state.board.map((id,index)=>{const piece=id&&pieceById(id),hint=state.hint.has(index);return`<button class="cell ${id?'filled':''} ${hint?'hint':''}" data-index="${index}" data-piece="${id||''}" style="${piece?`--c:${piece.color}`:''}" aria-label="第${Math.floor(index/state.puzzle.size)+1}行第${index%state.puzzle.size+1}列${id?`，${id}号拼块`:''}"></button>`}).join('')}
function updateStatus(){$('roundText').textContent=state.mode==='challenge'?`${state.step} / 5`:'自由练习';$('placedText').textContent=`${state.placements.size} / ${state.puzzle.pieces.length}`;$('mistakeText').textContent=`${state.mistakes} 次`;$('streakText').textContent=`${state.streak} 轮`;$('undoBtn').disabled=!state.history.length||state.done}
function renderAll(){renderBoard();renderPieces();updateStatus()}
function startRound(reset=false){if(reset&&state.mode==='challenge')state.step=1;state.puzzle=generatePuzzle(state.level);state.board=Array(state.puzzle.size**2).fill(0);state.placements=new Map();state.rotations=new Map(state.puzzle.pieces.map(piece=>[piece.id,piece.initialRotation]));state.selected=null;state.mistakes=0;state.history=[];state.hint.clear();state.done=false;$('nextBtn').hidden=true;setMessage('箱子必须刚好铺满，拼块不能重叠，也不能伸出边界。');renderAll()}
function selectPiece(id){if(state.done)return;state.selected=id;state.hint.clear();setMessage(`已选择${id}号拼块。可以旋转，也可以点击箱子尝试放置。`);renderAll()}
function removePiece(id){if(state.done)return;state.history.push(snapshot());state.board=state.board.map(value=>value===id?0:value);const placed=state.placements.get(id);state.placements.delete(id);state.selected=id;if(placed)state.rotations.set(id,placed.rotation);state.hint.clear();setMessage(`${id}号拼块已经取回，可以换个位置。`);renderAll()}
function tryPlace(index){if(state.done)return;const occupied=state.board[index];if(occupied){removePiece(occupied);return}if(!state.selected){setMessage('请先从右边选择一块拼块。','bad');return}const size=state.puzzle.size,row=Math.floor(index/size),col=index%size,piece=pieceById(state.selected),rotation=state.rotations.get(piece.id)||0,next=placePiece(state.board,size,piece,row,col,rotation);if(!next){state.mistakes++;setMessage('这里放不下：可能超出箱子或压住了别的拼块。当前题不会更换。','bad');say('这里放不下。可以旋转，或者换一个位置。');updateStatus();return}state.history.push(snapshot());state.board=next;state.placements.set(piece.id,{r:row,c:col,rotation});state.selected=null;state.hint.clear();if(isComplete(state.board)){state.done=true;state.streak++;saveStreak();const complete=state.mode==='challenge'&&state.step===5;$('nextBtn').hidden=false;$('nextBtn').textContent=complete?'再挑战一次 ↻':'下一组 →';setMessage(`${complete?'5关完成！':'装箱成功！'}所有拼块刚好铺满，没有重叠。`,'ok');say(`${complete?'五关挑战完成。':'装箱成功。'}所有拼块都找到了位置。`)}else setMessage('放入成功！继续安排剩下的拼块。','ok');renderAll()}
function hint(){if(state.done)return;const piece=state.puzzle.pieces.find(item=>!state.placements.has(item.id));if(!piece){return}state.selected=piece.id;state.rotations.set(piece.id,0);state.hint=new Set(cellsAt(piece,piece.solution.r,piece.solution.c,0).map(cell=>cell.r*state.puzzle.size+cell.c));setMessage(`提示：${piece.id}号拼块保持当前方向，可以参考黄色方格。若被占住，先取回挡住的拼块。`,'hint');say(`${piece.id}号拼块可以参考黄色方格。`);renderAll()}
function next(){if(state.mode==='challenge'){if(state.step===5){startRound(true);return}state.step++}startRound(false)}
$('pieces').addEventListener('click',e=>{const button=e.target.closest('.piece-card');if(button)selectPiece(Number(button.dataset.id))});$('board').addEventListener('click',e=>{const cell=e.target.closest('.cell');if(cell)tryPlace(Number(cell.dataset.index))});$('rotateBtn').addEventListener('click',()=>{if(!state.selected)return;state.rotations.set(state.selected,((state.rotations.get(state.selected)||0)+1)%4);state.hint.clear();setMessage(`${state.selected}号拼块已旋转90°。`);renderAll()});$('undoBtn').addEventListener('click',()=>{const snap=state.history.pop();if(snap)restore(snap)});$('clearBtn').addEventListener('click',()=>{if(!state.placements.size)return;state.history.push(snapshot());state.board.fill(0);state.placements.clear();state.selected=null;state.hint.clear();setMessage('所有拼块已经取出，可以重新安排。');renderAll()});$('hintBtn').addEventListener('click',hint);$('newBtn').addEventListener('click',()=>startRound(state.mode==='challenge'));$('nextBtn').addEventListener('click',next);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startRound(true)});$('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startRound(true)});startRound(true);
})();
</script><script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><script src="hpx-speech-compat.js"></script>
