<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>图案接龙｜慧陪学</title>
<meta name="description" content="观察颜色、形状和大小的排列规律，选择正确的下一项，练习规律识别与逻辑推理。">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#435047;--accent:#6d4c41}
body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}button{font:inherit}.container{max-width:920px;margin:auto}
.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}
.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}
.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background,.15s box-shadow}.chip:hover,.action:hover,.answer:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}.chip:focus-visible,.action:focus-visible,.answer:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}
.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}
.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6;margin-bottom:5px}.sub{text-align:center;font-size:.78rem;color:#7c8a7b;margin-bottom:16px}
.sequence-wrap{overflow-x:auto;padding:8px 2px 14px}.sequence{display:flex;gap:9px;align-items:center;justify-content:center;min-width:max-content}.term{width:76px;height:86px;border-radius:16px;background:#f3f7ef;border:3px solid #a7baa2;display:grid;place-items:center;position:relative;box-shadow:0 3px 8px rgba(54,79,57,.12)}.term::after{content:attr(data-number);position:absolute;bottom:2px;right:7px;color:#91a08f;font-size:.66rem}.term.question{font-size:2.2rem;font-weight:900;color:#6d4c41;background:#e1ebdd;border-style:dashed}.term.hint{box-shadow:0 0 0 4px #d6a13b,0 3px 8px rgba(54,79,57,.12)}
.shape{width:48px;height:48px;background:var(--color);transform:scale(var(--scale,1));transition:.15s transform}.shape.circle{border-radius:50%}.shape.square{border-radius:8px}.shape.triangle{clip-path:polygon(50% 4%,96% 94%,4% 94%)}.shape.diamond{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.answer-title{text-align:center;color:#6c786a;font-size:.84rem;font-weight:700;margin:4px 0 9px}.answers{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.answer{width:94px;height:94px;border:3px solid #cad7c6;border-radius:18px;background:#f8fbf6;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(54,79,57,.12);transition:.15s transform,.15s box-shadow}.answer.wrong{animation:shake .35s ease;border-color:#cf5349;box-shadow:0 0 0 3px rgba(207,83,73,.15)}.answer.correct{border-color:#3d8750;box-shadow:0 0 0 4px rgba(61,135,80,.2);background:#e2f1e1}.answer:disabled{cursor:default}.answer-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action[hidden]{display:none}
.message{min-height:52px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}
.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.term{width:59px;height:69px;border-radius:13px}.shape{width:38px;height:38px}.answer{width:78px;height:78px}.answer .shape{width:42px;height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header"><h1>🔶 图案接龙</h1><p>观察颜色、形状和大小的变化，选出正确的下一项。</p></header>
  <section class="card" aria-label="游戏设置">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级</button><button class="chip" data-level="medium">中年级</button><button class="chip" data-level="hard">高年级</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row" aria-live="polite"><div class="stat">当前进度<b id="roundText">自由练习</b></div><div class="stat">本题误选<b id="mistakeText">0 次</b></div><div class="stat">累计完成<b id="completeText">0 题</b></div><div class="stat">连续答对<b id="streakText">0 题</b></div></div>
  </section>
  <section class="card">
    <p class="instruction">按照前面的规律，问号位置应该放什么图案？</p>
    <p class="sub" id="levelHint">先看看颜色是不是一个隔一个重复。</p>
    <div class="sequence-wrap"><div class="sequence" id="sequence" aria-label="待观察的图案序列"></div></div>
    <p class="answer-title">请选择下一项</p><div class="answers" id="answers"></div>
    <div class="actions"><button class="action secondary" id="hintBtn">💡 给我提示</button><button class="action muted" id="newBtn">↻ 换一题</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">先完整看一遍，再找重复出现的一小组图案。</div>
  </section>
  <section class="card help"><h2>观察小方法</h2><ol><li>先只看颜色：它们按几个一组重复？</li><li>再看形状和大小：是否也有自己的变化顺序？</li><li>选错不会跳题，可以回到序列中重新找规律。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-14：本站独立设计；题目由颜色、形状和大小规则在浏览器内随机组合生成。
(function(){
  'use strict';
  const COLORS=[{name:'红色',value:'#ef617b'},{name:'黄色',value:'#f4b43a'},{name:'绿色',value:'#48a66b'},{name:'蓝色',value:'#4f87c7'},{name:'紫色',value:'#8a68b5'}];
  const SHAPES=[{name:'圆形',value:'circle'},{name:'正方形',value:'square'},{name:'三角形',value:'triangle'},{name:'菱形',value:'diamond'}];
  const LEVELS={easy:{length:6,choices:3},medium:{length:7,choices:4},hard:{length:8,choices:5}};
  const STORE_KEY='hpxPatternSequenceStatsV1';
  const state={mode:'practice',level:'easy',question:null,mistakes:0,challengeStep:1,solved:false,stats:loadStats()};
  const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;
  function say(text){if(speech)speech.speak(text)}el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
  function loadStats(){try{return Object.assign({completed:0,streak:0,bestStreak:0},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{completed:0,streak:0,bestStreak:0}}}
  function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
  function randomItem(items){return items[Math.floor(Math.random()*items.length)]}
  function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
  function pickDistinct(items,count){return shuffled(items).slice(0,count)}
  function token(color,shape,scale=1){return{color,shape,scale}}
  function tokenKey(t){return`${t.color.value}|${t.shape.value}|${t.scale}`}

  function easyRules(){
    const [c1,c2,c3]=pickDistinct(COLORS,3),[s1,s2,s3]=pickDistinct(SHAPES,3);
    return[
      {period:2,build:i=>token(i%2?c2:c1,s1),hint:'颜色每2个重复一次，形状没有变化。',explain:`颜色按照“${c1.name}、${c2.name}”循环。`},
      {period:3,build:i=>token([c1,c2,c3][i%3],s1),hint:'把连续3个颜色看成一组。',explain:`颜色按照“${c1.name}、${c2.name}、${c3.name}”循环。`},
      {period:2,build:i=>token(c1,i%2?s2:s1),hint:'颜色不变，只看形状怎样轮流出现。',explain:`形状按照“${s1.name}、${s2.name}”交替。`}
    ];
  }
  function mediumRules(){
    const [c1,c2,c3]=pickDistinct(COLORS,3),[s1,s2,s3]=pickDistinct(SHAPES,3);
    return[
      {period:4,build:i=>token(Math.floor(i/2)%2?c2:c1,s1),hint:'每种颜色连续出现2次，再换下一种颜色。',explain:`${c1.name}连续2个，${c2.name}连续2个，然后重新循环。`},
      {period:3,build:i=>token(c1,[s1,s2,s3][i%3]),hint:'把连续3个形状看成一组。',explain:`形状按照“${s1.name}、${s2.name}、${s3.name}”循环。`},
      {period:4,build:i=>token(i%2?c2:c1,i%2?s2:s1),hint:'颜色和形状一起成对变化。',explain:`“${c1.name}${s1.name}、${c2.name}${s2.name}”交替出现。`},
      {period:4,build:i=>token([c1,c1,c2,c3][i%4],s1),hint:'前两个颜色相同，后两个颜色不同，4个一组。',explain:`颜色按照“${c1.name}、${c1.name}、${c2.name}、${c3.name}”循环。`}
    ];
  }
  function hardRules(){
    const [c1,c2,c3]=pickDistinct(COLORS,3),[s1,s2,s3]=pickDistinct(SHAPES,3);
    return[
      {period:6,build:i=>token([c1,c2,c3][i%3],i%2?s2:s1),hint:'颜色3个一轮，形状2个一轮，两条规律同时进行。',explain:`颜色按3个循环，形状按2个交替，两种规律组合后每6项重复。`},
      {period:4,build:i=>token(i%2?c2:c1,i%2?s2:s1,i%4<2?1:.68),hint:'除了颜色和形状，还要观察图案大小。',explain:'颜色与形状交替，同时每两个图案由大变小。'},
      {period:6,build:i=>token(Math.floor(i/2)%3===0?c1:Math.floor(i/2)%3===1?c2:c3,[s1,s2,s3][i%3]),hint:'颜色每2个换一次，形状每1个换一次。',explain:'颜色各连续2项，形状则按3个一组持续循环。'},
      {period:5,build:i=>token([c1,c2,c1,c3,c3][i%5],[s1,s2,s2,s1,s3][i%5]),hint:'把颜色和形状合在一起，尝试圈出5个一组。',explain:'颜色和形状组成一个固定的5项组合，然后从头重复。'}
    ];
  }
  function buildRule(level){return randomItem(level==='easy'?easyRules():level==='medium'?mediumRules():hardRules())}
  function makeChoices(correct,count){
    const candidates=[];
    COLORS.forEach(color=>candidates.push(token(color,correct.shape,correct.scale)));
    SHAPES.forEach(shape=>candidates.push(token(correct.color,shape,correct.scale)));
    [1,.68].forEach(scale=>candidates.push(token(correct.color,correct.shape,scale)));
    const unique=new Map(candidates.map(t=>[tokenKey(t),t]));unique.delete(tokenKey(correct));
    return shuffled([correct,...shuffled([...unique.values()]).slice(0,count-1)]);
  }
  function createQuestion(level){
    const cfg=LEVELS[level],rule=buildRule(level),sequence=Array.from({length:cfg.length},(_,i)=>rule.build(i)),correct=rule.build(cfg.length);
    return{sequence,correct,choices:makeChoices(correct,cfg.choices),hint:rule.hint,explain:rule.explain,period:rule.period};
  }

  function startQuestion(resetChallenge){
    if(resetChallenge&&state.mode==='challenge')state.challengeStep=1;
    state.question=createQuestion(state.level);state.mistakes=0;state.solved=false;render();setMessage('先完整看一遍，再找重复出现的一小组图案。','');say('请观察规律，选择正确的下一项。');
  }
  function shapeHtml(t){return`<span class="shape ${t.shape.value}" style="--color:${t.color.value};--scale:${t.scale}" aria-hidden="true"></span>`}
  function tokenName(t){return`${t.scale<1?'小':'大'}${t.color.name}${t.shape.name}`}
  function render(){
    const q=state.question;el('sequence').innerHTML=q.sequence.map((t,i)=>`<div class="term" data-number="${i+1}">${shapeHtml(t)}</div>`).join('')+`<div class="term question" data-number="${q.sequence.length+1}">?</div>`;
    el('answers').innerHTML='';q.choices.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='answer';b.dataset.key=tokenKey(t);b.setAttribute('aria-label',tokenName(t));b.innerHTML=shapeHtml(t);b.addEventListener('click',()=>choose(t,b));el('answers').appendChild(b)});
    el('levelHint').textContent=state.level==='easy'?'先看颜色或形状怎样重复。':state.level==='medium'?'试着把连续几个图案圈成一组。':'颜色、形状和大小可能同时按不同节奏变化。';
    el('hintBtn').disabled=false;el('newBtn').hidden=false;el('nextBtn').hidden=true;updateStatus();
  }
  function choose(choice,button){
    if(state.solved)return;
    if(tokenKey(choice)===tokenKey(state.question.correct)){
      state.solved=true;state.stats.completed++;state.stats.streak++;state.stats.bestStreak=Math.max(state.stats.bestStreak,state.stats.streak);saveStats();button.classList.add('correct');
      document.querySelectorAll('.answer').forEach(b=>b.disabled=true);el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;
      if(state.mode==='challenge'&&state.challengeStep===5){setMessage(`5关挑战完成！规律是：${state.question.explain}`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('五关挑战全部完成！')}
      else{setMessage(`答对了！规律是：${state.question.explain}`,'ok');el('nextBtn').textContent='下一题 →';say('答对了，你发现规律了！')}
      celebrate();
    }else{
      state.mistakes++;state.stats.streak=0;saveStats();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage('这一项接不上前面的规律，本题不会跳走，再观察一次。','bad');say('再看看前面的规律。');
    }
    updateStatus();
  }
  function showHint(){
    if(state.solved)return;document.querySelectorAll('.term').forEach(t=>t.classList.remove('hint'));
    const terms=[...document.querySelectorAll('.term:not(.question)')],start=Math.max(0,terms.length-state.question.period);terms.slice(start).forEach(t=>t.classList.add('hint'));setMessage(`提示：${state.question.hint}`,'');say(state.question.hint);
  }
  function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startQuestion(true);return}state.challengeStep++}startQuestion(false)}
  function updateStatus(){el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('mistakeText').textContent=`${state.mistakes} 次`;el('completeText').textContent=`${state.stats.completed} 题`;el('streakText').textContent=`${state.stats.streak} 题`}
  function setMessage(text,type){const m=el('message');m.textContent=text;m.className='message'+(type?' '+type:'')}
  function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(b=>b.classList.toggle('on',b.dataset[key]===value))}
  el('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startQuestion(true)});el('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startQuestion(true)});el('hintBtn').addEventListener('click',showHint);el('newBtn').addEventListener('click',()=>startQuestion(false));el('nextBtn').addEventListener('click',next);
  function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<30;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top='-15px';d.style.background=randomItem(COLORS).value;d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}}
  window.PatternSequence={LEVELS,COLORS,SHAPES,tokenKey,createQuestion};startQuestion(false);
})();
</script>
