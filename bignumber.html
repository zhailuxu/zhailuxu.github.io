<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大数的认识</title>
<link rel="stylesheet" href="hpx-common.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Comic Sans MS","华文圆体","微软雅黑",sans-serif;background:linear-gradient(135deg,#eceff1 0%,#e8eaf6 50%,#fff3e0 100%);min-height:100vh;padding:16px 12px;}
.container{max-width:760px;margin:0 auto;}
.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2rem;color:#263238;letter-spacing:3px;text-shadow:2px 3px 0 #b0bec5;}
.header p{font-size:.85rem;color:#999;margin-top:4px;}
.tab-btn{padding:8px 22px;font-size:.95rem;}
.card{background:rgba(255,255,255,.92);border-radius:20px;padding:22px 18px;box-shadow:0 4px 20px rgba(0,0,0,.1);margin-bottom:14px;overflow-x:auto;}
.preset-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.preset-btn{padding:7px 14px;border:2px solid #b0bec5;border-radius:14px;background:#fff;color:#37474f;font-size:.82rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .15s;}
.preset-btn.on{background:#37474f;color:#fff;border-color:#37474f;}
.num-input-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.num-input{font-size:1.2rem;width:220px;border:2px solid #b0bec5;border-radius:10px;padding:8px 12px;text-align:center;outline:none;font-family:inherit;}
.num-input:focus{border-color:#37474f;}
/* place value chart */
.pv-wrap{display:flex;justify-content:center;overflow-x:auto;padding:6px 0 14px;}
.pv-table{border-collapse:collapse;font-size:.78rem;}
.pv-table th,.pv-table td{padding:4px 2px;text-align:center;min-width:34px;}
.pv-lvl{font-weight:bold;font-size:.8rem;color:#fff;border-radius:6px 6px 0 0;}
.pv-lvl.yi{background:#e65100;}
.pv-lvl.wan{background:#1565c0;}
.pv-lvl.ge{background:#2e7d32;}
.pv-unit{color:#888;font-size:.72rem;}
.pv-digit{font-size:1.3rem;font-weight:bold;border-radius:8px;padding:6px 0;background:#f5f5f5;color:#ccc;}
.pv-digit.yi{color:#e65100;background:#fff3e0;}
.pv-digit.wan{color:#1565c0;background:#e3f2fd;}
.pv-digit.ge{color:#2e7d32;background:#e8f5e9;}
.reading-box{background:#fffde7;border-radius:12px;padding:14px 18px;text-align:center;font-size:1.3rem;color:#5d4037;font-weight:bold;margin-top:6px;}
.speak-btn{margin-top:10px;padding:7px 20px;border:none;border-radius:14px;background:#37474f;color:#fff;font-size:.9rem;font-weight:bold;cursor:pointer;font-family:inherit;display:block;margin-left:auto;margin-right:auto;}
/* quiz */
.quiz-box{text-align:center;}
.score-row{display:flex;gap:16px;justify-content:center;margin-bottom:12px;}
.score-item{background:#eceff1;border-radius:10px;padding:6px 18px;font-size:.9rem;font-weight:bold;color:#37474f;}
.quiz-mode-tag{display:inline-block;padding:4px 14px;border-radius:14px;font-size:.82rem;font-weight:bold;color:#fff;background:#78909c;margin-bottom:10px;}
.quiz-q{font-size:1.25rem;color:#333;margin-bottom:14px;line-height:1.8;font-weight:bold;}
.quiz-input{font-size:1.2rem;width:220px;border:2px solid #b0bec5;border-radius:10px;padding:6px 10px;text-align:center;outline:none;font-family:inherit;}
.quiz-input:focus{border-color:#37474f;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto;}
.choice-btn{padding:12px 10px;border:2px solid #cfd8dc;border-radius:12px;background:#fff;color:#37474f;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .15s;}
.choice-btn:hover{background:#eceff1;}
.choice-btn.correct{background:#c8e6c9;border-color:#2e7d32;}
.choice-btn.wrong{background:#ffcdd2;border-color:#c62828;}
.check-btn{margin-left:10px;padding:8px 22px;border:none;border-radius:10px;background:#37474f;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;}
.result-msg{font-size:1.05rem;font-weight:bold;min-height:26px;margin-top:12px;}
.result-msg.ok{color:#2e7d32;}
.result-msg.no{color:#c62828;}
.next-btn{margin-top:12px;padding:10px 32px;border:none;border-radius:20px;background:#37474f;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;}
</style>
</head>
<body data-hpx-page style="--hpx-accent:#37474f">
<div class="container">
  <div class="header">
    <div style="font-size:2.4rem;">🔢</div>
    <h1>大数的认识</h1>
    <p>数位、数级，读一读、写一写大数字</p>
  </div>
  <div class="speak-bar"><button class="speak-toggle on" id="speakToggle" onclick="toggleSpeak()">🔊 声音解说 开</button></div>
  <div class="tabs">
    <button class="tab-btn on" onclick="switchTab('learn')">📖 认识数位</button>
    <button class="tab-btn" onclick="switchTab('quiz')">✏️ 读写练习</button>
  </div>

  <!-- 认识数位 -->
  <div id="tab-learn">
    <div class="card">
      <div class="preset-row" id="presetRow"></div>
      <div class="num-input-row">
        <input type="text" id="customInput" class="num-input" placeholder="输入一个数字，如 305000000" inputmode="numeric">
        <button class="speak-btn" style="margin:0;" onclick="applyCustom()">显示</button>
      </div>
      <div class="pv-wrap"><table class="pv-table" id="pvTable"></table></div>
      <div class="reading-box" id="readingBox"></div>
      <button class="speak-btn" onclick="speakReading()">🔊 读一读</button>
    </div>
    <div class="card" style="font-size:.88rem;color:#666;line-height:1.9;">
      <div>📌 每 <b>4</b> 个数位分成一级：<span style="color:#2e7d32">个级</span>（个十百千）→ <span style="color:#1565c0">万级</span>（万十万百万千万）→ <span style="color:#e65100">亿级</span>（亿十亿百亿千亿）</div>
      <div>📌 读数从最高位读起，每级末尾按级加读"万"或"亿"，中间有 0 只读一个"零"，末尾的 0 不读</div>
    </div>
  </div>

  <!-- 读写练习 -->
  <div id="tab-quiz" style="display:none;">
    <div class="card quiz-box">
      <div class="score-row">
        <div class="score-item">✅ <span id="qC">0</span></div>
        <div class="score-item">❌ <span id="qW">0</span></div>
      </div>
      <div class="quiz-mode-tag" id="modeTag"></div>
      <div id="quizArea"></div>
      <div class="result-msg" id="quizMsg"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()" style="display:none;">下一题 →</button>
    </div>
  </div>

  <a href="index.html" class="back-link">← 返回慧陪学</a>
</div>
<script src="hpx-core.js"></script>
<script>
Hpx.speech.install({rate:0.85});

// ── 中文数字转换核心算法 ──
const CN_NUM=['零','一','二','三','四','五','六','七','八','九'];
const CN_UNIT_SMALL=['','十','百','千'];
const CN_UNIT_BIG=['','万','亿','兆'];

function convertGroup(g){
  let s='', pendingZero=false;
  for(let i=0;i<4;i++){
    const d=+g[i];
    const unit=CN_UNIT_SMALL[3-i];
    if(d===0){ if(s!=='') pendingZero=true; }
    else{ if(pendingZero){s+='零';pendingZero=false;} s+=CN_NUM[d]+unit; }
  }
  return s;
}
function numberToChinese(numStr){
  numStr=String(numStr).replace(/^0+/,'')||'0';
  if(numStr==='0') return '零';
  const pad=(4-numStr.length%4)%4;
  const padded='0'.repeat(pad)+numStr;
  const groups=[];
  for(let i=0;i<padded.length;i+=4) groups.push(padded.slice(i,i+4));
  const n=groups.length;
  let parts=[], anyWritten=false, prevGroupWasZero=true;
  for(let gi=0; gi<n; gi++){
    const g=groups[gi], bigIdx=n-1-gi, isAllZero=(g==='0000');
    if(isAllZero){ prevGroupWasZero=true; continue; }
    if(anyWritten && (g[0]==='0' || prevGroupWasZero)) parts.push('零');
    parts.push(convertGroup(g)+(bigIdx>0?CN_UNIT_BIG[bigIdx]:''));
    anyWritten=true; prevGroupWasZero=false;
  }
  let result=parts.join('').replace(/零+/g,'零').replace(/零$/,'');
  if(result.startsWith('一十')) result=result.slice(1);
  return result||'零';
}

// ── 数位表 ──
const PV_COLS=[
  {u:'千亿',lvl:'yi'},{u:'百亿',lvl:'yi'},{u:'十亿',lvl:'yi'},{u:'亿',lvl:'yi'},
  {u:'千万',lvl:'wan'},{u:'百万',lvl:'wan'},{u:'十万',lvl:'wan'},{u:'万',lvl:'wan'},
  {u:'千',lvl:'ge'},{u:'百',lvl:'ge'},{u:'十',lvl:'ge'},{u:'个',lvl:'ge'}
];
function renderPV(numStr){
  numStr=String(numStr).replace(/^0+/,'')||'0';
  const digits=numStr.split('').map(Number);
  const padded=new Array(PV_COLS.length-digits.length).fill(null).concat(digits);
  const table=document.getElementById('pvTable');
  let lvlRow='<tr>', unitRow='<tr>', digitRow='<tr>';
  let i=0;
  while(i<PV_COLS.length){
    const lvl=PV_COLS[i].lvl;
    let span=0; while(i+span<PV_COLS.length && PV_COLS[i+span].lvl===lvl) span++;
    const label=lvl==='yi'?'亿级':lvl==='wan'?'万级':'个级';
    lvlRow+=`<th class="pv-lvl ${lvl}" colspan="${span}">${label}</th>`;
    i+=span;
  }
  PV_COLS.forEach(c=>{unitRow+=`<td class="pv-unit">${c.u}</td>`;});
  padded.forEach((d,idx)=>{
    const lvl=PV_COLS[idx].lvl;
    digitRow+=`<td class="pv-digit ${d===null?'':lvl}">${d===null?'':d}</td>`;
  });
  lvlRow+='</tr>'; unitRow+='</tr>'; digitRow+='</tr>';
  table.innerHTML=lvlRow+unitRow+digitRow;
}

let curReading='';
function showNumber(numStr){
  numStr=String(numStr).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
  if(numStr==='') numStr='0';
  renderPV(numStr);
  curReading=numberToChinese(numStr);
  document.getElementById('readingBox').textContent='读作：'+curReading;
}
function speakReading(){speak('读作：'+curReading);}

const PRESETS=[100000,1200000,30000000,305000000,1000000000,12300000000];
let curPresetIdx=0;
function buildPresets(){
  const row=document.getElementById('presetRow');
  row.innerHTML='';
  PRESETS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='preset-btn'+(i===curPresetIdx?' on':'');
    b.textContent=p.toLocaleString('en-US');
    b.onclick=()=>{curPresetIdx=i;buildPresets();document.getElementById('customInput').value='';showNumber(p);speak('这个数读作：'+numberToChinese(String(p)));};
    row.appendChild(b);
  });
}
function applyCustom(){
  const v=document.getElementById('customInput').value.trim();
  if(!v) return;
  curPresetIdx=-1; buildPresets();
  showNumber(v);
  speak('这个数读作：'+curReading);
}

// ── 读写练习 ──
let qScore={c:0,w:0}, qMode='read', qTarget=0, qChoices=[], qDone=false;
const randInt=Hpx.random.int;
function randomBigNumber(){
  const patterns=[
    ()=>randInt(2,99)*10000, // 几十万/几万
    ()=>randInt(2,99)*1000000, // 几百万/几千万
    ()=>randInt(2,20)*100000000, // 几亿/十几亿
    ()=>randInt(1,9)*100000000+randInt(1,99)*10000, // 几亿零几十万
    ()=>randInt(1,9)*10000000+randInt(1,999)*10000, // 复合数
    ()=>randInt(100,999)*100000
  ];
  return patterns[randInt(0,patterns.length-1)]();
}
function perturb(numStr){
  for(let tries=0;tries<20;tries++){
    const arr=numStr.split('');
    const idx=randInt(0, arr.length-1);
    let d=randInt(0,9);
    arr[idx]=String(d);
    let cand=arr.join('').replace(/^0+(?=\d)/,'');
    if(cand!==numStr && cand!=='0') return cand;
  }
  return String(Number(numStr)+randInt(1,9)*Math.pow(10,randInt(1,3)));
}
function nextQ(){
  qDone=false;
  document.getElementById('quizMsg').textContent='';
  document.getElementById('nextBtn').style.display='none';
  qMode = Math.random()<0.5 ? 'read' : 'write';
  qTarget = randomBigNumber();
  const targetStr=String(qTarget);
  const correctReading=numberToChinese(targetStr);
  const modeTag=document.getElementById('modeTag');
  const area=document.getElementById('quizArea');
  if(qMode==='read'){
    modeTag.textContent='📖 读数：选出正确的读法'; modeTag.style.background='#1565c0';
    const set=new Set([correctReading]);
    let guard=0;
    while(set.size<4 && guard<40){
      guard++;
      const cand=perturb(targetStr);
      const r=numberToChinese(cand);
      if(!set.has(r)) set.add(r);
    }
    qChoices=Array.from(set);
    for(let i=qChoices.length-1;i>0;i--){const j=randInt(0,i);[qChoices[i],qChoices[j]]=[qChoices[j],qChoices[i]];}
    area.innerHTML=`<div class="quiz-q">${targetStr.replace(/\B(?=(\d{4})+(?!\d))/g,',')}</div><div class="choice-grid" id="choiceGrid"></div>`;
    const grid=document.getElementById('choiceGrid');
    qChoices.forEach(c=>{
      const b=document.createElement('button');
      b.className='choice-btn'; b.textContent=c;
      b.onclick=()=>checkChoice(b,c===correctReading,correctReading);
      grid.appendChild(b);
    });
    speak('这个数应该怎么读？请选出正确答案。');
  } else {
    modeTag.textContent='✏️ 写数：根据读法写出数字'; modeTag.style.background='#e65100';
    area.innerHTML=`<div class="quiz-q">${correctReading}</div>
      <div><input type="text" id="quizInput" class="quiz-input" placeholder="请输入数字" inputmode="numeric"></div>`;
    const wInp=document.getElementById('quizInput');
    wInp.addEventListener('keydown',e=>{if(e.key==='Enter')checkWrite();});
    wInp.addEventListener('input',()=>{
      const v=wInp.value.replace(/[^0-9]/g,'');
      if(v.length>0 && v.length>=String(qTarget).length) checkWrite();
    });
    wInp.addEventListener('blur',()=>{ if(wInp.value.replace(/[^0-9]/g,'').length>0) checkWrite(); });
    speak('请写出这个数：'+correctReading);
  }
}
function checkChoice(btn,isCorrect,correctReading){
  if(qDone) return;
  qDone=true;
  document.querySelectorAll('#choiceGrid .choice-btn').forEach(b=>{b.disabled=true; if(b.textContent===correctReading) b.classList.add('correct');});
  if(isCorrect){
    qScore.c++;document.getElementById('qC').textContent=qScore.c;
    document.getElementById('quizMsg').className='result-msg ok';
    document.getElementById('quizMsg').textContent='✅ 正确！';
    speak('正确！真棒！');
    setTimeout(nextQ,1200);
  } else {
    btn.classList.add('wrong');
    qScore.w++;document.getElementById('qW').textContent=qScore.w;
    document.getElementById('quizMsg').className='result-msg no';
    document.getElementById('quizMsg').textContent='❌ 正确答案是：'+correctReading;
    speak('答案是'+correctReading+'，再想想！');
    document.getElementById('nextBtn').style.display='inline-block';
  }
}
function checkWrite(){
  if(qDone) return;
  const input=document.getElementById('quizInput');
  const v=input.value.replace(/[^0-9]/g,'');
  if(!v) return;
  qDone=true;
  input.disabled=true;
  if(Number(v)===qTarget){
    qScore.c++;document.getElementById('qC').textContent=qScore.c;
    document.getElementById('quizMsg').className='result-msg ok';
    document.getElementById('quizMsg').textContent='✅ 正确！';
    speak('正确！真棒！');
    setTimeout(nextQ,1200);
  } else {
    qScore.w++;document.getElementById('qW').textContent=qScore.w;
    document.getElementById('quizMsg').className='result-msg no';
    document.getElementById('quizMsg').textContent='❌ 正确答案是：'+qTarget.toLocaleString('en-US');
    speak('答案是'+numberToChinese(String(qTarget))+'，再想想！');
    document.getElementById('nextBtn').style.display='inline-block';
  }
}

function switchTab(t){
  Hpx.tabs.activate(t, ['learn','quiz']);
  if(t==='learn') speak('认识数位：每四个数位分成一级，试试输入不同的大数字吧。');
  if(t==='quiz') nextQ();
}
buildPresets();
showNumber(PRESETS[0]);
speak('欢迎来到大数的认识！看看数字是怎么分级和读出来的。');
</script>

<script src="feedback.js?v=20260906-2"></script>
<script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
