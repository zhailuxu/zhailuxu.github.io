<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>指令挑战｜慧陪学</title>
  <meta name="description" content="听清或读懂多步骤指令，按顺序点击颜色、形状和数字，练习工作记忆与执行力。">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#445148;--accent:#6b566e}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e4f1dd,#d7ead3 55%,#e8f1df)}button{font:inherit}.container{max-width:930px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#654f69;text-shadow:2px 3px #ddd1df}.header p{margin-top:6px;color:#708071;font-size:.92rem;line-height:1.6}.card{background:rgba(239,247,234,.94);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.8rem;font-weight:700;color:#71806f}.chip,.action{border:2px solid #cbd8c7;background:#fbfdf9;color:#5d625d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background}.chip:hover,.action:hover,.item:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(107,86,110,.2)}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.04rem;color:#654f69;margin-top:2px}.command-box{max-width:720px;margin:0 auto 15px;padding:14px;border-radius:17px;background:#e4e3d4;text-align:center}.command-title{font-size:.78rem;color:#747669;margin-bottom:7px}.command{font-weight:800;color:#5e4b61;line-height:1.8;font-size:clamp(.95rem,2.5vw,1.12rem)}.command.hidden-command{filter:blur(7px);user-select:none}.step{display:inline-block;padding:3px 7px;border-radius:8px}.step.current{background:#fff;color:#744a7b;box-shadow:0 1px 5px rgba(76,54,81,.15)}.step.done{color:#367644;text-decoration:line-through}.board{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:10px;max-width:650px;margin:auto}.item{min-height:108px;border:2px solid #c9d7c5;border-radius:17px;background:#f9fcf6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#536154;box-shadow:0 3px 8px rgba(58,79,59,.1);transition:.15s transform,.15s background}.item.done{background:#d9ebd7;border-color:#72a275}.item.wrong{animation:shake .34s ease;border-color:#d04e44;box-shadow:inset 0 0 0 2px #d04e44}.item.hint{animation:pulse .7s ease 2;background:#f3e4b6;border-color:#c89a35}.shape{width:42px;height:42px;background:var(--color);filter:saturate(.82)}.shape.circle{border-radius:50%}.shape.square{border-radius:7px}.shape.diamond{transform:rotate(45deg) scale(.78);border-radius:5px}.shape.triangle{width:0;height:0;background:transparent;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:43px solid var(--color);filter:saturate(.82)}.item-label{font-size:.8rem;font-weight:700;color:#667166}.number{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 6px;border-radius:8px;background:#e1eadc;color:#594f5c;font-weight:900}.progress{max-width:650px;margin:14px auto 4px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#8a718e,#5f7f65);transition:width .2s}.progress-text{text-align:center;font-size:.79rem;color:#71806f}.actions{margin-top:13px}.action{border:0;padding:9px 16px;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#806583,#654f69);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.45;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:50px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#654f69;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(.88)}}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
    @media(max-width:560px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.board{gap:7px}.item{min-height:94px}.shape{width:35px;height:35px}.shape.triangle{border-left-width:20px;border-right-width:20px;border-bottom-width:36px}.item-label{font-size:.72rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
<link rel="stylesheet" href="hpx-game-mobile.css">
</head>
<body>
<main class="container">
  <header class="header"><h1>🧭 指令挑战</h1><p>听清顺序再行动：先做什么、接着做什么、最后做什么。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 2步</button><button class="chip" data-level="medium">中年级 3步</button><button class="chip" data-level="hard">高年级 4步</button></div>
      <button class="chip" id="memoryToggle">🧠 记忆模式 关</button><button class="chip" id="speakToggle">🔊 声音解说 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">当前步骤<b id="stepText">1 / 2</b></div><div class="stat">本题误点<b id="mistakeText">0 次</b></div><div class="stat">连续完成<b id="streakText">0 题</b></div></div>
  </section>
  <section class="card">
    <div class="command-box"><div class="command-title">请严格按照下面的顺序完成</div><div class="command" id="command" aria-live="polite"></div></div>
    <div class="board" id="board" role="grid" aria-label="指令挑战选项"></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">等待点击第1步</p>
    <div class="actions"><button class="action secondary" id="readBtn">🔊 再读一遍</button><button class="action secondary" id="hintBtn">💡 提示当前步骤</button><button class="action muted" id="newBtn">↻ 换一道题</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">先完整读一遍指令，再开始点击。</div>
  </section>
  <section class="card help"><h2>怎么玩</h2><ol><li>先读完或听完全部指令，记住“先、接着、然后、最后”的顺序。</li><li>每个图形都有颜色、形状和数字，请根据指令找到唯一目标。</li><li>点错不会跳到下一步；记忆模式会隐藏指令，需要时可以再读一遍。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-15：本站独立设计；指令、图形组合和关卡顺序均由浏览器内代码生成。
(function(){'use strict';
const LEVELS={easy:{count:6,steps:2},medium:{count:9,steps:3},hard:{count:12,steps:4}};
const COLORS=[{key:'red',name:'红色',hex:'#d96a66'},{key:'blue',name:'蓝色',hex:'#5d8fc4'},{key:'yellow',name:'黄色',hex:'#dda83d'},{key:'green',name:'绿色',hex:'#65a36c'},{key:'purple',name:'紫色',hex:'#9273aa'},{key:'orange',name:'橙色',hex:'#d9874d'}];
const SHAPES=[{key:'circle',name:'圆形'},{key:'square',name:'方形'},{key:'triangle',name:'三角形'},{key:'diamond',name:'菱形'}];
const STORE_KEY='hpxInstructionChallengeV1';
const state={mode:'practice',level:'easy',memory:false,game:null,current:0,mistakes:0,challengeStep:1,streak:loadStreak(),phase:'playing'};
const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.88,pitch:1.06}):null;
function loadStreak(){try{return Number(localStorage.getItem(STORE_KEY)||0)}catch(e){return 0}}
function saveStreak(){try{localStorage.setItem(STORE_KEY,String(state.streak))}catch(e){}}
function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function makeCards(count){return shuffled(Array.from({length:count},(_,i)=>{const color=COLORS[i%COLORS.length],shape=SHAPES[(i*3+Math.floor(i/COLORS.length))%SHAPES.length];return{id:`card-${i+1}`,number:i+1,colorKey:color.key,colorName:color.name,colorHex:color.hex,shapeKey:shape.key,shapeName:shape.name}}))}
function matchesFields(card,fields,target){return fields.every(field=>card[field]===target[field])}
function buildStep(target,cards,preferred){let fields=preferred==='number'?['number']:preferred==='shape'?['shapeKey']:preferred==='color'?['colorKey']:['colorKey','shapeKey'];if(cards.filter(card=>matchesFields(card,fields,target)).length!==1){fields=preferred==='shape'?['shapeKey','colorKey']:['colorKey','shapeKey'];if(cards.filter(card=>matchesFields(card,fields,target)).length!==1)fields=['colorKey','shapeKey','number']}let text='点';if(fields.includes('colorKey'))text+=target.colorName;if(fields.includes('shapeKey'))text+=target.shapeName;if(fields.includes('number'))text+=(fields.length>1?'、':'')+`数字${target.number}`;return{targetId:target.id,fields,text}}
function createGame(level){const cfg=LEVELS[level],cards=makeCards(cfg.count),targets=shuffled(cards).slice(0,cfg.steps),preferences=['color','shape','number','combo'];const steps=targets.map((target,index)=>buildStep(target,cards,preferences[index]));return{cards,steps}}
function evaluateStep(step,cardId,current){return cardId===step.targetId?{correct:true,next:current+1}:{correct:false,next:current}}
function commandText(steps){const joins=['先','接着','然后','最后'];return steps.map((step,index)=>`${joins[index]}${step.text}`).join('，')+'。'}
function say(text){if(speech)speech.speak(text)}
function startGame(resetChallenge){if(resetChallenge&&state.mode==='challenge')state.challengeStep=1;state.game=createGame(state.level);state.current=0;state.mistakes=0;state.phase='playing';renderBoard();renderCommand();updateStatus();el('nextBtn').hidden=true;el('newBtn').hidden=false;el('hintBtn').disabled=false;setMessage('先完整读一遍指令，再开始点击。','');say(commandText(state.game.steps))}
function renderBoard(){const board=el('board');board.innerHTML='';state.game.cards.forEach(card=>{const button=document.createElement('button');button.type='button';button.className='item';button.dataset.id=card.id;button.setAttribute('role','gridcell');button.setAttribute('aria-label',`${card.colorName}${card.shapeName}，数字${card.number}`);button.innerHTML=`<span class="shape ${card.shapeKey}" style="--color:${card.colorHex}"></span><span class="item-label">${card.colorName}${card.shapeName}</span><span class="number">${card.number}</span>`;button.addEventListener('click',()=>pick(card.id,button));board.appendChild(button)})}
function renderCommand(){const box=el('command');box.innerHTML='';state.game.steps.forEach((step,index)=>{const span=document.createElement('span');span.className='step'+(index===state.current?' current':index<state.current?' done':'');span.textContent=(index?['','接着','然后','最后'][index]:'先')+step.text+(index===state.game.steps.length-1?'。':'，');box.appendChild(span)});box.classList.toggle('hidden-command',state.memory&&state.phase==='playing')}
function pick(cardId,button){if(state.phase!=='playing')return;const result=evaluateStep(state.game.steps[state.current],cardId,state.current);if(result.correct){button.classList.add('done');button.disabled=true;state.current=result.next;if(state.current===state.game.steps.length)finish();else{renderCommand();updateStatus();setMessage('这一步正确，继续按原来的顺序完成。','ok')}}else{state.mistakes++;state.streak=0;saveStreak();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage(`顺序不能乱，现在应该${state.game.steps[state.current].text}。`,'bad');say(`现在应该${state.game.steps[state.current].text}。`);updateStatus()}}
function finish(){state.phase='done';state.streak++;saveStreak();renderCommand();el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){setMessage(`5关挑战全部完成！这一题误点${state.mistakes}次。`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('五关挑战全部完成！')}else{setMessage(`全部指令执行正确！本题误点${state.mistakes}次。`,'ok');el('nextBtn').textContent='下一题 →';say('全部指令执行正确！')}updateStatus();celebrate()}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}
function hint(){if(state.phase!=='playing')return;const step=state.game.steps[state.current],button=el('board').querySelector(`[data-id="${step.targetId}"]`);button.classList.add('hint');setTimeout(()=>button.classList.remove('hint'),1300);setMessage(`当前步骤：${step.text}。`,'');say(step.text)}
function updateStatus(){const total=state.game.steps.length;el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('stepText').textContent=state.phase==='done'?`${total} / ${total}`:`${state.current+1} / ${total}`;el('mistakeText').textContent=`${state.mistakes} 次`;el('streakText').textContent=`${state.streak} 题`;el('progressFill').style.width=`${state.current/total*100}%`;el('progressText').textContent=state.phase==='done'?`已完成 ${total} / ${total}`:`等待点击第${state.current+1}步`}
function setMessage(text,type){const message=el('message');message.textContent=text;message.className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(button=>button.classList.toggle('on',button.dataset[key]===value))}
el('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});
el('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startGame(true)});
el('memoryToggle').addEventListener('click',()=>{state.memory=!state.memory;el('memoryToggle').textContent=state.memory?'🧠 记忆模式 开':'🧠 记忆模式 关';el('memoryToggle').classList.toggle('on',state.memory);renderCommand()});
el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());el('readBtn').addEventListener('click',()=>say(commandText(state.game.steps)));el('hintBtn').addEventListener('click',hint);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<28;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=colors[Math.floor(Math.random()*colors.length)];dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}}
window.InstructionChallenge={LEVELS,makeCards,buildStep,createGame,matchesFields,evaluateStep,commandText};startGame(false)})();
</script>
<script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
