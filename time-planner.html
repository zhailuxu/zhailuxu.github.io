  <style>

lock;margin-top:2px;color:#5e574e;font-size:1rem}.mission{padding:10px 13px;border-radius:14px;background:#eee7d4;color:#675f51;text-align:center;font-size:.84rem;line-height:1.65}.station{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(360px,1.28fr);gap:14px;margin-top:14px}.scene,.schedule{min-width:0;padding:13px;border-radius:18px;background:#edf2e9}.scene h2,.schedule h2{margin-bottom:9px;text-align:center;color:#5d695f;font-size:.92rem}.task-card{display:grid;min-height:185px;place-items:center;padding:14px;border-radius:17px;background:#fafcf7;text-align:center}.task-icon{display:block;font-size:3rem}.task-name{display:block;margin-top:8px;color:#5a625d;font-size:1.15rem;font-weight:900}.task-detail{display:block;margin-top:5px;color:#778178;font-size:.8rem;line-height:1.55}.clock-face{position:relative;width:142px;height:142px;margin:auto;border:7px solid #7d897f;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(48,65,52,.13)}.clock-face::before{content:"12";position:absolute;left:50%;top:6px;transform:translateX(-50%);color:#7c867f;font-size:.72rem}.clock-face::after{content:"6";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);color:#7c867f;font-size:.72rem}.hand{position:absolute;left:50%;bottom:50%;width:4px;border-radius:4px;background:#566a60;transform-origin:50% 100%}.hour-hand{height:37px;transform:translateX(-50%) rotate(var(--hour-angle))}.minute-hand{height:50px;width:3px;background:#b06e5f;transform:translateX(-50%) rotate(var(--minute-angle))}.clock-dot{position:absolute;z-index:2;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#5b6e64;transform:translate(-50%,-50%)}.digital{margin-top:9px;color:#5e695f;font-size:1.25rem;font-weight:950}.duration-row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.duration-card{min-width:135px;padding:13px;border-radius:15px;background:#fafcf7;text-align:center}.duration-card span{display:block;color:#768078;font-size:.75rem}.duration-card b{display:block;margin-top:5px;color:#5a665f;font-size:1.15rem}.arrow{font-size:1.5rem;color:#829087;font-weight:900}.timeline-wrap{overflow-x:auto;padding-bottom:5px}.timeline{position:relative;min-width:570px;height:185px;margin:4px 6px 0}.axis{position:absolute;left:0;right:0;top:121px;height:4px;border-radius:4px;background:#aebbae}.tick{position:absolute;top:113px;width:2px;height:18px;background:#8e9e90}.tick-label{position:absolute;top:138px;transform:translateX(-50%);color:#748078;font-size:.67rem}.event{position:absolute;top:39px;height:66px;padding:8px 5px;border-radius:12px;background:#d7e6d4;color:#4c6650;text-align:center;overflow:hidden;box-shadow:0 3px 8px rgba(52,69,55,.11)}.event:nth-of-type(even){background:#e8dfca;color:#6d5c3e}.event b{display:block;font-size:.78rem}.event span{display:block;margin-top:4px;font-size:.65rem}.new-task{padding:9px;border:2px dashed #9baa9d;border-radius:13px;background:#f8faf5;color:#667269;text-align:center;font-size:.8rem;line-height:1.55}.question{margin:13px 0 10px;padding:11px;border-radius:14px;background:#e7ede1;color:#59665d;text-align:center;font-weight:850;line-height:1.65}.message{min-height:53px;margin-top:13px;padding:11px;border-radius:14px;background:#e1eadf;color:#5e6c62;text-align:center;line-height:1.6}.message.ok{background:#dcefdc;color:#26723a;font-weight:800}.message.bad{background:#f4e1dc;color:#a23d35;font-weight:800}.message.hint{background:#eee5c9;color:#735d25;font-weight:800}.explanation{display:none;margin-top:11px;padding:12px;border-radius:14px;background:#e9eddd;color:#596655;line-height:1.75}.explanation.show{display:block}.help summary{cursor:pointer;color:#596650;font-weight:900}.help ol{padding:9px 0 0 22px;color:#657068;font-size:.85rem;line-height:1.85}.back{display:block;margin-top:15px;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@media(max-width:720px){.station{grid-template-columns:1fr}.task-card{min-height:155px}.toolbar{overflow:visible}.toolbar .group{width:100%;min-width:0}.toolbar .group-label{flex:0 0 100%;text-align:center}.toolbar .chip{padding:7px 9px;font-size:.82rem}.toolbar #levelGroup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar #levelGroup .group-label{grid-column:1/-1}.toolbar #levelGroup .chip{width:100%;min-width:0;white-space:normal}.status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.header p{font-size:.8rem}.scene,.schedule{padding:9px}.option{min-width:92px;flex:1}.timeline{min-width:520px}.actions{position:static}}@media(max-width:480px){.card{padding:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
  </style>

<body data-sound-standard="speech">
<main class="container">
  <header class="header"><h1>🗓️ 时间规划站</h1><p>不只会看钟，还要把事情安排得下、接得上、不冲突。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">简单 合适时刻</button><button class="chip" data-level="medium">中等 经过时间</button><button class="chip" data-level="hard">困难 避开冲突</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">完成规划<b id="solvedText">0 次</b></div><div class="stat">本题类型<b id="typeText">合适时刻</b></div><div class="stat">连续正确<b id="streakText">0 关</b></div></div>
  </section>
  <section class="card">
    <div class="mission" id="mission"></div>
    <div class="station"><section class="scene"><h2 id="sceneTitle">待安排任务</h2><div id="scene"></div></section><section class="schedule"><h2 id="scheduleTitle">时间信息</h2><div id="scheduleView"></div></section></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="message" id="message" role="status" aria-live="polite">读懂任务和时间信息，再选择安排。</div>
    <div class="explanation" id="explanation"></div>
    <div class="actions" style="margin-top:12px"><button class="action secondary" id="hintBtn">给我一点提示</button><button class="action primary" id="checkBtn" disabled>检查安排</button><button class="action primary" id="nextBtn" hidden>下一个任务 →</button><button class="action muted" id="newBtn">换一个任务</button></div>
  </section>
  <details class="card help" open><summary>怎么玩？</summary><ol><li>简单：想一想生活任务通常适合安排在上午、中午还是晚上。</li><li>中等：把“开始时刻 + 持续时间”换算成结束时刻，下一项任务不能提前开始。</li><li>困难：查看已有日程占用的时间段，为新任务寻找完整、连续且不重叠的空档。</li><li>答错不会自动换题；可以查看解释、重新选择，确认理解后再进入下一题。</li></ol></details>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-17：本站独立设计；任务情境、时间参数、日程冲突、时间轴和反馈文案均由本地代码生成。
(function(){'use strict';
const CONFIG={easy:{type:'suitable'},medium:{type:'elapsed'},hard:{type:'conflict'}},LIFE_TASKS=[{name:'吃早餐',icon:'🥣',good:[420,480],bad:[750,1290]},{name:'午间休息',icon:'🌤️',good:[750,810],bad:[450,1260]},{name:'放学后运动',icon:'🏃',good:[990,1080],bad:[450,1290]},{name:'睡前阅读',icon:'📖',good:[1200,1260],bad:[450,780]},{name:'整理书包',icon:'🎒',good:[1170,1230],bad:[450,780]}],SCHEDULE_TASKS=[['阅读','📘'],['画画','🎨'],['运动','🏃'],['整理','🧺'],['练琴','🎹'],['搭积木','🧱']],STORE='hpxTimePlannerV1';
function randomInt(min,max,rng=Math.random){return min+Math.floor(rng()*(max-min+1))}function shuffled(list,rng=Math.random){const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}function formatTime(total){total=((total%1440)+1440)%1440;return`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}function overlap(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}function isValidStart(start,duration,events,windowStart=0,windowEnd=1440){return start>=windowStart&&start+duration<=windowEnd&&!events.some(event=>overlap(start,start+duration,event.start,event.end))}
function uniqueOptions(correct,wrong,rng=Math.random){const values=[correct,...wrong.filter(v=>v!==correct)];return shuffled([...new Set(values)].slice(0,3),rng)}
function generateProblem(level,rng=Math.random){if(level==='easy'){const task=LIFE_TASKS[randomInt(0,LIFE_TASKS.length-1,rng)],correct=randomInt(task.good[0]/30,task.good[1]/30,rng)*30,wrong=task.bad.map(v=>v+randomInt(0,1,rng)*30);return{level,type:'suitable',task:{name:task.name,icon:task.icon},correct,options:uniqueOptions(correct,wrong,rng),question:`“${task.name}”安排在什么时刻更合适？`,explanation:`${formatTime(correct)}处在适合“${task.name}”的生活时段。时间安排也要结合家庭实际，这里练习的是常见作息判断。`}}if(level==='medium'){const task=shuffled(SCHEDULE_TASKS,rng)[0],start=randomInt(32,67,rng)*15,duration=[30,45,60,75,90][randomInt(0,4,rng)],correct=start+duration,wrong=[correct-15,correct+15,correct-30,correct+30];return{level,type:'elapsed',task:{name:task[0],icon:task[1]},start,duration,correct,options:uniqueOptions(correct,shuffled(wrong,rng),rng),question:`${formatTime(start)}开始“${task[0]}”，持续${duration}分钟，最早几点可以开始下一项任务？`,explanation:`从${formatTime(start)}向后经过${duration}分钟，到${formatTime(correct)}结束。因此下一项任务最早在${formatTime(correct)}开始。`}}const tasks=shuffled(SCHEDULE_TASKS,rng),base=randomInt(16,20,rng)*30,event1Duration=[45,60][randomInt(0,1,rng)],event1={name:tasks[0][0],icon:tasks[0][1],start:base,end:base+event1Duration},newDuration=[30,45,60][randomInt(0,2,rng)],correct=event1.end+15,event2={name:tasks[1][0],icon:tasks[1][1],start:correct+newDuration+15,end:correct+newDuration+75},event3={name:tasks[2][0],icon:tasks[2][1],start:correct+newDuration+105,end:correct+newDuration+150},events=[event1,event2,event3],task={name:tasks[3][0],icon:tasks[3][1]};return{level,type:'conflict',task,duration:newDuration,events,windowStart:480,windowEnd:1080,correct,options:shuffled([correct,event1.start+15,event2.start+15],rng),question:`“${task.name}”需要连续${newDuration}分钟，安排在几点开始不会和已有任务冲突？`,explanation:`${formatTime(correct)}到${formatTime(correct+newDuration)}是一段完整空档。其他候选时刻落在已有任务的占用区间里，会发生时间冲突。`}}
window.TimePlanner={CONFIG,LIFE_TASKS,SCHEDULE_TASKS,formatTime,overlap,isValidStart,generateProblem};if(typeof document==='undefined')return;
const $=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.04}):null,state={mode:'practice',level:'easy',step:1,problem:null,choice:null,wrongValue:null,done:false,solved:0,streak:loadStreak()};
function loadStreak(){try{return Number(JSON.parse(localStorage.getItem(STORE)||'{}').streak)||0}catch(e){return 0}}function saveStreak(){try{localStorage.setItem(STORE,JSON.stringify({streak:state.streak}))}catch(e){}}function say(text){if(speech)speech.speak(text)}function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(btn=>btn.classList.toggle('on',btn.dataset[key]===value))}
function clock(time){const hourAngle=((time%720)/60)*30+(time%60)*.5,minuteAngle=(time%60)*6;return`<div class="clock-face" style="--hour-angle:${hourAngle}deg;--minute-angle:${minuteAngle}deg"><span class="hand hour-hand"></span><span class="hand minute-hand"></span><span class="clock-dot"></span></div><div class="digital">${formatTime(time)}</div>`}
function taskCard(task,detail=''){return`<div class="task-card"><div><span class="task-icon">${task.icon}</span><span class="task-name">${task.name}</span>${detail?`<span class="task-detail">${detail}</span>`:''}</div></div>`}
function timeline(problem){const start=480,end=1080,range=end-start,ticks=[];for(let time=start;time<=end;time+=60){const left=(time-start)/range*100;ticks.push(`<span class="tick" style="left:${left}%"></span><span class="tick-label" style="left:${left}%">${formatTime(time)}</span>`)}const events=problem.events.map(event=>{const left=(event.start-start)/range*100,width=(event.end-event.start)/range*100;return`<div class="event" style="left:${left}%;width:${width}%"><b>${event.icon}${event.name}</b><span>${formatTime(event.start)}–${formatTime(event.end)}</span></div>`}).join('');return`<div class="new-task">为 ${problem.task.icon}${problem.task.name} 寻找连续 ${problem.duration} 分钟的空档</div><div class="timeline-wrap"><div class="timeline"><div class="axis"></div>${ticks.join('')}${events}</div></div>`}
function renderProblem(){const p=state.problem;$('sceneTitle').textContent=p.type==='conflict'?'插入新任务':'待安排任务';$('scheduleTitle').textContent=p.type==='conflict'?'已有日程时间轴':p.type==='elapsed'?'开始与持续时间':'一天中的时刻';$('scene').innerHTML=taskCard(p.task,p.type==='elapsed'?`需要 ${p.duration} 分钟`:p.type==='conflict'?`需要连续 ${p.duration} 分钟`:'选择常见、合理的生活时刻');if(p.type==='suitable')$('scheduleView').innerHTML='<div class="duration-row"><div class="duration-card"><span>早晨</span><b>🌅 06:00–09:00</b></div><div class="duration-card"><span>中午</span><b>☀️ 11:00–14:00</b></div><div class="duration-card"><span>晚上</span><b>🌙 18:00–22:00</b></div></div>';else if(p.type==='elapsed')$('scheduleView').innerHTML=`<div class="duration-row"><div>${clock(p.start)}</div><span class="arrow">＋</span><div class="duration-card"><span>持续时间</span><b>${p.duration} 分钟</b></div><span class="arrow">＝ ?</span></div>`;else $('scheduleView').innerHTML=timeline(p);$('question').textContent=p.question;renderOptions()}
function renderOptions(){const p=state.problem;$('options').innerHTML=p.options.map(value=>{let cls=state.choice===value?' chosen':'';if(state.wrongValue===value)cls+=' wrong';if(state.done&&value===p.correct)cls=' correct';return`<button class="option${cls}" data-value="${value}" ${state.done?'disabled':''}>${formatTime(value)}</button>`}).join('');$('checkBtn').disabled=state.choice===null||state.done}
function updateStatus(){$('roundText').textContent=state.mode==='challenge'?`${state.step} / 5`:'自由练习';$('solvedText').textContent=`${state.solved} 次`;$('typeText').textContent={suitable:'合适时刻',elapsed:'经过时间',conflict:'日程冲突'}[state.problem.type];$('streakText').textContent=`${state.streak} 关`}
function startRound(reset=false){if(reset&&state.mode==='challenge')state.step=1;state.problem=generateProblem(state.level);state.choice=null;state.wrongValue=null;state.done=false;$('mission').textContent={easy:'把生活任务安排在常见、合理的时段。',medium:'先算任务的结束时刻，再决定下一项任务何时开始。',hard:'新任务必须完整放进空档，任何一分钟都不能和已有安排重叠。'}[state.level];$('explanation').className='explanation';$('nextBtn').hidden=true;$('checkBtn').hidden=false;$('hintBtn').disabled=false;renderProblem();setMessage('读懂任务和时间信息，再选择安排。');updateStatus()}
function choose(value){if(state.done)return;state.choice=value;state.wrongValue=null;renderOptions();setMessage(`你选择从 ${formatTime(value)} 开始。点击“检查安排”验证。`)}
function check(){if(state.choice===null)return;const p=state.problem;if(state.choice===p.correct){state.done=true;state.solved++;state.streak++;saveStreak();$('explanation').innerHTML=`<strong>规划解释：</strong>${p.explanation}`;$('explanation').className='explanation show';$('checkBtn').hidden=true;$('hintBtn').disabled=true;$('nextBtn').hidden=false;renderOptions();setMessage('规划完成！这个时刻符合任务要求。','ok');say('规划完成，这个时刻符合任务要求。');updateStatus()}else{state.wrongValue=state.choice;state.streak=0;saveStreak();renderOptions();let reason=p.type==='conflict'?'这个时段会与已有任务重叠，或者没有留下完整的连续时间。':p.type==='elapsed'?'结束时刻还没有算对，下一项任务不能在前一项结束前开始。':'这个时刻不符合题目中的常见作息情境。';setMessage(`${reason} 可以重新选择。`,'bad');say('这个安排还不合适，请重新选择。');updateStatus()}}
function hint(){const p=state.problem;if(p.type==='suitable')setMessage('提示：先判断任务更适合早晨、中午还是晚上，再比较三个时刻。','hint');else if(p.type==='elapsed')setMessage(`提示：从${formatTime(p.start)}开始，先增加整小时，再增加剩余分钟。`,'hint');else setMessage(`提示：逐个检查候选时刻之后的${p.duration}分钟，整段都空闲才可以。`,'hint');say($('message').textContent)}
function next(){if(state.mode==='challenge'){if(state.step===5){startRound(true);return}state.step++}startRound(false)}
$('options').addEventListener('click',event=>{const btn=event.target.closest('[data-value]');if(btn)choose(Number(btn.dataset.value))});$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',hint);$('nextBtn').addEventListener('click',next);$('newBtn').addEventListener('click',()=>startRound(state.mode==='challenge'));$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startRound(true)});$('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startRound(true)});startRound(true);
})();
</script>
