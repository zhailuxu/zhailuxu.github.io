<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>首次能力小测｜慧陪学</title>
<meta name="description" content="通过六个短游戏了解当前练习起点，为每日训练生成更合适的推荐。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#445149;--muted:#718078;--green:#55765b;--paper:rgba(250,252,246,.95)}body{min-height:100vh;padding:18px 12px 42px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#ddecda,#eff2dd 52%,#f5e7d2)}button{font:inherit}.container{max-width:900px;margin:auto}.hero,.panel{border:1px solid rgba(255,255,255,.8);border-radius:24px;background:var(--paper);box-shadow:0 7px 25px rgba(58,79,59,.1)}.hero{padding:24px 19px;text-align:center}.eyebrow{color:#7a896f;font-size:.74rem;font-weight:850;letter-spacing:2px}.hero h1{margin:6px 0;color:#6b5849;font-size:clamp(1.9rem,6vw,2.8rem)}.hero p{max-width:650px;margin:auto;color:var(--muted);font-size:.86rem;line-height:1.7}.panel{margin-top:14px;padding:19px}.intro h2,.result h2{font-size:1.16rem;color:#59695c}.intro p,.result-intro{margin-top:7px;color:var(--muted);font-size:.82rem;line-height:1.7}.grade-title{margin:17px 0 9px;font-size:.85rem;font-weight:850}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grade{border:2px solid #d4dfd0;border-radius:14px;padding:12px 8px;background:#f5f8f1;color:#58675b;font-weight:850;cursor:pointer}.grade:hover,.grade:focus-visible{border-color:#67876c}.skip{display:block;margin:15px auto 0;border:0;background:transparent;color:#718078;text-decoration:underline;cursor:pointer}.notice{margin-top:15px;padding:12px;border-radius:13px;background:#edf3e9;color:#6d786f;font-size:.75rem;line-height:1.65}.progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.progress b{font-size:.93rem}.bar{flex:1;height:10px;border-radius:99px;background:#d8e2d4;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d9772,#d0a04f);transition:width .25s}.tasks{display:grid;gap:10px}.task{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:14px;border-radius:17px;background:#eef4ea}.task.locked{opacity:.58}.task.done{background:#e2efdd}.task-icon{display:grid;width:44px;height:44px;place-items:center;border-radius:14px;background:white;font-size:1.45rem}.task h3{font-size:.94rem}.task p{margin-top:3px;color:var(--muted);font-size:.74rem;line-height:1.5}.task a,.task-state{min-width:88px;padding:9px 11px;border-radius:11px;text-align:center;font-size:.76rem;font-weight:850}.task a{background:#5c7b61;color:white;text-decoration:none}.task-state{color:#718078}.ability-list{display:grid;gap:10px;margin-top:15px}.ability-row{display:grid;grid-template-columns:110px 1fr 72px;align-items:center;gap:10px}.ability-name{font-size:.8rem;font-weight:800}.ability-meter{height:10px;border-radius:99px;background:#dce5d8;overflow:hidden}.ability-meter i{display:block;height:100%;border-radius:inherit;background:#739078}.ability-label{font-size:.74rem;font-weight:850;color:#607164;text-align:right}.focus-box{margin-top:17px;padding:15px;border-radius:15px;background:#fff2d9;color:#6f604b;font-size:.8rem;line-height:1.7}.primary{display:inline-block;margin-top:15px;padding:11px 16px;border-radius:13px;border:0;background:#56775c;color:#fff;text-decoration:none;font-weight:850;cursor:pointer}.secondary{margin-left:8px;border:0;background:transparent;color:#6c796f;text-decoration:underline;cursor:pointer}.back{display:block;margin-top:17px;text-align:center;color:#58725c;text-decoration:none;font-size:.82rem;font-weight:800}[hidden]{display:none!important}@media(max-width:620px){.grades{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:44px 1fr}.task a,.task-state{grid-column:1/-1;width:100%}.ability-row{grid-template-columns:96px 1fr}.ability-label{grid-column:2;text-align:left}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="container">
  <header class="hero"><div class="eyebrow">约 8～10 分钟 · 6 个短任务</div><h1>🌱 首次能力小测</h1><p>先了解当前练习起点，再准备更合适的每日任务。这里不是考试，做错了也可以继续尝试。</p></header>
  <section class="panel intro" id="intro"><h2>选择目前所在年级</h2><p>年级只用于选择合适的游戏难度，不会与其他孩子比较。</p><div class="grade-title">孩子目前在：</div><div class="grades"><button class="grade" data-grade="k">幼儿园</button><button class="grade" data-grade="1-2">一～二年级</button><button class="grade" data-grade="3-4">三～四年级</button><button class="grade" data-grade="5-6">五～六年级</button></div><button class="skip" id="skipBtn">暂时跳过，先使用均衡推荐</button><p class="notice">说明：这是一组帮助安排练习的轻量观察，不是专业测评或诊断。结果只保存在当前浏览器。</p></section>
  <section class="panel" id="taskPanel" hidden><div class="progress"><b id="progressText">已完成 0 / 6</b><div class="bar" role="progressbar" aria-label="能力小测进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><i id="progressBar"></i></div></div><div class="tasks" id="tasks"></div><button class="skip" id="stopBtn">结束小测，改用均衡推荐</button></section>
  <section class="panel result" id="resultPanel" hidden><h2>起点观察完成</h2><p class="result-intro">结果用于调整之后的游戏推荐。我们更关心下一步练什么，不给孩子排名。</p><div class="ability-list" id="abilityList"></div><div class="focus-box" id="focusBox"></div><a class="primary" href="daily-camp.html">开始今日训练 →</a><button class="secondary" id="restartBtn">重新测一次</button></section>
  <a class="back" href="daily-camp.html">← 返回每日训练营</a>
</main>
<script src="hpx-game-progress.js"></script>
<script src="hpx-ability-check.js"></script>
<script>
(function(){'use strict';var intro=document.getElementById('intro'),taskPanel=document.getElementById('taskPanel'),resultPanel=document.getElementById('resultPanel'),tasks=document.getElementById('tasks');function show(name){intro.hidden=name!=='intro';taskPanel.hidden=name!=='tasks';resultPanel.hidden=name!=='result'}function render(){var progress=HpxGameProgress.load(),state=HpxAbilityCheck.sync(HpxAbilityCheck.load(),progress),done=state.items.filter(function(item){return item.completedAt}).length;if(state.status==='complete'){show('result');var ordered=HpxAbilityCheck.ABILITIES.map(function(ability){return{meta:ability,value:state.result.abilities[ability.id]}});document.getElementById('abilityList').innerHTML=ordered.map(function(row){return '<div class="ability-row"><span class="ability-name">'+row.meta.icon+' '+row.meta.name+'</span><span class="ability-meter"><i style="width:'+row.value+'%"></i></span><span class="ability-label">'+HpxAbilityCheck.label(row.value)+'</span></div>'}).join('');var focus=state.result.focus.map(function(id){return HpxAbilityCheck.ability(id).name});document.getElementById('focusBox').innerHTML='<b>未来 7 天建议重点：</b>'+focus.join('、')+'。每日训练仍会保持多种能力均衡，同时适当增加这些方向的推荐权重。';return}if(state.status==='in_progress'){show('tasks');document.getElementById('progressText').textContent='已完成 '+done+' / 6';document.getElementById('progressBar').style.width=(done/6*100)+'%';document.querySelector('.bar').setAttribute('aria-valuenow',String(done));var next=state.items.findIndex(function(item){return!item.completedAt});tasks.innerHTML=state.items.map(function(item,index){var ability=HpxAbilityCheck.ability(item.ability),game=HpxGameProgress.GAMES[item.gameId],isDone=Boolean(item.completedAt),locked=!isDone&&index!==next,tail=isDone?'<span class="task-state">✓ 已完成</span>':locked?'<span class="task-state">等待前一项</span>':'<a href="'+item.gameId+'.html?from=ability-check&level='+state.level+'">开始 →</a>';return '<article class="task '+(isDone?'done':locked?'locked':'')+'"><span class="task-icon">'+(isDone?'✓':ability.icon)+'</span><div><h3>第 '+(index+1)+' 项 · '+ability.name+'</h3><p>'+game.name+' · '+ability.description+'</p></div>'+tail+'</article>'}).join('');return}show('intro')}document.querySelectorAll('[data-grade]').forEach(function(button){button.addEventListener('click',function(){HpxAbilityCheck.start(button.dataset.grade,HpxGameProgress.load());render()})});function skip(){HpxAbilityCheck.skip();location.href='daily-camp.html'}document.getElementById('skipBtn').addEventListener('click',skip);document.getElementById('stopBtn').addEventListener('click',skip);document.getElementById('restartBtn').addEventListener('click',function(){if(confirm('重新开始后，本次小测结果会被新的结果替换。确定继续吗？')){HpxAbilityCheck.reset();render()}});window.addEventListener('pageshow',render);document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});render()})();
</script>
<script src="feedback.js?v=20260906-2"></script>
<script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
</body>
</html>
