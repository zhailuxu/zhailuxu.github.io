  <style>

-top:7px;color:#657166;line-height:1.65;font-size:.86rem}.structure-tag{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:9px;background:#dce8d7;color:#4f6f54;font-size:.75rem;font-weight:800}.assembly-wrap{text-align:center;margin:16px 0 12px}.assembly-label{font-size:.78rem;color:#71806f;margin-bottom:7px}.assembly{display:grid;width:270px;min-height:118px;margin:auto;gap:6px;padding:8px;border-radius:18px;background:#d7e5d2}.slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:48px;border:2px dashed #9caf99;border-radius:12px;background:rgba(255,255,255,.58);color:#7b5b4c;font-size:2.3rem;font-weight:800}.slot.current{border-color:#b98252;background:#fff4dc;box-shadow:0 0 0 3px rgba(185,130,82,.14)}.slot.filled{border-style:solid;border-color:#77a27a;background:#f7fbf4}.layout-lr{grid-template-columns:repeat(2,1fr)}.layout-tb{grid-template-rows:repeat(2,1fr)}.layout-lr3{grid-template-columns:repeat(3,1fr)}.layout-triangle{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.layout-triangle .slot:first-child{grid-column:1/3}.layout-top2bottom{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.layout-top2bottom .slot:last-child{grid-column:1/3}.layout-surround{grid-template-columns:1fr 1fr}.layout-surround .slot:first-child{border-width:4px}.bank-title{text-align:center;color:#6c796c;font-size:.8rem;margin-bottom:8px}.bank{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;max-width:680px;margin:auto}.part{width:72px;height:65px;border:2px solid #c5d4c0;border-radius:14px;background:#fff;color:#6f5145;font-size:2rem;font-weight:850;cursor:pointer;box-shadow:0 3px 8px rgba(58,78,59,.1);transition:.15s transform,.15s background}.part.used{background:#dbe8d7;color:#8d998b;opacity:.55}.part.wrong{animation:shake .34s ease;border-color:#d05c52;box-shadow:inset 0 0 0 2px #d05c52}.part.hint{background:#f0dda2;border-color:#c39a35;animation:pulse .7s ease 2}.progress{max-width:680px;margin:15px auto 4px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#b48b70,#7b665b);transition:width .2s}.progress-text{text-align:center;font-size:.79rem;color:#71806f}.actions{margin-top:13px}.action{border:0;padding:9px 16px;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#9a7160,#795647);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.45;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:50px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#795647;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(.9)}}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}@media(max-width:560px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.question{grid-template-columns:110px 1fr;gap:10px}.hanzi{font-size:4rem}.hanzi-box{padding:9px}.assembly{width:240px}.part{width:62px;height:58px;font-size:1.75rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
    .layout-surround{display:block;position:relative}.layout-surround .slot:first-child{position:absolute;inset:0;align-items:flex-start;justify-content:flex-start;padding:7px 12px;border-width:4px}.layout-surround .slot:last-child{position:absolute;right:12%;bottom:10%;width:48%;height:62%}

<body>
<main class="container">
  <header class="header"><h1>🧱 汉字部件拼装</h1><p>看清汉字结构，把基础部件放回正确的位置。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 基础结构</button><button class="chip" data-level="medium">中年级 包围结构</button><button class="chip" data-level="hard">高年级 三部件</button></div>
      <button class="chip" id="speakToggle">🔊 汉字朗读 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">拼装进度<b id="stepText">0 / 2</b></div><div class="stat">本题误选<b id="mistakeText">0 次</b></div><div class="stat">连续完成<b id="streakText">0 题</b></div></div>
  </section>
  <section class="card">
    <div class="question"><div class="hanzi-box"><div class="pinyin" id="pinyin">xiū</div><div class="hanzi" id="hanzi">休</div></div><div class="info"><h2 id="questionTitle">请拼出“休”字</h2><p id="meaning">人靠在树边，可以表示休息。</p><span class="structure-tag" id="structure">左右结构</span></div></div>
    <div class="assembly-wrap"><div class="assembly-label">按结构顺序选择部件</div><div class="assembly layout-lr" id="assembly" aria-label="汉字部件槽"></div></div>
    <div class="bank-title">部件选择区</div><div class="bank" id="bank"></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">请选择第1个部件</p>
    <div class="actions"><button class="action secondary" id="hintBtn">💡 提示当前部件</button><button class="action secondary" id="undoBtn" disabled>↶ 撤销一步</button><button class="action muted" id="newBtn">↻ 换一个汉字</button><button class="action primary" id="nextBtn" hidden>下一个汉字 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">选错不会占用部件槽，想清楚后可以重新选择。</div>
  </section>
  <section class="card help"><h2>怎么玩</h2><ol><li>先观察目标汉字和结构提示，再从下方选择组成它的部件。</li><li>按照从左到右、从上到下或从外到内的顺序选择；三部件字按槽位顺序完成。</li><li>选错不会进入部件槽；需要调整时，可以撤销上一步。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-15：常用字部件关系属于字形事实；题目组合、释义短句、界面和反馈由本站独立整理与编写。
(function(){'use strict';
const QUESTIONS={
easy:[
{char:'休',pinyin:'xiū',meaning:'人靠在树边，可以表示休息。',structure:'左右结构',layout:'lr',parts:['亻','木']},{char:'明',pinyin:'míng',meaning:'表示光亮、清楚，也可以表示明天。',structure:'左右结构',layout:'lr',parts:['日','月']},{char:'好',pinyin:'hǎo',meaning:'表示美好、合适或令人满意。',structure:'左右结构',layout:'lr',parts:['女','子']},{char:'妈',pinyin:'mā',meaning:'对母亲的日常称呼。',structure:'左右结构',layout:'lr',parts:['女','马']},{char:'河',pinyin:'hé',meaning:'地面上天然形成的水道。',structure:'左右结构',layout:'lr',parts:['氵','可']},{char:'林',pinyin:'lín',meaning:'成片生长的树木。',structure:'左右结构',layout:'lr',parts:['木','木']},{char:'苗',pinyin:'miáo',meaning:'植物刚长出来的幼小部分。',structure:'上下结构',layout:'tb',parts:['艹','田']},{char:'岩',pinyin:'yán',meaning:'坚硬的石头或岩层。',structure:'上下结构',layout:'tb',parts:['山','石']},{char:'尖',pinyin:'jiān',meaning:'顶端细小、锐利。',structure:'上下结构',layout:'tb',parts:['小','大']},{char:'尘',pinyin:'chén',meaning:'细小的灰土。',structure:'上下结构',layout:'tb',parts:['小','土']}],
medium:[
{char:'问',pinyin:'wèn',meaning:'向别人提出问题。',structure:'半包围结构',layout:'surround',parts:['门','口']},{char:'间',pinyin:'jiān',meaning:'表示空间、中间或房间。',structure:'半包围结构',layout:'surround',parts:['门','日']},{char:'闪',pinyin:'shǎn',meaning:'表示突然出现、快速躲开或发光。',structure:'半包围结构',layout:'surround',parts:['门','人']},{char:'闻',pinyin:'wén',meaning:'可以表示听见，也可以表示消息。',structure:'半包围结构',layout:'surround',parts:['门','耳']},{char:'国',pinyin:'guó',meaning:'表示国家。',structure:'全包围结构',layout:'surround',parts:['囗','玉']},{char:'园',pinyin:'yuán',meaning:'种植花木或供人活动的地方。',structure:'全包围结构',layout:'surround',parts:['囗','元']}],
hard:[
{char:'树',pinyin:'shù',meaning:'木本植物的通称。',structure:'左中右结构',layout:'lr3',parts:['木','又','寸']},{char:'做',pinyin:'zuò',meaning:'表示进行某项活动。',structure:'左中右结构',layout:'lr3',parts:['亻','古','攵']},{char:'谢',pinyin:'xiè',meaning:'常用来表达感谢。',structure:'左中右结构',layout:'lr3',parts:['讠','身','寸']},{char:'湖',pinyin:'hú',meaning:'被陆地围绕的大片水域。',structure:'左中右结构',layout:'lr3',parts:['氵','古','月']},{char:'想',pinyin:'xiǎng',meaning:'表示思考、希望或惦记。',structure:'上下组合结构',layout:'top2bottom',parts:['木','目','心']},{char:'森',pinyin:'sēn',meaning:'可以形容树木很多。',structure:'品字形结构',layout:'triangle',parts:['木','木','木']},{char:'品',pinyin:'pǐn',meaning:'表示物品，也有品尝的意思。',structure:'品字形结构',layout:'triangle',parts:['口','口','口']},{char:'晶',pinyin:'jīng',meaning:'表示明亮、晶莹。',structure:'品字形结构',layout:'triangle',parts:['日','日','日']},{char:'众',pinyin:'zhòng',meaning:'表示许多人。',structure:'品字形结构',layout:'triangle',parts:['人','人','人']}]
};
const LEVELS={easy:{options:4},medium:{options:6},hard:{options:7}},COMPONENTS=['亻','木','日','月','女','子','马','氵','可','艹','田','山','石','小','大','土','门','口','人','耳','囗','玉','元','又','寸','古','攵','讠','身','目','心','火','禾','十','力','王','白','彳','刂'],STORE_KEY='hpxHanziComponentsV1';
const state={mode:'practice',level:'easy',game:null,current:0,chosen:[],mistakes:0,challengeStep:1,challengeMistakes:0,streak:loadStreak(),phase:'playing'};
const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.78,pitch:1.03}):null;
function loadStreak(){try{return Number(localStorage.getItem(STORE_KEY)||0)}catch(e){return 0}}
function saveStreak(){try{localStorage.setItem(STORE_KEY,String(state.streak))}catch(e){}}
function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function createGame(level){const question=QUESTIONS[level][Math.floor(Math.random()*QUESTIONS[level].length)],correct=question.parts.map((text,index)=>({id:`correct-${index}`,text,correct:true})),needed=LEVELS[level].options-correct.length,distractors=shuffled(COMPONENTS.filter(text=>!question.parts.includes(text))).slice(0,needed).map((text,index)=>({id:`wrong-${index}`,text,correct:false}));return{question,bank:shuffled([...correct,...distractors])}}
function evaluatePick(parts,current,text){return text===parts[current]?{correct:true,next:current+1}:{correct:false,next:current}}
function startGame(resetChallenge){if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeMistakes=0}state.game=createGame(state.level);state.current=0;state.chosen=[];state.mistakes=0;state.phase='playing';el('nextBtn').hidden=true;el('newBtn').hidden=false;el('hintBtn').disabled=false;render();setMessage('选错不会占用部件槽，想清楚后可以重新选择。','');speakQuestion()}
function render(){const q=state.game.question;el('hanzi').textContent=q.char;el('pinyin').textContent=q.pinyin;el('questionTitle').textContent=`请拼出“${q.char}”字`;el('meaning').textContent=q.meaning;el('structure').textContent=q.structure;renderAssembly();renderBank();updateStatus()}
function renderAssembly(){const q=state.game.question,assembly=el('assembly');assembly.className=`assembly layout-${q.layout}`;assembly.innerHTML='';q.parts.forEach((part,index)=>{const slot=document.createElement('div');slot.className='slot'+(index<state.current?' filled':index===state.current&&state.phase==='playing'?' current':'');slot.textContent=index<state.current?part:'？';slot.setAttribute('aria-label',index<state.current?`已放入${part}`:`第${index+1}个部件槽`);assembly.appendChild(slot)})}
function renderBank(){const bank=el('bank');bank.innerHTML='';state.game.bank.forEach(token=>{const button=document.createElement('button');button.type='button';button.className='part';button.dataset.id=token.id;button.textContent=token.text;button.setAttribute('aria-label',`部件${token.text}`);if(state.chosen.includes(token.id)){button.disabled=true;button.classList.add('used')}button.addEventListener('click',()=>pick(token,button));bank.appendChild(button)})}
function pick(token,button){if(state.phase!=='playing')return;const result=evaluatePick(state.game.question.parts,state.current,token.text);if(result.correct){state.chosen.push(token.id);state.current=result.next;if(state.current===state.game.question.parts.length)finish();else{renderAssembly();renderBank();updateStatus();setMessage('这个部件位置正确，继续选择下一个。','ok')}}else{state.mistakes++;state.streak=0;saveStreak();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage(`这个位置不是“${token.text}”，再观察一下目标汉字。`,'bad');updateStatus()}}
function undo(){if(state.phase!=='playing'||state.current===0)return;state.current--;state.chosen.pop();renderAssembly();renderBank();updateStatus();setMessage('已经撤销上一个部件，可以重新选择。','')}
function hint(){if(state.phase!=='playing')return;const expected=state.game.question.parts[state.current];el('bank').querySelectorAll('.part').forEach(button=>{if(!button.disabled&&button.textContent===expected){button.classList.add('hint');setTimeout(()=>button.classList.remove('hint'),1400)}});setMessage(`提示：第${state.current+1}个位置需要部件“${expected}”。`,'')}
function finish(){state.phase='done';state.streak++;saveStreak();if(state.mode==='challenge')state.challengeMistakes+=state.mistakes;renderAssembly();renderBank();el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){el('nextBtn').textContent='再挑战一次 ↻';setMessage(`5关全部完成！总误选${state.challengeMistakes}次。`,'done');if(speech)speech.speak('五关汉字部件挑战全部完成！')}else{el('nextBtn').textContent='下一个汉字 →';setMessage(`拼装完成！“${state.game.question.char}”由${state.game.question.parts.join('、')}组成。`,'done');if(speech)speech.speak(`${state.game.question.char}，拼装完成。`)}updateStatus();celebrate()}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}
function speakQuestion(){if(speech){const q=state.game.question;speech.speak(`${q.char}。${q.meaning}`)}}
function updateStatus(){const total=state.game.question.parts.length;el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('stepText').textContent=`${Math.min(state.current,total)} / ${total}`;el('mistakeText').textContent=`${state.mistakes} 次`;el('streakText').textContent=`${state.streak} 题`;el('progressFill').style.width=`${Math.min(state.current,total)/total*100}%`;el('progressText').textContent=state.phase==='done'?`已完成 ${total} / ${total}`:`请选择第${state.current+1}个部件`;el('undoBtn').disabled=state.phase!=='playing'||state.current===0}
function setMessage(text,type){const message=el('message');message.textContent=text;message.className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(button=>button.classList.toggle('on',button.dataset[key]===value))}
el('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});el('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startGame(true)});el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());el('hintBtn').addEventListener('click',hint);el('undoBtn').addEventListener('click',undo);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<28;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=colors[Math.floor(Math.random()*colors.length)];dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}}
window.HanziComponents={QUESTIONS,LEVELS,COMPONENTS,createGame,evaluatePick};startGame(false)})();
</script>
