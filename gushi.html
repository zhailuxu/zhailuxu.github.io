<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗背诵 — 一年级语文</title>
<meta name="description" content="一年级必背古诗：诗词表浏览、翻牌背诵、默写测验三种模式。">
<style>
:root {
  --bg:       #EEF2F7;
  --card:     #FFFFFF;
  --ink:      #1C2D3E;
  --slate:    #3B536B;
  --slate-lt: #D6E4F0;
  --amber:    #C8A84B;
  --amber-lt: #FDF3E3;
  --green:    #3B7558;
  --green-lt: #E3F2EA;
  --red:      #C44B3B;
  --red-lt:   #FBEAEA;
  --muted:    #6E859A;
  --border:   #C4D2DF;
  --shadow:   0 2px 14px rgba(28,45,62,.09), 0 0 0 1px rgba(28,45,62,.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 30%, rgba(59,83,107,.07) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(59,117,88,.05) 0%, transparent 45%);
  min-height: 100vh;
  padding: 22px 14px 52px;
  color: var(--ink);
}

.container { max-width: 780px; margin: 0 auto; }
.hidden { display: none !important; }

/* ── Header ── */
.header { text-align: center; margin-bottom: 20px; }
.header h1 {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', '宋体', serif;
  font-size: 2rem; font-weight: 800; color: var(--slate);
  letter-spacing: 4px; text-wrap: balance;
}
.header p { font-size: .82rem; color: var(--muted); margin-top: 5px; letter-spacing: .4px; }

/* ── Tabs ── */
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn {
  border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 18px;
  font-size: .83rem; font-weight: 700; cursor: pointer; font-family: inherit;
  background: var(--card); color: var(--muted); transition: all .15s;
}
.tab-btn:hover { border-color: var(--slate); color: var(--slate); }
.tab-btn.active { background: var(--slate); color: #fff; border-color: var(--slate); }
.tab-btn:focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }

/* ── Card panel ── */
.card-panel {
  background: var(--card); border-radius: 18px; padding: 22px 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}

/* ── Dynasty badge ── */
.badge {
  display: inline-block; font-size: .68rem; font-weight: 700;
  color: var(--amber); background: var(--amber-lt);
  border: 1px solid #EDD9A3; border-radius: 4px; padding: 1px 6px; letter-spacing: 1px;
}

/* ── Buttons ── */
.btn {
  border: none; border-radius: 10px; padding: 9px 22px;
  font-size: .87rem; font-weight: 700; cursor: pointer; font-family: inherit;
  letter-spacing: .5px; transition: transform .12s;
}
.btn:active { transform: scale(.96); }
.btn:focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }
.btn-slate { background: var(--slate); color: #fff; box-shadow: 0 3px 10px rgba(59,83,107,.25); }
.btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-green { background: var(--green); color: #fff; box-shadow: 0 3px 10px rgba(59,117,88,.25); }

/* ══════════════════════════════════════
   TAB 1 — POEM GRID
══════════════════════════════════════ */
.poem-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 11px;
}

.pg-card {
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 13px 13px 11px; cursor: pointer;
  background: var(--bg); transition: all .18s;
  position: relative; overflow: hidden;
}
.pg-card:hover  { border-color: var(--slate); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(28,45,62,.1); }
.pg-card.open   { border-color: var(--slate); background: #EDF3FA; }
.pg-card.known  { border-color: var(--green); }
.pg-card.known::after {
  content: '✓'; position: absolute; top: 7px; right: 10px;
  font-size: .78rem; color: var(--green); font-weight: 900;
}

.pg-title {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: 1.15rem; font-weight: 700; color: var(--ink);
  letter-spacing: 2px; margin: 5px 0 2px;
}
.pg-card.known .pg-title { color: var(--green); }
.pg-author  { font-size: .73rem; color: var(--muted); margin-bottom: 6px; }
.pg-preview { font-size: .8rem; color: var(--muted); font-style: italic; }
.pg-full {
  margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border);
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: .95rem; line-height: 2.2; color: var(--ink); letter-spacing: 1px;
}

/* ══════════════════════════════════════
   TAB 2 — FLASHCARD
══════════════════════════════════════ */
.fc-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.fc-progress { font-size: .85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.fc-known    { font-size: .78rem; color: var(--green); font-weight: 700; margin-top: 2px; }

.nav-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 1rem; cursor: pointer; color: var(--slate);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--slate); background: var(--slate-lt); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }

/* Flip card */
.flip-wrapper {
  perspective: 900px; margin-bottom: 18px; cursor: pointer;
}
.flip-card {
  width: 100%; min-height: 260px;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4, 0, .2, 1);
  position: relative;
}
.flip-card.flipped { transform: rotateY(180deg); }

.flip-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; border: 1.5px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 26px 20px;
}
.flip-front { background: linear-gradient(140deg, #EEF2F7 0%, #E0EBF5 100%); }
.flip-back  {
  background: linear-gradient(140deg, #FFFFFF 0%, #F4F8FB 100%);
  transform: rotateY(180deg);
}

.fc-deco {
  width: 36px; height: 2.5px; background: var(--slate);
  border-radius: 99px; opacity: .22; margin-bottom: 8px;
}
.fc-front-title {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: 2.4rem; font-weight: 700; color: var(--ink);
  letter-spacing: 6px; margin: 8px 0 6px;
}
.fc-front-author { font-size: .84rem; color: var(--muted); letter-spacing: 1px; }
.fc-front-hint {
  position: absolute; bottom: 14px; right: 16px;
  font-size: .7rem; color: var(--muted); letter-spacing: .3px;
}

.fc-poem-label {
  font-size: .78rem; color: var(--muted); margin-bottom: 14px; letter-spacing: 1px;
}
.fc-poem {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: 1.2rem; line-height: 2.5; color: var(--ink);
  letter-spacing: 1.5px; text-align: center;
}

.fc-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ── AI 讲诗意 ── */
.btn-purple { background: #6a4ba3; color: #fff; box-shadow: 0 3px 10px rgba(106,75,163,.28); }
.ai-poem-box {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 14px;
  background: linear-gradient(140deg, #F3EFFA 0%, #EDE6F7 100%);
  border: 1.5px solid #D8CCEE; font-size: .88rem; color: #4a3b70; line-height: 1.8;
}
.ai-poem-box.show { display: block; animation: fadeSlide .25s ease-out; }
.ai-poem-tag {
  font-size: .68rem; font-weight: 700; color: #6a4ba3; background: #fff;
  display: inline-block; border-radius: 8px; padding: 1px 9px; margin-bottom: 7px; letter-spacing: .5px;
}
.ai-poem-loading { color: #8a72b8; font-style: italic; }
.ai-poem-err { color: var(--red); font-size: .8rem; }
.ai-poem-retry {
  margin-top: 7px; border: 1.5px solid #a68fd0; background: #fff; color: #6a4ba3;
  border-radius: 8px; padding: 4px 12px; font-size: .78rem; cursor: pointer; font-family: inherit;
}
.ai-poem-block { background: #fff; border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
.ai-poem-block:last-child { margin-bottom: 0; }
.ai-poem-block b { color: #6a4ba3; }

/* ══════════════════════════════════════
   TAB 3 — QUIZ
══════════════════════════════════════ */
.quiz-hud {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
}
.hud-score { font-size: .9rem; font-weight: 800; color: var(--slate); font-variant-numeric: tabular-nums; }
.prog-bar  { background: var(--slate-lt); border-radius: 99px; height: 5px; margin-bottom: 18px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--slate), var(--green)); transition: width .35s; }

.quiz-header {
  text-align: center; margin-bottom: 18px;
}
.quiz-title {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: 1.4rem; font-weight: 700; color: var(--ink); letter-spacing: 3px;
}
.quiz-author { font-size: .78rem; color: var(--muted); margin-top: 3px; }

.quiz-lines {
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: 1.1rem; line-height: 2.8; color: var(--ink);
  letter-spacing: 1.5px; text-align: center; margin-bottom: 20px;
}
.quiz-blank {
  display: inline-block; min-width: 96px;
  border-bottom: 2.5px solid var(--slate);
  background: var(--slate-lt); border-radius: 4px;
  padding: 0 8px; letter-spacing: 1px;
  vertical-align: middle; font-size: 1rem; font-weight: 700;
  color: transparent; transition: all .22s;
}
.quiz-blank.correct { border-color: var(--green); background: var(--green-lt); color: var(--green); }
.quiz-blank.wrong   { border-color: var(--red);   background: var(--red-lt);   color: var(--red); }

.quiz-choices {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px;
}
.quiz-choice {
  border: 1.5px solid var(--border); border-radius: 10px;
  padding: 12px 8px; cursor: pointer; text-align: center;
  font-family: 'Songti SC', 'STSong', 'NSimSun', 'SimSun', serif;
  font-size: .95rem; font-weight: 600; color: var(--ink);
  background: var(--bg); letter-spacing: 1px; transition: all .15s;
}
.quiz-choice:hover { border-color: var(--slate); background: var(--slate-lt); }
.quiz-choice.correct { border-color: var(--green); background: var(--green-lt); color: var(--green); }
.quiz-choice.wrong   { border-color: var(--red);   background: var(--red-lt);   color: var(--red); }

.quiz-fb {
  text-align: center; font-size: .95rem; font-weight: 700;
  min-height: 28px; letter-spacing: .5px;
}
.quiz-fb.ok   { color: var(--green); }
.quiz-fb.fail { color: var(--red); }

/* ── Animations ── */
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeSlide .26s ease both; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%       { transform: translateX(-5px); }
  75%       { transform: translateX(5px); }
}
.shake { animation: shake .22s ease; }

@media (prefers-reduced-motion: reduce) {
  .flip-card { transition: none; }
  .fade-in, .shake { animation: none; }
  .prog-fill { transition: none; }
}

#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

/* ── Responsive ── */
@media (max-width: 480px) {
  .header h1       { font-size: 1.55rem; }
  .fc-front-title  { font-size: 1.85rem; }
  .fc-poem         { font-size: 1rem; }
  .poem-grid       { grid-template-columns: 1fr 1fr; }
  .pg-title        { font-size: 1rem; }
  .quiz-choice     { font-size: .85rem; }
}
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a148c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="慧陪学">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<canvas id="confetti"></canvas>
<div class="container">

<div class="header">
  <h1>古诗背诵</h1>
  <p>诗词表 · 翻牌背诵 · 默写测验 — 一年级必背古诗 15 首</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('grid')">📜 诗词表</button>
  <button class="tab-btn" onclick="switchTab('flash')">🀄 翻牌背诵</button>
  <button class="tab-btn" onclick="switchTab('quiz')">✏️ 默写测验</button>
</div>

<!-- TAB 1: Grid -->
<div id="tab-grid">
  <div class="card-panel">
    <div class="poem-grid" id="poemGrid"></div>
  </div>
</div>

<!-- TAB 2: Flashcard -->
<div id="tab-flash" class="hidden">
  <div class="card-panel">
    <div class="fc-nav">
      <button class="nav-btn" id="btnPrev" onclick="fcNav(-1)">←</button>
      <div style="text-align:center">
        <div class="fc-progress" id="fcProgress">1 / 15</div>
        <div class="fc-known" id="fcKnown"></div>
      </div>
      <button class="nav-btn" id="btnNext" onclick="fcNav(1)">→</button>
    </div>

    <div class="flip-wrapper" id="flipWrapper" onclick="flipCard()">
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-front">
          <div class="fc-deco"></div>
          <div id="fcBadge"></div>
          <div class="fc-front-title" id="fcTitle"></div>
          <div class="fc-front-author" id="fcAuthor"></div>
          <span class="fc-front-hint">点击翻转 →</span>
        </div>
        <div class="flip-face flip-back">
          <div class="fc-poem-label" id="fcBackLabel"></div>
          <div class="fc-poem" id="fcPoem"></div>
        </div>
      </div>
    </div>

    <div class="fc-actions">
      <button class="btn btn-ghost" onclick="markUnknown()">↺ 再背</button>
      <button class="btn btn-ghost" onclick="speakPoem()">🔊 朗读</button>
      <button class="btn btn-purple" id="aiPoemBtn" onclick="genPoemStory()">🤖 AI讲诗意</button>
      <button class="btn btn-green" onclick="markKnown()">✓ 背会了</button>
    </div>
    <div class="ai-poem-box" id="aiPoemBox"></div>
  </div>
</div>

<!-- TAB 3: Quiz -->
<div id="tab-quiz" class="hidden">
  <div class="card-panel">
    <div class="quiz-hud">
      <span class="hud-score" id="quizScore">✅ 0 &nbsp; ❌ 0</span>
      <button class="btn btn-ghost" style="padding:5px 14px;font-size:.78rem" onclick="nextQuiz()">换一题</button>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProg" style="width:0%"></div></div>
    <div class="quiz-header">
      <div class="quiz-title"  id="qTitle"></div>
      <div class="quiz-author" id="qAuthor"></div>
    </div>
    <div class="quiz-lines"   id="quizLines"></div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div class="quiz-fb"      id="quizFb"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn btn-ghost" onclick="speakQuizPoem()">🔊 听读整首</button>
    </div>
  </div>
</div>

</div><!-- /container -->

<script>
// ══ DATA ══════════════════════════════════════════════════
const POEMS = [
  { title:'静夜思',      author:'李白',   dynasty:'唐', lines:['床前明月光，','疑是地上霜。','举头望明月，','低头思故乡。'] },
  { title:'春晓',        author:'孟浩然', dynasty:'唐', lines:['春眠不觉晓，','处处闻啼鸟。','夜来风雨声，','花落知多少。'] },
  { title:'悯农（其一）',author:'李绅',   dynasty:'唐', lines:['锄禾日当午，','汗滴禾下土。','谁知盘中餐，','粒粒皆辛苦。'] },
  { title:'悯农（其二）',author:'李绅',   dynasty:'唐', lines:['春种一粒粟，','秋收万颗子。','四海无闲田，','农夫犹饿死。'] },
  { title:'咏鹅',        author:'骆宾王', dynasty:'唐', lines:['鹅鹅鹅，','曲项向天歌。','白毛浮绿水，','红掌拨清波。'] },
  { title:'登鹳雀楼',    author:'王之涣', dynasty:'唐', lines:['白日依山尽，','黄河入海流。','欲穷千里目，','更上一层楼。'] },
  { title:'画',          author:'王维',   dynasty:'唐', lines:['远看山有色，','近听水无声。','春去花还在，','人来鸟不惊。'] },
  { title:'梅花',        author:'王安石', dynasty:'宋', lines:['墙角数枝梅，','凌寒独自开。','遥知不是雪，','为有暗香来。'] },
  { title:'夜宿山寺',    author:'李白',   dynasty:'唐', lines:['危楼高百尺，','手可摘星辰。','不敢高声语，','恐惊天上人。'] },
  { title:'望庐山瀑布',  author:'李白',   dynasty:'唐', lines:['日照香炉生紫烟，','遥看瀑布挂前川。','飞流直下三千尺，','疑是银河落九天。'] },
  { title:'绝句',        author:'杜甫',   dynasty:'唐', lines:['两个黄鹂鸣翠柳，','一行白鹭上青天。','窗含西岭千秋雪，','门泊东吴万里船。'] },
  { title:'早发白帝城',  author:'李白',   dynasty:'唐', lines:['朝辞白帝彩云间，','千里江陵一日还。','两岸猿声啼不住，','轻舟已过万重山。'] },
  { title:'风',          author:'李峤',   dynasty:'唐', lines:['解落三秋叶，','能开二月花。','过江千尺浪，','入竹万竿斜。'] },
  { title:'江南',        author:'汉乐府', dynasty:'汉', lines:['江南可采莲，','莲叶何田田，','鱼戏莲叶间，','鱼戏莲叶东。'] },
  { title:'一去二三里',  author:'邵雍',   dynasty:'宋', lines:['一去二三里，','烟村四五家。','亭台六七座，','八九十枝花。'] },
];

// ══ STATE ═════════════════════════════════════════════════
let knownSet     = new Set();
let fcIdx        = 0;
let fcFlipped    = false;
let quizOK       = 0, quizFail = 0;
let quizAnswered = false;
let quizCurrent  = null;
let aCtx         = null;

// ══ TABS ══════════════════════════════════════════════════
function switchTab(name) {
  ['grid','flash','quiz'].forEach((t, i) => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active', t === name);
  });
  if (name === 'flash') renderFlash();
  if (name === 'quiz')  nextQuiz();
}

// ══ TAB 1: GRID ═══════════════════════════════════════════
function buildGrid() {
  const grid = document.getElementById('poemGrid');
  POEMS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'pg-card fade-in';
    card.id = 'pgcard-' + i;
    card.style.animationDelay = (i * 35) + 'ms';
    card.innerHTML = `
      <span class="badge">${p.dynasty}</span>
      <div class="pg-title">${p.title}</div>
      <div class="pg-author">${p.author}</div>
      <div class="pg-preview">${p.lines[0].slice(0,5)}…</div>
      <div class="pg-full hidden">${p.lines.join('<br>')}</div>`;
    card.onclick = () => togglePoem(card, i);
    grid.appendChild(card);
  });
}

function togglePoem(card, idx) {
  const full   = card.querySelector('.pg-full');
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.pg-card.open').forEach(c => {
    c.classList.remove('open');
    c.querySelector('.pg-full').classList.add('hidden');
  });
  if (!isOpen) {
    card.classList.add('open');
    full.classList.remove('hidden');
    speakCN(POEMS[idx].lines.join(''));
  }
}

// ══ TAB 2: FLASHCARD ══════════════════════════════════════
function renderFlash() {
  const p = POEMS[fcIdx];
  document.getElementById('flipCard').classList.remove('flipped');
  fcFlipped = false;
  document.getElementById('fcBadge').innerHTML = `<span class="badge" style="margin-bottom:6px">${p.dynasty}</span>`;
  document.getElementById('fcTitle').textContent    = p.title;
  document.getElementById('fcAuthor').textContent   = p.author;
  document.getElementById('fcBackLabel').textContent = p.title + '　' + p.author;
  document.getElementById('fcPoem').innerHTML       = p.lines.join('<br>');
  document.getElementById('fcProgress').textContent = `${fcIdx + 1} / ${POEMS.length}`;
  document.getElementById('fcKnown').textContent    = `已背会 ${knownSet.size} 首`;
  document.getElementById('btnPrev').disabled = fcIdx === 0;
  document.getElementById('btnNext').disabled = fcIdx === POEMS.length - 1;

  // 切换到新的一首诗时，清空上一首残留的 AI 讲解内容
  const aiBox = document.getElementById('aiPoemBox');
  if (aiBox) { aiBox.classList.remove('show'); aiBox.innerHTML = ''; }
  const aiBtn = document.getElementById('aiPoemBtn');
  if (aiBtn) aiBtn.disabled = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flipCard').classList.toggle('flipped', fcFlipped);
  if (fcFlipped) speakCN(POEMS[fcIdx].lines.join(''));
}

function fcNav(dir) {
  const next = fcIdx + dir;
  if (next < 0 || next >= POEMS.length) return;
  fcIdx = next;
  renderFlash();
}

function markKnown() {
  knownSet.add(fcIdx);
  document.getElementById('pgcard-' + fcIdx)?.classList.add('known');
  document.getElementById('fcKnown').textContent = `已背会 ${knownSet.size} 首`;
  playOK();
  if (knownSet.size === POEMS.length) launchConfetti();
  if (fcIdx < POEMS.length - 1) { fcIdx++; renderFlash(); }
}

function markUnknown() {
  knownSet.delete(fcIdx);
  document.getElementById('pgcard-' + fcIdx)?.classList.remove('known');
  document.getElementById('fcKnown').textContent = `已背会 ${knownSet.size} 首`;
  document.getElementById('flipCard').classList.remove('flipped');
  fcFlipped = false;
}

function speakPoem() { speakCN(POEMS[fcIdx].lines.join('')); }

// ══ TAB 3: QUIZ ═══════════════════════════════════════════
function nextQuiz() {
  quizAnswered = false;
  const pidx = Math.floor(Math.random() * POEMS.length);
  const p    = POEMS[pidx];
  const lidx = Math.floor(Math.random() * p.lines.length);
  quizCurrent = { pidx, p, lidx };

  document.getElementById('qTitle').textContent  = p.title;
  document.getElementById('qAuthor').textContent = `【${p.dynasty}】${p.author}`;

  const correct = p.lines[lidx];
  const blankText = correct.replace(/./g, '　');
  const linesHtml = p.lines.map((line, i) =>
    i === lidx
      ? `<span class="quiz-blank" id="quizBlank">${blankText}</span>`
      : line
  ).join('<br>');
  document.getElementById('quizLines').innerHTML = linesHtml;

  // 3 wrong lines from other poems at same position
  const wrongs = [];
  const shuffled = [...POEMS.keys()].filter(i => i !== pidx).sort(() => Math.random() - .5);
  for (const pi of shuffled) {
    const candidate = POEMS[pi].lines[lidx] || POEMS[pi].lines.at(-1);
    if (!wrongs.includes(candidate) && candidate !== correct) wrongs.push(candidate);
    if (wrongs.length === 3) break;
  }

  const choices = [correct, ...wrongs].sort(() => Math.random() - .5);
  const box = document.getElementById('quizChoices');
  box.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = ch;
    btn.onclick = () => handleQuiz(btn, ch, correct);
    box.appendChild(btn);
  });

  const fb = document.getElementById('quizFb');
  fb.textContent = ''; fb.className = 'quiz-fb';
}

function handleQuiz(btn, chosen, correct) {
  if (quizAnswered) return;
  quizAnswered = true;
  const ok  = chosen === correct;
  const fb  = document.getElementById('quizFb');
  const blk = document.getElementById('quizBlank');

  document.querySelectorAll('.quiz-choice').forEach(b => {
    if (b.textContent === correct) b.classList.add('correct');
  });

  if (ok) {
    quizOK++;
    btn.classList.add('correct');
    if (blk) { blk.textContent = correct; blk.classList.add('correct'); }
    fb.textContent = '✅ 答对了！'; fb.className = 'quiz-fb ok';
    playOK(); speakCN(correct);
    if (quizOK % 5 === 0) launchConfetti();
  } else {
    quizFail++;
    btn.classList.add('wrong');
    if (blk) { blk.textContent = correct; blk.classList.add('correct'); }
    fb.textContent = `❌ 应填：${correct}`; fb.className = 'quiz-fb fail';
    playFail(); speakCN(quizCurrent.p.lines.join(''));
  }

  const total = quizOK + quizFail;
  document.getElementById('quizProg').style.width  = Math.min(total * 5, 100) + '%';
  document.getElementById('quizScore').innerHTML   = `✅ ${quizOK} &nbsp; ❌ ${quizFail}`;
  setTimeout(nextQuiz, ok ? 1400 : 2300);
}

function speakQuizPoem() {
  if (quizCurrent) speakCN(quizCurrent.p.lines.join(''));
}

// ══ AUDIO ═════════════════════════════════════════════════
function getACtx() {
  if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
  return aCtx;
}
function tone(f, d, type = 'sine', v = .16) {
  try {
    const ctx = getACtx(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = type;
    o.frequency.setValueAtTime(f, ctx.currentTime);
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d);
    o.start(); o.stop(ctx.currentTime + d);
  } catch(e) {}
}
function playOK()   { tone(659, .09); setTimeout(() => tone(784, .13), 90); }
function playFail() { tone(220, .22, 'sawtooth', .12); }

function speakCN(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.82;
  window.speechSynthesis.speak(u);
}

// ══ AI 讲诗意（调用本地 Ollama）══════════════════════════════
// 要求：Ollama 需在同一台设备上运行，且已设置
// OLLAMA_HOST=0.0.0.0 / OLLAMA_ORIGINS=* 允许跨域访问，否则浏览器会因 CORS 被拒绝。
//
// 采用 Ollama Structured Outputs（format: JSON Schema）强制模型按固定结构输出，
// 并对字数加上限，避免输出一大段看不懂的长文字（复用了奥数/汉字页面验证过的做法）。
const PM_OLLAMA_URL = 'http://localhost:11434/api/generate';
const PM_OLLAMA_MODEL = 'qwen2.5:14b';
const PM_MEANING_MAXLEN = 70;  // 诗意翻译最多多少字
const PM_STORY_MAXLEN   = 60;  // 创作背景/小故事最多多少字

const PM_STORY_SCHEMA = {
  type: 'object',
  properties: {
    meaning: { type: 'string', maxLength: PM_MEANING_MAXLEN,
      description: `用小学生能听懂的大白话，翻译整首诗在说什么，最多${PM_MEANING_MAXLEN}个字` },
    story:   { type: 'string', maxLength: PM_STORY_MAXLEN,
      description: `诗人写这首诗时发生了什么事、当时是什么心情或场景，最多${PM_STORY_MAXLEN}个字` },
  },
  required: ['meaning','story'],
};

function pmEscapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pmClampText(s, maxLen) {
  s = String(s || '').trim();
  return s.length > maxLen ? s.slice(0, maxLen) + '…' : s;
}

function buildPoemStoryPrompt(p) {
  return `你是一名给小学生讲古诗的语文老师，正在讲解【${p.dynasty}】${p.author}的《${p.title}》。
原文：${p.lines.join('')}

请你做两件事：
1. meaning：用小学生能听懂的大白话，把整首诗翻译成大家能懂的意思，说清楚诗人看到了什么、想到了什么。
   最多${PM_MEANING_MAXLEN}个字，要具体、有画面感，不要照抄原文的字。
2. story：讲一个诗人当时的小故事或场景——比如他在哪里、当时发生了什么事、心情是怎样的，
   为什么会写下这首诗。最多${PM_STORY_MAXLEN}个字，要有画面感，像讲故事一样。
   如果确实查不到具体创作背景，可以说明"这是一种合理的推测"，不要编造成确凿的历史事实。

直接输出内容，不要说"好的""下面是"这类客套话。`;
}

async function genPoemStory() {
  const p = POEMS[fcIdx];
  const box = document.getElementById('aiPoemBox');
  const btn = document.getElementById('aiPoemBtn');
  if (!p || !box) return;

  btn.disabled = true;
  box.classList.add('show');
  box.innerHTML = `<span class="ai-poem-tag">🤖 AI 讲诗意</span><div class="ai-poem-loading">正在生成，请稍候…</div>`;

  const prompt = buildPoemStoryPrompt(p);
  const idxAtStart = fcIdx; // 记录发起请求时的诗，回来后校验是否已经切到别的诗

  try {
    const resp = await fetch(PM_OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: PM_OLLAMA_MODEL,
        prompt,
        stream: false,
        format: PM_STORY_SCHEMA,
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const raw = (data.response || '').trim();
    if (!raw) throw new Error('空响应');
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch (e) { throw new Error('返回内容不是合法 JSON'); }
    if (!parsed.meaning || !parsed.story) throw new Error('返回内容缺少讲解字段');

    // 如果用户在等待期间已经切到了别的诗，就不要把旧请求的结果糊到新诗上
    if (fcIdx !== idxAtStart) return;

    const meaning = pmClampText(parsed.meaning, PM_MEANING_MAXLEN);
    const story   = pmClampText(parsed.story, PM_STORY_MAXLEN);
    box.innerHTML = `<span class="ai-poem-tag">🤖 AI 讲的诗意</span>
      <div class="ai-poem-block">📖 <b>诗意：</b>${pmEscapeHtml(meaning)}</div>
      <div class="ai-poem-block">✍️ <b>小故事：</b>${pmEscapeHtml(story)}</div>`;
  } catch (err) {
    if (fcIdx !== idxAtStart) return;
    box.innerHTML = `<span class="ai-poem-tag">🤖 AI 讲诗意</span>
      <div class="ai-poem-err">生成失败：无法连接本地 Ollama（${pmEscapeHtml(err.message)}）。<br>
      请确认：① 本机已安装并启动 Ollama；② 已执行 <code>ollama pull ${PM_OLLAMA_MODEL}</code>；
      ③ 若本页面不是从本机打开，需设置 <code>OLLAMA_ORIGINS=*</code> 允许跨域访问。</div>
      <button class="ai-poem-retry" onclick="genPoemStory()">🔄 重试</button>`;
  } finally {
    if (fcIdx === idxAtStart) btn.disabled = false;
  }
}

// ══ CONFETTI ══════════════════════════════════════════════
function launchConfetti() {
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const cols = ['#3B536B','#3B7558','#C8A84B','#C44B3B','#7EB0CC','#A8D5B5'];
  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const ps = Array.from({ length: 100 }, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height - cv.height,
    w: rand(5,12), h: rand(4,8), color: cols[rand(0, cols.length - 1)],
    vx: (Math.random() - .5) * 3, vy: rand(2, 5),
    angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * .2, op: 1,
  }));
  let frame = 0;
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    let alive = 0;
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.angle += p.spin;
      p.op = Math.max(0, 1 - frame / 120);
      if (p.y < cv.height + 20) alive++;
      ctx.save(); ctx.globalAlpha = p.op;
      ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive > 0 && frame < 150) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}
