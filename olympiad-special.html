<main class="page">
  <a class="back" href="olympiad-roadmap.html">← 返回奥数专项地图</a>
  <header class="hero"><h1>数学思维专项训练营</h1><p>每次只练一个方法：先看清问题，再选择表示法，最后解释和检验。完成的进度只保存在这台设备上。</p></header>
  <section class="panel" aria-labelledby="chooseTitle"><h2 id="chooseTitle">1. 选择当前年级</h2><p class="muted">页面会给出适龄的训练重点。年级只是建议，不是限制。</p><div class="grade-tabs" role="group" aria-label="选择年级"><button class="grade-tab on" data-grade="12">一～二年级</button><button class="grade-tab" data-grade="34">三～四年级</button><button class="grade-tab" data-grade="56">五～六年级</button></div><p id="guide" class="guide"></p></section>
  <section class="panel" aria-labelledby="moduleTitle"><h2 id="moduleTitle">2. 选择一个专项</h2><p class="muted">每个专项都按“认识方法 → 看懂示例 → 跟着练 → 独立挑战”推进，现已开放一组由浅入深的入门练习。</p><div class="module-grid" id="moduleGrid">
    <button class="module" data-key="number"><span class="icon">🔢</span><h3>数与运算</h3><p>凑整、拆分、规律、倍数与余数，练习看见数的结构。</p><span class="tag">数感与巧算</span></button>
    <button class="module" data-key="model"><span class="icon">🧩</span><h3>应用与建模</h3><p>把文字条件变成线段图、表格和数量关系。</p><span class="tag">和差倍 · 行程 · 比例</span></button>
    <button class="module" data-key="geometry"><span class="icon">📐</span><h3>图形与几何</h3><p>通过拼拆、补形和观察理解面积、角度与空间关系。</p><span class="tag">看图 · 画图 · 验证</span></button>
    <button class="module" data-key="logic"><span class="icon">🕵️</span><h3>逻辑与组合</h3><p>排除、对应、列表和有序枚举，确保不重不漏。</p><span class="tag">排除与枚举</span></button>
    <button class="module" data-key="numberTheory"><span class="icon">🔷</span><h3>数论启蒙</h3><p>从奇偶、约数、倍数和周期认识整数之间的关系。</p><span class="tag">整数结构</span></button>
    <button class="module" data-key="challenge"><span class="icon">🏁</span><h3>综合挑战</h3><p>面对陌生题选择策略，尝试一题多解，并复盘方法。</p><span class="tag">迁移与表达</span></button>
  </div></section>
  <section class="panel lesson" id="lesson" aria-live="polite"></section>
</main>

    {q:'2、4、6、8 都有什么共同点？',choices:['都是奇数','都是偶数','都是 5 的倍数'],answer:1,why:'它们都能两两配完，是偶数。'}
  ],
  logic:[
    {q:'小明、小丽、小军坐三把不同颜色的椅子。小明坐红椅，小丽不坐蓝椅。小丽坐什么椅？',choices:['红椅','黄椅','蓝椅'],answer:1,why:'红椅已被小明坐，小丽又不坐蓝椅，只能坐黄椅。'},
    {q:'有大、中、小三个盒子。小球不在大盒，也不在中盒，它在哪个盒？',choices:['大盒','中盒','小盒'],answer:2,why:'排除大盒和中盒后，只能在小盒。'},
    {q:'数字 1、2、3 中，哪个最大？',choices:['1','2','3'],answer:2,why:'比较数的大小，3 最大。'}
  ],
  challenge:[
    {q:'妈妈买了 3 袋面包，每袋 6 个，早餐吃了 4 个，还剩多少个？',choices:['10 个','14 个','18 个'],answer:1,why:'先算 3×6=18 个，再减去 4 个，剩 14 个。'},
    {q:'一根彩带长 16 厘米，剪成 4 段一样长，每段几厘米？',choices:['3 厘米','4 厘米','12 厘米'],answer:1,why:'16÷4=4。'},
    {q:'小华有 9 本书，小芳比小华多 3 本，两人一共有多少本？',choices:['12 本','18 本','21 本'],answer:2,why:'小芳有 12 本，两人共 9＋12=21 本。'}
  ]
}};
let grade='12',selected=-1,current=0,currentKey='logic',reviewMode=false,reviewQueue=[],reviewIndex=0;
const guide=document.getElementById('guide'),lesson=document.getElementById('lesson');
function renderCatalog(){const catalog=gradeCatalog[grade];document.querySelectorAll('.module').forEach(card=>{const item=catalog[card.dataset.key];card.querySelector('h3').textContent=item[0];card.querySelector('p').textContent=item[1];card.querySelector('.tag').textContent=item[2]})}
function setGrade(value){grade=value;document.querySelectorAll('.grade-tab').forEach(b=>b.classList.toggle('on',b.dataset.grade===grade));guide.textContent=gradeNotes[grade];renderCatalog();if(lesson.classList.contains('show'))showLesson(currentKey)}
function activeQuestions(){const base=gradeQuestionBanks[grade]?.[currentKey]||questionBanks[currentKey];const extension=gradeExtensionBanks[grade]?.[currentKey]||[];const sharedExtension=(grade==='34'||grade==='56')?questionBanks[currentKey]:[];return [...base,...extension,...sharedExtension]}
function doneKey(){return `hpx_olympiad_${currentKey}_${grade}_v1`}
function wrongKey(){return `hpx_olympiad_${currentKey}_${grade}_wrong_v1`}
function getDone(){return JSON.parse(localStorage.getItem(doneKey())||'[]')}
function getWrong(){return JSON.parse(localStorage.getItem(wrongKey())||'[]')}
function recordActivity(){const d=new Date(),today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,key='hpx_olympiad_activity_dates_v1';let dates=[];try{dates=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!dates.includes(today)){dates.push(today);localStorage.setItem(key,JSON.stringify(dates.slice(-90)))}}
function dots(){const done=getDone();return `<div class="progress" aria-label="专项进度">${activeQuestions().map((_,i)=>`<span class="dot ${done.includes(i)?'done':''}"></span>`).join('')}</div>`}
function showLesson(key){if(!modules[key]||!questionBanks[key])return;currentKey=key;current=0;selected=-1;reviewMode=false;reviewQueue=[];reviewIndex=0;renderPractice();lesson.classList.add('show');lesson.scrollIntoView({behavior:'smooth',block:'start'})}
function lessonSteps(){return `<div class="steps"><div class="step"><strong>1. 认识方法</strong>知道它解决什么问题。</div><div class="step"><strong>2. 看懂示例</strong>关注每一步的依据。</div><div class="step"><strong>3. 跟着练</strong>从提示题到变式题。</div><div class="step"><strong>4. 独立挑战</strong>无提示作答并完成复盘。</div></div>`}
function renderPractice(){const m={...modules[currentKey],...(gradeLessonGuides[grade]?.[currentKey]||{}),name:gradeCatalog[grade][currentKey][0]},item=activeQuestions()[current],title=reviewMode?`${m.name} · 错题复练 ${reviewIndex+1}/${reviewQueue.length}`:`${m.name} · 第 ${current+1} 关`,hint=reviewMode?'把这道题重新想一遍；答对后会从错题记录中移除。':'先理解方法，再完成三道由浅入深的入门练习。';lesson.innerHTML=`<div class="lesson-head"><div><h2>${title}</h2><p class="muted">${hint}</p></div><button class="close" onclick="closeLesson()">收起</button></div>${dots()}${lessonSteps()}<div class="method"><strong>本专项方法：</strong>${m.method}</div><p>${m.example}</p><article class="practice"><h3>${reviewMode?'复练题':'挑战题'}</h3><p>${item.q}</p><div class="choices">${item.choices.map((x,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><button class="check-btn" onclick="checkAnswer()">检查我的思路</button><button class="next-btn" onclick="nextQuestion()">${reviewMode?(reviewIndex===reviewQueue.length-1?'完成本轮复练':'下一道错题'):(current===activeQuestions().length-1?'进入独立挑战':'下一关')}</button><p id="result" class="result"></p></article><p class="muted" style="margin-top:12px">复盘提示：先判断是“漏条件”“方法没选对”，还是“计算或检查出了错”。</p>`}
function pick(i){selected=i;renderPractice()}
function checkAnswer(){const result=document.getElementById('result');if(selected<0){result.className='result no';result.textContent='先选择一个答案，再说说你依据了什么条件。';return}const item=activeQuestions()[current];if(selected===item.answer){const done=getDone();if(!done.includes(current)){done.push(current);localStorage.setItem(doneKey(),JSON.stringify(done))}recordActivity();if(reviewMode){localStorage.setItem(wrongKey(),JSON.stringify(getWrong().filter(i=>i!==current)))}result.className='result ok';result.textContent=reviewMode?'复练答对，已从错题记录中移除！'+item.why:'答对了！'+item.why}else{const wrong=getWrong();if(!wrong.includes(current)){wrong.push(current);localStorage.setItem(wrongKey(),JSON.stringify(wrong))}result.className='result no';result.textContent='再想一想：'+item.why}}
function nextQuestion(){if(!getDone().includes(current)){const result=document.getElementById('result');result.className='result no';result.textContent='先答对本题，才能进入下一关。';return}if(reviewMode){if(reviewIndex===reviewQueue.length-1){reviewMode=false;showStageSummary();return}reviewIndex+=1;current=reviewQueue[reviewIndex];selected=-1;renderPractice();return}if(current===activeQuestions().length-1){showStageSummary();return}current+=1;selected=-1;renderPractice()}
function startWrongReview(){const wrong=getWrong();if(!wrong.length){showStageSummary();return}reviewMode=true;reviewQueue=[...wrong];reviewIndex=0;current=reviewQueue[0];selected=-1;renderPractice()}
function showStageSummary(){reviewMode=false;const total=activeQuestions().length,wrong=getWrong(),reviewButton=wrong.length?`<button class="next-btn" onclick="startWrongReview()">错题复练（${wrong.length}）</button>`:'';lesson.innerHTML=`<div class="lesson-head"><div><h2>单元完成小结</h2><p class="muted">基础与进阶练习已完成，可以进入无提示独立挑战。</p></div><button class="close" onclick="closeLesson()">收起</button></div><article class="complete"><strong>完成率：${getDone().length}/${total}</strong><p>本次记录了 ${wrong.length} 道需要复练的题。复练答对后会自动清除对应记录。</p><button class="check-btn" onclick="showIndependentChallenge()">进入独立挑战</button>${reviewButton}</article>`}
function currentChallenge(){return independentChallenges[currentKey][grade]}
function showIndependentChallenge(){const m=modules[currentKey],task=currentChallenge();lesson.innerHTML=`<div class="lesson-head"><div><h2>${m.name} · 第四步：独立挑战</h2><p class="muted">这题没有提示，也不提供选项。先独立完成，再检查答案。</p></div><button class="close" onclick="closeLesson()">收起</button></div>${dots()}${lessonSteps()}<article class="practice"><h3>${grade==='12'?'一～二年级':grade==='34'?'三～四年级':'五～六年级'}独立挑战</h3><p>${task.q}</p><input id="independentAnswer" class="answer-input" inputmode="text" autocomplete="off" aria-label="填写独立挑战答案" placeholder="填写你的答案"><button class="check-btn" onclick="checkIndependent()">检查答案</button><p id="independentResult" class="result"></p></article>`}
function checkIndependent(){const task=currentChallenge(),input=document.getElementById('independentAnswer'),result=document.getElementById('independentResult');const answer=input.value.trim().replace(/\s+/g,'');if(!answer){result.className='result no';result.textContent='先独立填写答案，再检查。';return}if(answer===task.answer){result.className='result ok';result.innerHTML=`独立挑战完成！${task.why}<br><button class="next-btn" onclick="showReview()">进入复盘卡</button>`}else{result.className='result no';result.textContent='还不对。回到题目条件，再自己检查一次。'}}
function reviewKey(){return `hpx_olympiad_${currentKey}_${grade}_review_v1`}
function showReview(){const m=modules[currentKey];lesson.innerHTML=`<div class="lesson-head"><div><h2>${m.name} · 复盘卡</h2><p class="muted">把过程留下来，比只记住答案更重要。</p></div><button class="close" onclick="closeLesson()">收起</button></div><article class="practice"><h3>记录你的方法和错因</h3><label for="reviewMethod">这次主要用了什么方法？</label><select id="reviewMethod" class="review-select"><option value="画图或列表">画图或列表</option><option value="拆分或计算">拆分或计算</option><option value="逐条排除">逐条排除</option><option value="观察规律">观察规律</option><option value="其他方法">其他方法</option></select><p style="margin:13px 0 5px">这次有没有遇到卡点？（可多选）</p><div class="checklist"><label><input type="checkbox" value="漏看条件"> 漏看条件</label><label><input type="checkbox" value="方法没想到"> 方法没想到</label><label><input type="checkbox" value="计算出错"> 计算出错</label><label><input type="checkbox" value="没有检查"> 没有检查</label><label><input type="checkbox" value="没有卡住"> 没有卡住</label></div><label for="reviewNote">我下次想提醒自己：</label><textarea id="reviewNote" class="review-note" maxlength="120" placeholder="例如：先画线段图，再计算。"></textarea><button class="check-btn" onclick="saveReview()">保存复盘卡</button><p id="reviewResult" class="result"></p></article>`}
function saveReview(){const checks=[...document.querySelectorAll('.checklist input:checked')].map(x=>x.value);const data={method:document.getElementById('reviewMethod').value,issues:checks,note:document.getElementById('reviewNote').value.trim(),savedAt:new Date().toISOString()};localStorage.setItem(reviewKey(),JSON.stringify(data));const result=document.getElementById('reviewResult');result.className='result ok';result.textContent='复盘卡已保存在这台设备。你完成了本专项的第四步！'}
function closeLesson(){lesson.classList.remove('show');lesson.innerHTML=''}
document.querySelectorAll('.grade-tab').forEach(b=>b.addEventListener('click',()=>setGrade(b.dataset.grade)));document.querySelectorAll('.module').forEach(b=>b.addEventListener('click',()=>showLesson(b.dataset.key)));const requested=new URLSearchParams(location.search),requestedGrade=requested.get('grade'),requestedModule=requested.get('module');if(['12','34','56'].includes(requestedGrade))grade=requestedGrade;setGrade(grade);if(modules[requestedModule]){showLesson(requestedModule);if(requested.get('review')==='1')startWrongReview()}
</script>
</body>
</html>
