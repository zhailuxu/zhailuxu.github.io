<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>舒尔特方格｜慧陪学</title><meta name="description" content="在随机方格中按顺序寻找数字、字母或中文数字，练习视觉搜索和持续注意。"><link rel="stylesheet" href="hpx-game-mobile.css"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#435047;--accent:#6d4c41}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd 0%,#d5ecd2 55%,#e8f2df 100%)}button{font:inherit}.container{max-width:900px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6d4c41;text-shadow:2px 3px #d7ccc8}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}.card{background:rgba(233,244,227,.92);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}.group-label{font-size:.8rem;font-weight:700;color:#71806f;margin-right:2px}.chip,.action{border:2px solid #cad7c6;background:#f8fbf6;color:#5d554d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background}.chip:hover,.action:hover,.grid-cell:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(109,76,65,.22)}.chip:focus-visible,.action:focus-visible,.grid-cell:focus-visible{outline:4px solid rgba(21,101,192,.28);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.05rem;color:#6d4c41;margin-top:2px}.instruction{text-align:center;font-weight:700;color:#566558;line-height:1.6}.sub{text-align:center;font-size:.78rem;color:#7c8a7b;margin:5px 0 12px}
.target{max-width:460px;margin:0 auto 12px;background:#dfeadd;border-radius:14px;padding:9px;text-align:center;color:#637161;font-size:.82rem}.target b{font-size:1.25rem;color:#6d4c41;margin-left:5px}.board-wrap{position:relative;width:max-content;max-width:100%;margin:auto}.grid{--n:3;--cell:min(17vw,78px);display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:5px;padding:10px;background:#91aa8b;border-radius:18px;box-shadow:0 5px 16px rgba(54,79,57,.2)}.grid.size-4{--cell:min(15vw,68px)}.grid.size-5{--cell:min(12vw,59px)}.grid-cell{border:0;border-radius:10px;background:#f3f7ef;color:#526151;font-size:clamp(1.05rem,4vw,1.65rem);font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(58,83,58,.13);transition:.13s transform,.15s background}.grid-cell.done{background:#75a47a;color:#fff;box-shadow:inset 0 0 0 3px #b9d6b9}.grid-cell.wrong{animation:shake .34s ease;box-shadow:inset 0 0 0 4px #d04e44}.grid-cell.hint{background:#d5a13d;color:#fff;animation:pulse .7s ease 2}.cover{position:absolute;inset:0;z-index:3;border-radius:18px;background:#dfead9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#657263;text-align:center;padding:18px}.cover strong{color:#6d4c41;font-size:1.05rem}.cover[hidden]{display:none}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(.86)}}
.progress{max-width:460px;margin:14px auto 3px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7fa777,#4d7c52);border-radius:inherit;transition:width .2s}.progress-text{text-align:center;font-size:.78rem;color:#71806f}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.action{padding:9px 17px;border:0;box-shadow:0 3px 9px rgba(0,0,0,.12)}.primary{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.48;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:52px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#6d4c41;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}
@media(max-width:520px){.card{padding:12px}.status-row{grid-template-columns:repeat(2,1fr)}.grid{gap:4px;padding:8px}.grid.size-3{--cell:min(23vw,72px)}.grid.size-4{--cell:min(17vw,61px)}.grid.size-5{--cell:min(13.5vw,49px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body><main class="container"><header class="header"><h1>👀 舒尔特方格</h1><p>眼睛快速寻找目标，按正确顺序点击随机排列的格子。</p></header>
<section class="card"><div class="toolbar"><div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div><div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 3×3</button><button class="chip" data-level="medium">中年级 4×4</button><button class="chip" data-level="hard">高年级 5×5</button></div><div class="group" id="typeGroup"><span class="group-label">内容</span><button class="chip on" data-type="number">数字</button><button class="chip" data-type="reverse">倒序</button><button class="chip" data-type="letter">字母</button><button class="chip" data-type="chinese">中文数字</button></div><button class="chip" id="timeToggle">⏱ 用时显示 开</button><button class="chip" id="speakToggle">🔊 声音解说 开</button></div><div class="status-row"><div class="stat">当前进度<b id="roundText">自由练习</b></div><div class="stat">本题误点<b id="mistakeText">0 次</b></div><div class="stat">本题用时<b id="timeText">0.0 秒</b></div><div class="stat">最佳成绩<b id="bestText">--</b></div></div></section>
<section class="card"><p class="instruction" id="instruction">从1开始，按1、2、3……依次点击到9。</p><p class="sub">点击“开始寻找”后才会计时；关闭用时显示也不会影响成绩记录。</p><div class="target">下一个要找：<b id="targetText">1</b></div><div class="board-wrap"><div class="grid size-3" id="grid" role="grid" aria-label="舒尔特方格"></div><div class="cover" id="cover"><strong>准备好了吗？</strong><span>开始后格子会显示，计时同时启动。</span><button class="action primary" id="startBtn">开始寻找</button></div></div><div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">等待开始</p><div class="actions"><button class="action secondary" id="hintBtn" disabled>💡 提示下一个</button><button class="action muted" id="newBtn">↻ 换一张表</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div><div class="message" id="message" role="status" aria-live="polite">眼睛可以先扫一遍整张表，不需要从左上角逐格阅读。</div></section>
<section class="card help"><h2>练习小提醒</h2><ol><li>眼睛尽量看向方格中央，用余光寻找周围目标。</li><li>误点不会换题，找到正确目标后继续即可。</li><li>不喜欢计时压力，可以关闭用时显示，系统仍会安静记录成绩。</li></ol></section><a class="back" href="game-paradise.html">← 返回游戏乐园</a></main>
<script src="hpx-core.js"></script><script>
// 2026-08-15：本站独立设计；方格内容、排列顺序和成绩记录均由浏览器内代码生成。
(function(){'use strict';
const LEVELS={easy:{size:3},medium:{size:4},hard:{size:5}},STORE_KEY='hpxSchulteStatsV1';const state={mode:'practice',level:'easy',type:'number',game:null,phase:'ready',current:0,mistakes:0,startMs:0,elapsedMs:0,timer:null,showTime:true,challengeStep:1,challengeMs:0,challengeMistakes:0,stats:loadStats()};const el=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.92,pitch:1.08}):null;function say(t){if(speech)speech.speak(t)}el('speakToggle').addEventListener('click',()=>speech&&speech.toggle());
function loadStats(){try{return Object.assign({best:{},bestChallenge:{}},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{best:{},bestChallenge:{}}}}function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}function shuffled(a){const o=Array.from(a);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}function chineseNumber(n){const d=['','一','二','三','四','五','六','七','八','九'];if(n<10)return d[n];if(n===10)return'十';if(n<20)return'十'+d[n%10];return d[Math.floor(n/10)]+'十'+d[n%10]}
function labelFor(value,type){if(type==='letter')return String.fromCharCode(64+value);if(type==='chinese')return chineseNumber(value);return String(value)}function createGame(level,type){const count=LEVELS[level].size**2,values=Array.from({length:count},(_,i)=>i+1),order=type==='reverse'?values.slice().reverse():values.slice();return{size:LEVELS[level].size,cells:shuffled(values).map(value=>({value,label:labelFor(value,type)})),order,labels:order.map(value=>labelFor(value,type))}}function checkPick(order,current,value){return value===order[current]?{correct:true,next:current+1}:{correct:false,next:current}}
function key(){return`${state.level}:${state.type}`}function startGame(resetChallenge){stopTimer();if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeMs=0;state.challengeMistakes=0}state.game=createGame(state.level,state.type);state.phase='ready';state.current=0;state.mistakes=0;state.elapsedMs=0;render();setMessage('眼睛可以先扫一遍整张表，不需要从左上角逐格阅读。','');say('准备好后，点击开始寻找。')}
function render(){const g=state.game,grid=el('grid');grid.className=`grid size-${g.size}`;grid.style.setProperty('--n',g.size);grid.innerHTML='';g.cells.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='grid-cell';b.dataset.value=item.value;b.textContent=item.label;b.setAttribute('role','gridcell');b.setAttribute('aria-label',item.label);b.addEventListener('click',()=>pick(item.value,b));grid.appendChild(b)});el('cover').hidden=false;el('startBtn').disabled=false;el('hintBtn').disabled=true;el('newBtn').hidden=false;el('nextBtn').hidden=true;el('instruction').textContent=instructionText();updateStatus()}
function instructionText(){const last=state.game.labels.at(-1);if(state.type==='reverse')return`从${state.game.labels[0]}开始，按倒序依次点击到${last}。`;if(state.type==='letter')return`从A开始，按字母顺序依次点击到${last}。`;if(state.type==='chinese')return`从“一”开始，按中文数字顺序依次点击到“${last}”。`;return`从1开始，按1、2、3……依次点击到${last}。`}
function begin(){if(state.phase!=='ready')return;state.phase='running';state.startMs=performance.now();el('cover').hidden=true;el('hintBtn').disabled=false;state.timer=setInterval(()=>{state.elapsedMs=performance.now()-state.startMs;updateTime()},100);updateStatus();say(`请先找${state.game.labels[0]}。`)}function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function pick(value,button){if(state.phase!=='running')return;const result=checkPick(state.game.order,state.current,value);if(result.correct){button.classList.add('done');button.disabled=true;state.current=result.next;if(state.current===state.game.order.length)finish();else{setMessage('找对了，继续寻找下一个。','ok');updateStatus()}}else{state.mistakes++;button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setMessage(`现在要找的是“${state.game.labels[state.current]}”，本题不会跳走。`,'bad');say(`请找${state.game.labels[state.current]}。`);updateStatus()}}
function finish(){state.elapsedMs=performance.now()-state.startMs;stopTimer();state.phase='done';const k=key();if(!state.stats.best[k]||state.elapsedMs<state.stats.best[k])state.stats.best[k]=Math.round(state.elapsedMs);if(state.mode==='challenge'){state.challengeMs+=state.elapsedMs;state.challengeMistakes+=state.mistakes}saveStats();el('hintBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){if(!state.stats.bestChallenge[k]||state.challengeMs<state.stats.bestChallenge[k])state.stats.bestChallenge[k]=Math.round(state.challengeMs);saveStats();setMessage(`5关挑战完成！总用时${formatTime(state.challengeMs)}，共误点${state.challengeMistakes}次。`,'done');el('nextBtn').textContent='再挑战一次 ↻';say('五关挑战全部完成！')}else{setMessage(`全部找完！用时${formatTime(state.elapsedMs)}，误点${state.mistakes}次。`,'ok');el('nextBtn').textContent='下一题 →';say('全部找完了！')}celebrate();updateStatus()}
function hint(){if(state.phase!=='running')return;const value=state.game.order[state.current],cell=el('grid').querySelector(`[data-value="${value}"]`);cell.classList.add('hint');setTimeout(()=>cell.classList.remove('hint'),1300);setMessage(`提示：寻找“${state.game.labels[state.current]}”。`,'')}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}function formatTime(ms){return`${(ms/1000).toFixed(1)}秒`}function updateTime(){el('timeText').textContent=state.showTime?formatTime(state.elapsedMs):'已隐藏'}function updateStatus(){const total=state.game.order.length;el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('mistakeText').textContent=`${state.mistakes} 次`;updateTime();const best=state.mode==='challenge'?state.stats.bestChallenge[key()]:state.stats.best[key()];el('bestText').textContent=best?formatTime(best):'--';el('targetText').textContent=state.current<total?state.game.labels[state.current]:'完成';el('progressFill').style.width=`${state.current/total*100}%`;el('progressText').textContent=state.phase==='ready'?'等待开始':state.phase==='done'?`已完成 ${total} / ${total}`:`已找到 ${state.current} / ${total}`}
function setMessage(t,type){const m=el('message');m.textContent=t;m.className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(b=>b.classList.toggle('on',b.dataset[key]===value))}
el('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});el('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startGame(true)});el('typeGroup').addEventListener('click',e=>{if(!e.target.dataset.type)return;state.type=e.target.dataset.type;setSelected('typeGroup','type',state.type);startGame(true)});el('timeToggle').addEventListener('click',()=>{state.showTime=!state.showTime;el('timeToggle').textContent=state.showTime?'⏱ 用时显示 开':'⏱ 用时显示 关';el('timeToggle').classList.toggle('on',!state.showTime);updateTime()});el('startBtn').addEventListener('click',begin);el('hintBtn').addEventListener('click',hint);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<30;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top='-15px';d.style.background=colors[Math.floor(Math.random()*colors.length)];d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}}window.SchulteGrid={LEVELS,chineseNumber,labelFor,createGame,checkPick};startGame(false)})();
</script><script src="hpx-game-progress.js"></script><script src="feedback.js?v=20260906-2"></script><script data-goatcounter="https://zhailuxu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><script src="hpx-speech-compat.js"></script>
<script src="hpx-footer-actions.js"></script>
