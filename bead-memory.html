<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>闪记拼豆｜慧陪学</title>
  <meta name="description" content="短暂观察程序生成的彩色拼豆图案，隐藏后凭记忆逐格还原，练习专注力和视觉工作记忆。">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#445047;--accent:#6e6352}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e3f2dd,#d6ecd2 55%,#e9f2df)}button{font:inherit}.container{max-width:980px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.7rem,5vw,2.35rem);letter-spacing:3px;color:#6c5748;text-shadow:2px 3px #ddd2c2}.header p{margin-top:6px;color:#71806f;font-size:.92rem;line-height:1.6}.card{background:rgba(240,248,235,.95);border:1px solid rgba(255,255,255,.62);border-radius:22px;padding:16px;box-shadow:0 5px 22px rgba(54,79,57,.11);margin-bottom:14px}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.8rem;font-weight:700;color:#71806f}.chip,.action{border:2px solid #cbd8c7;background:#fbfdf9;color:#5d625d;border-radius:15px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.15s transform,.15s background}.chip:hover,.action:hover,.cell:hover{transform:translateY(-1px)}.chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 9px rgba(99,87,70,.22)}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border-radius:13px;background:#deecd9;padding:8px;text-align:center;color:#6d796b;font-size:.75rem}.stat b{display:block;font-size:1.04rem;color:#6c5748;margin-top:2px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.board-panel{text-align:center}.board-title{font-weight:850;color:#65594e;margin-bottom:7px}.board-sub{font-size:.75rem;color:#7a8678;min-height:18px;margin-bottom:6px}.board-wrap{position:relative;width:max-content;max-width:100%;margin:auto}.grid{--n:4;--cell:min(8vw,52px);display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));gap:4px;padding:9px;border-radius:19px;background:#9daf99;box-shadow:0 5px 14px rgba(52,75,54,.17);touch-action:none}.grid.size-6{--cell:min(6.4vw,43px)}.grid.size-8{--cell:min(5vw,34px);gap:3px}.cell{border:0;border-radius:8px;background:#eef4eb;box-shadow:inset 0 0 0 1px rgba(67,83,68,.12);cursor:pointer;transition:.1s transform,.12s background}.cell.filled{background:var(--color)}.cell.wrong{box-shadow:inset 0 0 0 4px #d2564d;animation:shake .34s ease}.cell:disabled{cursor:default}.preview-cover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:19px;background:#dfead9;text-align:center;color:#667366}.preview-cover[hidden]{display:none}.preview-cover strong{color:#6c5748;font-size:1.02rem}.countdown{font-size:1.55rem;font-weight:900;color:#8b5f47}.palette{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 5px}.palette-label{font-size:.78rem;color:#71806f;font-weight:750}.color-btn{width:43px;height:43px;border:3px solid #fff;border-radius:13px;background:var(--color);cursor:pointer;box-shadow:0 2px 8px rgba(54,73,55,.2)}.color-btn.eraser{background:#f4f5f1;color:#677168;font-size:1.1rem}.color-btn.on{outline:4px solid #886b55;outline-offset:2px}.progress{max-width:720px;margin:14px auto 4px;height:12px;border-radius:8px;background:#d7e5d3;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#9e8a67,#617c63);transition:width .2s}.progress-text{text-align:center;font-size:.79rem;color:#71806f}.actions{margin-top:13px}.action{border:0;padding:9px 16px;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#85745d,#6e6352);color:#fff}.secondary{background:#dbe9d6;color:#4d6b4f}.muted{background:#e5e8e2;color:#626862}.action:disabled{opacity:.45;cursor:default;transform:none}.action[hidden]{display:none}.message{min-height:50px;margin-top:12px;border-radius:14px;padding:11px 13px;text-align:center;line-height:1.55;background:#dfeadd;color:#5f6f60}.message.ok{background:#dcefdc;color:#26743b;font-weight:700}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:700}.message.done{background:#eee8c9;color:#705a18;font-weight:700}.help h2{font-size:1rem;color:#6c5748;margin-bottom:7px}.help ol{padding-left:22px;color:#5f6c60;font-size:.86rem;line-height:1.8}.back{display:block;text-align:center;color:#526f54;text-decoration:none;font-size:.88rem;margin-top:15px}.confetti{position:fixed;pointer-events:none;z-index:20;width:10px;height:10px;border-radius:3px;animation:fall 1.5s ease-out forwards}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes fall{from{transform:translate(0,-20px) rotate(0);opacity:1}to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}@media(max-width:650px){.card{padding:11px}.status-row{grid-template-columns:repeat(2,1fr)}.boards{grid-template-columns:1fr;gap:19px}.grid{--cell:min(18vw,54px)}.grid.size-6{--cell:min(12vw,43px)}.grid.size-8{--cell:min(8.6vw,34px)}.board-panel:first-child .board-wrap{transform:scale(.88);margin-top:-8px;margin-bottom:-8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
<link rel="stylesheet" href="hpx-game-mobile.css">

<body>
<main class="container">
  <header class="header"><h1>✨ 闪记拼豆</h1><p>先专心看清彩豆的位置和颜色，图案隐藏后凭记忆还原。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 4×4</button><button class="chip" data-level="medium">中年级 6×6</button><button class="chip" data-level="hard">高年级 8×8</button></div>
      <div class="group" id="timeGroup"><span class="group-label">观察</span><button class="chip" data-time="3">3秒</button><button class="chip on" data-time="5">5秒</button><button class="chip" data-time="8">8秒</button><button class="chip" data-time="0">自己决定</button></div>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">彩豆放对<b id="matchText">0 / 7 颗</b></div><div class="stat">检查次数<b id="checkText">0 次</b></div><div class="stat">最佳记录<b id="bestText">--</b></div></div>
  </section>
  <section class="card">
    <div class="boards">
      <div class="board-panel"><div class="board-title">记忆图案</div><div class="board-sub" id="previewSub">点击开始后再计时</div><div class="board-wrap"><div class="grid size-4" id="previewGrid" aria-label="需要记忆的拼豆图案"></div><div class="preview-cover" id="previewCover"><strong id="coverTitle">准备好了吗？</strong><span id="coverText">开始后仔细观察颜色和位置。</span><span class="countdown" id="countdown"></span><button class="action primary" id="startBtn">开始记忆</button></div></div></div>
      <div class="board-panel"><div class="board-title">我的还原</div><div class="board-sub">选颜色后点击或拖过格子</div><div class="board-wrap"><div class="grid size-4" id="workGrid" aria-label="我的拼豆还原区"></div></div></div>
    </div>
    <div class="palette" id="palette"><span class="palette-label">选择彩豆</span></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">等待开始记忆</p>
    <div class="actions"><button class="action primary" id="hideBtn" hidden>我记住了，开始还原</button><button class="action secondary" id="replayBtn" disabled>👀 再看2秒</button><button class="action primary" id="checkBtn" disabled>检查答案</button><button class="action muted" id="clearBtn" disabled>清空重来</button><button class="action muted" id="newBtn">↻ 换一个图案</button><button class="action primary" id="nextBtn" hidden>下一个图案 →</button></div>
    <div class="message" id="message" role="status" aria-live="polite">图案会由程序随机生成，每一题都不一样。</div>
  </section>
  <section class="card help"><h2>怎么玩</h2><ol><li>点击“开始记忆”，在设定时间内观察彩豆的位置和颜色。</li><li>图案隐藏后，选择颜色并点击或拖过右侧格子进行还原；橡皮可以清除格子。</li><li>检查后只标出不同的位置，不直接揭晓颜色，可以继续修改直到完全正确。</li></ol></section>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-15：本站独立设计；拼豆图案、颜色分布、展示流程和反馈均由浏览器内代码生成。
(function(){'use strict';
const LEVELS={easy:{size:4,colors:2,filled:7},medium:{size:6,colors:3,filled:15},hard:{size:8,colors:4,filled:27}},PALETTE=['#d96c68','#e0ac43','#65a474','#628fc0'],STORE_KEY='hpxBeadMemoryV1';
const state={mode:'practice',level:'easy',viewSeconds:5,game:null,user:[],phase:'ready',selected:1,wrong:new Set(),checks:0,replays:0,timer:null,challengeStep:1,challengeChecks:0,stats:loadStats(),painting:false};
const el=id=>document.getElementById(id);
function loadStats(){try{return Object.assign({bestChecks:{}},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return{bestChecks:{}}}}
function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.stats))}catch(e){}}
function shuffled(items){const out=Array.from(items);for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function generatePattern(level){const cfg=LEVELS[level],total=cfg.size**2,chosen=new Set([Math.floor(cfg.size/2)*cfg.size+Math.floor(cfg.size/2)]);while(chosen.size<cfg.filled){const frontier=new Set();for(const base of chosen){const row=Math.floor(base/cfg.size),col=base%cfg.size;[[row-1,col],[row+1,col],[row,col-1],[row,col+1]].filter(([r,c])=>r>=0&&r<cfg.size&&c>=0&&c<cfg.size).map(([r,c])=>r*cfg.size+c).filter(index=>!chosen.has(index)).forEach(index=>frontier.add(index))}const candidates=Array.from(frontier);chosen.add(candidates[Math.floor(Math.random()*candidates.length)])}const cells=Array(total).fill(0),positions=shuffled(Array.from(chosen));positions.forEach((index,i)=>{cells[index]=i<cfg.colors?i+1:1+Math.floor(Math.random()*cfg.colors)});return{size:cfg.size,colorCount:cfg.colors,cells}}
function comparePattern(target,user){const wrong=[];for(let i=0;i<target.length;i++)if(target[i]!==user[i])wrong.push(i);return wrong}
function countMatchedBeads(target,user){let matched=0,total=0;for(let i=0;i<target.length;i++)if(target[i]){total++;if(target[i]===user[i])matched++}return{matched,total}}
function startGame(resetChallenge){stopTimer();if(resetChallenge&&state.mode==='challenge'){state.challengeStep=1;state.challengeChecks=0}state.game=generatePattern(state.level);state.user=Array(state.game.cells.length).fill(0);state.phase='ready';state.selected=1;state.wrong=new Set();state.checks=0;state.replays=0;renderBoards();renderPalette();el('previewCover').hidden=false;el('coverTitle').textContent='准备好了吗？';el('coverText').textContent='开始后仔细观察颜色和位置。';el('countdown').textContent='';el('startBtn').hidden=false;el('hideBtn').hidden=true;el('replayBtn').disabled=true;el('checkBtn').disabled=true;el('clearBtn').disabled=true;el('newBtn').hidden=false;el('nextBtn').hidden=true;setMessage('图案会由程序随机生成，每一题都不一样。','');updateStatus()}
function renderBoards(){renderGrid('previewGrid',state.game.cells,false);renderGrid('workGrid',state.user,true)}
function renderGrid(id,cells,interactive){const grid=el(id);grid.className=`grid size-${state.game.size}`;grid.style.setProperty('--n',state.game.size);grid.innerHTML='';cells.forEach((value,index)=>{const button=document.createElement('button');button.type='button';button.className='cell'+(value?' filled':'')+(interactive&&state.wrong.has(index)?' wrong':'');if(value)button.style.setProperty('--color',PALETTE[value-1]);button.disabled=!interactive||state.phase!=='rebuild';button.setAttribute('aria-label',value?`第${index+1}格，颜色${value}`:`第${index+1}格，空白`);if(interactive){button.addEventListener('pointerdown',event=>{event.preventDefault();state.painting=true;paint(index)});button.addEventListener('pointerenter',()=>{if(state.painting)paint(index)});button.addEventListener('click',()=>paint(index))}grid.appendChild(button)})}
function renderPalette(){const palette=el('palette');palette.innerHTML='<span class="palette-label">选择彩豆</span>';PALETTE.slice(0,state.game.colorCount).forEach((color,index)=>{const button=document.createElement('button');button.type='button';button.className='color-btn'+(state.selected===index+1?' on':'');button.style.setProperty('--color',color);button.setAttribute('aria-label',`选择颜色${index+1}`);button.addEventListener('click',()=>{state.selected=index+1;renderPalette()});palette.appendChild(button)});const eraser=document.createElement('button');eraser.type='button';eraser.className='color-btn eraser'+(state.selected===0?' on':'');eraser.textContent='⌫';eraser.setAttribute('aria-label','橡皮擦');eraser.addEventListener('click',()=>{state.selected=0;renderPalette()});palette.appendChild(eraser)}
function beginMemory(){if(state.phase!=='ready')return;state.phase='memorize';el('previewCover').hidden=true;el('startBtn').hidden=true;el('newBtn').hidden=true;if(state.viewSeconds===0){el('hideBtn').hidden=false;el('previewSub').textContent='看清后手动开始还原'}else{let left=state.viewSeconds;el('previewSub').textContent=`还剩 ${left} 秒`;el('countdown').textContent='';state.timer=setInterval(()=>{left--;el('previewSub').textContent=left>0?`还剩 ${left} 秒`:'时间到';if(left<=0){stopTimer();hideTarget()}},1000)}updateStatus()}
function hideTarget(){if(state.phase!=='memorize'&&state.phase!=='peek')return;stopTimer();state.phase='rebuild';el('previewCover').hidden=false;el('coverTitle').textContent='图案已隐藏';el('coverText').textContent='现在凭记忆还原右侧拼豆。';el('countdown').textContent='🙈';el('startBtn').hidden=true;el('hideBtn').hidden=true;el('previewSub').textContent='需要时可再看2秒';el('replayBtn').disabled=false;el('checkBtn').disabled=false;el('clearBtn').disabled=false;el('newBtn').hidden=false;renderGrid('workGrid',state.user,true);updateStatus()}
function replay(){if(state.phase!=='rebuild')return;state.replays++;state.phase='peek';el('previewCover').hidden=true;el('replayBtn').disabled=true;el('checkBtn').disabled=true;el('previewSub').textContent='再看 2 秒';state.timer=setTimeout(()=>{stopTimer();hideTarget()},2000)}
function paint(index){if(state.phase!=='rebuild'||state.user[index]===state.selected)return;state.user[index]=state.selected;state.wrong.delete(index);renderGrid('workGrid',state.user,true);updateStatus()}
function checkAnswer(){if(state.phase!=='rebuild')return;state.checks++;const wrong=comparePattern(state.game.cells,state.user);state.wrong=new Set(wrong);if(!wrong.length){finish();return}renderGrid('workGrid',state.user,true);setMessage(`还有${wrong.length}格不同，红框只提示位置，不会揭晓正确颜色。`,'bad');updateStatus()}
function clearWork(){if(state.phase!=='rebuild')return;state.user.fill(0);state.wrong.clear();renderGrid('workGrid',state.user,true);updateStatus();setMessage('还原区已经清空，可以重新拼。','')}
function finish(){state.phase='done';if(state.mode==='challenge')state.challengeChecks+=state.checks;const previous=state.stats.bestChecks[state.level];if(previous===undefined||state.checks<previous){state.stats.bestChecks[state.level]=state.checks;saveStats()}renderGrid('workGrid',state.user,true);el('previewCover').hidden=true;el('previewSub').textContent='原图再次显示';el('replayBtn').disabled=true;el('checkBtn').disabled=true;el('clearBtn').disabled=true;el('newBtn').hidden=true;el('nextBtn').hidden=false;if(state.mode==='challenge'&&state.challengeStep===5){el('nextBtn').textContent='再挑战一次 ↻';setMessage(`5关全部完成！共检查${state.challengeChecks}次。`,'done')}else{el('nextBtn').textContent='下一个图案 →';setMessage(`完全还原！检查${state.checks}次，再看提示${state.replays}次。`,'done')}updateStatus();celebrate()}
function next(){if(state.mode==='challenge'){if(state.challengeStep===5){startGame(true);return}state.challengeStep++}startGame(false)}
function stopTimer(){if(state.timer){clearInterval(state.timer);clearTimeout(state.timer);state.timer=null}}
function updateStatus(){const progress=countMatchedBeads(state.game.cells,state.user);el('roundText').textContent=state.mode==='challenge'?`${state.challengeStep} / 5`:'自由练习';el('matchText').textContent=`${progress.matched} / ${progress.total} 颗`;el('checkText').textContent=`${state.checks} 次`;const best=state.stats.bestChecks[state.level];el('bestText').textContent=best===undefined?'--':`${best} 次`;el('progressFill').style.width=`${progress.matched/progress.total*100}%`;el('progressText').textContent=state.phase==='ready'?'等待开始记忆':state.phase==='memorize'?'正在观察图案':state.phase==='done'?'已经完全还原':`已放对 ${progress.matched} / ${progress.total} 颗彩豆`}
function setMessage(text,type){const message=el('message');message.textContent=text;message.className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(button=>button.classList.toggle('on',String(button.dataset[key])===String(value)))}
el('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startGame(true)});el('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;const recommended={easy:8,medium:5,hard:3};state.viewSeconds=recommended[state.level];setSelected('levelGroup','level',state.level);setSelected('timeGroup','time',state.viewSeconds);startGame(true)});el('timeGroup').addEventListener('click',event=>{if(event.target.dataset.time===undefined)return;state.viewSeconds=Number(event.target.dataset.time);setSelected('timeGroup','time',state.viewSeconds);startGame(false)});el('startBtn').addEventListener('click',beginMemory);el('hideBtn').addEventListener('click',hideTarget);el('replayBtn').addEventListener('click',replay);el('checkBtn').addEventListener('click',checkAnswer);el('clearBtn').addEventListener('click',clearWork);el('newBtn').addEventListener('click',()=>startGame(false));el('nextBtn').addEventListener('click',next);document.addEventListener('pointerup',()=>{state.painting=false});document.addEventListener('pointercancel',()=>{state.painting=false});
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ef617b','#f4b43a','#48a66b','#4f87c7','#8a68b5'];for(let i=0;i<28;i++){const dot=document.createElement('i');dot.className='confetti';dot.style.left=Math.random()*100+'vw';dot.style.top='-15px';dot.style.background=colors[Math.floor(Math.random()*colors.length)];dot.style.setProperty('--dx',(Math.random()*180-90)+'px');dot.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(dot);setTimeout(()=>dot.remove(),2000)}}
window.BeadMemory={LEVELS,PALETTE,generatePattern,comparePattern,countMatchedBeads};startGame(false)})();
</script>
