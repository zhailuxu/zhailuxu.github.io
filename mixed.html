<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>混合运算 — 加减乘除与括号</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:"华文圆体","微软雅黑","Comic Sans MS",sans-serif;
  background:linear-gradient(145deg,#f3e5f5 0%,#ede7f6 40%,#fff8e1 100%);
  min-height:100vh; padding:16px 14px 48px;
}
.container{ max-width:680px; margin:0 auto; }

/* ── header ── */
.hdr{ text-align:center; padding:14px 0 10px; }
.hdr h1{ font-size:1.85rem; color:#4a148c; text-shadow:2px 2px 0 #ce93d8; letter-spacing:3px; }
.hdr p{ font-size:.82rem; color:#aaa; margin-top:4px; }

/* ── tabs ── */
.tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
.tab-btn{
  padding:8px 22px; border:none; border-radius:20px;
  font-size:.92rem; font-weight:bold; cursor:pointer;
  background:rgba(255,255,255,.7); color:#666;
  box-shadow:0 2px 8px rgba(0,0,0,.08); transition:all .18s;
}
.tab-btn.on{ background:#6a1b9a; color:#fff; box-shadow:0 4px 14px rgba(106,27,154,.35); }

/* ── card ── */
.card{
  background:rgba(255,255,255,.92); border-radius:20px;
  padding:18px 16px; box-shadow:0 4px 20px rgba(0,0,0,.1); margin-bottom:12px;
}

/* ── level pills ── */
.lv-row{ display:flex; gap:6px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
.lv-btn{
  padding:6px 16px; border:2px solid #ce93d8; border-radius:18px;
  background:#fff; color:#7b1fa2; font-size:.82rem; font-weight:bold;
  cursor:pointer; transition:all .15s;
}
.lv-btn.on{ background:#7b1fa2; color:#fff; border-color:#7b1fa2; }

/* ── expression display ── */
.expr-area{
  min-height:110px; display:flex; align-items:center; justify-content:center;
  padding:14px 12px; margin-bottom:10px;
}
.expr-box{
  font-size:clamp(1.5rem,5.5vw,2.4rem); font-weight:bold; color:#333;
  text-align:center; line-height:1.6; word-break:break-word;
  transition:opacity .18s;
}
.expr-box.fading{ opacity:0; }

mark{
  background:linear-gradient(135deg,#ffd54f,#ffb300);
  border:2.5px solid #ff8f00; border-radius:8px;
  padding:2px 8px; font-style:normal; color:#222;
  box-shadow:0 3px 10px rgba(255,143,0,.3);
  display:inline-block;
}
mark.final{
  background:linear-gradient(135deg,#a5d6a7,#66bb6a);
  border-color:#2e7d32; color:#1b5e20;
  box-shadow:0 3px 10px rgba(46,125,50,.3);
}

/* ── tip box ── */
.tip-box{
  background:linear-gradient(135deg,#ede7f6,#e8eaf6);
  border-left:4px solid #7b1fa2; border-radius:12px;
  padding:10px 14px; font-size:.95rem; color:#333; text-align:center;
  min-height:46px; display:flex; align-items:center; justify-content:center;
  margin-bottom:12px;
}

/* ── rule banner ── */
.rule-banner{
  background:#fff9c4; border:1.5px solid #f9a825; border-radius:12px;
  padding:8px 14px; font-size:.82rem; color:#555; text-align:center;
  margin-bottom:12px;
}
.rule-banner b{ color:#e65100; }

/* ── step progress ── */
.step-prog{ display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
.step-dot{
  width:10px; height:10px; border-radius:50%;
  background:#e0e0e0; transition:background .2s;
}
.step-dot.on{ background:#7b1fa2; }
.step-dot.done{ background:#ce93d8; }

/* ── buttons ── */
.btn{ border:none; border-radius:12px; padding:10px 20px; font-size:.92rem; font-weight:bold; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.1); transition:transform .12s; }
.btn:active{ transform:scale(.95); }
.btn-purple{ background:linear-gradient(135deg,#ce93d8,#6a1b9a); color:#fff; }
.btn-green { background:linear-gradient(135deg,#81c784,#2e7d32); color:#fff; }
.btn-orange{ background:linear-gradient(135deg,#ffb74d,#e65100); color:#fff; }
.btn-blue  { background:linear-gradient(135deg,#64b5f6,#1565c0); color:#fff; }
.btn-gray  { background:#e0e0e0; color:#555; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.gap8{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.nav-row{ display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:8px; }
.step-label{ font-size:.82rem; color:#aaa; min-width:64px; text-align:center; }

/* ── practice ── */
.prac-expr{
  font-size:clamp(1.6rem,6vw,2.6rem); font-weight:bold; color:#4a148c;
  text-align:center; padding:16px 10px; letter-spacing:2px;
}
.ans-row{ display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:12px; }
.ans-inp{
  width:120px; height:56px; border:3px solid #ce93d8; border-radius:14px;
  text-align:center; font-size:2rem; font-weight:bold; color:#333;
  background:#f3e5f5; outline:none; -moz-appearance:textfield;
}
.ans-inp:focus{ border-color:#6a1b9a; }
.ans-inp::-webkit-inner-spin-button,.ans-inp::-webkit-outer-spin-button{-webkit-appearance:none;}
.ans-inp.ok  { border-color:#43a047; background:#e8f5e9; color:#2e7d32; }
.ans-inp.bad { border-color:#e53935; background:#ffebee; color:#c62828; }
.prac-fb{ text-align:center; font-size:1rem; font-weight:bold; min-height:28px; margin-bottom:8px; }
.prac-fb.ok  { color:#2e7d32; }
.prac-fb.bad { color:#c62828; }

/* ── quiz ── */
.qmeta{ display:flex; justify-content:space-between; font-size:.88rem; color:#888; margin-bottom:10px; }
.quiz-q{
  background:#fff; border-radius:16px; padding:20px 16px; text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.1); margin-bottom:12px; min-height:120px;
  display:flex; flex-direction:column; justify-content:center; gap:8px;
}
.quiz-big{ font-size:clamp(1.5rem,5vw,2.2rem); font-weight:bold; color:#4a148c; word-break:break-word; }
.quiz-lbl{ font-size:.8rem; color:#ccc; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.ch-btn{
  padding:14px 8px; border:2.5px solid #e0e0e0; border-radius:14px;
  background:#fff; font-size:1.1rem; font-weight:bold; cursor:pointer;
  transition:all .14s; min-height:54px;
  display:flex; align-items:center; justify-content:center;
}
.ch-btn:hover{ border-color:#ce93d8; background:#f3e5f5; }
.ch-btn.correct{ border-color:#43a047; background:#e8f5e9; color:#2e7d32; }
.ch-btn.wrong  { border-color:#e53935; background:#ffebee; color:#c62828; }
.qfb{ text-align:center; font-size:1rem; font-weight:bold; min-height:28px; margin-bottom:8px; }
.qfb.ok  { color:#2e7d32; }
.qfb.bad { color:#c62828; }
.quiz-done{ text-align:center; padding:20px 0; }
.score-big{ font-size:3rem; font-weight:bold; color:#4a148c; }

/* ── toast ── */
#toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#323232; color:#fff; border-radius:20px; padding:10px 22px;
  font-size:.88rem; opacity:0; transition:opacity .2s,transform .2s;
  pointer-events:none; z-index:9999; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.hidden{ display:none !important; }
.mt10{ margin-top:10px; }

  </div>
  <div class="card">

<script src="hpx-core.js"></script>
<script>
// ─── voice ───────────────────────────────────────────────────────────────────
Hpx.speech.install({rate:0.88,startDelayMs:50});

// ─── audio ───────────────────────────────────────────────────────────────────
let _ac = null;
function tone(f, d, t='sine', v=.2) {
  try {
    if (!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.connect(g); g.connect(_ac.destination);
    o.type = t; o.frequency.setValueAtTime(f, _ac.currentTime);
    g.gain.setValueAtTime(v, _ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, _ac.currentTime + d);
    o.start(); o.stop(_ac.currentTime + d);
  } catch(e){}
}
const playPop  = () => tone(440, .05);
const playOk   = () => { tone(523,.08); setTimeout(()=>tone(659,.14),80); };
const playFail = () => tone(200, .18, 'sawtooth', .12);
const playWin  = () => { [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.14),i*80)); };

// ─── utils ───────────────────────────────────────────────────────────────────
const ri = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) { const j = ri(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
let _tid = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tid); _tid = setTimeout(()=>el.classList.remove('show'), 2000);
}

// ─── Problem generators ───────────────────────────────────────────────────────
// Problem: { expr(plain), answer, steps:[{html, tip}] }
// steps: last step always has mark.final wrapping the answer

function step(html, tip) { return {html, tip}; }
const hl = (x) => `<mark>${x}</mark>`;
const fin = (x) => `<mark class="final">${x}</mark>`;

// Level 1: two-step, no parens (mul/div beats add/sub)
const L1 = [
  () => { // a + b×c
    const b=ri(2,9),c=ri(2,9),a=ri(1,20); const bc=b*c,ans=a+bc;
    return { expr:`${a} + ${b} × ${c}`, answer:ans, steps:[
      step(`${a} + ${hl(`${b} × ${c}`)}`, `乘除优先：${b} × ${c} = ${bc}`),
      step(hl(`${a} + ${bc}`), `再算加法：${a} + ${bc} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a - b×c (a > b×c)
    const b=ri(2,6),c=ri(2,6),bc=b*c,a=ri(bc+1,bc+20); const ans=a-bc;
    return { expr:`${a} - ${b} × ${c}`, answer:ans, steps:[
      step(`${a} - ${hl(`${b} × ${c}`)}`, `乘除优先：${b} × ${c} = ${bc}`),
      step(hl(`${a} - ${bc}`), `再算减法：${a} - ${bc} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a×b + c
    const a=ri(2,9),b=ri(2,9),c=ri(1,20); const ab=a*b,ans=ab+c;
    return { expr:`${a} × ${b} + ${c}`, answer:ans, steps:[
      step(`${hl(`${a} × ${b}`)} + ${c}`, `乘除优先：${a} × ${b} = ${ab}`),
      step(hl(`${ab} + ${c}`), `再算加法：${ab} + ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a×b - c (ab > c)
    const a=ri(2,9),b=ri(2,9),ab=a*b,c=ri(1,ab-1); const ans=ab-c;
    return { expr:`${a} × ${b} - ${c}`, answer:ans, steps:[
      step(`${hl(`${a} × ${b}`)} - ${c}`, `乘除优先：${a} × ${b} = ${ab}`),
      step(hl(`${ab} - ${c}`), `再算减法：${ab} - ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a + b÷c (b=c×q)
    const c=ri(2,9),q=ri(1,9),b=c*q,a=ri(1,20); const ans=a+q;
    return { expr:`${a} + ${b} ÷ ${c}`, answer:ans, steps:[
      step(`${a} + ${hl(`${b} ÷ ${c}`)}`, `乘除优先：${b} ÷ ${c} = ${q}`),
      step(hl(`${a} + ${q}`), `再算加法：${a} + ${q} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a÷b - c (a=b×q, q>c)
    const b=ri(2,9),q=ri(3,9),a=b*q,c=ri(1,q-1); const ans=q-c;
    return { expr:`${a} ÷ ${b} - ${c}`, answer:ans, steps:[
      step(`${hl(`${a} ÷ ${b}`)} - ${c}`, `乘除优先：${a} ÷ ${b} = ${q}`),
      step(hl(`${q} - ${c}`), `再算减法：${q} - ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a÷b + c
    const b=ri(2,9),q=ri(1,9),a=b*q,c=ri(1,20); const ans=q+c;
    return { expr:`${a} ÷ ${b} + ${c}`, answer:ans, steps:[
      step(`${hl(`${a} ÷ ${b}`)} + ${c}`, `乘除优先：${a} ÷ ${b} = ${q}`),
      step(hl(`${q} + ${c}`), `再算加法：${q} + ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a - b÷c (a > q)
    const c=ri(2,9),q=ri(1,8),b=c*q,a=ri(q+1,q+20); const ans=a-q;
    return { expr:`${a} - ${b} ÷ ${c}`, answer:ans, steps:[
      step(`${a} - ${hl(`${b} ÷ ${c}`)}`, `乘除优先：${b} ÷ ${c} = ${q}`),
      step(hl(`${a} - ${q}`), `再算减法：${a} - ${q} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
];

// Level 2: two-step, with parens
const L2 = [
  () => { // (a+b)×c
    const a=ri(2,15),b=ri(2,15),c=ri(2,9); const s=a+b,ans=s*c;
    return { expr:`(${a} + ${b}) × ${c}`, answer:ans, steps:[
      step(`(${hl(`${a} + ${b}`)}) × ${c}`, `括号优先：${a} + ${b} = ${s}`),
      step(hl(`${s} × ${c}`), `再算乘法：${s} × ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // (a-b)×c (a>b)
    const b=ri(2,9),a=ri(b+1,b+10),c=ri(2,9); const d=a-b,ans=d*c;
    return { expr:`(${a} - ${b}) × ${c}`, answer:ans, steps:[
      step(`(${hl(`${a} - ${b}`)}) × ${c}`, `括号优先：${a} - ${b} = ${d}`),
      step(hl(`${d} × ${c}`), `再算乘法：${d} × ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // (a+b)÷c, sum divisible by c
    const c=ri(2,9),q=ri(2,9),s=c*q,a=ri(1,s-1),b=s-a;
    return { expr:`(${a} + ${b}) ÷ ${c}`, answer:q, steps:[
      step(`(${hl(`${a} + ${b}`)}) ÷ ${c}`, `括号优先：${a} + ${b} = ${s}`),
      step(hl(`${s} ÷ ${c}`), `再算除法：${s} ÷ ${c} = ${q}`),
      step(fin(q), `✅ 答案是 ${q}`),
    ]};
  },
  () => { // (a-b)÷c (a>b, diff divisible by c)
    const c=ri(2,6),q=ri(1,8),d=c*q,b=ri(1,10),a=b+d;
    return { expr:`(${a} - ${b}) ÷ ${c}`, answer:q, steps:[
      step(`(${hl(`${a} - ${b}`)}) ÷ ${c}`, `括号优先：${a} - ${b} = ${d}`),
      step(hl(`${d} ÷ ${c}`), `再算除法：${d} ÷ ${c} = ${q}`),
      step(fin(q), `✅ 答案是 ${q}`),
    ]};
  },
  () => { // a×(b+c)
    const a=ri(2,9),b=ri(2,9),c=ri(2,9); const s=b+c,ans=a*s;
    return { expr:`${a} × (${b} + ${c})`, answer:ans, steps:[
      step(`${a} × (${hl(`${b} + ${c}`)})`, `括号优先：${b} + ${c} = ${s}`),
      step(hl(`${a} × ${s}`), `再算乘法：${a} × ${s} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a×(b-c) (b>c)
    const a=ri(2,9),c=ri(2,6),b=ri(c+1,c+8); const d=b-c,ans=a*d;
    return { expr:`${a} × (${b} - ${c})`, answer:ans, steps:[
      step(`${a} × (${hl(`${b} - ${c}`)})`, `括号优先：${b} - ${c} = ${d}`),
      step(hl(`${a} × ${d}`), `再算乘法：${a} × ${d} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a÷(b+c), a divisible by (b+c)
    const s=ri(3,9),q=ri(2,9),a=s*q,b=ri(1,s-1),c=s-b;
    return { expr:`${a} ÷ (${b} + ${c})`, answer:q, steps:[
      step(`${a} ÷ (${hl(`${b} + ${c}`)})`, `括号优先：${b} + ${c} = ${s}`),
      step(hl(`${a} ÷ ${s}`), `再算除法：${a} ÷ ${s} = ${q}`),
      step(fin(q), `✅ 答案是 ${q}`),
    ]};
  },
  () => { // a÷(b-c) (b>c)
    const c=ri(2,5),b=ri(c+2,c+6),d=b-c,q=ri(2,9),a=d*q;
    return { expr:`${a} ÷ (${b} - ${c})`, answer:q, steps:[
      step(`${a} ÷ (${hl(`${b} - ${c}`)})`, `括号优先：${b} - ${c} = ${d}`),
      step(hl(`${a} ÷ ${d}`), `再算除法：${a} ÷ ${d} = ${q}`),
      step(fin(q), `✅ 答案是 ${q}`),
    ]};
  },
];

// Level 3: three-step
const L3 = [
  () => { // a×b + c×d
    const a=ri(2,9),b=ri(2,9),c=ri(2,6),d=ri(2,6);
    const ab=a*b,cd=c*d,ans=ab+cd;
    return { expr:`${a} × ${b} + ${c} × ${d}`, answer:ans, steps:[
      step(`${hl(`${a} × ${b}`)} + ${c} × ${d}`, `乘除优先（从左）：${a} × ${b} = ${ab}`),
      step(`${ab} + ${hl(`${c} × ${d}`)}`, `继续乘除：${c} × ${d} = ${cd}`),
      step(hl(`${ab} + ${cd}`), `最后加法：${ab} + ${cd} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a×b - c×d (ab > cd)
    const c=ri(2,5),d=ri(2,5),cd=c*d;
    const a=ri(2,9),b=ri(2,9);
    const ab=a*b; if(ab<=cd) return L3[0]();
    const ans=ab-cd;
    return { expr:`${a} × ${b} - ${c} × ${d}`, answer:ans, steps:[
      step(`${hl(`${a} × ${b}`)} - ${c} × ${d}`, `乘除优先（从左）：${a} × ${b} = ${ab}`),
      step(`${ab} - ${hl(`${c} × ${d}`)}`, `继续乘除：${c} × ${d} = ${cd}`),
      step(hl(`${ab} - ${cd}`), `最后减法：${ab} - ${cd} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // (a+b)×c + d
    const a=ri(2,10),b=ri(2,10),c=ri(2,6),d=ri(1,20);
    const s=a+b,sc=s*c,ans=sc+d;
    return { expr:`(${a} + ${b}) × ${c} + ${d}`, answer:ans, steps:[
      step(`(${hl(`${a} + ${b}`)}) × ${c} + ${d}`, `括号优先：${a} + ${b} = ${s}`),
      step(`${hl(`${s} × ${c}`)} + ${d}`, `再算乘法：${s} × ${c} = ${sc}`),
      step(hl(`${sc} + ${d}`), `最后加法：${sc} + ${d} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // d + (a-b)×c (a>b)
    const b=ri(2,6),a=ri(b+1,b+8),c=ri(2,8),d=ri(1,20);
    const diff=a-b,dc=diff*c,ans=d+dc;
    return { expr:`${d} + (${a} - ${b}) × ${c}`, answer:ans, steps:[
      step(`${d} + (${hl(`${a} - ${b}`)}) × ${c}`, `括号优先：${a} - ${b} = ${diff}`),
      step(`${d} + ${hl(`${diff} × ${c}`)}`, `再算乘法：${diff} × ${c} = ${dc}`),
      step(hl(`${d} + ${dc}`), `最后加法：${d} + ${dc} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // (a+b)÷c × d, (a+b) divisible by c
    const c=ri(2,6),q=ri(2,6),s=c*q,a=ri(1,s-1),b=s-a,d=ri(2,8);
    const ans=q*d;
    return { expr:`(${a} + ${b}) ÷ ${c} × ${d}`, answer:ans, steps:[
      step(`(${hl(`${a} + ${b}`)}) ÷ ${c} × ${d}`, `括号优先：${a} + ${b} = ${s}`),
      step(`${hl(`${s} ÷ ${c}`)} × ${d}`, `再算除法：${s} ÷ ${c} = ${q}`),
      step(hl(`${q} × ${d}`), `最后乘法：${q} × ${d} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // a × b ÷ c (a×b divisible by c)
    const c=ri(2,9),q=ri(2,9),ab=c*q,a=ri(2,9); if(ab%a!==0) return L3[0]();
    const b=ab/a,ans=q;
    return { expr:`${a} × ${b} ÷ ${c}`, answer:ans, steps:[
      step(`${hl(`${a} × ${b}`)} ÷ ${c}`, `同级从左算：${a} × ${b} = ${ab}`),
      step(hl(`${ab} ÷ ${c}`), `再算除法：${ab} ÷ ${c} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
  () => { // (a+b) × (c-d)  (c>d)
    const d=ri(1,5),c=ri(d+1,d+8),a=ri(1,10),b=ri(1,10);
    const s1=a+b,s2=c-d,ans=s1*s2;
    return { expr:`(${a} + ${b}) × (${c} - ${d})`, answer:ans, steps:[
      step(`(${hl(`${a} + ${b}`)}) × (${c} - ${d})`, `先算左括号：${a} + ${b} = ${s1}`),
      step(`${s1} × (${hl(`${c} - ${d}`)})`, `再算右括号：${c} - ${d} = ${s2}`),
      step(hl(`${s1} × ${s2}`), `最后乘法：${s1} × ${s2} = ${ans}`),
      step(fin(ans), `✅ 答案是 ${ans}`),
    ]};
  },
];

const BANKS = [null, L1, L2, L3];

function genProblem(lv) {
  const bank = lv === 0 ? BANKS[ri(1,3)] : BANKS[lv];
  let p;
  let tries = 0;
  do { p = bank[ri(0, bank.length-1)](); tries++; } while (!p && tries < 10);
  return p;
}

// ─── Tab ─────────────────────────────────────────────────────────────────────
let curTab = 'demo';
function switchTab(t) {
  curTab = t;
  Hpx.tabs.activate(t,['demo','prac','quiz'],{hiddenClass:'hidden',panelId:id=>'pg'+id.charAt(0).toUpperCase()+id.slice(1)});
  if (t==='prac') genPrac();
  if (t==='quiz') startQuiz();
}

// ─── Demo ────────────────────────────────────────────────────────────────────
let demoProblem = null, demoStep = 0, autoTimer = null;
let demoLv = 1;

function setDemoLv(lv, btn) {
  demoLv = lv;
  document.querySelectorAll('#demoLvRow .lv-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  newDemo();
}

function newDemo() {
  stopAuto();
  demoProblem = genProblem(demoLv);
  demoStep = 0;
  renderDemo();
  speak(stripHtml(demoProblem.steps[0].html));
}

function setExprHtml(id, html) {
  const el = document.getElementById(id);
  el.classList.add('fading');
  setTimeout(() => { el.innerHTML = html; el.classList.remove('fading'); }, 150);
}

function renderDemo() {
  if (!demoProblem) return;
  const s = demoProblem.steps;
  const st = s[demoStep];
  setExprHtml('demoExpr', st.html);
  document.getElementById('demoTip').textContent = st.tip;

  // progress dots
  const prog = document.getElementById('stepProg');
  prog.innerHTML = '';
  s.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i===demoStep?' on': i<demoStep?' done':'');
    prog.appendChild(d);
  });

  document.getElementById('stepLbl').textContent = `${demoStep+1} / ${s.length}`;
  document.getElementById('btnPrev').disabled = demoStep === 0;
  document.getElementById('btnNext').disabled = demoStep === s.length - 1;
  playPop();
}

function stepNext() {
  if (demoStep < demoProblem.steps.length - 1) {
    demoStep++;
    renderDemo();
    speak(demoProblem.steps[demoStep].tip);
  }
}
function stepPrev() {
  if (demoStep > 0) { demoStep--; renderDemo(); }
}

let _autoRunning = false;
async function autoPlay() {
  _autoRunning = true;
  demoStep = 0; renderDemo();
  while (demoStep < demoProblem.steps.length - 1 && _autoRunning) {
    speak(demoProblem.steps[demoStep].tip);
    await new Promise(r => autoTimer = setTimeout(r, 2000));
    if (!_autoRunning) break;
    demoStep++; renderDemo();
  }
  if (_autoRunning) speak(demoProblem.steps[demoStep].tip);
  _autoRunning = false;
  document.getElementById('btnAuto').textContent = '🎬 自动演示';
}
function stopAuto() {
  _autoRunning = false;
  clearTimeout(autoTimer);
  document.getElementById('btnAuto').textContent = '🎬 自动演示';
}
function toggleAuto() {
  if (_autoRunning) { stopAuto(); return; }
  document.getElementById('btnAuto').textContent = '⏹ 停止';
  autoPlay();
}

// ─── Practice ────────────────────────────────────────────────────────────────
let pracProblem = null, pracDone = false, pracLv = 1;
let psStep = 0;

function setPracLv(lv, btn) {
  pracLv = lv;
  document.querySelectorAll('#pracLvRow .lv-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  genPrac();
}

function genPrac() {
  pracDone = false;
  document.getElementById('pracStepCard').classList.add('hidden');
  pracProblem = genProblem(pracLv);
  document.getElementById('pracExpr').textContent = pracProblem.expr;
  document.getElementById('pracFb').textContent = '';
  document.getElementById('pracFb').className = 'prac-fb';
  const inp = document.getElementById('ansInp');
  inp.value = ''; inp.className = 'ans-inp'; inp.focus();
  speak(pracProblem.expr + '，等于多少？');
  inp.addEventListener('input',()=>{ if(inp.value.length>0 && inp.value.length>=String(pracProblem.answer).length) checkPrac(); });
  inp.addEventListener('blur',()=>{ if(inp.value.length>0) checkPrac(); });
}

function checkPrac() {
  if (pracDone) return;
  const v = parseInt(document.getElementById('ansInp').value);
  const fb = document.getElementById('pracFb');
  const inp = document.getElementById('ansInp');
  if (isNaN(v)) { showToast('请输入数字'); return; }
  if (v === pracProblem.answer) {
    inp.classList.add('ok');
    fb.textContent = `✅ 正确！答案是 ${pracProblem.answer}`; fb.className='prac-fb ok';
    playOk(); pracDone = true;
    speak('正确！');
    setTimeout(nextPrac,1200);
  } else {
    inp.classList.add('bad');
    fb.textContent = `❌ 不对，再算算`; fb.className='prac-fb bad';
    playFail();
    setTimeout(()=>{ inp.classList.remove('bad'); inp.value=''; inp.focus(); }, 800);
  }
}

function nextPrac() { genPrac(); }

function pracSeeSteps() {
  const card = document.getElementById('pracStepCard');
  card.classList.remove('hidden');
  psStep = 0;
  renderPracStep();
}

function renderPracStep() {
  const s = pracProblem.steps;
  setExprHtml('pracStepExpr', s[psStep].html);
  document.getElementById('pracStepTip').textContent = s[psStep].tip;
  document.getElementById('psLbl').textContent = `${psStep+1} / ${s.length}`;
  document.getElementById('psBtnPrev').disabled = psStep === 0;
  document.getElementById('psBtnNext').disabled = psStep === s.length-1;
  speak(s[psStep].tip);
}
function pracStepNav(d) { psStep = Math.max(0, Math.min(pracProblem.steps.length-1, psStep+d)); renderPracStep(); }

// ─── Quiz ────────────────────────────────────────────────────────────────────
let qList=[], qIdx=0, qOk=0, qBad=0, qAns=false;

function makeQuizItem() {
  const lv = ri(1,3);
  const p = genProblem(lv);
  const correct = p.answer;
  const wrongs = new Set();
  const tries = [correct+1,correct-1,correct+ri(2,5),correct-ri(2,5),
                 correct+10,correct-10,correct*2, Math.max(1,correct-ri(1,3))];
  for (const w of tries) { if (w>0 && w!==correct) wrongs.add(w); if (wrongs.size===3) break; }
  while (wrongs.size < 3) wrongs.add(correct + ri(1,8) * (Math.random()<.5?1:-1));
  return { expr: p.expr, answer: correct, choices: shuffle([correct,...wrongs]).map(Number) };
}

function startQuiz() {
  qOk=0; qBad=0; qIdx=0; qAns=false;
  qList = Array.from({length:10}, makeQuizItem);
  document.getElementById('quizDone').classList.add('hidden');
  document.getElementById('qNextBtn').style.display='none';
  renderQuiz();
}

function renderQuiz() {
  document.getElementById('quizDone').classList.add('hidden');
  document.getElementById('qNextBtn').style.display='none';
  document.getElementById('qfb').textContent=''; document.getElementById('qfb').className='qfb';
  qAns=false;
  const item = qList[qIdx];
  document.getElementById('qMeta').textContent = `第 ${qIdx+1} / 10 题`;
  document.getElementById('qScore').innerHTML = `✅ ${qOk} &nbsp;❌ ${qBad}`;
  document.getElementById('quizQ').innerHTML = `
    <div class="quiz-lbl">算出结果</div>
    <div class="quiz-big">${item.expr} = ?</div>`;
  speak(item.expr + '，等于多少？');
  const ch = document.getElementById('choices');
  ch.innerHTML='';
  item.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='ch-btn'; btn.textContent=c;
    btn.onclick=()=>pickQ(btn,c,item);
    ch.appendChild(btn);
  });
}

function pickQ(btn, chosen, item) {
  if (qAns) return; qAns=true;
  const ok = chosen===item.answer;
  btn.classList.add(ok?'correct':'wrong');
  if (!ok) document.querySelectorAll('.ch-btn').forEach(b=>{ if(+b.textContent===item.answer) b.classList.add('correct'); });
  const fb=document.getElementById('qfb');
  if (ok) { qOk++; fb.textContent='✅ 正确！'; fb.className='qfb ok'; playOk(); speak('正确！'); }
  else     { qBad++; fb.textContent=`❌ 正确答案是 ${item.answer}`; fb.className='qfb bad'; playFail(); speak(`正确答案是${item.answer}`); }
  document.getElementById('qScore').innerHTML=`✅ ${qOk} &nbsp;❌ ${qBad}`;
  if (qIdx+1>=qList.length) setTimeout(showQuizDone,1400);
  else if (ok) setTimeout(quizNext,1200);
  else document.getElementById('qNextBtn').style.display='inline-block';
}
function quizNext() { qIdx++; renderQuiz(); }
function showQuizDone() {
  document.getElementById('quizDone').classList.remove('hidden');
  document.getElementById('qNextBtn').style.display='none';
  const pct=Math.round(qOk/qList.length*100);
  document.getElementById('qFinalScore').textContent=`${qOk} / ${qList.length}`;
  const msgs=['继续加油！💪','不错，再练练！😊','很棒！🌟','优秀！⭐','满分！🎉'];
  document.getElementById('qFinalMsg').textContent=msgs[pct<40?0:pct<60?1:pct<80?2:pct<100?3:4];
  speak(`本次得了${qOk}分`);
  if(pct>=90) playWin();
}

// ─── helpers ─────────────────────────────────────────────────────────────────
function stripHtml(h) { return h.replace(/<[^>]*>/g,''); }

// ─── init ────────────────────────────────────────────────────────────────────
newDemo();
