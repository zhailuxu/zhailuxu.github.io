  <link rel="stylesheet" href="hpx-game-mobile.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#48534f;--green:#667d70;--paper:#fbfaf4;--line:#c8d2c8}body{min-height:100vh;padding:16px 12px 42px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dce9dd,#f1ecda 55%,#e8ded2)}button{font:inherit}.container{max-width:980px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.75rem,5vw,2.45rem);letter-spacing:3px;color:#5a554b;text-shadow:2px 3px #d9d2c4}.header p{margin-top:6px;color:#6e7b73;font-size:.9rem;line-height:1.6}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(255,255,255,.75);border-radius:22px;background:rgba(251,250,244,.95);box-shadow:0 5px 22px rgba(54,70,58,.1)}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.78rem;font-weight:850;color:#718078}.chip,.action{min-height:42px;border:2px solid #c8d3c8;border-radius:14px;padding:8px 13px;background:#fff;color:#59635d;cursor:pointer;font-weight:850}.chip.on{border-color:var(--green);background:var(--green);color:#fff}.action{border:0;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#718b7c,#587063);color:#fff}.secondary{background:#e1eadc;color:#506653}.muted{background:#e8e6df;color:#64675f}.chip:disabled,.action:disabled{opacity:.45;cursor:default}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.stat{min-width:0;padding:8px;border-radius:13px;background:#e2eadf;text-align:center;color:#6d786f;font-size:.74rem}.stat b{display:block;margin-top:2px;color:#5d574e;font-size:1rem}.mission{margin-bottom:12px;padding:10px 13px;border-radius:14px;background:#eee7d5;text-align:center;color:#675f51;font-size:.84rem;line-height:1.65}.clue-title{margin-bottom:8px;color:#59675e;text-align:center;font-size:.92rem}.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.clue{position:relative;display:flex;min-height:52px;align-items:center;gap:9px;border:2px solid #d3d8cf;border-radius:14px;padding:9px 11px;background:#fff;color:#56615a;text-align:left;cursor:pointer;line-height:1.45}.clue .badge{display:grid;width:27px;height:27px;flex:0 0 auto;place-items:center;border-radius:50%;background:#e5ebe1;color:#66746a;font-weight:900}.clue.suspect{border-color:#b76a62;background:#f6e5e0}.clue.suspect .badge{background:#b76a62;color:#fff}.clue:disabled{cursor:default}.clue-note{margin-top:8px;text-align:center;color:#7a776d;font-size:.76rem}.board-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.logic-panel{padding:12px;border-radius:17px;background:#edf2e9;overflow:hidden}.logic-panel h2{margin-bottom:8px;text-align:center;color:#5e695f;font-size:.9rem}.table-scroll{overflow-x:auto}.logic-table{width:100%;min-width:315px;border-collapse:separate;border-spacing:4px;table-layout:fixed}.logic-table th{height:38px;padding:4px;color:#626e65;font-size:.72rem;line-height:1.2}.logic-table th:first-child{width:74px}.logic-table td{height:47px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px #d0d8cf;text-align:center;cursor:pointer;font-size:1.25rem;font-weight:900;user-select:none}.logic-table td.no{background:#f0e5e1;color:#a95b53;box-shadow:inset 0 0 0 2px #d9aaa3}.logic-table td.yes{background:#dcebdc;color:#347343;box-shadow:inset 0 0 0 3px #72a27b}.logic-table td.revealed{animation:pop .25s ease}.message{min-height:53px;margin-top:13px;padding:11px;border-radius:14px;background:#e2eadf;color:#5e6c62;text-align:center;line-height:1.6}.message.ok{background:#dcefdc;color:#26723a;font-weight:800}.message.bad{background:#f4e1dc;color:#a23d35;font-weight:800}.message.hint{background:#eee5c9;color:#735d25;font-weight:800}.explanation{display:none;margin-top:11px;padding:12px;border-radius:14px;background:#e9eddd;color:#596655;line-height:1.75}.explanation.show{display:block}.help summary{cursor:pointer;color:#596650;font-weight:900}.help ol{padding:9px 0 0 22px;color:#657068;font-size:.85rem;line-height:1.85}.back{display:block;margin-top:15px;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@keyframes pop{50%{transform:scale(1.12)}}@media(max-width:720px){.board-wrap{grid-template-columns:1fr}.clues{grid-template-columns:1fr}.logic-panel{padding:8px}.logic-table td{height:44px}.toolbar{overflow:visible}.toolbar .group{width:100%}.toolbar .group-label{flex:0 0 100%;text-align:center}}@media(max-width:480px){.card{padding:11px}.status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.header p{font-size:.8rem}.clue{min-height:48px}.actions{position:static}.logic-table{min-width:290px}.logic-table th:first-child{width:64px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
  </style>

<body data-sound-standard="speech">
<main class="container">
  <header class="header"><h1>🕵️ 真假线索侦探</h1><p>认真读线索，找出不可靠的话，再用“排除”和“确定”破解对应关系。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">简单 物品</button><button class="chip" data-level="medium">中等 物品+地点</button><button class="chip" data-level="hard">困难 4位人物</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 读线索 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">已确定关系<b id="filledText">0 / 3</b></div><div class="stat">完成案件<b id="solvedText">0 个</b></div><div class="stat">连续破案<b id="streakText">0 关</b></div></div>
  </section>
  <section class="card">
    <div class="mission" id="mission"></div>
    <h2 class="clue-title">案件线索</h2>
    <div class="clues" id="clues"></div>
    <p class="clue-note" id="clueNote"></p>
    <div class="board-wrap" id="boards"></div>
    <div class="message" id="message" role="status" aria-live="polite">先读线索，再填写推理表。</div>
    <div class="explanation" id="explanation"></div>
    <div class="actions" style="margin-top:12px"><button class="action secondary" id="hintBtn">给我一点提示</button><button class="action primary" id="checkBtn">提交推理</button><button class="action primary" id="nextBtn" hidden>下一个案件 →</button><button class="action muted" id="newBtn">换一个案件</button></div>
  </section>
  <details class="card help" open><summary>怎么玩？</summary><ol><li>先逐条阅读线索。中等和困难案件中有且只有一条不可靠，点击它将其标成红色。</li><li>点击推理表格：第一次是“× 排除”，第二次是“✓ 确定”，第三次恢复空白。</li><li>每个人只能对应一个物品和一个地点；每个物品、地点也只能使用一次。</li><li>提交后不会自动跳题。答错可以继续修改，答对后会展示完整结论和推理依据。</li></ol></details>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-17：本站独立设计；人物、物品、地点、线索组合、推理表与反馈文案均由本地代码生成。
(function(){'use strict';
const DATA={people:['小禾','乐乐','安安','米粒'],items:[['风筝','🔷'],['画笔','🖌️'],['水壶','🧴'],['望远镜','🔭']],places:[['花园','🌿'],['书屋','📚'],['操场','🏃'],['凉亭','🏠']]},CONFIG={easy:{size:3,places:false,falseClue:false},medium:{size:3,places:true,falseClue:true},hard:{size:4,places:true,falseClue:true}},STORE='hpxClueDetectiveV1';
function shuffled(list,rng=Math.random){const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}function permutations(list){if(list.length<2)return[list.slice()];const out=[];list.forEach((v,i)=>permutations(list.slice(0,i).concat(list.slice(i+1))).forEach(rest=>out.push([v,...rest])));return out}
function makeSolutions(size,withPlaces){const ids=Array.from({length:size},(_,i)=>i),perms=permutations(ids),out=[];for(const itemOf of perms){if(withPlaces)for(const placeOf of perms)out.push({itemOf:itemOf.slice(),placeOf:placeOf.slice()});else out.push({itemOf:itemOf.slice(),placeOf:[]})}return out}
function holds(solution,clue){if(clue.kind==='item')return(clue.equal?solution.itemOf[clue.person]===clue.value:solution.itemOf[clue.person]!==clue.value);if(clue.kind==='place')return(clue.equal?solution.placeOf[clue.person]===clue.value:solution.placeOf[clue.person]!==clue.value);const owner=solution.itemOf.indexOf(clue.item);return clue.equal?solution.placeOf[owner]===clue.place:solution.placeOf[owner]!==clue.place}
function clueText(clue,names){if(clue.kind==='item')return`${names.people[clue.person]}${clue.equal?'拿的是':'没有拿'}${names.items[clue.value]}`;if(clue.kind==='place')return`${names.people[clue.person]}${clue.equal?'在':'不在'}${names.places[clue.value]}`;return`${names.items[clue.item]}${clue.equal?'出现在':'不在'}${names.places[clue.place]}`}
function cluePool(secret,cfg){const pool=[];for(let p=0;p<cfg.size;p++)for(let v=0;v<cfg.size;v++)pool.push({kind:'item',person:p,value:v,equal:secret.itemOf[p]===v});if(cfg.places){for(let p=0;p<cfg.size;p++)for(let v=0;v<cfg.size;v++)pool.push({kind:'place',person:p,value:v,equal:secret.placeOf[p]===v});for(let item=0;item<cfg.size;item++)for(let place=0;place<cfg.size;place++){const owner=secret.itemOf.indexOf(item);pool.push({kind:'cross',item,place,equal:secret.placeOf[owner]===place})}}return pool}
function solve(size,withPlaces,clues){return makeSolutions(size,withPlaces).filter(solution=>clues.every(clue=>holds(solution,clue)))}
function generatePuzzle(level,rng=Math.random){const cfg=CONFIG[level],people=shuffled(DATA.people,rng).slice(0,cfg.size),itemPairs=shuffled(DATA.items,rng).slice(0,cfg.size),placePairs=shuffled(DATA.places,rng).slice(0,cfg.size),items=itemPairs.map(x=>x[0]),places=placePairs.map(x=>x[0]),secret={itemOf:shuffled(Array.from({length:cfg.size},(_,i)=>i),rng),placeOf:cfg.places?shuffled(Array.from({length:cfg.size},(_,i)=>i),rng):[]},names={people,items,places};let candidates=makeSolutions(cfg.size,cfg.places),chosen=[];const pool=shuffled(cluePool(secret,cfg),rng).sort((a,b)=>Number(a.equal)-Number(b.equal));for(const clue of pool){const next=candidates.filter(s=>holds(s,clue));if(next.length&&next.length<candidates.length){chosen.push(clue);candidates=next}if(candidates.length===1)break}if(candidates.length!==1)throw new Error('案件无法唯一求解');const target=cfg.size+(cfg.places?2:1),extra=shuffled(pool.filter(c=>!chosen.includes(c)&&holds(secret,c)),rng);while(chosen.length<target&&extra.length)chosen.push(extra.pop());let falseIndex=-1;if(cfg.falseClue){const base=shuffled(chosen,rng);const source=base.find(c=>c.equal)||base[0],fake=Object.assign({},source,{equal:!source.equal});chosen=shuffled(base.concat(fake),rng);falseIndex=chosen.indexOf(fake)}else chosen=shuffled(chosen,rng);return{level,size:cfg.size,withPlaces:cfg.places,names,icons:{items:Object.fromEntries(itemPairs.map(x=>[x[0],x[1]])),places:Object.fromEntries(placePairs.map(x=>[x[0],x[1]]))},secret,clues:chosen,falseIndex}}
function validateMarks(puzzle,marks){for(let p=0;p<puzzle.size;p++)for(let v=0;v<puzzle.size;v++){const expected=puzzle.secret.itemOf[p]===v?'yes':'no';if(marks.item[p][v]!==expected)return false;if(puzzle.withPlaces){const placeExpected=puzzle.secret.placeOf[p]===v?'yes':'no';if(marks.place[p][v]!==placeExpected)return false}}return true}
function emptyMarks(puzzle){const grid=()=>Array.from({length:puzzle.size},()=>Array(puzzle.size).fill(''));return{item:grid(),place:puzzle.withPlaces?grid():[]}}
window.ClueDetective={DATA,CONFIG,permutations,makeSolutions,holds,clueText,solve,generatePuzzle,validateMarks,emptyMarks};if(typeof document==='undefined')return;
const $=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.04}):null,state={mode:'practice',level:'easy',step:1,puzzle:null,marks:null,suspect:-1,solved:false,solvedCount:0,streak:loadStreak()};
function loadStreak(){try{return Number(JSON.parse(localStorage.getItem(STORE)||'{}').streak)||0}catch(e){return 0}}function saveStreak(){try{localStorage.setItem(STORE,JSON.stringify({streak:state.streak}))}catch(e){}}function say(text){if(speech)speech.speak(text)}function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(btn=>btn.classList.toggle('on',btn.dataset[key]===value))}
function display(category,index){const name=state.puzzle.names[category][index];if(category==='people')return name;return`${state.puzzle.icons[category][name]||''} ${name}`}
function renderClues(){const p=state.puzzle;$('clues').innerHTML=p.clues.map((clue,i)=>`<button class="clue ${state.suspect===i?'suspect':''}" data-clue="${i}" ${state.solved?'disabled':''}><span class="badge">${i+1}</span><span>${clueText(clue,p.names)}</span></button>`).join('');$('clueNote').textContent=p.falseIndex<0?'本案线索全部可靠，请把它们一起使用。':'本案有且只有 1 条不可靠线索，点击你怀疑的那一条。'}
function table(type,title,values){const p=state.puzzle;return`<section class="logic-panel"><h2>${title}</h2><div class="table-scroll"><table class="logic-table"><thead><tr><th>人物</th>${values.map((_,i)=>`<th>${display(type==='item'?'items':'places',i)}</th>`).join('')}</tr></thead><tbody>${p.names.people.map((person,row)=>`<tr><th>${person}</th>${values.map((_,col)=>{const mark=state.marks[type][row][col];return`<td class="${mark}" data-grid="${type}" data-row="${row}" data-col="${col}" aria-label="${person}和${values[col]}：${mark==='yes'?'确定':mark==='no'?'排除':'未判断'}">${mark==='yes'?'✓':mark==='no'?'×':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function renderBoards(){$('boards').innerHTML=table('item','人物 × 物品',state.puzzle.names.items)+(state.puzzle.withPlaces?table('place','人物 × 地点',state.puzzle.names.places):'')}
function filled(){let count=0;['item','place'].forEach(type=>(state.marks[type]||[]).forEach(row=>row.forEach(mark=>{if(mark==='yes')count++})));return count}function totalRelations(){return state.puzzle.size*(state.puzzle.withPlaces?2:1)}function updateStatus(){$('roundText').textContent=state.mode==='challenge'?`${state.step} / 5`:'自由练习';$('filledText').textContent=`${filled()} / ${totalRelations()}`;$('solvedText').textContent=`${state.solvedCount} 个`;$('streakText').textContent=`${state.streak} 关`}
function startRound(reset=false){if(reset&&state.mode==='challenge')state.step=1;state.puzzle=generatePuzzle(state.level);state.marks=emptyMarks(state.puzzle);state.suspect=-1;state.solved=false;$('nextBtn').hidden=true;$('checkBtn').hidden=false;$('hintBtn').disabled=false;$('explanation').className='explanation';$('mission').textContent=state.puzzle.withPlaces?'找出每位小朋友拿的物品和所在地点。先辨认假线索，再完成两张推理表。':'找出每位小朋友拿的物品。所有线索都可靠，逐格排除后确定答案。';renderClues();renderBoards();setMessage('先读线索，再填写推理表。');updateStatus()}
function cycleCell(cell){if(state.solved)return;const type=cell.dataset.grid,row=Number(cell.dataset.row),col=Number(cell.dataset.col),now=state.marks[type][row][col],next=now===''?'no':now==='no'?'yes':'';state.marks[type][row][col]=next;renderBoards();updateStatus()}
function chooseSuspect(index){if(state.solved||state.puzzle.falseIndex<0)return;state.suspect=state.suspect===index?-1:index;renderClues();setMessage(state.suspect<0?'已取消标记，请重新判断。':`你认为第 ${state.suspect+1} 条不可靠。继续填写推理表。`)}
function conclusion(){const p=state.puzzle,parts=p.names.people.map((person,i)=>`${person}拿${p.names.items[p.secret.itemOf[i]]}${p.withPlaces?`，在${p.names.places[p.secret.placeOf[i]]}`:''}`);const falseText=p.falseIndex>=0?`第 ${p.falseIndex+1} 条“${clueText(p.clues[p.falseIndex],p.names)}”与真实对应关系冲突，所以它是不可靠线索。`:'';return`<strong>案件结论：</strong>${parts.join('；')}。${falseText?`<br><strong>真假解释：</strong>${falseText}`:''}`}
function check(){if(state.puzzle.falseIndex>=0&&state.suspect<0){setMessage('还没有指出哪条线索不可靠。先点击你怀疑的线索。','hint');return}const falseRight=state.puzzle.falseIndex<0||state.suspect===state.puzzle.falseIndex,gridRight=validateMarks(state.puzzle,state.marks);if(falseRight&&gridRight){state.solved=true;state.solvedCount++;state.streak++;saveStreak();$('explanation').innerHTML=conclusion();$('explanation').className='explanation show';$('checkBtn').hidden=true;$('hintBtn').disabled=true;$('nextBtn').hidden=false;renderClues();setMessage('破案成功！真假线索和全部对应关系都找对了。','ok');say('破案成功，真假线索和全部对应关系都找对了。');updateStatus()}else{state.streak=0;saveStreak();const reason=!falseRight?'不可靠线索还没有找对。':'推理表里还有关系不正确或没有填写。';setMessage(`${reason} 对照线索继续排除，再提交一次。`,'bad');say('还没有破案，请继续检查线索和推理表。');updateStatus()}}
function hint(){const p=state.puzzle;if(p.falseIndex>=0&&state.suspect!==p.falseIndex){state.suspect=p.falseIndex;renderClues();setMessage(`提示：第 ${p.falseIndex+1} 条线索不可靠，已替你标出。`,'hint');return}for(const type of ['item','place'])for(let row=0;row<(state.marks[type]||[]).length;row++)for(let col=0;col<p.size;col++){const expected=(type==='item'?p.secret.itemOf[row]:p.secret.placeOf[row])===col?'yes':'no';if(state.marks[type][row][col]!==expected){state.marks[type][row][col]=expected;renderBoards();updateStatus();const word=expected==='yes'?'确定':'排除';setMessage(`提示：已帮你${word}一个格子，看看它会带来哪些新的排除。`,'hint');return}}}
function next(){if(state.mode==='challenge'){if(state.step===5){startRound(true);return}state.step++}startRound(false)}
$('clues').addEventListener('click',event=>{const btn=event.target.closest('[data-clue]');if(btn)chooseSuspect(Number(btn.dataset.clue))});$('boards').addEventListener('click',event=>{const cell=event.target.closest('[data-grid]');if(cell)cycleCell(cell)});$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',hint);$('nextBtn').addEventListener('click',next);$('newBtn').addEventListener('click',()=>startRound(state.mode==='challenge'));$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startRound(true)});$('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startRound(true)});startRound(true);
})();
</script>
