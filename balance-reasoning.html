<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#465149;--accent:#637a62}body{min-height:100vh;padding:16px 12px 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dfedda,#eff2dc 52%,#f6e9d5)}button{font:inherit}.container{max-width:900px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.75rem,5vw,2.45rem);letter-spacing:3px;color:#625648;text-shadow:2px 3px #ddd4c4}.header p{margin-top:6px;color:#718078;font-size:.9rem;line-height:1.6}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(248,251,244,.94);box-shadow:0 5px 22px rgba(54,79,57,.1)}.toolbar,.group,.actions,.options{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.78rem;font-weight:800;color:#71806f}.chip,.action,.option{border:2px solid #c8d5c3;border-radius:14px;padding:8px 13px;background:#fff;color:#59635b;cursor:pointer;font-weight:800;transition:.15s transform,.15s background}.chip:hover,.action:hover,.option:hover{transform:translateY(-1px)}.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}.action{border:0;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#78917c,#55715b);color:#fff}.secondary{background:#e0ebdc;color:#4e6852}.muted{background:#e8e8e2;color:#62675f}.chip:disabled,.action:disabled,.option:disabled{opacity:.48;cursor:default;transform:none}button:focus-visible{outline:4px solid rgba(21,101,192,.25);outline-offset:2px}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:8px;border-radius:13px;background:#dfebda;text-align:center;color:#6d796b;font-size:.74rem}.stat b{display:block;margin-top:2px;color:#5f5748;font-size:1.02rem}.level-note{padding:11px 14px;border-radius:15px;background:#eee7d5;text-align:center;color:#6c6251;font-size:.82rem;line-height:1.6}.facts{display:grid;gap:11px;max-width:700px;margin:14px auto}.compare-row{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:10px;padding:13px;border-radius:18px;background:#edf3e9}.object-card{display:flex;min-height:104px;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:2px solid #fff;border-radius:17px;background:#fff;box-shadow:0 3px 10px rgba(55,74,58,.08);transition:.2s transform}.object-card.down{transform:translateY(9px)}.object-card.up{transform:translateY(-7px)}.box-shape{display:grid;width:53px;height:46px;place-items:center;border-radius:10px;background:var(--c);box-shadow:inset -4px -5px rgba(40,46,42,.12);color:#fff;font-weight:950}.object-card b{color:#59645b}.relation{text-align:center;color:#795f42;font-size:.78rem;font-weight:900}.relation strong{display:block;margin-top:2px;font-size:1.7rem}.known{display:block;margin-top:4px;padding:4px 8px;border-radius:8px;background:#e5eddf;color:#506451;font-size:.75rem}.equal-row{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:10px;padding:16px;border-radius:18px;background:#edf3e9}.piece-group{display:flex;min-height:115px;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:11px;border-radius:17px;background:#fff}.piece{display:grid;width:42px;height:38px;place-items:center;border-radius:8px;background:#7194ae;color:white;font-weight:900;box-shadow:inset -3px -4px rgba(40,46,42,.12)}.piece.big{width:70px;height:62px;background:#c28658}.equals{text-align:center;color:#765f48;font-size:2rem;font-weight:950}.fact-caption{grid-column:1/-1;text-align:center;color:#6c746c;font-size:.78rem}.question{margin:15px 0 12px;text-align:center;color:#5f574b;font-size:1.12rem;font-weight:900;line-height:1.6}.option{min-width:130px;padding:11px 17px;border-color:#b9cbb4}.option.wrong{border-color:#d47c72;background:#f6e1dd;color:#a43b34}.option.correct{border-color:#69a473;background:#dcefdc;color:#26743b}.message{min-height:50px;margin-top:13px;padding:11px;border-radius:14px;background:#e1ebde;color:#5e6d60;text-align:center;line-height:1.6}.message.ok{background:#dcefdc;color:#27733b;font-weight:750}.message.bad{background:#f5e2dd;color:#a43b34;font-weight:750}.message.hint{background:#eee5c9;color:#745e25;font-weight:750}.help summary{cursor:pointer;color:#5e684f;font-weight:900}.help ol{padding:10px 0 0 22px;color:#647066;font-size:.85rem;line-height:1.85}.unit-note{margin-top:10px;padding:9px;border-radius:11px;background:#e8f0e4;text-align:center;color:#526653;font-size:.82rem;font-weight:800}.back{display:block;margin-top:15px;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@media(max-width:620px){.status-row{grid-template-columns:repeat(2,1fr)}.toolbar{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}.group{flex:0 0 auto}.chip{white-space:nowrap}.compare-row{grid-template-columns:1fr 62px 1fr;padding:9px;gap:6px}.relation{font-size:.68rem}.relation strong{font-size:1.25rem}.object-card{min-height:96px}.equal-row{grid-template-columns:1fr 42px 1fr;padding:10px}.piece-group{min-height:105px}.option{min-width:105px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>

<body data-sound-standard="speech">
<main class="container">
  <header class="header"><h1>⚖️ 天平推理</h1><p>看懂天平告诉你的关系，再一步一步推出答案。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">低年级 直接比较</button><button class="chip" data-level="medium">中年级 传递比较</button><button class="chip" data-level="hard">高年级 等量代换</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">当前题型<b id="typeText">直接比较</b></div><div class="stat">本轮误选<b id="mistakeText">0 次</b></div><div class="stat">连续完成<b id="streakText">0 轮</b></div></div>
  </section>
  <section class="card">
    <div class="level-note" id="levelNote">天平较低的一边更重，较高的一边更轻。</div>
    <div class="facts" id="facts" aria-label="天平提供的条件"></div>
    <p class="question" id="question"></p><div class="options" id="options"></div>
    <div class="message" id="message" role="status" aria-live="polite">先看天平，再选择答案。选错后仍然可以回答当前题。</div>
    <div class="actions" style="margin-top:12px"><button class="action secondary" id="hintBtn">给我一点提示</button><button class="action muted" id="newBtn">换一道</button><button class="action primary" id="nextBtn" hidden>下一题 →</button></div>
  </section>
  <details class="card help" open><summary>三种推理方法</summary><ol><li>直接比较：天平低的一边更重，高的一边更轻。</li><li>传递比较：如果甲比乙重、乙比丙重，那么甲也比丙重。</li><li>等量代换：两边平衡表示一样重，可以把已知重量代入，再用乘法或除法计算。</li><li>选错不会自动换题，可以查看提示后继续回答。</li></ol><div class="unit-note">1000 克 = 1 千克</div></details>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-16：本站独立设计；物品、数值、比较链、代换题和解释均由浏览器内代码生成，声音使用浏览器原生语音合成。
(function(){'use strict';
const CONFIG={easy:{type:'direct'},medium:{type:'transitive'},hard:{type:'substitution'}},OBJECTS=[{key:'blue',name:'蓝盒',color:'#668eae'},{key:'orange',name:'橙盒',color:'#ca8957'},{key:'green',name:'绿盒',color:'#719975'},{key:'purple',name:'紫盒',color:'#9477a3'}],STORE='hpxBalanceReasoningV1';
function shuffle(items,rng=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function makeFact(heavy,light,rng=Math.random){return rng()<.5?{left:heavy,right:light,op:'>'}:{left:light,right:heavy,op:'<'}}
function objectOption(object){return{value:object.key,label:object.name}}
function formatWeight(grams){return grams>=1000?`${grams}克（${Number((grams/1000).toFixed(2))}千克）`:`${grams}克`}
function weightOptions(answer,unit,total,rng=Math.random){const values=new Set([answer]);[answer+unit,answer-unit,total,unit,total+unit,answer*2,answer+100,Math.max(50,answer-100)].forEach(value=>{if(value>0)values.add(value)});let step=50;while(values.size<4){values.add(answer+step);step+=50}return shuffle([...values].slice(0,4),rng).map(value=>({value:String(value),label:formatWeight(value)}))}
function generateEasy(rng=Math.random){const [a,b]=shuffle(OBJECTS,rng),aHeavy=rng()<.5,heavy=aHeavy?a:b,light=aHeavy?b:a,fact=makeFact(heavy,light,rng),askHeavy=rng()<.5,answer=askHeavy?heavy:light;return{level:'easy',type:'direct',objects:[a,b],facts:[fact],question:`哪一个盒子更${askHeavy?'重':'轻'}？`,answer:answer.key,options:shuffle([objectOption(a),objectOption(b),{value:'same',label:'一样重'}],rng),hint:'天平较低的一边更重，较高的一边更轻。',explanation:`${heavy.name}这一边较低，所以${heavy.name}比${light.name}重。`}}
function generateMedium(rng=Math.random){const ranked=shuffle(OBJECTS,rng).slice(0,3),[heavy,middle,light]=ranked,askHeavy=rng()<.5,answer=askHeavy?heavy:light,facts=shuffle([makeFact(heavy,middle,rng),makeFact(middle,light,rng)],rng);return{level:'medium',type:'transitive',objects:ranked,facts,question:`根据两次比较，哪一个盒子最${askHeavy?'重':'轻'}？`,answer:answer.key,options:shuffle(ranked.map(objectOption),rng),hint:'先找两次比较中都能连起来的盒子，再排成“最重 ＞ 中间 ＞ 最轻”。',explanation:`两次比较可以连成：${heavy.name} ＞ ${middle.name} ＞ ${light.name}，所以${answer.name}最${askHeavy?'重':'轻'}。`}}
function generateHard(rng=Math.random){const ratio=2+Math.floor(rng()*3),unit=[100,200,250,500][Math.floor(rng()*4)],total=ratio*unit,askLarge=rng()<.5,answer=askLarge?total:unit;return{level:'hard',type:'substitution',ratio,unit,total,askLarge,facts:[],question:askLarge?`每个小方块重${unit}克，一个大方块重多少？`:`一个大方块重${formatWeight(total)}，每个小方块重多少？`,answer:String(answer),options:weightOptions(answer,unit,total,rng),hint:askLarge?`一个大方块等于${ratio}个小方块，用 ${unit} × ${ratio}。`:`一个大方块等于${ratio}个小方块，用 ${total} ÷ ${ratio}。`,explanation:askLarge?`${ratio}个小方块一样重：${unit} × ${ratio} = ${total}克，也就是${formatWeight(total)}。`:`把${total}克平均分成${ratio}份：${total} ÷ ${ratio} = ${unit}克。`}}
function generateRound(level,rng=Math.random){return level==='easy'?generateEasy(rng):level==='medium'?generateMedium(rng):generateHard(rng)}
function evaluate(round,value){return String(value)===String(round.answer)}
window.BalanceReasoning={CONFIG,OBJECTS,makeFact,formatWeight,generateEasy,generateMedium,generateHard,generateRound,evaluate};
if(typeof document==='undefined')return;
const $=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.05}):null;const state={mode:'practice',level:'easy',step:1,round:null,mistakes:0,streak:loadStreak(),answered:false};
function loadStreak(){try{return Number(JSON.parse(localStorage.getItem(STORE)||'{}').streak)||0}catch(e){return 0}}
function saveStreak(){try{localStorage.setItem(STORE,JSON.stringify({streak:state.streak}))}catch(e){}}
function say(text){if(speech)speech.speak(text)}
function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}
function setSelected(group,key,value){document.querySelectorAll(`#${group} [data-${key}]`).forEach(btn=>btn.classList.toggle('on',btn.dataset[key]===value))}
function objectCard(object,position){return`<div class="object-card ${position}"><i class="box-shape" style="--c:${object.color}">${object.name[0]}</i><b>${object.name}</b></div>`}
function renderFact(fact){const leftDown=fact.op==='>',rightDown=fact.op==='<';return`<div class="compare-row">${objectCard(fact.left,leftDown?'down':'up')}<div class="relation">天平倾斜<strong>${fact.op}</strong></div>${objectCard(fact.right,rightDown?'down':'up')}</div>`}
function renderSubstitution(round){const smalls=Array.from({length:round.ratio},()=>'<i class="piece">小</i>').join(''),known=round.askLarge?`每个小方块：${round.unit}克`:`大方块：${formatWeight(round.total)}`;return`<div class="equal-row"><div class="piece-group">${smalls}</div><div class="equals">＝</div><div class="piece-group"><i class="piece big">大</i></div><div class="fact-caption">天平保持平衡 · ${known}</div></div>`}
function updateStatus(){$('roundText').textContent=state.mode==='challenge'?`${state.step} / 5`:'自由练习';$('typeText').textContent={easy:'直接比较',medium:'传递比较',hard:'等量代换'}[state.level];$('mistakeText').textContent=`${state.mistakes} 次`;$('streakText').textContent=`${state.streak} 轮`}
function render(){const round=state.round;$('levelNote').textContent={easy:'天平较低的一边更重，较高的一边更轻。',medium:'把两次比较连接起来，排出从重到轻的顺序。',hard:'天平平衡表示两边一样重；1000克等于1千克。'}[state.level];$('facts').innerHTML=state.level==='hard'?renderSubstitution(round):round.facts.map(renderFact).join('');$('question').textContent=round.question;$('options').innerHTML=round.options.map(option=>`<button class="option" data-value="${option.value}">${option.label}</button>`).join('');$('nextBtn').hidden=true;$('hintBtn').disabled=false;state.answered=false;setMessage('先看天平，再选择答案。选错后仍然可以回答当前题。');updateStatus()}
function startRound(reset=false){if(reset&&state.mode==='challenge')state.step=1;state.round=generateRound(state.level);state.mistakes=0;render()}
function answer(value,button){if(state.answered)return;if(!evaluate(state.round,value)){state.mistakes++;button.classList.add('wrong');button.disabled=true;setMessage('这个答案还不对，题目不会更换。再看看天平关系。','bad');say('这个答案还不对。题目不会更换，可以再想一次。');updateStatus();return}state.answered=true;button.classList.add('correct');document.querySelectorAll('.option').forEach(option=>option.disabled=true);$('hintBtn').disabled=true;$('nextBtn').hidden=false;const challengeDone=state.mode==='challenge'&&state.step===5;$('nextBtn').textContent=challengeDone?'再挑战一次 ↻':'下一题 →';setMessage(`${challengeDone?'5关完成！':'答对了！'}${state.round.explanation}`,'ok');say(`${challengeDone?'五关挑战完成。':'答对了。'}${state.round.explanation}`);state.streak++;saveStreak();updateStatus()}
function next(){if(state.mode==='challenge'){if(state.step===5){startRound(true);return}state.step++}startRound(false)}
$('options').addEventListener('click',e=>{const button=e.target.closest('.option');if(button)answer(button.dataset.value,button)});$('hintBtn').addEventListener('click',()=>{setMessage(`提示：${state.round.hint}`,'hint');say(state.round.hint)});$('newBtn').addEventListener('click',()=>startRound(state.mode==='challenge'));$('nextBtn').addEventListener('click',next);$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startRound(true)});$('levelGroup').addEventListener('click',e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;setSelected('levelGroup','level',state.level);startRound(true)});startRound(true);
})();
</script>
