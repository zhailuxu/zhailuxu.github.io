<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>坐标寻宝｜慧陪学</title>
  <meta name="description" content="从东南西北方向移动、行列定位逐步学习简单平面坐标，根据指令点击宝藏位置。">
  <link rel="stylesheet" href="hpx-game-mobile.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--ink:#48534f;--green:#637d70;--sand:#eee5d2}body{min-height:100vh;padding:16px 12px 42px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#dceadd,#eef0dc 55%,#eadfd3)}button{font:inherit}.container{max-width:920px;margin:auto}.header{text-align:center;margin-bottom:14px}.header h1{font-size:clamp(1.75rem,5vw,2.45rem);letter-spacing:3px;color:#5d574c;text-shadow:2px 3px #d8d1c3}.header p{margin-top:6px;color:#6f7c74;font-size:.9rem;line-height:1.6}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(255,255,255,.75);border-radius:22px;background:rgba(251,250,244,.96);box-shadow:0 5px 22px rgba(54,70,58,.1)}.toolbar,.group,.actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.group-label{font-size:.78rem;font-weight:850;color:#718078}.chip,.action{min-height:42px;border:2px solid #c6d2c8;border-radius:14px;padding:8px 13px;background:#fff;color:#58635d;cursor:pointer;font-weight:850}.chip.on{border-color:var(--green);background:var(--green);color:#fff}.action{border:0;box-shadow:0 3px 9px rgba(0,0,0,.1)}.primary{background:linear-gradient(135deg,#718b7c,#587064);color:#fff}.secondary{background:#e0eadc;color:#506653}.muted{background:#e9e6df;color:#62665e}.chip:disabled,.action:disabled{opacity:.48;cursor:default}.status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.stat{min-width:0;padding:8px;border-radius:13px;background:#e1eadf;text-align:center;color:#6b776e;font-size:.74rem}.stat b{display:block;margin-top:2px;color:#5e574e;font-size:1rem}.mission{padding:10px 13px;border-radius:14px;background:var(--sand);color:#675f51;text-align:center;font-size:.84rem;line-height:1.65}.map-panel{max-width:650px;margin:14px auto 0;padding:13px;border-radius:20px;background:#eaf1e7}.compass-strip{display:flex;justify-content:center;gap:8px;margin-bottom:9px}.direction{display:grid;width:42px;height:42px;place-items:center;border-radius:12px;background:#fafbf6;color:#67746b;font-size:.72rem;font-weight:900}.direction strong{font-size:1rem}.direction.north{color:#a34b43}.board-wrap{overflow-x:auto;padding:3px}.board{display:grid;width:min(100%,560px);min-width:310px;margin:auto;grid-template-columns:34px repeat(var(--size),minmax(34px,1fr));gap:4px}.axis-label{display:grid;min-height:29px;place-items:center;color:#6c786f;font-size:.7rem;font-weight:900}.axis-corner{color:#9aa39d}.cell{position:relative;display:grid;aspect-ratio:1;min-height:38px;place-items:center;border:0;border-radius:9px;background:#fafbf6;box-shadow:inset 0 0 0 2px #cbd6ca;color:#5f6b63;cursor:pointer;font-size:1.25rem;font-weight:900}.cell:hover{background:#e1ebdd}.cell.start{background:#e4ead5;box-shadow:inset 0 0 0 3px #9aa56c}.cell.wrong{background:#f3dfda;color:#a5473f;box-shadow:inset 0 0 0 3px #c8786e}.cell.correct{background:#d8ecd8;color:#276f39;box-shadow:inset 0 0 0 3px #6ca177}.cell.hinted{animation:pulse 1s ease-in-out infinite}.cell small{position:absolute;right:3px;bottom:2px;color:#9aa49d;font-size:.5rem;font-weight:700}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;color:#707b73;font-size:.74rem}.legend span{display:flex;align-items:center;gap:4px}.swatch{width:15px;height:15px;border-radius:4px;background:#fafbf6;box-shadow:inset 0 0 0 2px #cbd6ca}.swatch.start{background:#e4ead5;box-shadow:inset 0 0 0 2px #9aa56c}.instruction-card{max-width:720px;margin:13px auto 0;padding:13px;border-radius:16px;background:#e6ece0;color:#59665e;text-align:center;line-height:1.75}.instruction-card strong{color:#4f6659}.step-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}.step-chip{padding:6px 10px;border-radius:10px;background:#fafbf6;color:#66736a;font-size:.78rem;font-weight:800}.message{min-height:53px;margin-top:13px;padding:11px;border-radius:14px;background:#e1eadf;color:#5e6c62;text-align:center;line-height:1.6}.message.ok{background:#dcefdc;color:#26723a;font-weight:800}.message.bad{background:#f4e1dc;color:#a23d35;font-weight:800}.message.hint{background:#eee5c9;color:#735d25;font-weight:800}.explanation{display:none;margin-top:11px;padding:12px;border-radius:14px;background:#e9eddd;color:#596655;line-height:1.75}.explanation.show{display:block}.help summary{cursor:pointer;color:#596650;font-weight:900}.help ol{padding:9px 0 0 22px;color:#657068;font-size:.85rem;line-height:1.85}.back{display:block;margin-top:15px;text-align:center;color:#526f54;text-decoration:none;font-size:.87rem}@keyframes pulse{50%{box-shadow:inset 0 0 0 4px #c89a54;transform:scale(.94)}}@media(max-width:720px){.toolbar{overflow:visible}.toolbar .group{width:100%;min-width:0}.toolbar .group-label{flex:0 0 100%;text-align:center}.toolbar #levelGroup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar #levelGroup .group-label{grid-column:1/-1}.toolbar #levelGroup .chip{width:100%;min-width:0;padding:7px 8px;font-size:.82rem;white-space:normal}.status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.header p{font-size:.8rem}.actions{position:static}.map-panel{padding:9px}.board{gap:3px}.cell{min-height:34px}}@media(max-width:480px){.card{padding:11px}.board{grid-template-columns:28px repeat(var(--size),minmax(34px,1fr))}.compass-strip{gap:5px}.direction{width:38px;height:38px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
  </style>
</head>
<body data-sound-standard="speech">
<main class="container">
  <header class="header"><h1>🧭 坐标寻宝</h1><p>读懂方向、行列和坐标，让探险者一步一步找到隐藏宝藏。</p></header>
  <section class="card">
    <div class="toolbar">
      <div class="group" id="modeGroup"><span class="group-label">模式</span><button class="chip on" data-mode="practice">自由练习</button><button class="chip" data-mode="challenge">5关挑战</button></div>
      <div class="group" id="levelGroup"><span class="group-label">难度</span><button class="chip on" data-level="easy">简单 方向移动</button><button class="chip" data-level="medium">中等 行列定位</button><button class="chip" data-level="hard">困难 平面坐标</button></div>
      <button class="chip" id="speakToggle" type="button">🔊 声音解说 开</button>
    </div>
    <div class="status-row"><div class="stat">当前关卡<b id="roundText">自由练习</b></div><div class="stat">已点格子<b id="clickText">0 次</b></div><div class="stat">找到宝藏<b id="solvedText">0 个</b></div><div class="stat">连续成功<b id="streakText">0 关</b></div></div>
  </section>
  <section class="card">
    <div class="mission" id="mission"></div>
    <div class="map-panel"><div class="compass-strip"><span class="direction north"><strong>↑</strong>北</span><span class="direction"><strong>→</strong>东</span><span class="direction"><strong>↓</strong>南</span><span class="direction"><strong>←</strong>西</span></div><div class="board-wrap"><div class="board" id="board"></div></div><div class="legend"><span><i class="swatch start"></i>探险者起点</span><span><i class="swatch"></i>可点击格子</span></div></div>
    <div class="instruction-card" id="instruction"></div>
    <div class="message" id="message" role="status" aria-live="polite">读完指令，点击你认为藏着宝藏的格子。</div>
    <div class="explanation" id="explanation"></div>
    <div class="actions" style="margin-top:12px"><button class="action secondary" id="hintBtn">给我一点提示</button><button class="action primary" id="nextBtn" hidden>下一张地图 →</button><button class="action muted" id="newBtn">换一张地图</button></div>
  </section>
  <details class="card help" open><summary>怎么玩？</summary><ol><li>简单：地图上方是北，右边是东；从探险者所在格按方向移动。</li><li>中等：先找第几行，再找第几列。行从上往下数，列从左往右数。</li><li>困难：左下角是原点 `(0,0)`；横着先看 x，竖着再看 y。</li><li>宝藏开始时隐藏。点错不会换地图，可以重新计算后继续点击。</li></ol></details>
  <a class="back" href="game-paradise.html">← 返回游戏乐园</a>
</main>
<script src="hpx-core.js"></script>
<script>
// 2026-08-18：本站独立设计；地图尺寸、起点、移动指令、目标坐标、提示与反馈均由本地代码生成。
(function(){'use strict';
const CONFIG={easy:{size:5,type:'direction'},medium:{size:6,type:'rowcol'},hard:{size:7,type:'coordinate'}},DIRS=[{name:'东',dx:1,dy:0,arrow:'→'},{name:'西',dx:-1,dy:0,arrow:'←'},{name:'北',dx:0,dy:1,arrow:'↑'},{name:'南',dx:0,dy:-1,arrow:'↓'}],STORE='hpxCoordinateTreasureV1';
function randomInt(min,max,rng=Math.random){return min+Math.floor(rng()*(max-min+1))}function shuffled(list,rng=Math.random){const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}function applyMove(point,move){return{x:point.x+move.dx*move.steps,y:point.y+move.dy*move.steps}}function inside(point,size){return point.x>=0&&point.y>=0&&point.x<size&&point.y<size}function key(point){return`${point.x},${point.y}`}
function generatePuzzle(level,rng=Math.random){const cfg=CONFIG[level];if(level==='easy'){const dir=DIRS[randomInt(0,DIRS.length-1,rng)],steps=randomInt(1,3,rng),start={x:randomInt(dir.dx<0?steps:0,dir.dx>0?cfg.size-1-steps:cfg.size-1,rng),y:randomInt(dir.dy<0?steps:0,dir.dy>0?cfg.size-1-steps:cfg.size-1,rng)},move={name:dir.name,arrow:dir.arrow,dx:dir.dx,dy:dir.dy,steps},target=applyMove(start,move);return{level,type:cfg.type,size:cfg.size,start,target,moves:[move],instruction:`从探险者出发，向${dir.name}走 ${steps} 格。`}}if(level==='medium'){const row=randomInt(1,cfg.size,rng),col=randomInt(1,cfg.size,rng),target={x:col-1,y:cfg.size-row};return{level,type:cfg.type,size:cfg.size,start:null,target,row,col,moves:[],instruction:`宝藏藏在第 ${row} 行、第 ${col} 列。`}}let start,target,dx,dy;do{start={x:randomInt(1,cfg.size-2,rng),y:randomInt(1,cfg.size-2,rng)};dx=randomInt(-2,2,rng);dy=randomInt(-2,2,rng);target={x:start.x+dx,y:start.y+dy}}while(dx===0||dy===0||!inside(target,cfg.size));const horizontal={name:dx>0?'东':'西',arrow:dx>0?'→':'←',dx:Math.sign(dx),dy:0,steps:Math.abs(dx)},vertical={name:dy>0?'北':'南',arrow:dy>0?'↑':'↓',dx:0,dy:Math.sign(dy),steps:Math.abs(dy)},moves=shuffled([horizontal,vertical],rng);return{level,type:cfg.type,size:cfg.size,start,target,moves,instruction:`从坐标 (${start.x}, ${start.y}) 出发，先${moves[0].name}走 ${moves[0].steps} 格，再${moves[1].name}走 ${moves[1].steps} 格。`}}
function resolveMoves(start,moves){return moves.reduce((point,move)=>applyMove(point,move),start)}function isValidPuzzle(puzzle){return inside(puzzle.target,puzzle.size)&&(!puzzle.start||inside(puzzle.start,puzzle.size))&&(puzzle.type==='rowcol'||key(resolveMoves(puzzle.start,puzzle.moves))===key(puzzle.target))}
window.CoordinateTreasure={CONFIG,DIRS,applyMove,inside,key,generatePuzzle,resolveMoves,isValidPuzzle};if(typeof document==='undefined')return;
const $=id=>document.getElementById(id),speech=window.Hpx&&Hpx.speech?Hpx.speech.create({buttonId:'speakToggle',rate:.9,pitch:1.03}):null,state={mode:'practice',level:'easy',step:1,puzzle:null,wrong:new Set(),done:false,clicks:0,solved:0,streak:loadStreak(),hinted:null};
function loadStreak(){try{return Number(JSON.parse(localStorage.getItem(STORE)||'{}').streak)||0}catch(e){return 0}}function saveStreak(){try{localStorage.setItem(STORE,JSON.stringify({streak:state.streak}))}catch(e){}}function say(text){if(speech)speech.speak(text)}function setMessage(text,type=''){$('message').textContent=text;$('message').className='message'+(type?' '+type:'')}function setSelected(group,keyName,value){document.querySelectorAll(`#${group} [data-${keyName}]`).forEach(btn=>btn.classList.toggle('on',btn.dataset[keyName]===value))}
function axisTop(p){if(p.type==='direction')return Array.from({length:p.size},()=>'<span class="axis-label"></span>').join('');if(p.type==='rowcol')return Array.from({length:p.size},(_,i)=>`<span class="axis-label">第${i+1}列</span>`).join('');return Array.from({length:p.size},(_,i)=>`<span class="axis-label">x=${i}</span>`).join('')}
function rowLabel(p,visualRow){if(p.type==='direction')return'';if(p.type==='rowcol')return`第${visualRow+1}行`;return`y=${p.size-1-visualRow}`}
function renderBoard(){const p=state.puzzle,out=[`<span class="axis-label axis-corner">${p.type==='coordinate'?'y / x':''}</span>`,axisTop(p)];for(let visualRow=0;visualRow<p.size;visualRow++){const y=p.size-1-visualRow;out.push(`<span class="axis-label">${rowLabel(p,visualRow)}</span>`);for(let x=0;x<p.size;x++){const point={x,y},cellKey=key(point),isStart=p.start&&cellKey===key(p.start),isWrong=state.wrong.has(cellKey),isCorrect=state.done&&cellKey===key(p.target),isHinted=state.hinted===cellKey;let cls='cell'+(isStart?' start':'')+(isWrong?' wrong':'')+(isCorrect?' correct':'')+(isHinted?' hinted':'');out.push(`<button class="${cls}" data-x="${x}" data-y="${y}" ${state.done?'disabled':''}>${isCorrect?'💎':isStart?'🧑‍🚀':isWrong?'×':''}${p.type==='coordinate'?`<small>${x},${y}</small>`:''}</button>`)}}$('board').style.setProperty('--size',p.size);$('board').innerHTML=out.join('')}
function renderInstruction(){const p=state.puzzle,steps=p.moves.map(move=>`<span class="step-chip">${move.arrow} ${move.name} ${move.steps} 格</span>`).join('');$('instruction').innerHTML=`<strong>${p.instruction}</strong>${steps?`<div class="step-chips">${steps}</div>`:''}`}
function updateStatus(){$('roundText').textContent=state.mode==='challenge'?`${state.step} / 5`:'自由练习';$('clickText').textContent=`${state.clicks} 次`;$('solvedText').textContent=`${state.solved} 个`;$('streakText').textContent=`${state.streak} 关`}
function startRound(reset=false){if(reset&&state.mode==='challenge')state.step=1;state.puzzle=generatePuzzle(state.level);state.wrong=new Set();state.done=false;state.hinted=null;$('mission').textContent={easy:'根据东南西北移动指令，从探险者的位置找到终点。',medium:'行从上往下数，列从左往右数，按照“先行后列”定位。',hard:'左下角是原点，横轴是 x、纵轴是 y；执行两段移动后找到坐标。'}[state.level];$('explanation').className='explanation';$('nextBtn').hidden=true;$('hintBtn').disabled=false;renderBoard();renderInstruction();setMessage('读完指令，点击你认为藏着宝藏的格子。');updateStatus();say(state.puzzle.instruction)}
function explain(){const p=state.puzzle;if(p.type==='direction')return`从起点向${p.moves[0].name}移动${p.moves[0].steps}格，到达目标格。`;if(p.type==='rowcol')return`先找到从上往下第${p.row}行，再找到从左往右第${p.col}列，两者交叉的位置就是宝藏。`;let point={...p.start},parts=[];for(const move of p.moves){point=applyMove(point,move);parts.push(`${move.name}${move.steps}格到 (${point.x}, ${point.y})`)}return`从 (${p.start.x}, ${p.start.y}) 出发，${parts.join('，再')}，最终到达 (${p.target.x}, ${p.target.y})。`}
function selectCell(x,y){if(state.done)return;state.clicks++;const chosen={x,y};if(key(chosen)===key(state.puzzle.target)){state.done=true;state.solved++;state.streak++;saveStreak();state.hinted=null;$('explanation').innerHTML=`<strong>寻宝路线：</strong>${explain()}`;$('explanation').className='explanation show';$('nextBtn').hidden=false;$('hintBtn').disabled=true;renderBoard();setMessage('找到宝藏了！位置和指令完全一致。','ok');say('找到宝藏了，位置正确。');updateStatus()}else{state.wrong.add(key(chosen));state.streak=0;saveStreak();renderBoard();setMessage('这里没有宝藏。重新检查方向、行列顺序或坐标，还可以继续点击。','bad');say('这里没有宝藏，请再想一想。');updateStatus()}}
function hint(){const p=state.puzzle;if(p.type==='direction'){const first=applyMove(p.start,{...p.moves[0],steps:1});state.hinted=key(first);setMessage(`提示：从起点先向${p.moves[0].name}走第一格，已用闪动边框标出。`,'hint')}else if(p.type==='rowcol'){state.hinted=key({x:0,y:p.size-p.row});setMessage(`提示：先锁定第 ${p.row} 行，已标出这一行的起始格，再沿着它找第 ${p.col} 列。`,'hint')}else{const middle=applyMove(p.start,p.moves[0]);state.hinted=key(middle);setMessage(`提示：完成第一段移动会到 (${middle.x}, ${middle.y})，已标出这个中间点。`,'hint')}renderBoard()}
function next(){if(state.mode==='challenge'){if(state.step===5){startRound(true);return}state.step++}startRound(false)}
$('board').addEventListener('click',event=>{const cell=event.target.closest('[data-x]');if(cell)selectCell(Number(cell.dataset.x),Number(cell.dataset.y))});$('hintBtn').addEventListener('click',hint);$('nextBtn').addEventListener('click',next);$('newBtn').addEventListener('click',()=>startRound(state.mode==='challenge'));$('speakToggle').addEventListener('click',()=>speech&&speech.toggle());$('modeGroup').addEventListener('click',event=>{if(!event.target.dataset.mode)return;state.mode=event.target.dataset.mode;setSelected('modeGroup','mode',state.mode);startRound(true)});$('levelGroup').addEventListener('click',event=>{if(!event.target.dataset.level)return;state.level=event.target.dataset.level;setSelected('levelGroup','level',state.level);startRound(true)});startRound(true);
})();
</script>
